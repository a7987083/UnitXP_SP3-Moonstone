name: HFAPatchIPA

options:
  bundleIdPrefix: com.hfa
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

packages:
  Zip:
    url: https://github.com/marmelroy/Zip.git
    from: 2.1.2
  Zsign:
    path: Vendor/Zsign

targets:
  HFAPatchIPA:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Zip
        product: Zip
      - package: Zsign
        product: Zsign
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HFAPatchIPA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        UIApplicationSupportsIndirectInputEvents: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Decrypted IPA
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.apple.itunes.ipa
          - CFBundleTypeName: HFAPatch Package
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.hfa.patch-package
              - public.json
          - CFBundleTypeName: All Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.hfa.patch-package
            UTTypeDescription: HFAPatch JSON Package
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hfapatch
                - json
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfa.patchipa
        PRODUCT_NAME: HFAPatchIPA
        MARKETING_VERSION: 2.2.1
        CURRENT_PROJECT_VERSION: 7
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []

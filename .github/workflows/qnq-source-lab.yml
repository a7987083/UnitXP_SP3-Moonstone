name: QNQ Source Lab Build

on:
  workflow_dispatch:
  push:
    branches:
      - lab/qnq-source-lite-v0.1
    paths:
      - 'QNQSourceLab/**'
      - '.github/workflows/qnq-source-lab.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -project QNQSourceLab/QNQSourceLab.xcodeproj -list

      - name: Build Release iphoneos
        run: |
          set -o pipefail
          rm -rf QNQSourceLab/build QNQSourceLab/dist
          xcodebuild \
            -project QNQSourceLab/QNQSourceLab.xcodeproj \
            -target QNQSourceLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath QNQSourceLab/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee QNQSourceLab-build.log

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail
          APP="QNQSourceLab/build/Build/Products/Release-iphoneos/QNQSourceLab.app"
          test -d "$APP"
          mkdir -p QNQSourceLab/package/Payload QNQSourceLab/dist
          cp -R "$APP" QNQSourceLab/package/Payload/
          cd QNQSourceLab/package
          /usr/bin/zip -qry ../dist/QNQSourceLab_v0.1_TrollStore.ipa Payload
          cd ../..
          unzip -l QNQSourceLab/dist/QNQSourceLab_v0.1_TrollStore.ipa | head -40
          shasum -a 256 QNQSourceLab/dist/QNQSourceLab_v0.1_TrollStore.ipa | tee QNQSourceLab/dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QNQSourceLab-v0.1
          path: |
            QNQSourceLab/dist/QNQSourceLab_v0.1_TrollStore.ipa
            QNQSourceLab/dist/SHA256SUMS.txt
            QNQSourceLab-build.log
          if-no-files-found: error

      - name: Publish IPA to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f QNQSourceLab/dist/QNQSourceLab_v0.1_TrollStore.ipa QNQSourceLab/dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish QNQSourceLab v0.1 IPA [skip ci]"
          git push

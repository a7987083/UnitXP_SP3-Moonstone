name: Build MoonMarker Slim Round 2

on:
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - '.github/workflows/build-moonmarker-slim-round2.yml'
      - 'slim/round2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout verified build assets
        uses: actions/checkout@v4

      - name: Decode verified reconstruction inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir cleanroom_input advanced_v2_input
          cat cleanroom/bundle.part00 cleanroom/bundle.part01 cleanroom/bundle.part02 cleanroom/bundle.part03 \
            | base64 -d > cleanroom_bundle.zip
          echo '077166868465beba39f5d8a87448190cb5892f9335289b3860a2c2396f5fd31a  cleanroom_bundle.zip' | sha256sum -c -
          unzip -q cleanroom_bundle.zip -d cleanroom_input

          git fetch --depth 1 origin 100463402c468a97c0804bbdcf4b077d321ebd96
          git archive FETCH_HEAD cleanroom | tar -x
          cat cleanroom/advanced-v2.fixed.part00 cleanroom/advanced-v2.fixed.part01 \
              cleanroom/advanced-v2.fixed.part02 cleanroom/advanced-v2.fixed.part03 \
              cleanroom/advanced-v2.fixed.part04 cleanroom/advanced-v2.fixed.part05 \
              cleanroom/advanced-v2.fixed.part06 \
            | base64 -d > advanced-v2.tar.xz
          echo 'bb817eb41f64ccea39e5c35119f367146e2ba554597ace2bcb7fa07b6e857e1f  advanced-v2.tar.xz' | sha256sum -c -
          tar -xJf advanced-v2.tar.xz -C advanced_v2_input

      - name: Reconstruct exact full MoonMarker source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir reconstructed
          git -C reconstructed init
          git -C reconstructed remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C reconstructed fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C reconstructed checkout --detach FETCH_HEAD
          test "$(git -C reconstructed rev-parse HEAD)" = '3370011e396ccdbf4c9921f6cf2b005bed818b24'

          sed -i 's/\r$//' reconstructed/dllmain.cpp reconstructed/sceneBegin_sceneEnd.cpp reconstructed/sceneBegin_sceneEnd.h reconstructed/Makefile
          sed -i '1s/^\xEF\xBB\xBF//' reconstructed/dllmain.cpp reconstructed/sceneBegin_sceneEnd.cpp reconstructed/sceneBegin_sceneEnd.h reconstructed/Makefile

          patch --batch -p1 -d reconstructed < cleanroom_input/MoonMarker_Cleanroom.patch
          patch --batch -p1 -d reconstructed < cleanroom/fix-lua-string.patch
          patch --batch -p1 -d reconstructed < cleanroom/present-hook.patch
          patch --batch -p1 -d reconstructed < cleanroom/fix-placement-projection.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/addon-status.patch

          cp cleanroom/native-m2-v2/nativeM2Test.cpp reconstructed/
          cp cleanroom/native-m2-v2/nativeM2Test.h reconstructed/
          patch --batch -p1 -d reconstructed < cleanroom/native-m2-v2.patch
          patch --batch -p1 -d reconstructed < cleanroom/native-white-v1.patch
          patch --batch -p1 -d reconstructed < cleanroom/native-white-remote-v1.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/native-white-remote-addon-v1.patch

          cp cleanroom/native-eight-v1/nativeM2Test.cpp reconstructed/nativeM2Test.cpp
          cp cleanroom/native-eight-v1/nativeM2Test.h reconstructed/nativeM2Test.h
          python3 cleanroom/apply_eight_markers.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon \
            --addon-source cleanroom/eight-markers/MoonMarker.lua
          python3 cleanroom/configure_eight_marker_addon.py \
            --addon cleanroom_input/addon \
            --source-dir cleanroom/eight-markers
          python3 cleanroom/apply_guild_auth.py \
            --upstream reconstructed \
            --source-dir cleanroom/guild-auth-v1
          python3 cleanroom/apply_advanced_editor_bundle.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon
          python3 cleanroom/apply_advanced_editor_v2.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon \
            --source-dir advanced_v2_input/advanced-v2

          base64 -d cleanroom/main-model-v1/native-patches.tar.gz.b64 > native-patches.tar.gz
          echo 'dcee1a75e9b3fa55d472a80db0c0a2d1d17fe9ba444f923b4b423172d112147f  native-patches.tar.gz' | sha256sum -c -
          tar -xzf native-patches.tar.gz
          for patch_file in native/*.patch; do
            patch --batch -p0 -d reconstructed < "$patch_file"
          done

          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('reconstructed/MoonMarkerGuildAuth.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const char* guildName = lua_tostring(luaState, oldTop + 1);',
                        'const std::string guildName = lua_tostring(luaState, oldTop + 1);')
          s = s.replace('result.guildName = guildName ? guildName : "";', 'result.guildName = guildName;')
          s = s.replace('if (guildName) result.guildName = guildName;', 'result.guildName = guildName;')
          s = s.replace('const char* name = lua_tostring(luaState, oldTop + 1);',
                        'const std::string name = lua_tostring(luaState, oldTop + 1);')
          s = s.replace('result = name ? name : "";', 'result = name;')
          s = s.replace('if (name) result = name; else result.clear();', 'result = name;')
          p.write_text(s, encoding='utf-8')
          PYFIX

          grep -Fq 'createCustomAt' reconstructed/nativeM2Test.cpp
          grep -Fq 'MoonMarker.Main.Remote' reconstructed/MoonMarkerGuildAuth.cpp
          grep -Fq 'MoonMarkerM2Scanner.cpp' reconstructed/Makefile

      - name: Decode exact matching plugin
        shell: bash
        run: |
          set -euxo pipefail
          for pair in \
            '1f4e402aa75694885a09839697efc7ac287b3f749ad871a222184050a4f54e2b cleanroom/main-model-v1/addon.part00' \
            '2ec2a1284aacb77ea920dea10e15466c8aeba73f212ca1034665910b50261a4f cleanroom/main-model-v1/addon.part01' \
            '07e05ab6e6ee6ea5078fc50f864410446d3da9839fc3cfb391e91a4990343d6a cleanroom/main-model-v1/addon.part02' \
            'b1de5af9d50fcf0927eed9aa2d81f1745dc9db04d3a314dde5cdc72d987f0273 cleanroom/main-model-v1/addon.part03' \
            'cd4123b59352f2c43958d8efac00ab165aebc5be962a8364f20475f180324f02 cleanroom/main-model-v1/addon.part04' \
            'b837f806d5f03d536d879cfcbb7bd2ba0944843c1aaeb3ffbd9986aa0b44033a cleanroom/main-model-v1/addon.part05' \
            '43cf4a7d92aebb559706260e9d8919950df317fee7e62a95d8953d14f2354af2 cleanroom/main-model-v1/addon.part06' \
            '9b93e4d396b9f97fb61bc67ca594e3ed77dbafeaa808d86fcfc5e21167fe5bb1 cleanroom/main-model-v1/addon.part07' \
            '37ce6eea035ba0b10ce34288541f89e92367622cd7d4e9d7a9256e2382575ea7 cleanroom/main-model-v1/addon.part08'; do
              echo "$pair" | sha256sum -c -
          done
          cat cleanroom/main-model-v1/addon.part00 cleanroom/main-model-v1/addon.part01 \
              cleanroom/main-model-v1/addon.part02 cleanroom/main-model-v1/addon.part03 \
              cleanroom/main-model-v1/addon.part04 cleanroom/main-model-v1/addon.part05 \
              cleanroom/main-model-v1/addon.part06 cleanroom/main-model-v1/addon.part07 \
              cleanroom/main-model-v1/addon.part08 \
            | base64 -d > addon.tar.xz
          echo '266c465bda70eb7619d733501aab6c63bd149be7c6a63b9f800b1e147b0e99bc  addon.tar.xz' | sha256sum -c -
          mkdir addon_package
          tar -xJf addon.tar.xz -C addon_package
          test -f addon_package/MoonMarker/ModelLibrary.lua

      - name: Create corrected round 1 baseline and round 2 tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p baseline/native baseline/plugin round2/native round2/plugin
          cp -a reconstructed/. baseline/native/
          cp -a addon_package/MoonMarker/. baseline/plugin/

          base64 -d slim/round2/apply-round1-corrected.py.gz.b64 > round1-corrected.py.gz
          echo '2d512aab0fa09d2e21a28fc6a1c78584a0771a58de1c2145247f8cbd1c139e20  round1-corrected.py.gz' | sha256sum -c -
          gzip -dc round1-corrected.py.gz > round1-corrected.py
          python3 -m py_compile round1-corrected.py
          python3 round1-corrected.py baseline

          cp -a baseline/native/. round2/native/
          cp -a baseline/plugin/. round2/plugin/
          base64 -d slim/round2/apply-round2-slim.py.gz.b64 > round2-slim.py.gz
          echo '9f1477fed36b3c4ab0d7e2ddd8704346d9dc2fc7d5c09cd13b90a3afa552313f  round2-slim.py.gz' | sha256sum -c -
          gzip -dc round2-slim.py.gz > round2-slim.py
          python3 -m py_compile round2-slim.py
          python3 round2-slim.py round2

          test -f baseline/native/MoonMarkerM2Scanner.cpp
          test -f round2/native/MoonMarkerM2Scanner.cpp
          grep -Fq 'cmd_MoonMarker_Advanced_ScanM2_Start' baseline/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'cmd_MoonMarker_Advanced_ScanM2_Start' round2/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'MoonMarker.Advanced.ScanM2.Start' baseline/plugin/ModelLibrary.lua
          grep -Fq 'MoonMarker.Advanced.ScanM2.Start' round2/plugin/ModelLibrary.lua
          test -f baseline/plugin/Textures/moonbeam.png
          test ! -e round2/plugin/Textures/moonbeam.png
          grep -Fq 'gMarks' baseline/native/moonMarker.cpp
          ! grep -RFq 'gMarks' round2/native round2/plugin
          ! grep -RFq 'D3DXCreateTextureFromFileA' round2/native round2/plugin
          ! grep -RFq 'moonbeam.png' round2/native round2/plugin
          grep -Fq '## Version: 0.5.2-slim-round1-corrected' baseline/plugin/MoonMarker.toc
          grep -Fq '## Version: 0.6.0-slim-round2' round2/plugin/MoonMarker.toc

          find baseline/native -type f \( -name '*.cpp' -o -name '*.h' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > baseline-native-source-bytes.txt
          find round2/native -type f \( -name '*.cpp' -o -name '*.h' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > round2-native-source-bytes.txt
          find baseline/plugin -type f \( -name '*.lua' -o -name '*.toc' -o -name '*.png' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > baseline-plugin-source-bytes.txt
          find round2/plugin -type f \( -name '*.lua' -o -name '*.toc' -o -name '*.png' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > round2-plugin-source-bytes.txt

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          for tree in baseline/plugin round2/plugin; do
            while IFS= read -r file; do luac5.1 -p "$file"; done < <(find "$tree" -type f -name '*.lua' | sort)
          done

      - name: Install Windows x86 build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK

          curl -L --fail --retry 3 \
            'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile corrected baseline and round 2
        shell: bash
        run: |
          set -euxo pipefail
          for tree in baseline/native round2/native; do
            ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" "$tree/xwinSDK"
            ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" "$tree/d3d9x_headers"
            sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' "$tree/Makefile"
            make -C "$tree" clean
            make -C "$tree" -j2
            file "$tree/UnitXP_SP3.dll" | tee "$tree/DLL-FILE-TYPE.txt"
            grep -q 'PE32 executable.*Intel 80386' "$tree/DLL-FILE-TYPE.txt"
          done
          stat -c '%s' baseline/native/UnitXP_SP3.dll > baseline-dll-size.txt
          stat -c '%s' round2/native/UnitXP_SP3.dll > round2-dll-size.txt
          test "$(cat round2-dll-size.txt)" -lt "$(cat baseline-dll-size.txt)"

      - name: Package round 2 test build
        shell: bash
        run: |
          set -euxo pipefail
          baseline_size=$(cat baseline-dll-size.txt)
          round2_size=$(cat round2-dll-size.txt)
          reduced=$((baseline_size-round2_size))
          clean_v89=491008
          remaining=$((round2_size-clean_v89))

          mkdir -p release/Interface/AddOns/MoonMarker
          cp round2/native/UnitXP_SP3.dll release/
          cp -a round2/plugin/. release/Interface/AddOns/MoonMarker/
          cp slim/round2/*.b64 release/
          sha256sum release/UnitXP_SP3.dll > release/DLL-SHA256.txt
          file release/UnitXP_SP3.dll > release/DLL-FILE-TYPE.txt
          printf '%s\n' "$round2_size" > release/DLL-SIZE-BYTES.txt
          cat > release/SLIM-ROUND2-RESULT.txt <<EOF
          Corrected round 1 baseline DLL: ${baseline_size} bytes
          Round 2 DLL: ${round2_size} bytes
          Round 2 reduction: ${reduced} bytes
          Clean v89 baseline: ${clean_v89} bytes
          Remaining increase over clean v89: ${remaining} bytes
          Scanner restored and retained: yes
          Old PNG renderer removed: yes
          Duplicate gMarks state removed: yes
          Fixed top icon Present hook retained: yes
          Lua 5.1 validation: passed
          PE32 x86 compilation: passed
          In-game runtime test: not performed
          EOF
          cat > release/SOURCE-SIZE-RESULT.txt <<EOF
          Corrected baseline native source: $(cat baseline-native-source-bytes.txt) bytes
          Round 2 native source: $(cat round2-native-source-bytes.txt) bytes
          Corrected baseline plugin resources: $(cat baseline-plugin-source-bytes.txt) bytes
          Round 2 plugin resources: $(cat round2-plugin-source-bytes.txt) bytes
          EOF
          (cd release && zip -9 -r ../MoonMarker-Slim-Round2-x86.zip .)

      - name: Upload round 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Slim-Round2-x86
          path: |
            release
            MoonMarker-Slim-Round2-x86.zip
          if-no-files-found: error

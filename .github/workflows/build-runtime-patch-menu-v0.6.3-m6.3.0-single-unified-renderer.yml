name: Build Runtime Patch Menu v0.6.3 M6.3.0 Single Unified Renderer

on:
  push:
    branches:
      - feature/m6.3-single-unified-renderer
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: UI architecture contract — single renderer only
        run: |
          set -euxo pipefail
          python3 iosruntimepatchmenu/tools/validate_single_ui_renderer.py

      - name: M6.3 source contract assertions
        run: |
          set -euxo pipefail
          grep -q '0.6.3 · M6.3.0' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZN_UI_CANONICAL_FEATURE_RENDERER' iosruntimepatchmenu/src/ZNM630SingleUnifiedRenderer.mm
          grep -q 'customer parameter labels are not created' iosruntimepatchmenu/src/ZNM630SingleUnifiedRenderer.mm
          grep -q 'single Builder renderer installed' iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm
          grep -q '显示给客户的说明' iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm
          grep -q 'exact IL2CPP Method Offset' iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm
          grep -q 'direct Static numeric fallback removed' iosruntimepatchmenu/src/ZNM610UnifiedFeatureModel.mm
          grep -q 'updateGroup:' iosruntimepatchmenu/src/ZNRuntimeActionModel.h
          grep -q '"group"' iosruntimepatchmenu/src/ZNM551AuthoringPersistence.mm
          ! grep -q 'placeholder:@"ARM64 HEX"' iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm
          ! grep -q 'zn40_button:@"＋ 增加 Patch"' iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm
          ! grep -q 'ZNInstallRuntimeMethodCallBuilderUIDeferred();' iosruntimepatchmenu/src/ZNRuntimeMethodCallBootstrap.mm
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M6.3.0
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m6.3.0
          cp .theos/obj/ZonoePatchV03.dylib dist-m6.3.0/ZonoPatch_v0.6.3_M6.3.0_SingleUnifiedRenderer.dylib
          shasum -a 256 dist-m6.3.0/ZonoPatch_v0.6.3_M6.3.0_SingleUnifiedRenderer.dylib | tee dist-m6.3.0/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m6.3.0/ZonoPatch_v0.6.3_M6.3.0_SingleUnifiedRenderer.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m630_load_commands.txt
          strings -a "$out" > /tmp/zono_m630_strings.txt
          grep -q '\[m6.3-ui\]' /tmp/zono_m630_strings.txt
          grep -q '\[m6.3-authoring\]' /tmp/zono_m630_strings.txt
          grep -q 'direct Static numeric fallback removed' /tmp/zono_m630_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m630_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.6.3-M6.3.0-SingleUnifiedRenderer
          path: |
            iosruntimepatchmenu/dist-m6.3.0/ZonoPatch_v0.6.3_M6.3.0_SingleUnifiedRenderer.dylib
            iosruntimepatchmenu/dist-m6.3.0/SHA256.txt
          if-no-files-found: error

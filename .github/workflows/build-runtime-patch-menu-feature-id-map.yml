name: Build Runtime Patch Menu FeatureID Map

on:
  push:
    branches:
      - feature/runtime-patch-menu-feature-id-map
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Source assertions
        run: |
          set -euxo pipefail
          grep -q 'src/ZNFeatureMetadataCodec.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNFeatureMetadataEncodeEntry' iosruntimepatchmenu/src/ZNStaticMetadataPrivacy.mm
          grep -q 'ZNFeatureMetadataDecodeEntry' iosruntimepatchmenu/src/ZNFeatureGroupUI.mm
          grep -q 'ZN44_STATIC_HEADER_FLAG_FEATURE_METADATA_V1' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'displayMetadataCodec' iosruntimepatchmenu/src/ZNStaticBinarySigningBridge.mm

      - name: Feature metadata codec tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation \
            -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/feature_metadata_codec_test.mm \
            iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm \
            -o /tmp/zn_feature_metadata_codec_test
          /tmp/zn_feature_metadata_codec_test

      - name: Build
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-feature-id-map
          cp .theos/obj/ZonoePatchV03.dylib dist-feature-id-map/ZonoPatch_v0.5.0_FeatureIDMap_Test.dylib
          shasum -a 256 dist-feature-id-map/ZonoPatch_v0.5.0_FeatureIDMap_Test.dylib | tee dist-feature-id-map/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-feature-id-map/ZonoPatch_v0.5.0_FeatureIDMap_Test.dylib
          file "$out"
          nm -gU "$out" | grep 'ZNFeatureMetadataEncodeEntry'
          nm -gU "$out" | grep 'ZNFeatureMetadataDecodeEntry'
          strings "$out" > /tmp/zonoe_feature_id_map_strings.txt
          grep -q 'embedded FeatureID + display name' /tmp/zonoe_feature_id_map_strings.txt
          grep -q 'displayMetadataCodec' /tmp/zonoe_feature_id_map_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.0-FeatureIDMap-Test
          path: |
            iosruntimepatchmenu/dist-feature-id-map/ZonoPatch_v0.5.0_FeatureIDMap_Test.dylib
            iosruntimepatchmenu/dist-feature-id-map/SHA256.txt
          if-no-files-found: error

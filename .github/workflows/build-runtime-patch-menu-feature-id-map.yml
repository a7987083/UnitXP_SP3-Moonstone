name: Build Runtime Patch Menu v0.5.3 Direct UI

on:
  push:
    branches:
      - feature/runtime-patch-menu-consolidation-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate active UI layer
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          menu = Path('iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm')
          template = Path('iosruntimepatchmenu/tools/v053_current_ui.inc').read_text()
          text = menu.read_text()
          direct_marker = 'v0.5.3 direct current UI layer installed'

          if direct_marker not in text:
              left_marker = '// END inlined ZonoeRuntimeMenuV044.mm'
              right_marker = '// END inlined ZonoeRuntimeMenuV045.mm'
              left = text.index(left_marker) + len(left_marker)
              right = text.index(right_marker, left)
              text = (text[:left] +
                      '\n\n// v0.5.3: legacy V045 Feature/Compact renderer removed.\n'
                      '// ZNFeatureGroupUI is the sole public Feature renderer.\n' +
                      text[right:])

              bootstrap_marker = '// v0.5.3: one deterministic menu bootstrap owns the historical layer order.'
              pos = text.index(bootstrap_marker)
              text = text[:pos].rstrip() + '\n\n' + template.rstrip() + '\n'
              menu.write_text(text)
          PY

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Source assertions
        run: |
          set -euxo pipefail
          menu=iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm
          makefile=iosruntimepatchmenu/Makefile
          feature=iosruntimepatchmenu/src/ZNFeatureGroupUI.mm
          compact=iosruntimepatchmenu/src/ZNPublicCompactUI.mm

          test "$(grep -c '__attribute__((constructor' "$menu")" -eq 1
          grep -q 'v0.5.3 direct current UI layer installed' "$menu"
          grep -q 'ZNInstallV053CurrentUI();' "$menu"
          ! grep -q 'ZNInstallV045FunctionUI();' "$menu"
          ! grep -q 'zn45_renderFeaturePage' "$menu"
          ! grep -q 'zn45_renderCompactPage' "$menu"
          ! grep -q 'ZNSwapV045' "$menu"
          grep -q 'zn53_renderDebug' "$menu"
          grep -q 'zn49_toggleSharedSiteProbe:' "$menu"
          grep -q 'zn43_validateRuntimePatch:' "$menu"
          grep -q 'ZNFeatureMetadataDecodeEntry' "$feature"
          grep -q 'Compact is always the public Feature surface' "$feature"
          grep -q 'self.subtitleLabel.text = @"0.5.3"' "$compact"
          grep -q -- '-fvisibility=hidden' "$makefile"
          grep -q 'ZN44_STATIC_HEADER_FLAG_RVA_PROTECTION_V1' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'ZN55ProtectStaticRVAsAtPath' iosruntimepatchmenu/src/ZNStaticBinarySigningBridge.mm
          grep -q 'ZN55DecodeEntryRVAs' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q 'runtimeWritesPlainRVAsBackToStaticEntry.*@NO' iosruntimepatchmenu/src/ZNStaticBinarySigningBridge.mm

      - name: Feature metadata codec tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation \
            -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/feature_metadata_codec_test.mm \
            iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm \
            -o /tmp/zn_feature_metadata_codec_test
          /tmp/zn_feature_metadata_codec_test

      - name: Static RVA protection tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation \
            -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/static_rva_protection_test.mm \
            -o /tmp/zn_static_rva_protection_test
          /tmp/zn_static_rva_protection_test

      - name: Build
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-consolidation-v2
          cp .theos/obj/ZonoePatchV03.dylib dist-consolidation-v2/ZonoPatch_v0.5.3_ConsolidationV2_Test.dylib
          shasum -a 256 dist-consolidation-v2/ZonoPatch_v0.5.3_ConsolidationV2_Test.dylib | tee dist-consolidation-v2/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-consolidation-v2/ZonoPatch_v0.5.3_ConsolidationV2_Test.dylib
          file "$out"
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'
          nm -gU "$out" | grep '_ZonoePatchDeveloperAuthorized'
          nm -gU "$out" | grep '_ZonoePatchOtherAuthorized'
          if nm -gU "$out" | grep -q 'BaselineV024'; then exit 1; fi
          if nm -gU "$out" | grep -q 'ZNFeatureMetadataDecodeEntry'; then exit 1; fi
          if nm -gU "$out" | grep -q 'ZN55ProtectStaticRVAsAtPath'; then exit 1; fi

          strings "$out" > /tmp/zonoe_v053_direct_strings.txt
          grep -q '0.5.3-ui-consolidated' /tmp/zonoe_v053_direct_strings.txt
          grep -q 'v0.5.3 direct current UI layer installed' /tmp/zonoe_v053_direct_strings.txt
          grep -q 'v0.5.3 public compact UI installed' /tmp/zonoe_v053_direct_strings.txt
          grep -q 'static-rva-protection-v1' /tmp/zonoe_v053_direct_strings.txt
          if grep -q '0.2.4-ui' /tmp/zonoe_v053_direct_strings.txt; then exit 1; fi
          if grep -q '0.5.0-menu-consolidated' /tmp/zonoe_v053_direct_strings.txt; then exit 1; fi
          if grep -q 'PatchCore 0.4.' /tmp/zonoe_v053_direct_strings.txt; then exit 1; fi

      - name: Commit direct UI source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(ui): replace legacy active chain with current layer'
            git push origin HEAD:feature/runtime-patch-menu-consolidation-v2
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.3-ConsolidationV2-Test
          path: |
            iosruntimepatchmenu/dist-consolidation-v2/ZonoPatch_v0.5.3_ConsolidationV2_Test.dylib
            iosruntimepatchmenu/dist-consolidation-v2/SHA256.txt
          if-no-files-found: error

name: Build Runtime Patch Menu v0.5.10 M5.10.5 Offset Core Rebuild

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Offset rebuild source contract
        run: |
          set -euxo pipefail
          grep -q '0.5.10 · M5.10.5' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'M5.10.0 clean Offset Core' iosruntimepatchmenu/src/ZNOffsetCore.mm
          grep -q 'M5.10.0 Offset Workspace V1' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'Switch/byte patch only' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'src/ZNOffsetCore.mm' iosruntimepatchmenu/Makefile

          # Deleted legacy Offset implementations / resolvers / typed backends.
          ! grep -q 'src/ZNPatchRuntimeValidator.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM591OffsetHookControls.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM592OffsetAuthoringPersistence.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM593CanonicalOffsetArchitecture.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM585UnifiedControlSemantics.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM585StaticRuntimeRange.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM56StaticValueCellBinding.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNStaticValueCellV1.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNFeatureRuntimeControlsV2.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNAnyImageAddressResolver' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNSharedSite' iosruntimepatchmenu/Makefile

          test ! -e iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          test ! -e iosruntimepatchmenu/src/ZNM591OffsetHookControls.mm
          test ! -e iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm
          test ! -e iosruntimepatchmenu/src/ZNM593CanonicalOffsetArchitecture.mm
          test ! -e iosruntimepatchmenu/src/ZNOffsetResolverV2.mm
          test ! -e iosruntimepatchmenu/src/ZNBinaryPatchWorkspaceAddressV2.mm
          test ! -e iosruntimepatchmenu/src/ZNAnyImageAddressResolver.h
          test ! -e iosruntimepatchmenu/src/ZNAnyImageAddressResolver.mm
          test ! -e iosruntimepatchmenu/src/ZNStaticValueCellV1.h
          test ! -e iosruntimepatchmenu/src/ZNStaticBinaryBuilder.mm
          test ! -e iosruntimepatchmenu/src/ZNStaticBinarySigningBridge.mm
          test ! -e iosruntimepatchmenu/src/ZNSharedSiteProbe.h
          test ! -e iosruntimepatchmenu/src/ZNSharedSiteProbeV2.mm
          test ! -e iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3.h
          test ! -e iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3.mm
          test ! -e iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3Bootstrap.mm

          # Static Offset authoring/rendering is Switch/byte-patch only.
          grep -q '类型 · Switch' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          ! grep -q 'znfr_staticSlider' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          ! grep -q 'znfr_staticNumberReturn' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          ! grep -R -q 'ZN44_STATIC_ENTRY_FLAG_OFFSET_HOOK_V1' iosruntimepatchmenu/src
          ! grep -R -q 'ZN44_STATIC_ENTRY_FLAG_VALUE_CELL_V1' iosruntimepatchmenu/src
          ! grep -R -q 'ZN44_STATIC_HEADER_FLAG_VALUE_CELLS_V1' iosruntimepatchmenu/src
          ! grep -R -q 'ZN_FEATURE_CONTROL_FLAG_' iosruntimepatchmenu/src
          ! grep -R -q 'ZN_FEATURE_VALUE_FLAG_' iosruntimepatchmenu/src
          ! grep -q 'featureControlType' iosruntimepatchmenu/src/ZNFeatureControlModel.h iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          ! grep -q 'featureValueType' iosruntimepatchmenu/src/ZNFeatureControlModel.h iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          ! grep -q 'setControlType' iosruntimepatchmenu/src/ZNFeatureControlModel.h iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          ! grep -q 'setValueType' iosruntimepatchmenu/src/ZNFeatureControlModel.h iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          ! grep -R -q 'ZNFeatureNumberValueDidChangeNotification' iosruntimepatchmenu/src
          ! grep -R -q 'ZNFeatureSliderValueDidChangeNotification' iosruntimepatchmenu/src

          # Game/sample-specific Shared-Site probe chain must be absent.
          ! grep -R -q 'ZNSharedSiteProbe' iosruntimepatchmenu/src
          ! grep -R -q 'MdhpNuX' iosruntimepatchmenu/src
          ! grep -R -q '0x2E25904' iosruntimepatchmenu/src
          ! grep -R -q '0x2E1BCA0' iosruntimepatchmenu/src
          ! grep -R -q '0x2E257E4' iosruntimepatchmenu/src
          ! grep -q 'SharedSiteExecutionProbe' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm

          # Runtime Method/IL2CPP typed controls remain intentionally present.
          grep -q 'ZNRuntimeArgumentControlTypeSlider' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNRuntimeArgumentControlTypeNumber' iosruntimepatchmenu/src/ZNFeaturePageUI.mm

          # Old install chain / value-cell postprocess must not return.
          ! grep -q 'ZNInstallOffsetResolverV2Deferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallBinaryPatchWorkspaceAddressV2Deferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM56StaticValueCellBindingDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM585StaticRuntimeRangeDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM585UnifiedControlSemanticsDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM590UnifiedActionModelDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM591OffsetHookControlsDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM592OffsetAuthoringPersistenceDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM593CanonicalOffsetArchitectureDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNStaticValueCellAugmentAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          ! grep -q 'ZNStaticValueCellV1.h' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for Runtime Method backend
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.10.5 Offset Core Rebuild
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.10.5-offset-rebuild
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.10.5-offset-rebuild/ZonoPatch_v0.5.10_M5.10.5_OffsetCoreRebuild.dylib
          stat -f '%z' dist-m5.10.5-offset-rebuild/ZonoPatch_v0.5.10_M5.10.5_OffsetCoreRebuild.dylib | tee dist-m5.10.5-offset-rebuild/SIZE.txt
          shasum -a 256 dist-m5.10.5-offset-rebuild/ZonoPatch_v0.5.10_M5.10.5_OffsetCoreRebuild.dylib | tee dist-m5.10.5-offset-rebuild/SHA256.txt

      - name: Verify binary cleanup
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.10.5-offset-rebuild/ZonoPatch_v0.5.10_M5.10.5_OffsetCoreRebuild.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m5105_strings.txt
          grep -q 'm5.10-offset' /tmp/zono_m5105_strings.txt
          ! grep -q 'm5.9.1-offset-hook' /tmp/zono_m5105_strings.txt
          ! grep -q 'm5.9.2-offset-persist' /tmp/zono_m5105_strings.txt
          ! grep -q 'm5.9.3-canonical-offset' /tmp/zono_m5105_strings.txt
          ! grep -q 'Offset Hook · 自动准备' /tmp/zono_m5105_strings.txt
          ! grep -q 'Offset Hook 数量超过' /tmp/zono_m5105_strings.txt
          ! grep -q 'Static RW Value Cell' /tmp/zono_m5105_strings.txt
          ! grep -q 'ZNStaticValueCellAugmentAtPath' /tmp/zono_m5105_strings.txt
          ! grep -q 'ZNInstallAnyImageAddressResolverDeferred' /tmp/zono_m5105_strings.txt
          ! grep -q 'ZNFeatureNumberValueDidChangeNotification' /tmp/zono_m5105_strings.txt
          ! grep -q 'ZNFeatureSliderValueDidChangeNotification' /tmp/zono_m5105_strings.txt
          ! grep -q 'ZNSharedSiteProbe' /tmp/zono_m5105_strings.txt
          ! grep -q 'MdhpNuX' /tmp/zono_m5105_strings.txt
          ! grep -q '0x2E25904' /tmp/zono_m5105_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.10-M5.10.5-OffsetCoreRebuild
          path: |
            iosruntimepatchmenu/dist-m5.10.5-offset-rebuild/ZonoPatch_v0.5.10_M5.10.5_OffsetCoreRebuild.dylib
            iosruntimepatchmenu/dist-m5.10.5-offset-rebuild/SHA256.txt
            iosruntimepatchmenu/dist-m5.10.5-offset-rebuild/SIZE.txt
          if-no-files-found: error

name: Build M5.12 Offset UI

on:
  push:
    branches:
      - recovery/m5.12-historical-offset-closure
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ordinary Offset UI contract
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'src/ZNPatchRuntimeValidator.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNOffsetCore.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNH5GGValueBackend.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueOffset.mm' iosruntimepatchmenu/Makefile
          test -f iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'src/ZNOrdinaryOffsetControlsUI.mm' iosruntimepatchmenu/Makefile
          grep -q '点击执行' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '开关' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '输入' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '滑动条' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNFeatureControlTypeButton: return ZNFeatureControlTypeSwitch' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNFeatureControlTypeSwitch: return ZNFeatureControlTypeNumber' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNFeatureControlTypeNumber: return ZNFeatureControlTypeSlider' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNFeatureControlTypeSlider: return ZNFeatureControlTypeButton' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNOONeedsValueType' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          ! grep -q 'H5GG\|ZNTypedValue\|ZNStaticDispatchRuntime' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'OrdinaryOffsetControlsUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'FeatureBuilderUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'ZNRuntimeActionEmbedIntoGeneratedOutputs' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('include/dobby.h')
          s=p.read_text()
          old='''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new='''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s: raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old,new,1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build Offset UI
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.12-offset-ui
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.12-offset-ui/ZonoPatch_v0.5.12_M5.12_OffsetUI.dylib
          stat -f '%z' dist-m5.12-offset-ui/ZonoPatch_v0.5.12_M5.12_OffsetUI.dylib | tee dist-m5.12-offset-ui/SIZE.txt
          shasum -a 256 dist-m5.12-offset-ui/ZonoPatch_v0.5.12_M5.12_OffsetUI.dylib | tee dist-m5.12-offset-ui/SHA256.txt

      - name: Verify binary contract
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.12-offset-ui/ZonoPatch_v0.5.12_M5.12_OffsetUI.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m512_strings.txt
          grep -q 'runtime-validate' /tmp/zono_m512_strings.txt
          grep -q 'static-dispatch' /tmp/zono_m512_strings.txt
          grep -q 'builder-pipeline-m5.12-offset-recovery' /tmp/zono_m512_strings.txt
          ! grep -q 'H5GG typed/raw backend ready' /tmp/zono_m512_strings.txt
          ! grep -q 'm5.11-value-runtime' /tmp/zono_m512_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.12-M5.12-OffsetUI
          path: |
            iosruntimepatchmenu/dist-m5.12-offset-ui/ZonoPatch_v0.5.12_M5.12_OffsetUI.dylib
            iosruntimepatchmenu/dist-m5.12-offset-ui/SHA256.txt
            iosruntimepatchmenu/dist-m5.12-offset-ui/SIZE.txt
          if-no-files-found: error

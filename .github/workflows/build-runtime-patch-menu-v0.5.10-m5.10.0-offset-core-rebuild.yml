name: Build M5.13 Input Service

on:
  push:
    branches:
      - recovery/m5.12-historical-offset-closure
      - feature/m5.13-input-service-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Input Service + Ordinary Offset contract
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNInputService.h
          grep -q 'ZNInputModeHexAddress' iosruntimepatchmenu/src/ZNInputService.h
          grep -q 'ZNInputModeNumericFlexible' iosruntimepatchmenu/src/ZNInputService.h
          grep -q 'no custom keyWindow' iosruntimepatchmenu/src/ZNStandaloneNumericKeypad.mm
          ! grep -q 'makeKeyAndVisible' iosruntimepatchmenu/src/ZNStandaloneNumericKeypad.mm
          grep -q 'ZNInputServiceBindField(offset, ZNInputModeHexAddress)' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNInputServiceBindField(enabledHex, ZNInputModeHexBytes)' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZNInputServiceBindField(argument, ZNInputModeNumericFlexible)' iosruntimepatchmenu/src/ZNRuntimeMethodCallBuilderUI.mm
          grep -q 'ZNInputServiceBindField(name, ZNInputModeSystemText)' iosruntimepatchmenu/src/ZNRuntimeMethodCallBuilderUI.mm
          test -f iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'src/ZNPatchRuntimeValidator.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNOffsetCore.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNH5GGValueBackend.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueOffset.mm' iosruntimepatchmenu/Makefile

          # Authoring UI: exactly four ordinary Offset control types.
          test -f iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '点击执行' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '开关' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '输入' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q '滑动条' iosruntimepatchmenu/src/ZNOrdinaryOffsetControlsUI.mm
          grep -q 'ZN_FEATURE_CONTROL_FLAG_SHIFT' iosruntimepatchmenu/src/ZNFeatureControlModel.h
          grep -q 'ZN_FEATURE_VALUE_FLAG_SHIFT' iosruntimepatchmenu/src/ZNFeatureControlModel.h

          # Generated binary closure: metadata -> value-cell -> RVA protection -> signing.
          test -f iosruntimepatchmenu/src/ZNStaticValueCellV1.mm
          grep -q 'src/ZNStaticValueCellV1.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNStaticValueCellAugmentAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'RW __ZNDATA Value Cell' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'ZN55ProtectStaticRVAsAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'ZNAdhocResignMachOAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm

          # Generated client UI + binder.
          test -f iosruntimepatchmenu/src/ZNFeatureRuntimeControlsV2.mm
          test -f iosruntimepatchmenu/src/ZNM56StaticValueCellBinding.mm
          grep -q 'src/ZNFeatureRuntimeControlsV2.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM56StaticValueCellBinding.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallFeatureRuntimeControlsV2Deferred' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'ZNInstallM56StaticValueCellBindingDeferred' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'ZNFeatureNumberValueDidChangeNotification' iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          grep -q 'ZNFeatureSliderValueDidChangeNotification' iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          grep -q 'ZNFeatureActionRequestedNotification' iosruntimepatchmenu/src/ZNFeatureControlModel.mm

          # Switch continues through the historical Static Dispatch path.
          grep -q 'selectedTarget' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q '__ZNTEXT' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          grep -q '__ZNDATA' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          grep -q 'ZNRuntimeActionEmbedIntoGeneratedOutputs' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm

      - name: Install dependencies
        run: |
          set -euxo pipefail
          # Hosted macOS arm64 images may keep openssl@1.1 linked while Homebrew
          # installs openssl@3 as an ldid dependency. Homebrew then exits 1 even
          # though ldid itself is installed successfully. Verify the actual tools.
          brew install ldid cmake || true
          command -v ldid
          command -v cmake
          ldid -h >/dev/null 2>&1 || test $? -le 1
          cmake --version

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('include/dobby.h')
          s=p.read_text()
          old='''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new='''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s: raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old,new,1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build Normal variant
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.13-input-service
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_Normal.dylib

      - name: Build ExternalOnly variant
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1 ZN_EXTERNAL_ONLY=1
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_ExternalOnly.dylib

      - name: Verify both binary contracts
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          normal=dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_Normal.dylib
          external=dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_ExternalOnly.dylib
          for out in "$normal" "$external"; do
            file "$out" | grep -q 'arm64'
            strings -a "$out" | grep -q '\[m5.13-input\]'
            nm -gU "$out" | grep -q '_ZonoePatchActivate'
            nm -gU "$out" | grep -q '_ZonoePatchShow'
            strings -a "$out" > /tmp/zono_m512_strings.txt
            grep -q 'runtime-validate' /tmp/zono_m512_strings.txt
            grep -q 'static-dispatch' /tmp/zono_m512_strings.txt
            grep -q 'm5.12-value-cell' /tmp/zono_m512_strings.txt
            ! grep -q 'H5GG typed/raw backend ready' /tmp/zono_m512_strings.txt
            ! grep -q 'm5.11-value-runtime' /tmp/zono_m512_strings.txt
          done
          test "$(shasum -a 256 "$normal" | awk '{print $1}')" != "$(shasum -a 256 "$external" | awk '{print $1}')"
          {
            shasum -a 256 "$normal"
            shasum -a 256 "$external"
          } | tee dist-m5.13-input-service/SHA256.txt
          {
            stat -f '%z %N' "$normal"
            stat -f '%z %N' "$external"
          } | tee dist-m5.13-input-service/SIZE.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.13-M5.13-InputService-Dual
          path: |
            iosruntimepatchmenu/dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_Normal.dylib
            iosruntimepatchmenu/dist-m5.13-input-service/ZonoPatch_v0.5.13_M5.13_InputService_ExternalOnly.dylib
            iosruntimepatchmenu/dist-m5.13-input-service/SHA256.txt
            iosruntimepatchmenu/dist-m5.13-input-service/SIZE.txt
          if-no-files-found: error

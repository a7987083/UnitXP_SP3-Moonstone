name: Build Runtime Patch Menu v0.5.11 M5.11.1 Unified Offset

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unified Offset source contract
        run: |
          set -euxo pipefail
          grep -q '0.5.11 · M5.11.1' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'Unified Offset' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNOffsetControlKindSwitch' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h
          grep -q 'ZNOffsetControlKindSlider' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h
          grep -q 'ZNOffsetControlKindNumber' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h
          grep -q '类型 · %@' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          grep -q 'zn64fb_cycleControl' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          grep -q 'zn64fb_cycleValueType' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          grep -q 'zn64fb_editRange' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          grep -q 'UnifiedOffsetControls' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          ! grep -q 'TypedValueAuthoringUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          ! grep -q 'src/ZNTypedValueWorkspace.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueAuthoringUI.mm' iosruntimepatchmenu/Makefile

          # Switch/raw-byte authoring now prefers H5GG and falls back to native page writes.
          grep -q 'writeRawARM64BytesAtAddress' iosruntimepatchmenu/src/ZNH5GGValueBackend.h
          grep -q 'writeRawARM64BytesAtAddress' iosruntimepatchmenu/src/ZNH5GGValueBackend.mm
          grep -q 'ZNOCWriteBestBackend' iosruntimepatchmenu/src/ZNOffsetCore.mm
          grep -q 'H5GG raw backend' iosruntimepatchmenu/src/ZNOffsetCore.mm

          # Slider/Number use the same original Offset workspace and persist from those rows.
          grep -q 'row.controlKind != ZNOffsetControlKindSwitch' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          grep -q 'ZNStaticOnlyWorkspace' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          grep -q 'ZNBinaryPatchWorkspace sharedWorkspace' iosruntimepatchmenu/src/ZNTypedValueBinaryPersistence.mm
          grep -q 'ZNTVStaticEntry' iosruntimepatchmenu/src/ZNTypedValueBinaryPersistence.mm

          # Legacy dangerous Offset hook/value-cell stacks stay gone.
          for p in \
            iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm \
            iosruntimepatchmenu/src/ZNM591OffsetHookControls.mm \
            iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm \
            iosruntimepatchmenu/src/ZNM593CanonicalOffsetArchitecture.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNAnyImageAddressResolver.mm \
            iosruntimepatchmenu/src/ZNStaticValueCellV1.mm \
            iosruntimepatchmenu/src/ZNRuntimePatchExecutor.mm; do
            test ! -e "$p"
          done
          ! grep -R -q 'ZN44_STATIC_ENTRY_FLAG_OFFSET_HOOK_V1\|ZN44_STATIC_ENTRY_FLAG_VALUE_CELL_V1' iosruntimepatchmenu/src

          # Single RVA coordinate system remains authoritative.
          grep -q 'ZNOCParseRVA' iosruntimepatchmenu/src/ZNOffsetCore.mm
          ! grep -q 'ZNJIParseRVA' iosruntimepatchmenu/src/ZNPatchJSONImporter.mm
          ! grep -q '@"address"\|@"addr"\|@"location"' iosruntimepatchmenu/src/ZNPatchJSONImporter.mm

          # Runtime Method / IL2CPP controls remain untouched.
          grep -q 'ZNRuntimeArgumentControlTypeSlider' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNRuntimeArgumentControlTypeNumber' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNRuntimeMethodActionRecord' iosruntimepatchmenu/src/ZNM58UnifiedControlRuntime.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for Runtime Method backend
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.11.1 Unified Offset
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.11.1-unified-offset
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.11.1-unified-offset/ZonoPatch_v0.5.11_M5.11.1_UnifiedOffset.dylib
          stat -f '%z' dist-m5.11.1-unified-offset/ZonoPatch_v0.5.11_M5.11.1_UnifiedOffset.dylib | tee dist-m5.11.1-unified-offset/SIZE.txt
          shasum -a 256 dist-m5.11.1-unified-offset/ZonoPatch_v0.5.11_M5.11.1_UnifiedOffset.dylib | tee dist-m5.11.1-unified-offset/SHA256.txt

      - name: Verify binary contract
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.11.1-unified-offset/ZonoPatch_v0.5.11_M5.11.1_UnifiedOffset.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m5111_strings.txt
          grep -q 'M5.11.1' /tmp/zono_m5111_strings.txt
          grep -q 'Unified Offset' /tmp/zono_m5111_strings.txt
          grep -q 'm5.11-offset' /tmp/zono_m5111_strings.txt
          grep -q 'H5GG raw' /tmp/zono_m5111_strings.txt
          ! grep -q 'Typed Value Offset · H5GG' /tmp/zono_m5111_strings.txt
          ! grep -q 'm5.9.1-offset-hook\|m5.9.2-offset-persist\|m5.9.3-canonical-offset' /tmp/zono_m5111_strings.txt
          ! grep -q 'Static RW Value Cell\|Shared Site Owner Stack' /tmp/zono_m5111_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.11-M5.11.1-UnifiedOffset
          path: |
            iosruntimepatchmenu/dist-m5.11.1-unified-offset/ZonoPatch_v0.5.11_M5.11.1_UnifiedOffset.dylib
            iosruntimepatchmenu/dist-m5.11.1-unified-offset/SHA256.txt
            iosruntimepatchmenu/dist-m5.11.1-unified-offset/SIZE.txt
          if-no-files-found: error

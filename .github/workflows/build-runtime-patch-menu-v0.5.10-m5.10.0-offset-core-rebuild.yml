name: Build M5.12 Historical Ordinary Offset Recovery

on:
  push:
    branches:
      - recovery/m5.12-historical-offset-closure
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ordinary Offset isolation contract
        run: |
          set -euxo pipefail

          # Ordinary Offset has exactly one authoring/runtime validator implementation.
          test -f iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'src/ZNPatchRuntimeValidator.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNOffsetCore.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNH5GGValueBackend.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueOffset.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueBinaryPersistence.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueDispatchRuntime.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedValueFeatureUI.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNTypedOnlyBinaryBuilder.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'src/ZNFeatureBuilderControlsV2.mm' iosruntimepatchmenu/Makefile

          # Builder surface is plain Target + Offset/RVA + Enabled bytes.
          ! grep -q 'ZNOffsetControlKind' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h
          ! grep -q 'ZNTypedValueOffset' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h
          grep -q 'ZNPatchRuntimeValidator' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'applyTemporary' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'restoreOriginal' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm

          # No Typed Value / unified-offset hooks are installed at activation.
          ! grep -q 'TypedValueFeatureUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          ! grep -q 'UnifiedOffsetControls' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'StaticDispatchPrepare' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'FeatureBuilderUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'FeatureGroupUI' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm

          # IL2CPP/Runtime Method may not reinstall an ordinary Offset authoring layer.
          ! grep -q 'ZNInstallFeatureBuilderControlsV2Deferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm

          # Static generation + customer runtime are a matched historical pair.
          grep -q '__ZNTEXT' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          grep -q '__ZNDATA' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          grep -q 'ownerOrderBySite' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q 'selectedTarget' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q 'ZNStaticBinaryBuilderV3BuildWorkspace(workspace' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          ! grep -q 'ZNTypedValue' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          ! grep -q 'ZNTypedOnlyBinaryBuilder' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm

          # Runtime Method/IL2CPP remains on the current independent chain.
          grep -q 'ZNRuntimeActionEmbedIntoGeneratedOutputs' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          grep -q 'ZNRuntimeArgumentControlTypeSlider' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNRuntimeMethodActionRecord' iosruntimepatchmenu/src/ZNM58UnifiedControlRuntime.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for Runtime Method backend
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.12 Ordinary Offset Recovery
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.12-offset-recovery
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.12-offset-recovery/ZonoPatch_M5.12_OrdinaryOffsetRecovery.dylib
          stat -f '%z' dist-m5.12-offset-recovery/ZonoPatch_M5.12_OrdinaryOffsetRecovery.dylib | tee dist-m5.12-offset-recovery/SIZE.txt
          shasum -a 256 dist-m5.12-offset-recovery/ZonoPatch_M5.12_OrdinaryOffsetRecovery.dylib | tee dist-m5.12-offset-recovery/SHA256.txt

      - name: Verify binary contract
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.12-offset-recovery/ZonoPatch_M5.12_OrdinaryOffsetRecovery.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m512_strings.txt
          grep -q 'runtime-validate' /tmp/zono_m512_strings.txt
          grep -q 'static-dispatch' /tmp/zono_m512_strings.txt
          grep -q 'builder-pipeline-m5.12-offset-recovery' /tmp/zono_m512_strings.txt
          ! grep -q 'H5GG typed/raw backend ready' /tmp/zono_m512_strings.txt
          ! grep -q 'm5.11-value-runtime' /tmp/zono_m512_strings.txt
          ! grep -q 'generated Typed Value Slider/Number UI installed' /tmp/zono_m512_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-M5.12-OrdinaryOffsetRecovery
          path: |
            iosruntimepatchmenu/dist-m5.12-offset-recovery/ZonoPatch_M5.12_OrdinaryOffsetRecovery.dylib
            iosruntimepatchmenu/dist-m5.12-offset-recovery/SHA256.txt
            iosruntimepatchmenu/dist-m5.12-offset-recovery/SIZE.txt
          if-no-files-found: error

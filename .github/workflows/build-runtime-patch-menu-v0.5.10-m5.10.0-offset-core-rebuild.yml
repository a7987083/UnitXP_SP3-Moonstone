name: Build Runtime Patch Menu v0.5.10 M5.10.6 Offset Core Rebuild

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Offset rebuild source contract
        run: |
          set -euxo pipefail
          grep -q '0.5.10 · M5.10.6' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'M5.10.0 clean Offset Core' iosruntimepatchmenu/src/ZNOffsetCore.mm
          grep -q 'M5.10.0 Offset Workspace V1' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'Switch/byte patch only' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'src/ZNOffsetCore.mm' iosruntimepatchmenu/Makefile

          # Legacy Offset implementations/resolvers/typed backends are physically gone.
          for p in \
            iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm \
            iosruntimepatchmenu/src/ZNM591OffsetHookControls.mm \
            iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm \
            iosruntimepatchmenu/src/ZNM593CanonicalOffsetArchitecture.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNBinaryPatchWorkspaceAddressV2.mm \
            iosruntimepatchmenu/src/ZNAnyImageAddressResolver.h \
            iosruntimepatchmenu/src/ZNAnyImageAddressResolver.mm \
            iosruntimepatchmenu/src/ZNStaticValueCellV1.h \
            iosruntimepatchmenu/src/ZNStaticBinaryBuilder.mm \
            iosruntimepatchmenu/src/ZNStaticBinarySigningBridge.mm \
            iosruntimepatchmenu/src/ZNSharedSiteProbe.h \
            iosruntimepatchmenu/src/ZNSharedSiteProbeV2.mm \
            iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3.h \
            iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3.mm \
            iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3Bootstrap.mm; do
            test ! -e "$p"
          done

          ! grep -q 'ZNM591OffsetHookControls\|ZNM592OffsetAuthoringPersistence\|ZNM593CanonicalOffsetArchitecture\|ZNOffsetResolverV2\|ZNAnyImageAddressResolver\|ZNSharedSite' iosruntimepatchmenu/Makefile

          # Static Offset authoring/rendering/backend is Switch + raw byte patch only.
          grep -q '类型 · Switch' iosruntimepatchmenu/src/ZNFeatureBuilderControlsV2.mm
          ! grep -q 'znfr_staticSlider\|znfr_staticNumberReturn' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          ! grep -R -q 'ZN44_STATIC_ENTRY_FLAG_OFFSET_HOOK_V1\|ZN44_STATIC_ENTRY_FLAG_VALUE_CELL_V1\|ZN44_STATIC_HEADER_FLAG_VALUE_CELLS_V1' iosruntimepatchmenu/src
          ! grep -R -q 'ZN_FEATURE_CONTROL_FLAG_\|ZN_FEATURE_VALUE_FLAG_' iosruntimepatchmenu/src
          ! grep -q 'featureControlType\|featureValueType\|setControlType\|setValueType' iosruntimepatchmenu/src/ZNFeatureControlModel.h iosruntimepatchmenu/src/ZNFeatureControlModel.mm
          ! grep -R -q 'ZNFeatureNumberValueDidChangeNotification\|ZNFeatureSliderValueDidChangeNotification' iosruntimepatchmenu/src

          # One Target+RVA == one physical site == OFF/ON. No owner/shared-site model.
          grep -q 'one-site-two-state-off-on' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          grep -q 'Switch/byte patch only' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          ! grep -R -q 'ZN44_STATIC_ENTRY_FLAG_SHARED' iosruntimepatchmenu/src
          ! grep -q 'logicalToPhysical\|\.members\|sharedSiteCount\|last-enabled-active-owner-wins' iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          ! grep -q 'ownerOrderBySite\|Shared Site Owner Stack\|ZN44CanonicalIndex\|fallback-compat-scan\|compatibility full scan' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          ! grep -q 'VM_PROT_WRITE.*ZN44StaticHeader' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q '__ZNDATA' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q '__zndata' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm

          # Game/sample-specific probe chain is absent.
          ! grep -R -q 'ZNSharedSiteProbe\|MdhpNuX\|0x2E25904\|0x2E1BCA0\|0x2E257E4' iosruntimepatchmenu/src

          # Runtime Method / IL2CPP typed controls intentionally remain.
          grep -q 'ZNRuntimeArgumentControlTypeSlider' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNRuntimeArgumentControlTypeNumber' iosruntimepatchmenu/src/ZNFeaturePageUI.mm

          # Old install/value-cell chains cannot return through bootstrap/postprocess.
          ! grep -q 'ZNInstallOffsetResolverV2Deferred\|ZNInstallBinaryPatchWorkspaceAddressV2Deferred\|ZNInstallM56StaticValueCellBindingDeferred\|ZNInstallM585StaticRuntimeRangeDeferred\|ZNInstallM585UnifiedControlSemanticsDeferred\|ZNInstallM590UnifiedActionModelDeferred\|ZNInstallM591OffsetHookControlsDeferred\|ZNInstallM592OffsetAuthoringPersistenceDeferred\|ZNInstallM593CanonicalOffsetArchitectureDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNStaticValueCellAugmentAtPath\|ZNStaticValueCellV1.h' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for Runtime Method backend
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.10.6 Offset Core Rebuild
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.10.6-offset-rebuild
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.10.6-offset-rebuild/ZonoPatch_v0.5.10_M5.10.6_OffsetCoreRebuild.dylib
          stat -f '%z' dist-m5.10.6-offset-rebuild/ZonoPatch_v0.5.10_M5.10.6_OffsetCoreRebuild.dylib | tee dist-m5.10.6-offset-rebuild/SIZE.txt
          shasum -a 256 dist-m5.10.6-offset-rebuild/ZonoPatch_v0.5.10_M5.10.6_OffsetCoreRebuild.dylib | tee dist-m5.10.6-offset-rebuild/SHA256.txt

      - name: Verify binary cleanup
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.10.6-offset-rebuild/ZonoPatch_v0.5.10_M5.10.6_OffsetCoreRebuild.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m5106_strings.txt
          grep -q 'm5.10-offset' /tmp/zono_m5106_strings.txt
          ! grep -q 'm5.9.1-offset-hook\|m5.9.2-offset-persist\|m5.9.3-canonical-offset' /tmp/zono_m5106_strings.txt
          ! grep -q 'Offset Hook · 自动准备\|Offset Hook 数量超过\|Static RW Value Cell' /tmp/zono_m5106_strings.txt
          ! grep -q 'ZNStaticValueCellAugmentAtPath\|ZNInstallAnyImageAddressResolverDeferred' /tmp/zono_m5106_strings.txt
          ! grep -q 'ZNFeatureNumberValueDidChangeNotification\|ZNFeatureSliderValueDidChangeNotification' /tmp/zono_m5106_strings.txt
          ! grep -q 'ZNSharedSiteProbe\|MdhpNuX\|0x2E25904\|Shared Site Owner Stack' /tmp/zono_m5106_strings.txt
          ! grep -q 'fallback-compat-scan\|last-enabled-active-owner-wins' /tmp/zono_m5106_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.10-M5.10.6-OffsetCoreRebuild
          path: |
            iosruntimepatchmenu/dist-m5.10.6-offset-rebuild/ZonoPatch_v0.5.10_M5.10.6_OffsetCoreRebuild.dylib
            iosruntimepatchmenu/dist-m5.10.6-offset-rebuild/SHA256.txt
            iosruntimepatchmenu/dist-m5.10.6-offset-rebuild/SIZE.txt
          if-no-files-found: error

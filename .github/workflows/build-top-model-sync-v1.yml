name: Build MoonMarker Top Model Sync V1

on:
  push:
    branches: ['agent/top-model-sync-v1']
    paths:
      - 'cleanroom/top-model-sync-v1/**'
      - '.github/workflows/build-top-model-sync-v1.yml'
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - 'cleanroom/top-model-sync-v1/**'
      - '.github/workflows/build-top-model-sync-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Decode clean-room inputs
        run: |
          set -euxo pipefail
          mkdir cleanroom_input
          cat cleanroom/bundle.part00 cleanroom/bundle.part01 cleanroom/bundle.part02 cleanroom/bundle.part03 | base64 -d > cleanroom_bundle.zip
          echo '077166868465beba39f5d8a87448190cb5892f9335289b3860a2c2396f5fd31a  cleanroom_bundle.zip' | sha256sum -c -
          unzip -q cleanroom_bundle.zip -d cleanroom_input

          mkdir advanced_v2_input
          cat cleanroom/advanced-v2.fixed.part00 cleanroom/advanced-v2.fixed.part01 cleanroom/advanced-v2.fixed.part02 cleanroom/advanced-v2.fixed.part03 cleanroom/advanced-v2.fixed.part04 cleanroom/advanced-v2.fixed.part05 cleanroom/advanced-v2.fixed.part06 | base64 -d > advanced-v2.tar.xz
          echo 'bb817eb41f64ccea39e5c35119f367146e2ba554597ace2bcb7fa07b6e857e1f  advanced-v2.tar.xz' | sha256sum -c -
          tar -xJf advanced-v2.tar.xz -C advanced_v2_input

      - name: Fetch exact UnitXP SP3 v89 source
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = '3370011e396ccdbf4c9921f6cf2b005bed818b24'

      - name: Reconstruct stable MoonMarker source
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/sceneBegin_sceneEnd.h upstream/Makefile
          sed -i '1s/^\xEF\xBB\xBF//' upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/sceneBegin_sceneEnd.h upstream/Makefile

          patch --batch -p1 -d upstream < cleanroom_input/MoonMarker_Cleanroom.patch
          patch --batch -p1 -d upstream < cleanroom/fix-lua-string.patch
          patch --batch -p1 -d upstream < cleanroom/present-hook.patch
          patch --batch -p1 -d upstream < cleanroom/fix-placement-projection.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/addon-status.patch

          cp cleanroom/native-m2-v2/nativeM2Test.cpp upstream/
          cp cleanroom/native-m2-v2/nativeM2Test.h upstream/
          patch --batch -p1 -d upstream < cleanroom/native-m2-v2.patch
          patch --batch -p1 -d upstream < cleanroom/native-white-v1.patch
          patch --batch -p1 -d upstream < cleanroom/native-white-remote-v1.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/native-white-remote-addon-v1.patch

          cp cleanroom/native-eight-v1/nativeM2Test.cpp upstream/nativeM2Test.cpp
          cp cleanroom/native-eight-v1/nativeM2Test.h upstream/nativeM2Test.h
          python3 cleanroom/apply_eight_markers.py --upstream upstream --addon cleanroom_input/addon --addon-source cleanroom/eight-markers/MoonMarker.lua
          python3 cleanroom/configure_eight_marker_addon.py --addon cleanroom_input/addon --source-dir cleanroom/eight-markers
          python3 cleanroom/apply_guild_auth.py --upstream upstream --source-dir cleanroom/guild-auth-v1
          python3 cleanroom/apply_advanced_editor_bundle.py --upstream upstream --addon cleanroom_input/addon
          python3 cleanroom/apply_advanced_editor_v2.py --upstream upstream --addon cleanroom_input/addon --source-dir advanced_v2_input/advanced-v2

      - name: Apply persistent top-model slots
        run: |
          set -euxo pipefail
          patch --batch -p0 -d upstream < cleanroom/top-model-sync-v1/nativeM2Test.h.patch
          patch --batch -p0 -d upstream < cleanroom/top-model-sync-v1/nativeM2Test.cpp.patch
          patch --batch -p0 -d upstream < cleanroom/top-model-sync-v1/MoonMarkerGuildAuth.cpp.patch
          grep -Fq 'gAdvancedTopModels' upstream/nativeM2Test.cpp
          grep -Fq 'createAdvancedTopModel' upstream/nativeM2Test.cpp
          grep -Fq 'cmd_MoonMarker_Advanced_TopSet' upstream/MoonMarkerGuildAuth.cpp
          grep -Fq 'cmd_MoonMarker_Advanced_TopClear' upstream/MoonMarkerGuildAuth.cpp
          ! grep -Fq '太阳神殿' upstream/MoonMarkerGuildAuth.cpp

      - name: Install Clang 19 and build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Install Windows SDK and D3DX headers
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK

          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/

      - name: Build PE32 x86 DLL
        working-directory: upstream
        run: |
          set -euxo pipefail
          sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' Makefile
          make clean
          make -j2
          file UnitXP_SP3.dll
          file UnitXP_SP3.dll | grep -q 'PE32 executable.*Intel 80386'
          ! strings UnitXP_SP3.dll | grep -Fq '太阳神殿'

      - name: Package runtime DLL
        run: |
          set -euxo pipefail
          mkdir -p release
          cp upstream/UnitXP_SP3.dll release/
          sha256sum release/UnitXP_SP3.dll > release/SHA256.txt
          sha256sum -c release/SHA256.txt
          printf '%s\n' \
            'MoonMarker Top Model Sync V1 DLL' \
            'Adds eight persistent custom top-model slots.' \
            'Ordinary CLEAR/PLACE is unchanged.' \
            'No login restore, snapshots, legacy SYNCREQ/SYNCBEGIN/SYNCEND, or delayed rebuild.' \
            > release/BUILD.txt

      - name: Upload runtime DLL
        uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Top-Model-Sync-V1-x86-DLL
          path: release/
          if-no-files-found: error
          retention-days: 14

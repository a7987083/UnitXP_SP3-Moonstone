name: Build Runtime Patch Menu v0.5.8 M4.6 Full Method Signature

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-m4.6-full-method-signature-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNIL2CPPMethodSignature.h
          test -f iosruntimepatchmenu/src/ZNIL2CPPMethodSignature.mm
          test -f iosruntimepatchmenu/src/ZNRuntimeActionSignaturePostprocess.mm
          test -f iosruntimepatchmenu/src/ZNM46SignatureExecution.mm
          test -f iosruntimepatchmenu/src/ZNM46FullSignatureUI.mm
          grep -q 'src/ZNIL2CPPMethodSignature.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNRuntimeActionSignaturePostprocess.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM46SignatureExecution.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM46FullSignatureUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM46SignatureExecutionDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM46FullSignatureUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNRuntimeActionFlagParameterSignature' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'reserved\[1\]' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'FAILED_SIGNATURE_AMBIGUOUS' iosruntimepatchmenu/src/ZNIL2CPPMethodSignature.mm
          grep -q 'fail-closed' iosruntimepatchmenu/src/ZNM46SignatureExecution.mm
          grep -q 'Static Patch locked to exact candidate RVA' iosruntimepatchmenu/src/ZNM46FullSignatureUI.mm
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          git diff --exit-code a3b8db8651eaea23ec0ae7e5fca497e8f67bcf6c -- \
            iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build M4.6 Full Method Signature
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m4.6-full-signature
          cp .theos/obj/ZonoePatchV03.dylib dist-m4.6-full-signature/ZonoPatch_v0.5.8_M4.6_FullMethodSignature_V1.dylib
          shasum -a 256 dist-m4.6-full-signature/ZonoPatch_v0.5.8_M4.6_FullMethodSignature_V1.dylib | tee dist-m4.6-full-signature/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m4.6-full-signature/ZonoPatch_v0.5.8_M4.6_FullMethodSignature_V1.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out"
          strings -a "$out" > /tmp/zono_m46_strings.txt
          grep -q '\[offset-v2\]' /tmp/zono_m46_strings.txt
          grep -q '\[runtime-method-call\]' /tmp/zono_m46_strings.txt
          grep -q '\[instance-selection-v2\]' /tmp/zono_m46_strings.txt
          grep -q '\[m4.4.2-search-restore\]' /tmp/zono_m46_strings.txt
          grep -q '\[m4.5-owning-method\]' /tmp/zono_m46_strings.txt
          grep -q '\[m4.6-signature\]' /tmp/zono_m46_strings.txt
          grep -q '\[m4.6-signature-ui\]' /tmp/zono_m46_strings.txt
          grep -q 'FAILED_SIGNATURE_AMBIGUOUS' /tmp/zono_m46_strings.txt
          grep -q 'Static Patch locked to exact candidate RVA' /tmp/zono_m46_strings.txt
          grep -q 'il2cpp_method_get_param' /tmp/zono_m46_strings.txt
          grep -q 'il2cpp_type_get_name' /tmp/zono_m46_strings.txt
          init_size=$(otool -l "$out" | awk '$1=="sectname" && $2=="__init_offsets" {found=1; next} found && $1=="size" {print $2; exit}')
          echo "__init_offsets size=$init_size"
          test "$init_size" = '0x0000000000000004' -o "$init_size" = '0x4'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M4.6-FullMethodSignature-V1
          path: |
            iosruntimepatchmenu/dist-m4.6-full-signature/ZonoPatch_v0.5.8_M4.6_FullMethodSignature_V1.dylib
            iosruntimepatchmenu/dist-m4.6-full-signature/SHA256.txt
          if-no-files-found: error

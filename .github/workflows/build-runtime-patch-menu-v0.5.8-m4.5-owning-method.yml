name: Build Runtime Patch Menu v0.5.8 M4.5 Owning Method

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-m4.5-address-owning-method-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNIL2CPPOwningMethodResolver.h
          test -f iosruntimepatchmenu/src/ZNIL2CPPOwningMethodResolver.mm
          test -f iosruntimepatchmenu/src/ZNM45AddressOwningMethodUI.mm
          grep -q 'src/ZNIL2CPPOwningMethodResolver.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM45AddressOwningMethodUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM45AddressOwningMethodDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'bounded-method-interval' iosruntimepatchmenu/src/ZNIL2CPPOwningMethodResolver.mm
          grep -q 'bounded-by-next-known-method' iosruntimepatchmenu/src/ZNIL2CPPOwningMethodResolver.mm
          grep -q 'znm442_submitSearch:' iosruntimepatchmenu/src/ZNM45AddressOwningMethodUI.mm
          grep -q 'm4.5-owning-method' iosruntimepatchmenu/src/ZNM45AddressOwningMethodUI.mm
          grep -q '+0x%llX' iosruntimepatchmenu/src/ZNIL2CPPOwningMethodResolver.mm
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          git diff --exit-code a3b8db8651eaea23ec0ae7e5fca497e8f67bcf6c -- \
            iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build M4.5 Owning Method
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m4.5-owning-method
          cp .theos/obj/ZonoePatchV03.dylib dist-m4.5-owning-method/ZonoPatch_v0.5.8_M4.5_OwningMethod_V1.dylib
          shasum -a 256 dist-m4.5-owning-method/ZonoPatch_v0.5.8_M4.5_OwningMethod_V1.dylib | tee dist-m4.5-owning-method/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m4.5-owning-method/ZonoPatch_v0.5.8_M4.5_OwningMethod_V1.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out"
          strings -a "$out" > /tmp/zono_m45_strings.txt
          grep -q '\[offset-v2\]' /tmp/zono_m45_strings.txt
          grep -q '\[runtime-method-call\]' /tmp/zono_m45_strings.txt
          grep -q '\[instance-selection-v2\]' /tmp/zono_m45_strings.txt
          grep -q '\[m4.4.2-search-restore\]' /tmp/zono_m45_strings.txt
          grep -q '\[m4.5-owning-method\]' /tmp/zono_m45_strings.txt
          grep -q 'bounded-method-interval' /tmp/zono_m45_strings.txt
          grep -q 'znm45_submitSearch:' /tmp/zono_m45_strings.txt
          grep -q 'il2cpp_method_get_pointer' /tmp/zono_m45_strings.txt
          init_size=$(otool -l "$out" | awk '$1=="sectname" && $2=="__init_offsets" {found=1; next} found && $1=="size" {print $2; exit}')
          echo "__init_offsets size=$init_size"
          test "$init_size" = '0x0000000000000004' -o "$init_size" = '0x4'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M4.5-OwningMethod-V1
          path: |
            iosruntimepatchmenu/dist-m4.5-owning-method/ZonoPatch_v0.5.8_M4.5_OwningMethod_V1.dylib
            iosruntimepatchmenu/dist-m4.5-owning-method/SHA256.txt
          if-no-files-found: error

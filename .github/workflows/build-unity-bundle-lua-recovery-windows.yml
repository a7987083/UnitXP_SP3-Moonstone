name: Build Unity Bundle Lua Recovery Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.4.2-g2-full-sweep
    paths:
      - 'tools/unity_bundle_lua_recovery.py'
      - 'tools/unity_bundle_lua_recovery_gui.py'
      - '.github/workflows/build-unity-bundle-lua-recovery-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install UnityPy==1.25.3 pyinstaller==6.22.3 tkinterdnd2
          python -c "import UnityPy; print('UnityPy', UnityPy.__version__)"
          pyinstaller --version

      - name: Verify source and self-test
        shell: pwsh
        run: |
          python -m py_compile tools/unity_bundle_lua_recovery.py tools/unity_bundle_lua_recovery_gui.py
          python tools/unity_bundle_lua_recovery.py --self-test
          python tools/unity_bundle_lua_recovery_gui.py --self-test
          Select-String -Path tools/unity_bundle_lua_recovery.py -SimpleMatch 'ENCM_XOR_KEY = 0x4D'
          Select-String -Path tools/unity_bundle_lua_recovery.py -SimpleMatch 'UnityFS'
          Select-String -Path tools/unity_bundle_lua_recovery.py -SimpleMatch 'TextAsset'
          Select-String -Path tools/unity_bundle_lua_recovery.py -SimpleMatch 'recovered_json'
          if (Select-String -Path tools/unity_bundle_lua_recovery.py -Pattern 'exec\(|eval\(' -Quiet) { throw 'arbitrary code execution primitive found' }

      - name: Build GUI EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name UnityBundleLuaRecovery `
            --paths tools `
            --collect-all UnityPy `
            --collect-all tkinterdnd2 `
            tools/unity_bundle_lua_recovery_gui.py
          Get-Item dist/UnityBundleLuaRecovery.exe | Format-List Name,Length
          Get-FileHash dist/UnityBundleLuaRecovery.exe -Algorithm SHA256 | Format-List

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/UnityBundleLuaRecovery.exe release/
          @'
          Unity Bundle Lua Recovery v0.2.0

          用法：
          1. 从手机导出游戏 .app/Data（如可访问）、Documents、Library/Caches 等数据目录。
          2. 运行 UnityBundleLuaRecovery.exe。
          3. 选择或拖入游戏数据根目录。
          4. 点击“开始全量处理”。

          功能：
          - 递归识别 UnityFS/UnityRaw/UnityWeb 和常见 Bundle/cache 候选。
          - UnityPy 解析 AssetBundle/SerializedFile，提取全部 TextAsset。
          - 自动识别 ENCM + XOR 0x4D、Lua 5.3 bytecode、Lua source、直接 JSON。
          - TAB_*_1/_2/... 分片按组共享静态环境恢复。
          - Lua 字节码只做确定性静态白名单解释，不执行 Lua。
          - 原始输入只读，不修改。

          输出：raw_textasset、decoded_lua、direct_json、recovered_json、summary.json、recovery_report.json。
          '@ | Set-Content -Encoding UTF8 release/README.txt
          $hash = (Get-FileHash release/UnityBundleLuaRecovery.exe -Algorithm SHA256).Hash.ToLower()
          "${hash}  UnityBundleLuaRecovery.exe" | Set-Content -Encoding ASCII release/SHA256.txt
          Compress-Archive -Path release/UnityBundleLuaRecovery.exe,release/README.txt,release/SHA256.txt -DestinationPath release/UnityBundleLuaRecovery_Windows_x64_v0.2.0.zip -Force
          $zhash = (Get-FileHash release/UnityBundleLuaRecovery_Windows_x64_v0.2.0.zip -Algorithm SHA256).Hash.ToLower()
          "${zhash}  UnityBundleLuaRecovery_Windows_x64_v0.2.0.zip" | Set-Content -Encoding ASCII release/ZIP_SHA256.txt

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: UnityBundleLuaRecovery-Windows-x64-v0.2.0
          path: |
            release/UnityBundleLuaRecovery.exe
            release/README.txt
            release/SHA256.txt
            release/UnityBundleLuaRecovery_Windows_x64_v0.2.0.zip
            release/ZIP_SHA256.txt
          if-no-files-found: error

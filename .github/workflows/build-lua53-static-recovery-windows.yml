name: Build Lua53 Static Recovery Windows

on:
  push:
    branches:
      - feature/lua53-static-recovery-v0.1
    paths:
      - tools/lua53_static_recover.py
      - tools/lua53_static_recovery_gui.py
      - .github/workflows/build-lua53-static-recovery-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7 tkinterdnd2==0.6.3
          python -m PyInstaller --version

      - name: Source self-test
        shell: pwsh
        run: |
          python tools/lua53_static_recovery_gui.py --self-test

      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Lua53StaticRecovery `
            --collect-all tkinterdnd2 `
            tools/lua53_static_recovery_gui.py

      - name: Executable self-test
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Lua53StaticRecovery.exe')) { throw 'EXE missing after build' }
          $p = Start-Process -FilePath (Resolve-Path 'dist/Lua53StaticRecovery.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE self-test failed with exit code $($p.ExitCode)" }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Lua53StaticRecovery.exe release/Lua53StaticRecovery.exe
          $hash = (Get-FileHash release/Lua53StaticRecovery.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Lua53StaticRecovery.exe" | Set-Content -Encoding ascii release/SHA256.txt
          @'
          Lua 5.3 Static Recovery v0.1.0
          =================================

          Windows x64 GUI build.

          Usage:
          1. Double-click Lua53StaticRecovery.exe.
          2. Drag .luac/.bin/.bytes files or folders into the window, or use Add File/Add Folder.
          3. Choose an output directory.
          4. Click Start Recovery.

          Outputs per input:
          - *.recovered.json
          - *.recovered.lua
          - *.recovered.meta.json
          - *.normalized-format0.luac

          Safety model:
          - Original input is never modified.
          - The tool only interprets an allow-listed static Lua 5.3 table-construction opcode subset.
          - It does not execute arbitrary Lua/native code.

          Build dependencies:
          - Python 3.12 x64
          - PyInstaller 6.22.3
          - pyinstaller-hooks-contrib 2026.7
          - tkinterdnd2 0.6.3

          Note: this executable is not Authenticode-signed, so Windows SmartScreen may show an unknown-publisher warning.
          '@ | Set-Content -Encoding utf8 release/README.txt
          Compress-Archive -Path release/* -DestinationPath Lua53StaticRecovery_Windows_x64_v0.1.0.zip -CompressionLevel Optimal
          Get-FileHash Lua53StaticRecovery_Windows_x64_v0.1.0.zip -Algorithm SHA256 | Format-List

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Lua53StaticRecovery-Windows-x64-v0.1.0
          path: Lua53StaticRecovery_Windows_x64_v0.1.0.zip
          if-no-files-found: error
          retention-days: 30

name: Check MoonMarker FuBar V1

on:
  workflow_dispatch:
  push:
    branches: ['agent/guild-auth-gate']
    paths:
      - 'cleanroom/fubar-v1/**'
      - 'cleanroom/apply_fubar_v1.py'
      - 'cleanroom/apply_advanced_editor_v2.py'
      - '.github/workflows/check-fubar-v1.yml'
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - 'cleanroom/fubar-v1/**'
      - 'cleanroom/apply_fubar_v1.py'
      - 'cleanroom/apply_advanced_editor_v2.py'
      - '.github/workflows/check-fubar-v1.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate FuBar and installers
        run: |
          set -euxo pipefail
          luac5.1 -p cleanroom/fubar-v1/FuBar.lua
          python3 -m py_compile cleanroom/apply_fubar_v1.py cleanroom/apply_advanced_editor_v2.py
          grep -Fq 'MoonMarker_BindingToggle' cleanroom/fubar-v1/FuBar.lua
          grep -Fq 'FuBarPlugin-2.0' cleanroom/fubar-v1/FuBar.lua
          grep -Fq 'SLASH_MOONMARKERFUBAR1 = "/mmfubar"' cleanroom/fubar-v1/FuBar.lua

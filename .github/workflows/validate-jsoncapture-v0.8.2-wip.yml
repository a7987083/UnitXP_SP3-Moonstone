name: Validate JSONCapture v0.8.3 WIP

on:
  push:
    branches:
      - fix/jsoncapture-v0.8.2-recovery-memory-bundles
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/validate-jsoncapture-v0.8.2-wip.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply patch chain
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          python3 scripts/apply_v052_runtime_cache.py
          python3 scripts/apply_v054_response_observer.py
          python3 scripts/apply_v055_response_capture.py
          python3 scripts/apply_v056_response_metadata.py
          python3 scripts/apply_v056_response_metadata_hardening.py
          python3 scripts/apply_v057_unity_all_json.py
          python3 scripts/apply_v057_compile_compat.py
          python3 scripts/apply_v058_socket_http_json.py
          python3 scripts/apply_v059_network_coverage.py
          python3 scripts/apply_v059_compile_fix.py
          python3 scripts/apply_v060_page_protobuf.py
          python3 scripts/apply_v060_hardening.py
          python3 scripts/apply_v070_page_snapshot.py
          python3 scripts/apply_v071_snapshot_completeness.py
          python3 scripts/apply_v080_page_dependency.py
          python3 scripts/apply_v080_runtime_auto_fix.py
          python3 scripts/apply_v081_runtime_latest_sync.py
          python3 scripts/apply_v082_sha256_identity.py
          python3 scripts/apply_v083_foundation_fixes.py
          python3 scripts/apply_v083_recovery_memory.py
          python3 scripts/apply_v083_recovery_summary_restore.py
          python3 scripts/apply_v083_snapshot_mode_unify.py
          python3 scripts/apply_v083_compile_cleanup.py

      - name: Verify v0.8.3 invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          src=src/ManualTaskEngineV05.m
          rec=src/OnDeviceLuaRecovery.m
          grep -Fq 'JCG5_SHA256_IDENTITY_V082' "$src"
          grep -Fq 'JCG5_FOUNDATION_FIXES_V083' "$src"
          grep -Fq 'JCG5_SNAPSHOT_MODE_UNIFY_V083' "$src"
          grep -Fq 'JCG5_V083_COMPILE_CLEANUP' "$src"
          grep -Fq 'JSONCapture v0.8.3 Snapshot Unified' "$src"
          grep -Fq 'stringByAppendingPathComponent:@"Bundles"' "$src"
          grep -Fq 'JCG83OnCanonicalSnapshotWrite' "$src"
          grep -Fq 'authority=runtime_page_snapshot' "$src"
          grep -Fq 'semantic_sha256' "$src"
          grep -Fq 'file_sha256' "$src"
          grep -Fq 'ODLR_RECOVERY_MEMORY_V083' "$rec"
          grep -Fq 'ODLRBuildSummary' "$rec"
          grep -Fq 'incremental_exact_top_k' "$rec"
          ! grep -Fq 'gJCG81Mode2RunPages' "$src"
          ! grep -Fq 'JCG81CaptureJSONData(gJCG80Mode1Session' "$src"
          ! grep -Fq 'JCG81CaptureJSONData(session, meta' "$src"
          ! grep -Fq 'JCG81CaptureProtobufData(gJCG80Mode1Session' "$src"
          ! grep -Fq 'JCG81CaptureProtobufData(session, event' "$src"
          ! grep -Fq 'JCG81WriteCleanPageData(gJCG80Mode1Session' "$src"
          ! grep -Fq 'JCG81WriteCleanPageData(session, gJCG81Mode2DataDir' "$src"
          ! grep -Fq 'JCG5MD5(' "$src"
          ! grep -Fq 'CC_MD5_DIGEST_LENGTH' "$src"

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build arm64
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          file .theos/obj/JSONCapture.dylib
          strings .theos/obj/JSONCapture.dylib | grep -F 'effective-identity=full-sha256'
          strings .theos/obj/JSONCapture.dylib | grep -F 'JSONCapture v0.8.3 Snapshot Unified'
          strings .theos/obj/JSONCapture.dylib | grep -F 'runtime_page_snapshot'
          cp .theos/obj/JSONCapture.dylib ../JSONCapture_v0.8.3_SnapshotUnified_WIP.dylib
          shasum -a 256 ../JSONCapture_v0.8.3_SnapshotUnified_WIP.dylib | tee ../JSONCapture_v0.8.3_SnapshotUnified_WIP.sha256

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSONCapture-v0.8.3-SnapshotUnified-WIP
          path: |
            JSONCapture_v0.8.3_SnapshotUnified_WIP.dylib
            JSONCapture_v0.8.3_SnapshotUnified_WIP.sha256
          if-no-files-found: error
          retention-days: 30

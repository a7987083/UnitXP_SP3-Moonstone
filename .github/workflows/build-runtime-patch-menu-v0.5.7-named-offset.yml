name: Build Runtime Patch Menu v0.5.7 Named Offset

on:
  push:
    branches:
      - feature/runtime-patch-menu-il2cpp-named-offset-resolver-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Named Offset source assertions
        run: |
          set -euxo pipefail
          src=iosruntimepatchmenu/src
          makefile=iosruntimepatchmenu/Makefile

          # Keep the sealed v0.5.6.2 lifecycle/performance baseline intact.
          test ! -e "$src/ZNActivationTrace.mm"
          ! grep -q 'src/ZNActivationTrace.mm' "$makefile"
          ! grep -R -q 'ZonoPatch-v0.5.6.2.log' "$src"
          grep -q 'gZNModuleRegistrationReplay' "$src/ZNPatchCore.mm"
          grep -q 'imageNotificationScheduled' "$src/ZNPatchCore.mm"
          grep -q 'zn44_scheduleRefreshAfter' "$src/ZNStaticDispatchRuntime.mm"

          # Named Offset must be explicit, deferred, and compiled.
          grep -q 'src/ZNIL2CPPNamedOffsetWorkspace.mm' "$makefile"
          grep -q 'resolveNamedOffsetExpression' "$src/ZNIL2CPPResolver.h"
          grep -q 'il2cpp_image_get_class_count' "$src/ZNIL2CPPResolver.mm"
          grep -q 'il2cpp_class_get_methods' "$src/ZNIL2CPPResolver.mm"
          grep -q 'isExecutableUnityAddress' "$src/ZNIL2CPPResolver.mm"
          grep -q 'ZNInstallIL2CPPNamedOffsetWorkspaceDeferred' "$src/ZNDeferredBootstrap.mm"
          grep -q 'row.target = @"UnityFramework"' "$src/ZNIL2CPPNamedOffsetWorkspace.mm"
          grep -q 'static dispatch_once_t onceToken' "$src/ZNIL2CPPNamedOffsetWorkspace.mm"

          # Preserve sealed Static Builder/Protection invariants.
          grep -q 'ZN44_STATIC_HEADER_FLAG_PAYLOAD_PROTECTION_V2' "$src/ZNStaticPatchFormat.h"
          grep -q 'ZNStaticPayloadProtectionV2.h' "$src/ZNStaticBinaryBuilderV3.mm"
          grep -q 'payload-v2+static-rva-protection-v1' "$src/ZNGeneratedBinaryPostprocess.mm"
          grep -q 'zn.f.%016llx.enabled' "$src/ZNFeatureGroupUI.mm"

          compiled="$(sed -n 's/^ZonoePatchV03_FILES = //p' "$makefile")"
          ctor_hits=""
          load_hits=""
          for f in $compiled; do
            if grep -n '__attribute__((constructor' "iosruntimepatchmenu/$f" >/tmp/zn_ctor_hits 2>/dev/null; then
              ctor_hits="$ctor_hits\niosruntimepatchmenu/$f:$(cat /tmp/zn_ctor_hits)"
            fi
            if grep -nE '^[[:space:]]*\+[[:space:]]*\(void\)load[[:space:]]*\{' "iosruntimepatchmenu/$f" >/tmp/zn_load_hits 2>/dev/null; then
              load_hits="$load_hits\niosruntimepatchmenu/$f:$(cat /tmp/zn_load_hits)"
            fi
          done
          test "$(printf '%b\n' "$ctor_hits" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          printf '%b\n' "$ctor_hits" | grep 'ZNDeferredBootstrap.mm'
          printf '%b\n' "$ctor_hits" | grep 'ZNDeferredColdLauncherBootstrap'
          test -z "$(printf '%b' "$load_hits")"

      - name: Named Offset parser tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/il2cpp_named_offset_parser_test.mm \
            iosruntimepatchmenu/src/ZNIL2CPPResolver.mm \
            -o /tmp/zn_il2cpp_named_offset_parser_test
          /tmp/zn_il2cpp_named_offset_parser_test

      - name: Protection V2 layout tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/static_payload_protection_v2_test.mm -o /tmp/zn_static_payload_protection_v2_test
          /tmp/zn_static_payload_protection_v2_test

      - name: Feature metadata codec tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/feature_metadata_codec_test.mm iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm -o /tmp/zn_feature_metadata_codec_test
          /tmp/zn_feature_metadata_codec_test

      - name: Static RVA protection tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/static_rva_protection_test.mm -o /tmp/zn_static_rva_protection_test
          /tmp/zn_static_rva_protection_test

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v057-named-offset
          cp .theos/obj/ZonoePatchV03.dylib dist-v057-named-offset/ZonoPatch_v0.5.7_NamedOffset.dylib
          shasum -a 256 dist-v057-named-offset/ZonoPatch_v0.5.7_NamedOffset.dylib | tee dist-v057-named-offset/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-v057-named-offset/ZonoPatch_v0.5.7_NamedOffset.dylib
          file "$out"
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'

          strings "$out" > /tmp/zonoe_v057_named_strings.txt
          ! grep -q 'ZonoPatch-v0.5.6.2.log' /tmp/zonoe_v057_named_strings.txt
          grep -q 'il2cpp_image_get_class_count' /tmp/zonoe_v057_named_strings.txt
          grep -q 'il2cpp_class_get_methods' /tmp/zonoe_v057_named_strings.txt
          grep -q 'payload-v2+static-rva-protection-v1' /tmp/zonoe_v057_named_strings.txt

          python3 <<'PY'
          import struct
          p='iosruntimepatchmenu/dist-v057-named-offset/ZonoPatch_v0.5.7_NamedOffset.dylib'
          data=open(p,'rb').read()
          if struct.unpack_from('<I',data,0)[0] != 0xfeedfacf:
              raise SystemExit('not thin arm64 Mach-O')
          ncmds=struct.unpack_from('<I',data,16)[0]
          off=32
          init_size=None
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',data,off)
              if cmd==0x19:
                  nsects=struct.unpack_from('<I',data,off+64)[0]
                  so=off+72
                  for __ in range(nsects):
                      sectname=data[so:so+16].split(b'\0',1)[0]
                      if sectname==b'__init_offsets':
                          init_size=struct.unpack_from('<Q',data,so+40)[0]
                      so+=80
              off+=cmdsize
          print('init_offsets_size=',init_size)
          if init_size != 4:
              raise SystemExit(f'expected exactly one cold-launch constructor, got {init_size}')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.7-NamedOffset-Test
          path: |
            iosruntimepatchmenu/dist-v057-named-offset/ZonoPatch_v0.5.7_NamedOffset.dylib
            iosruntimepatchmenu/dist-v057-named-offset/SHA256.txt
          if-no-files-found: error

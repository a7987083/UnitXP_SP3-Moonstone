name: Build iOS Runtime Patch Menu v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-runtime-patch-menu-v0.2-ui
    paths:
      - 'iosruntimepatchmenu/**'
      - '.github/workflows/build-ios-runtime-patch-menu-v0.2.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify runtime menu v0.2.4 adaptive themes
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu

          src="src/ZonoeRuntimeMenuV024.mm"
          grep -q "0.2.4-ui" "$src"
          grep -q '主题' "$src"
          grep -q "kZNThemeCategoryIndex" "$src"
          grep -q "addThemeGridY" "$src"
          grep -q "themeColumnsForWidth" "$src"
          grep -q "fullSizeForWindow" "$src"
          grep -q "ZNThemeModeCount" src/ZNTheme.h
          grep -q "ZNThemeModeRetroArcade" src/ZNTheme.h
          grep -q "玻璃拟态" src/ZNTheme.mm
          grep -q "终端黑客" src/ZNTheme.mm
          grep -q "太空舰桥" src/ZNTheme.mm
          grep -q "熔岩锻造" src/ZNTheme.mm
          grep -q "深海声呐" src/ZNTheme.mm
          grep -q "复古街机" src/ZNTheme.mm
          grep -q "kZNCompactModeKey" "$src"
          grep -q "kZNSelectedCategoryKey" "$src"
          grep -q "ZNEnabledKey" "$src"
          grep -q "ZNValueKey" "$src"
          grep -q "placeCompactSwitch" "$src"
          ! grep -q "恢复默认" "$src"
          ! grep -q "themePopover" "$src"

          make clean
          make FINALPACKAGE=1

          mkdir -p dist
          out="dist/ZonoePatch_v0.2.4_AdaptiveThemes.dylib"
          cp .theos/obj/ZonoePatchV02.dylib "$out"

          file "$out"
          otool -L "$out"
          strings "$out" | grep -q "Runtime Patch Menu"
          strings "$out" | grep -q "0.2.4-ui"
          strings "$out" | grep -q "paintpalette.fill"
          nm -gU "$out" | grep -q "_ZonoePatchGetAPIVersion"
          nm -gU "$out" | grep -q "_ZonoePatchStart"
          nm -gU "$out" | grep -q "_ZonoePatchShow"
          nm -gU "$out" | grep -q "_ZonoePatchHide"
          nm -gU "$out" | grep -q "_ZonoePatchIsVisible"

          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ZonoePatch-v0.2.4-AdaptiveThemes
          path: iosruntimepatchmenu/dist/*

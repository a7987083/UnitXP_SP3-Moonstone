name: Build iOS Runtime Patch Menu v0.3

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-runtime-patch-menu-v0.2-ui
    paths:
      - 'iosruntimepatchmenu/**'
      - '.github/workflows/build-ios-runtime-patch-menu-v0.2.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify runtime menu v0.3 Patch Core
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu

          src="src/ZonoeRuntimeMenuV030.mm"
          grep -q "0.3.0-core" "$src"
          grep -q '诊断' "$src"
          grep -q 'Debug' "$src"
          grep -q 'ZonoeRuntimeMenuV024.mm' "$src"
          grep -q 'ZonoeHostGetUDID' src/ZNDeveloperGate.mm
          grep -q 'ZonoeHostIsAuthorized' src/ZNDeveloperGate.mm
          grep -q 'Clipboard Fallback' src/ZNDeveloperGate.mm
          grep -q 'Documents/1' src/ZNDeveloperGate.mm
          grep -q 'PatchManager initialized' src/ZNPatchCore.mm
          grep -q 'UnityFramework' src/ZNPatchCore.mm
          grep -q 'runSelfTest' src/ZNPatchCore.mm
          grep -q 'ZonoePatchSubmitHostIdentity' src/ZNHostBridge.h
          grep -q '20 种外观' src/ZonoeRuntimeMenuV024.mm
          grep -q 'ZNThemeModeRetroArcade' src/ZNTheme.h
          ! grep -q "恢复默认" src/ZonoeRuntimeMenuV024.mm
          ! grep -q "themePopover" src/ZonoeRuntimeMenuV024.mm

          make clean
          make FINALPACKAGE=1

          mkdir -p dist
          out="dist/ZonoePatch_v0.3.0_PatchCore_Diagnostics.dylib"
          cp .theos/obj/ZonoePatchV03.dylib "$out"

          file "$out"
          otool -L "$out"
          strings "$out" | grep -q "Runtime Patch Menu"
          strings "$out" | grep -q "0.3.0-core"
          strings "$out" | grep -q "PatchManager initialized"
          strings "$out" | grep -q "Developer Gate"
          strings "$out" | grep -q "ZonoeHostGetUDID"
          nm -gU "$out" | grep -q "_ZonoePatchGetAPIVersion"
          nm -gU "$out" | grep -q "_ZonoePatchGetVersion"
          nm -gU "$out" | grep -q "_ZonoePatchStart"
          nm -gU "$out" | grep -q "_ZonoePatchShow"
          nm -gU "$out" | grep -q "_ZonoePatchHide"
          nm -gU "$out" | grep -q "_ZonoePatchIsVisible"
          nm -gU "$out" | grep -q "_ZonoePatchDeveloperAuthorized"
          nm -gU "$out" | grep -q "_ZonoePatchRequestUDIDValidation"
          nm -gU "$out" | grep -q "_ZonoePatchSubmitHostIdentity"

          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ZonoePatch-v0.3.0-PatchCore-Diagnostics
          path: iosruntimepatchmenu/dist/*

name: Build Runtime Patch Menu v0.5.9 M5.9.2 Architecture Rebuild

on:
  push:
    branches:
      - feature/m5.9.2-architecture-rebuild-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source contract assertions
        run: |
          set -euxo pipefail
          grep -q '0.5.9 · M5.9.2' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNFeaturePageModel.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNFeaturePageUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZN_UI_CANONICAL_FEATURE_RENDERER' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNInstallCanonicalFeaturePageDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'render path has no discovery refresh' iosruntimepatchmenu/src/ZNFeaturePageUI.mm
          grep -q 'ZNFeaturePageSourceStaticOffset' iosruntimepatchmenu/src/ZNFeaturePageModel.h
          grep -q 'ZNFeaturePageSourceRuntimeIL2CPP' iosruntimepatchmenu/src/ZNFeaturePageModel.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          python3 - <<'PY'
          from pathlib import Path
          s=Path('iosruntimepatchmenu/src/ZNFeaturePageUI.mm').read_text()
          body=s[s.index('- (void)znfr_render:(BOOL)compact'):s.index('- (void)znfr_renderFull')]
          assert '[runtime refresh]' not in body
          assert '[[ZNRuntimeActionRuntime sharedRuntime] refresh]' not in body
          assert '[[ZNStaticDispatchRuntime sharedRuntime] refresh]' not in body
          assert 'CGFloat width = CGRectGetWidth(self.contentView.bounds), y =' in body
          print('canonical Feature render contract OK')
          PY
      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
      - name: Build M5.9.2 Architecture Rebuild
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.9.2-rebuild
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.9.2-rebuild/ZonoPatch_v0.5.9_M5.9.2_UIRebuild.dylib
          shasum -a 256 dist-m5.9.2-rebuild/ZonoPatch_v0.5.9_M5.9.2_UIRebuild.dylib | tee dist-m5.9.2-rebuild/SHA256.txt
      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.9.2-rebuild/ZonoPatch_v0.5.9_M5.9.2_UIRebuild.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m592_rebuild_load_commands.txt
          strings -a "$out" > /tmp/zono_m592_rebuild_strings.txt
          grep -q 'canonical renderer bound' /tmp/zono_m592_rebuild_strings.txt
          grep -q 'snapshot published' /tmp/zono_m592_rebuild_strings.txt
          grep -q 'm5.9.2-offset-persist' /tmp/zono_m592_rebuild_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m592_rebuild_load_commands.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.9-M5.9.2-UIRebuild
          path: |
            iosruntimepatchmenu/dist-m5.9.2-rebuild/ZonoPatch_v0.5.9_M5.9.2_UIRebuild.dylib
            iosruntimepatchmenu/dist-m5.9.2-rebuild/SHA256.txt
          if-no-files-found: error
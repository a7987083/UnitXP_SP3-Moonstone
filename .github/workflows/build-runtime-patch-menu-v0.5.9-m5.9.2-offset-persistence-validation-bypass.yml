name: Build Runtime Patch Menu v0.5.9 M5.9.2 Unified Other Page

on:
  push:
    branches:
      - feature/m5.9.2-offset-register-analysis
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source contract assertions
        run: |
          set -euxo pipefail
          grep -q '0.5.9 · M5.9.2' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNM592OffsetAuthoringPersistence.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNM592UnifiedOtherPage.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM592FlatAuthoring.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM592OffsetAuthoringPersistenceDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM592UnifiedOtherPageDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZN_UI_CANONICAL_FEATURE_RENDERER' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          grep -q 'method_setImplementation' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          grep -q 'Runtime Method Call' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          grep -q 'Offset 功能' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          grep -q 'UIKeyboardTypeDefault' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          grep -q 'UIReturnKeyDone' iosruntimepatchmenu/src/ZNM592UnifiedOtherPage.mm
          ! grep -q 'ZNInstallRuntimeMethodCallBuilderUIDeferred();' iosruntimepatchmenu/src/ZNRuntimeMethodCallBootstrap.mm
          grep -q 'zonoe.m5.9.2.offset-authoring.v1' iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm
          grep -q 'bypassed legacy MOV/FMOV gate' iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm
          grep -q 'row.enabledText=ZNM592Hex(data)' iosruntimepatchmenu/src/ZNM592OffsetAuthoringPersistence.mm
          grep -q 'ZN44_STATIC_ENTRY_FLAG_OFFSET_HOOK_V1' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'DobbyInstrument' iosruntimepatchmenu/src/ZNM591OffsetHookControls.mm
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
      - name: Build M5.9.2 Unified Other Page
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.9.2-unified
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.9.2-unified/ZonoPatch_v0.5.9_M5.9.2_UnifiedOtherPage.dylib
          shasum -a 256 dist-m5.9.2-unified/ZonoPatch_v0.5.9_M5.9.2_UnifiedOtherPage.dylib | tee dist-m5.9.2-unified/SHA256.txt
      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.9.2-unified/ZonoPatch_v0.5.9_M5.9.2_UnifiedOtherPage.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m592_unified_load_commands.txt
          strings -a "$out" > /tmp/zono_m592_unified_strings.txt
          grep -q '\[m5.9.2\]' /tmp/zono_m592_unified_strings.txt
          grep -q 'm5.9.2-unified-other' /tmp/zono_m592_unified_strings.txt
          grep -q 'Runtime Method Call' /tmp/zono_m592_unified_strings.txt
          grep -q 'm5.9.2-offset-persist' /tmp/zono_m592_unified_strings.txt
          grep -q 'm5.9.2-validate' /tmp/zono_m592_unified_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m592_unified_load_commands.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.9-M5.9.2-UnifiedOtherPage
          path: |
            iosruntimepatchmenu/dist-m5.9.2-unified/ZonoPatch_v0.5.9_M5.9.2_UnifiedOtherPage.dylib
            iosruntimepatchmenu/dist-m5.9.2-unified/SHA256.txt
          if-no-files-found: error

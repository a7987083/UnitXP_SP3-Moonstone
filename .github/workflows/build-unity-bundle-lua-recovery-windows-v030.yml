name: Build Unity Bundle Lua Recovery Windows v0.3.0 Combined

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unity-bundle-lua-recovery-v0.3-combined
    paths:
      - 'tools/unity_bundle_lua_recovery.py'
      - 'tools/ublr_v030_common.py'
      - 'tools/ublr_v030_recovery.py'
      - 'tools/unity_bundle_lua_recovery_v030.py'
      - 'tools/unity_bundle_lua_recovery_gui_v030.py'
      - '.github/workflows/build-unity-bundle-lua-recovery-windows-v030.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install UnityPy==1.25.3 pyinstaller==6.22.3 tkinterdnd2
          python -c "import UnityPy; print('UnityPy', UnityPy.__version__)"
          pyinstaller --version

      - name: Verify combined recovery
        shell: pwsh
        run: |
          python -m py_compile tools/unity_bundle_lua_recovery.py tools/ublr_v030_common.py tools/ublr_v030_recovery.py tools/unity_bundle_lua_recovery_v030.py tools/unity_bundle_lua_recovery_gui_v030.py
          python tools/unity_bundle_lua_recovery_v030.py --self-test
          python tools/unity_bundle_lua_recovery_gui_v030.py --self-test
          Select-String -Path tools/ublr_v030_common.py -SimpleMatch 'RETURN-value capture'
          Select-String -Path tools/ublr_v030_recovery.py -SimpleMatch 'recovered_complete'
          Select-String -Path tools/ublr_v030_recovery.py -SimpleMatch 'recovered_partial'
          Select-String -Path tools/unity_bundle_lua_recovery_v030.py -SimpleMatch 'cross_source_duplicates'
          Select-String -Path tools/unity_bundle_lua_recovery_gui_v030.py -SimpleMatch '整个游戏数据根目录'

      - name: Build GUI EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name UnityBundleLuaRecoveryCombined `
            --paths tools `
            --collect-all UnityPy `
            --collect-all tkinterdnd2 `
            tools/unity_bundle_lua_recovery_gui_v030.py
          Get-Item dist/UnityBundleLuaRecoveryCombined.exe | Format-List Name,Length
          Get-FileHash dist/UnityBundleLuaRecoveryCombined.exe -Algorithm SHA256 | Format-List

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/UnityBundleLuaRecoveryCombined.exe release/
          @'
          Unity Bundle Lua Recovery Combined v0.3.0

          - 第一个输入请选整个爱思导出的游戏数据根目录，不要只选 Bundles。
          - 可选导入手机 Documents/JSONCapture/FullSweep。
          - Bundle + 手机 Lua 按解码后 SHA256 全局去重。
          - 支持 TAB_*、普通全局 LuaTable、RETURN LuaTable。
          - 后续分片动态失败时保留已恢复数据到 recovered_partial。
          - TAB 行宽不一致时保留可解析字段，额外字段写入 _extra。
          - 同一分片多个版本使用有界候选评估，优先保留静态数据量更完整的结果。
          - 工具不会执行 Lua。

          重点输出：
          recovered_complete/
          recovered_partial/
          combined_lua/
          dynamic_lua/
          combined_recovery_report.json
          summary.json
          '@ | Set-Content -Encoding UTF8 release/README.txt

          $hash = (Get-FileHash release/UnityBundleLuaRecoveryCombined.exe -Algorithm SHA256).Hash.ToLower()
          "${hash}  UnityBundleLuaRecoveryCombined.exe" | Set-Content -Encoding ASCII release/SHA256.txt
          Compress-Archive -Path release/UnityBundleLuaRecoveryCombined.exe,release/README.txt,release/SHA256.txt -DestinationPath release/UnityBundleLuaRecoveryCombined_Windows_x64_v0.3.0.zip -Force
          $zhash = (Get-FileHash release/UnityBundleLuaRecoveryCombined_Windows_x64_v0.3.0.zip -Algorithm SHA256).Hash.ToLower()
          "${zhash}  UnityBundleLuaRecoveryCombined_Windows_x64_v0.3.0.zip" | Set-Content -Encoding ASCII release/ZIP_SHA256.txt

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: UnityBundleLuaRecoveryCombined-Windows-x64-v0.3.0
          path: |
            release/UnityBundleLuaRecoveryCombined.exe
            release/README.txt
            release/SHA256.txt
            release/UnityBundleLuaRecoveryCombined_Windows_x64_v0.3.0.zip
            release/ZIP_SHA256.txt
          if-no-files-found: error

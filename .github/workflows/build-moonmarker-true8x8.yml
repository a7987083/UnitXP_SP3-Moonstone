name: Build MoonMarker True 8x8 DLL

on:
  workflow_dispatch:
  push:
    branches:
      - agent/moonmarker-true-8x8-dll
    paths:
      - 'patches/true8x8.patch.gz.b64.part*'
      - '.github/workflows/build-moonmarker-true8x8.yml'
      - 'BUILD-TRUE8X8.md'

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install Clang and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link
          clang-cl --version
          lld-link --version

      - name: Fetch exact UnitXP_SP3 v89 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"
          test -f upstream/Makefile
          test -f upstream/dllmain.cpp

      - name: Normalize source and apply True 8x8 patch
        shell: bash
        run: |
          set -euxo pipefail
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'
          wc -c patches/true8x8.patch.gz.b64.part*
          sha256sum patches/true8x8.patch.gz.b64.part*
          echo '56129deb1bc2bd107e3259c208dd64ff3752a8318de6a53df5597cc4807d95f5  patches/true8x8.patch.gz.b64.part00' | sha256sum -c -
          echo '817da4c402c956cb79b43ed8866892718e9c45b616ccde750eb4fb5a90ef5e2a  patches/true8x8.patch.gz.b64.part01' | sha256sum -c -
          echo 'd10f3a33e7e3cd68e1327c16646c9dee028d6ba99f2801eaa097ad877f1494d7  patches/true8x8.patch.gz.b64.part02' | sha256sum -c -
          echo 'f5aabc8eee03a1c88784932d9c9747dc61ef5f7074ed9d186f99097886be1d57  patches/true8x8.patch.gz.b64.part03' | sha256sum -c -
          echo '40f6d57b5698860978cb24d95b5098edc7217bdf540db1de3f9572b8cf0aba8a  patches/true8x8.patch.gz.b64.part04' | sha256sum -c -
          echo 'c0717e82b5e29082411894c758a668881cf437886eca788d99eed6ffd409183b  patches/true8x8.patch.gz.b64.part05' | sha256sum -c -
          echo 'c635adf59d12941f59ef9601a8a02f36fc0dc8ec2e5a734619a67e18e47665d1  patches/true8x8.patch.gz.b64.part06' | sha256sum -c -
          cat patches/true8x8.patch.gz.b64.part* > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          echo '19ca05bd7d6943c60b9d4372723c01e77a3ba551afcf300172f914e0c23b844b  true8x8.patch.gz' | sha256sum -c -
          gzip -dc true8x8.patch.gz > true8x8.patch
          echo 'f5d7506b85955661d322b00b6b2aa3bbfae8601cd7c05e672a8338a8ddc875e4  true8x8.patch' | sha256sum -c -
          patch --dry-run -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch
          test -f upstream/nativeM2Test.cpp
          test -f upstream/MoonMarkerDreamAvatar.cpp
          grep -Fq 'kSlotCount = kColorCount * kIconCount' upstream/nativeM2Test.cpp
          grep -Fq 'slotIndex(selectedColor, selectedIcon)' upstream/nativeM2Test.cpp
          grep -Fq 'nativeM2Test.cpp' upstream/Makefile

      - name: Install xwin
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --version

      - name: Download Microsoft CRT and Windows SDK x86
        shell: bash
        run: |
          set -euxo pipefail
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK

      - name: Download Microsoft D3DX headers
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/
          test -f upstream/d3d9x_headers/d3dx9.h

      - name: Build PE32 x86 DLL
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          test -f UnitXP_SP3.dll
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt

      - name: Package MoonMarker DLL
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/MoonMarker
          cp upstream/UnitXP_SP3.dll release/MoonMarker/
          cp upstream/UnitXP_SP3.pdb release/MoonMarker/ 2>/dev/null || true
          cp upstream/DLL-FILE-TYPE.txt release/MoonMarker/
          sha256sum release/MoonMarker/UnitXP_SP3.dll > release/MoonMarker/SHA256.txt
          cat > release/MoonMarker/BUILD-SCOPE.txt <<'EOF'
          Project: MoonMarker
          Base: DreamAvatar v0.3.4 Hotkeys10 system icons FuBar /daty native baseline
          Change: true 8 colors x 8 raid icons = 64 independent native marker slots
          DreamAvatar application behavior: unchanged
          DreamWeapon: not included
          Architecture: PE32 x86
          EOF

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-True-8x8-x86
          path: release/MoonMarker/
          if-no-files-found: error
          retention-days: 14

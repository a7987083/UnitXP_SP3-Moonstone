name: Build Addon Task Manager Profiler B1R1 x86

on:
  push:
    branches:
      - agent/addontaskmanager-profiler-b1-20260811
    paths:
      - '.github/workflows/build-addon-profiler-b1r1.yml'
      - 'tools/apply_addon_profiler_b1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file python3 binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Fetch exact UnitXP_SP3 v89
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Apply exact TRUE 8x8
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            patches/true8x8.patch.gz.b64.part00 \
            patches/true8x8.patch.gz.b64.part01 \
            patches/true8x8.patch.gz.b64.part02.00 \
            patches/true8x8.patch.gz.b64.part02.01.00 \
            patches/true8x8.patch.gz.b64.part02.01.01 \
            patches/true8x8.patch.gz.b64.part02.01.02 \
            patches/true8x8.patch.gz.b64.part02.01.03 \
            patches/true8x8.patch.gz.b64.part02.02 \
            patches/true8x8.patch.gz.b64.part02.03 \
            patches/true8x8.patch.gz.b64.part03 \
            patches/true8x8.patch.gz.b64.part04 \
            patches/true8x8.patch.gz.b64.part05 \
            patches/true8x8.patch.gz.b64.part06 \
            > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          echo '19ca05bd7d6943c60b9d4372723c01e77a3ba551afcf300172f914e0c23b844b  true8x8.patch.gz' | sha256sum -c -
          gzip -dc true8x8.patch.gz > true8x8.patch
          echo 'f5d7506b85955661d322b00b6b2aa3bbfae8601cd7c05e672a8338a8ddc875e4  true8x8.patch' | sha256sum -c -
          patch --dry-run -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch

      - name: Apply exact R6.3 baseline feature chain
        shell: bash
        run: |
          set -euxo pipefail
          echo '27f87c231bf5c174201c7e26ddc298e827435363e8d5135dece510f40795be7c  patches/groundprobe-b1.patch' | sha256sum -c -
          patch --dry-run -p1 -d upstream < patches/groundprobe-b1.patch
          patch --batch --forward -p1 -d upstream < patches/groundprobe-b1.patch
          python3 tools/apply_groundprobe_b2_fixed.py upstream
          python3 tools/apply_autorange_b3.py upstream
          python3 tools/apply_autorange_b31_fix.py upstream
          python3 tools/apply_autorange_b32_resolver.py upstream
          python3 tools/apply_speed_api.py upstream
          python3 tools/apply_autorange_b33_relation.py upstream
          python3 tools/apply_groundprobe_b34_totem.py upstream
          python3 tools/apply_autorange_b37_totemdbc.py upstream
          patch --dry-run -p1 -d upstream < patches/b38-cleancore-vfinal.patch
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-vfinal.patch
          patch --dry-run -p1 -d upstream < patches/b38-cleancore-sstream.patch
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-sstream.patch
          python3 tools/apply_autorange_b38r2_visual_resync.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1_fix.py upstream
          python3 tools/apply_autorange_r63_spellchain_fields.py upstream
          python3 tools/apply_autorange_tremor40_m2scale.py upstream

      - name: Verify exact source lineage features
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'cmd == "speed"' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.TotemSnapshot' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualRestart' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.PlayerPosition' upstream/dllmain.cpp
          grep -Fq 'std::string("applyAura") + suffix' upstream/UnitXPDbc.cpp
          grep -Fq 'descriptionZhCN' upstream/UnitXPDbc.cpp
          grep -Fq 'constexpr float kAutoRangeMaxScale = 20.0f;' upstream/nativeM2Test.cpp
          cat > BASELINE-LINEAGE.txt <<'TXT'
          User baseline:
            file size: 779264 bytes
            SHA-256: a733c0f9e52facafca0a6ce2aa3c615f6e1de834240fe995eaa1f8c917812a66
            PE COFF timestamp: 2026-08-11 00:02:45 UTC

          Matched source lineage:
            branch source: agent/autorange-tremor40-m2scale-20260811
            source commit: e7cfb96312ecf3a2eaa8aa13d0f849f493b58025
            successful artifact creation: 2026-08-11 00:02:51 UTC

          Exact whole-file SHA is intentionally not required for a rebuild because
          PE/CodeView build metadata changes on every new link. Functional source
          lineage, patch chain, architecture, toolchain, size class and required
          feature markers are verified instead.
          TXT

      - name: Install xwin and DirectX SDK headers
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/
          test -f upstream/d3d9x_headers/d3dx9.h

      - name: Rebuild baseline metadata before profiler patch
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          test -f UnitXP_SP3.dll
          file UnitXP_SP3.dll | tee ../BASELINE-FILE-TYPE.txt
          stat -c '%s' UnitXP_SP3.dll | tee ../BASELINE-SIZE.txt
          sha256sum UnitXP_SP3.dll | tee ../BASELINE-REBUILD-SHA256.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' ../BASELINE-FILE-TYPE.txt
          test "$(stat -c '%s' UnitXP_SP3.dll)" = "779264"
          cp UnitXP_SP3.dll ../BASELINE-R63-REBUILD.dll

      - name: Apply Addon Profiler B1
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1.py upstream
          grep -Fq '#include "addonProfiler.h"' upstream/dllmain.cpp
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          grep -Fq 'addonProfiler::onFrameBoundary();' upstream/sceneBegin_sceneEnd.cpp
          grep -Fq 'addonProfiler.cpp' upstream/Makefile

      - name: Build profiler DLL
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          test -f UnitXP_SP3.dll
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt
          stat -c '%s' UnitXP_SP3.dll | tee DLL-SIZE.txt
          sha256sum UnitXP_SP3.dll | tee DLL-SHA256.txt

      - name: Static profiler checks
        shell: bash
        run: |
          set -euxo pipefail
          strings -a upstream/UnitXP_SP3.dll | grep -F 'AddonProfiler B1'
          strings -a upstream/UnitXP_SP3.dll | grep -F 'native-call-ret-qpc'
          strings -a upstream/UnitXP_SP3.dll | grep -F 'longframes'
          grep -Fq 'LUA_MASKCALL | LUA_MASKRET' upstream/addonProfiler.cpp
          if grep -Fq 'LUA_MASKLINE' upstream/addonProfiler.cpp; then
            echo 'Unexpected LINE hook in profiler source' >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/source
          cp upstream/UnitXP_SP3.dll release/UnitXP_SP3.dll
          cp upstream/DLL-FILE-TYPE.txt release/
          cp upstream/DLL-SIZE.txt release/
          cp upstream/DLL-SHA256.txt release/SHA256.txt
          cp BASELINE-LINEAGE.txt BASELINE-FILE-TYPE.txt BASELINE-SIZE.txt BASELINE-REBUILD-SHA256.txt release/
          cp upstream/addonProfiler.cpp upstream/addonProfiler.h upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp release/source/
          cp tools/apply_addon_profiler_b1.py release/source/
          cat > release/PROFILER-B1-README.txt <<'TXT'
          Addon Task Manager / UnitXP_SP3 Profiler B1

          User-selected baseline:
            779264 bytes
            SHA-256 a733c0f9e52facafca0a6ce2aa3c615f6e1de834240fe995eaa1f8c917812a66

          New UnitXP profiler subcommands:
            UnitXP("profiler", "start")
            UnitXP("profiler", "stop")
            UnitXP("profiler", "reset")
            UnitXP("profiler", "status")
            UnitXP("profiler", "snapshot")
            UnitXP("profiler", "deep", boolean)
            UnitXP("profiler", "threshold", milliseconds)
            UnitXP("profiler", "files", addonName)
            UnitXP("profiler", "functions", addonName)
            UnitXP("profiler", "longframes")

          Profiler is OFF by default.
          start installs Lua CALL/RET hooks only. No LINE hook is used.
          Existing foreign Lua debug hook is never overwritten; start returns false,"HOOK_BUSY".
          QPC hook/self overhead is measured and exposed separately.
          OnEvent/OnUpdate classification in B1 is heuristic (WoW globals event/arg1).
          GC information in B1 is memory-drop detection, not direct GC duration measurement.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: AddonTaskManager-Profiler-B1R1-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

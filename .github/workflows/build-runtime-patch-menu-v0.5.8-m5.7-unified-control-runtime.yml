name: Build Runtime Patch Menu v0.5.8 M5.7 Unified Control Runtime

on:
  push:
    branches:
      - refactor/m5.7-unified-control-runtime
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNM57UnifiedRuntimeControls.mm
          test -f iosruntimepatchmenu/src/ZNM57RuntimeOnlyBuilderGate.mm
          grep -q 'ZNM462LooksLikeMachOPath' iosruntimepatchmenu/src/ZNM462RuntimeOnlyVerifier.mm
          grep -q 'suffixless Mach-O' iosruntimepatchmenu/src/ZNM462RuntimeOnlyVerifier.mm
          grep -q 'zn65fc_numberReturn' iosruntimepatchmenu/src/ZNFeatureRuntimeControlsV2.mm
          grep -q 'zn65fc_numberExecute' iosruntimepatchmenu/src/ZNFeatureRuntimeControlsV2.mm
          grep -q 'zn65fc_sliderCommitted' iosruntimepatchmenu/src/ZNFeatureRuntimeControlsV2.mm
          grep -q 'UIControlEventEditingDidEndOnExit' iosruntimepatchmenu/src/ZNFeatureRuntimeControlsV2.mm
          grep -q 'ZNInstallM57UnifiedRuntimeControlsDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM57RuntimeOnlyBuilderGateDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM56StaticValueCellBindingDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM53ControlBindingDeferred();' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM551RuntimeSliderStabilityDeferred();' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM562SliderIsolationDeferred();' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallRuntimeMethodCallFeatureUIDeferred();' iosruntimepatchmenu/src/ZNRuntimeMethodCallBootstrap.mm
          grep -q 'src/ZNM57UnifiedRuntimeControls.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM57RuntimeOnlyBuilderGate.mm' iosruntimepatchmenu/Makefile
          grep -q '0.5.8 · M5.7' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNStaticValueCellAugmentAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'runtimeExecutableWrites": @NO' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.7
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.7
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.7/ZonoPatch_v0.5.8_M5.7_Unified_Control_Runtime.dylib
          shasum -a 256 dist-m5.7/ZonoPatch_v0.5.8_M5.7_Unified_Control_Runtime.dylib | tee dist-m5.7/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.7/ZonoPatch_v0.5.8_M5.7_Unified_Control_Runtime.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m57_load_commands.txt
          strings -a "$out" > /tmp/zono_m57_strings.txt
          grep -q '\[m5.7-controls\]' /tmp/zono_m57_strings.txt
          grep -q '\[m5.7-runtime-only-verify\]' /tmp/zono_m57_strings.txt
          grep -q '\[m5.7-builder-gate\]' /tmp/zono_m57_strings.txt
          grep -q '\[m5.6-value-cell\]' /tmp/zono_m57_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m57_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M5.7-Unified-Control-Runtime
          path: |
            iosruntimepatchmenu/dist-m5.7/ZonoPatch_v0.5.8_M5.7_Unified_Control_Runtime.dylib
            iosruntimepatchmenu/dist-m5.7/SHA256.txt
          if-no-files-found: error

name: Build Addon Task Manager Profiler B1R5R4 Targeted Deep x86

on:
  push:
    branches:
      - agent/addontaskmanager-profiler-b1-20260811
    paths:
      - '.github/workflows/build-addon-profiler-b1r5r4-targeted-deep.yml'
      - 'tools/apply_addon_profiler_b1r5r4_targeted.py'
      - 'tools/apply_addon_profiler_b1r5r5_deep_merge.py'
      - 'tools/apply_addon_profiler_b1r5r4_deep_merge.py'
      - 'tools/apply_addon_profiler_b1r5_deep_merge.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file python3 binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Fetch exact UnitXP_SP3 v89 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Apply exact R6.3 baseline feature chain
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            patches/true8x8.patch.gz.b64.part00 \
            patches/true8x8.patch.gz.b64.part01 \
            patches/true8x8.patch.gz.b64.part02.00 \
            patches/true8x8.patch.gz.b64.part02.01.00 \
            patches/true8x8.patch.gz.b64.part02.01.01 \
            patches/true8x8.patch.gz.b64.part02.01.02 \
            patches/true8x8.patch.gz.b64.part02.01.03 \
            patches/true8x8.patch.gz.b64.part02.02 \
            patches/true8x8.patch.gz.b64.part02.03 \
            patches/true8x8.patch.gz.b64.part03 \
            patches/true8x8.patch.gz.b64.part04 \
            patches/true8x8.patch.gz.b64.part05 \
            patches/true8x8.patch.gz.b64.part06 > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          gzip -dc true8x8.patch.gz > true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < patches/groundprobe-b1.patch
          python3 tools/apply_groundprobe_b2_fixed.py upstream
          python3 tools/apply_autorange_b3.py upstream
          python3 tools/apply_autorange_b31_fix.py upstream
          python3 tools/apply_autorange_b32_resolver.py upstream
          python3 tools/apply_speed_api.py upstream
          python3 tools/apply_autorange_b33_relation.py upstream
          python3 tools/apply_groundprobe_b34_totem.py upstream
          python3 tools/apply_autorange_b37_totemdbc.py upstream
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-vfinal.patch
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-sstream.patch
          python3 tools/apply_autorange_b38r2_visual_resync.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1_fix.py upstream
          python3 tools/apply_autorange_r63_spellchain_fields.py upstream
          python3 tools/apply_autorange_tremor40_m2scale.py upstream
          grep -Fq 'cmd == "speed"' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.TotemSnapshot' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualRestart' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.PlayerPosition' upstream/dllmain.cpp
          grep -Fq 'descriptionZhCN' upstream/UnitXPDbc.cpp

      - name: Prepare B1R2 deep template
        shell: bash
        run: |
          set -euxo pipefail
          cp -a upstream cleanbase
          cp -a upstream deepbase
          python3 tools/apply_addon_profiler_b1.py deepbase
          python3 tools/apply_addon_profiler_b1r2_fix.py deepbase
          grep -Fq 'lua_sethook' deepbase/addonProfiler.cpp

      - name: Apply stable B1R4 light profiler
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r3_lite.py upstream
          python3 tools/apply_addon_profiler_b1r4_calibrated.py upstream
          grep -Fq 'AddonProfiler B1R4 Calibrated' upstream/addonProfilerLite.cpp
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          if grep -Fq 'lua_sethook' upstream/addonProfilerLite.cpp; then
            echo 'light profiler must remain hook-free' >&2
            exit 1
          fi

      - name: Add isolated deep module then convert to targeted sampling
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r5_deep_merge.py upstream cleanbase deepbase
          python3 tools/apply_addon_profiler_b1r5r4_targeted.py upstream
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          grep -Fq 'cmd == "profilerdeep"' upstream/dllmain.cpp
          grep -Fq 'TARGETED_ENTRY_SAMPLING' upstream/addonProfilerDeep.cpp
          grep -Fq 'beginTargetScope' upstream/addonProfilerLite.cpp
          grep -Fq 'setTargetedDeepAddon' upstream/addonProfilerLite.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/addonProfilerDeep.cpp').read_text(encoding='utf-8',errors='replace')
          a=p.index('static bool startProfiler')
          b=p.index('static void stopProfiler',a)
          assert 'lua_sethook' not in p[a:b], 'global hook found in startProfiler'
          a=p.index('bool beginTargetScope')
          b=p.index('void endTargetScope',a)
          assert 'lua_sethook' in p[a:b], 'target scope does not install hook'
          print('targeted deep source assertions OK')
          PY

      - name: Install Windows SDK and D3DX9 headers
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/

      - name: Build B1R5R4
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt
          stat -c '%s' UnitXP_SP3.dll | tee DLL-SIZE.txt
          sha256sum UnitXP_SP3.dll | tee DLL-SHA256.txt
          strings -a UnitXP_SP3.dll | grep -F 'AddonProfiler B1R4 Calibrated'
          strings -a UnitXP_SP3.dll | grep -F 'AddonProfiler Deep B1R5R4 Targeted'
          strings -a UnitXP_SP3.dll | grep -F 'TARGETED_ENTRY_SAMPLING'
          strings -a UnitXP_SP3.dll | grep -x 'profiler'
          strings -a UnitXP_SP3.dll | grep -x 'profilerdeep'

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/source
          cp upstream/UnitXP_SP3.dll release/UnitXP_SP3.dll
          cp upstream/DLL-FILE-TYPE.txt release/
          cp upstream/DLL-SIZE.txt release/
          cp upstream/DLL-SHA256.txt release/SHA256.txt
          cp upstream/addonProfilerLite.cpp upstream/addonProfilerLite.h release/source/
          cp upstream/addonProfilerDeep.cpp upstream/addonProfilerDeep.h release/source/
          cp upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/Makefile release/source/
          cp tools/apply_addon_profiler_b1r3_lite.py tools/apply_addon_profiler_b1r4_calibrated.py release/source/
          cp tools/apply_addon_profiler_b1r5_deep_merge.py tools/apply_addon_profiler_b1r5r4_targeted.py release/source/
          cat > release/README-B1R5R4.txt <<'TXT'
          Addon Task Manager / UnitXP_SP3 Profiler B1R5R4 Targeted Deep

          Baseline lineage:
            user baseline SHA-256 a733c0f9e52facafca0a6ce2aa3c615f6e1de834240fe995eaa1f8c917812a66
            size 779264 bytes

          Normal mode:
            Exact B1R4 calibrated light entry-wrapper profiler.
            No CALL/RET hook while targeted deep is idle.

          Targeted deep mode:
            UnitXP("profilerdeep","start", addonName, sampleIntervalMs)
            Arms one addon only. It does NOT install a global hook at start.
            The B1R4 wrapper enables CALL/RET only while a sampled handler entry of that addon executes.
            Default UI sampling interval is 50ms (at most about 20 sampled entry scopes/sec).
            Hook is removed immediately when the sampled entry returns.
            Frame-boundary safety forcibly removes a leaked scope after a Lua error/unwind.
            Function results accumulate over the entire 5/10/20 second session, not only the last 1-second window.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: AddonTaskManager-Profiler-B1R5R4-TargetedDeep-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

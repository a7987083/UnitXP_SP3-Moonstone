name: Build Runtime Patch Menu v0.5.8 Method Finder V3

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-method-finder-v3
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V3 source and lifecycle assertions
        run: |
          set -euxo pipefail
          src=iosruntimepatchmenu/src
          makefile=iosruntimepatchmenu/Makefile

          test ! -e "$src/ZNActivationTrace.mm"
          ! grep -q 'src/ZNActivationTrace.mm' "$makefile"
          ! grep -R -q 'ZonoPatch-v0.5.6.2.log' "$src"
          grep -q 'gZNModuleRegistrationReplay' "$src/ZNPatchCore.mm"
          grep -q 'imageNotificationScheduled' "$src/ZNPatchCore.mm"
          grep -q 'zn44_scheduleRefreshAfter' "$src/ZNStaticDispatchRuntime.mm"

          grep -q 'src/ZNIL2CPPMethodFinderSearchV2.mm' "$makefile"
          grep -q 'src/ZNIL2CPPMethodFinderZeroVMAddrFix.mm' "$makefile"
          grep -q 'src/ZNIL2CPPMethodFinderUXV2.mm' "$makefile"
          grep -q 'kZN58FinderShardClasses = 12000' "$src/ZNIL2CPPMethodFinderSearchV2.mm"
          grep -q 'textFound = NO' "$src/ZNIL2CPPMethodFinderZeroVMAddrFix.mm"

          grep -q 'src/ZNIL2CPPMethodFinderSearchV3.mm' "$makefile"
          grep -q 'src/ZNIL2CPPMethodFinderUIV3.mm' "$makefile"
          grep -q 'zn60_searchCandidates' "$src/ZNIL2CPPMethodFinderSearchV3.h"
          grep -q 'kZN60ShardClasses = 12000' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q 'v3-candidate-list' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q 'v3-qualified-candidates' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q 'v3-reverse-rva' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q 'v3CandidateList' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q '__TEXT.vmaddr == 0 is valid' "$src/ZNIL2CPPMethodFinderSearchV3.mm"
          grep -q '原始代码（前 16 字节）' "$src/ZNIL2CPPMethodFinderUIV3.mm"
          grep -q '搜索结果（' "$src/ZNIL2CPPMethodFinderUIV3.mm"
          grep -q '方法详细信息' "$src/ZNIL2CPPMethodFinderUIV3.mm"
          grep -q '创建 Patch' "$src/ZNIL2CPPMethodFinderUIV3.mm"
          grep -q 'ZNInstallIL2CPPMethodFinderV3Deferred' "$src/ZNIL2CPPMethodFinderMenuBinding.mm"

          grep -q 'resolveExpression:offset' "$src/ZNIL2CPPNamedOffsetWorkspace.mm"
          grep -q 'row.target = @"UnityFramework"' "$src/ZNIL2CPPNamedOffsetWorkspace.mm"
          grep -q 'ZN50FeatureToggleControl' "$src/ZNFeatureGroupUI.mm"
          grep -q 'ZN50FeatureVisualStateMixed' "$src/ZNFeatureGroupUI.mm"
          grep -q 'toggle rollback' "$src/ZNFeatureGroupUI.mm"
          grep -q 'ZN44_STATIC_HEADER_FLAG_PAYLOAD_PROTECTION_V2' "$src/ZNStaticPatchFormat.h"
          grep -q 'ZNStaticPayloadProtectionV2.h' "$src/ZNStaticBinaryBuilderV3.mm"
          grep -q 'payload-v2+static-rva-protection-v1' "$src/ZNGeneratedBinaryPostprocess.mm"

          compiled="$(sed -n 's/^ZonoePatchV03_FILES = //p' "$makefile")"
          ctor_hits=""
          load_hits=""
          for f in $compiled; do
            if grep -n '__attribute__((constructor' "iosruntimepatchmenu/$f" >/tmp/zn_ctor_hits 2>/dev/null; then
              ctor_hits="$ctor_hits\niosruntimepatchmenu/$f:$(cat /tmp/zn_ctor_hits)"
            fi
            if grep -nE '^[[:space:]]*\+[[:space:]]*\(void\)load[[:space:]]*\{' "iosruntimepatchmenu/$f" >/tmp/zn_load_hits 2>/dev/null; then
              load_hits="$load_hits\niosruntimepatchmenu/$f:$(cat /tmp/zn_load_hits)"
            fi
          done
          test "$(printf '%b\n' "$ctor_hits" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          printf '%b\n' "$ctor_hits" | grep 'ZNDeferredBootstrap.mm'
          printf '%b\n' "$ctor_hits" | grep 'ZNDeferredColdLauncherBootstrap'
          test -z "$(printf '%b' "$load_hits")"

      - name: Named Offset parser tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/il2cpp_named_offset_parser_test.mm \
            iosruntimepatchmenu/src/ZNIL2CPPResolver.mm \
            -o /tmp/zn_il2cpp_named_offset_parser_test
          /tmp/zn_il2cpp_named_offset_parser_test

      - name: Protection V2 layout tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/static_payload_protection_v2_test.mm -o /tmp/zn_static_payload_protection_v2_test
          /tmp/zn_static_payload_protection_v2_test

      - name: Feature metadata codec tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/feature_metadata_codec_test.mm iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm -o /tmp/zn_feature_metadata_codec_test
          /tmp/zn_feature_metadata_codec_test

      - name: Static RVA protection tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src iosruntimepatchmenu/tests/static_rva_protection_test.mm -o /tmp/zn_static_rva_protection_test
          /tmp/zn_static_rva_protection_test

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v058-method-finder-v3
          cp .theos/obj/ZonoePatchV03.dylib dist-v058-method-finder-v3/ZonoPatch_v0.5.8_MethodFinderV3.dylib
          shasum -a 256 dist-v058-method-finder-v3/ZonoPatch_v0.5.8_MethodFinderV3.dylib | tee dist-v058-method-finder-v3/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-v058-method-finder-v3/ZonoPatch_v0.5.8_MethodFinderV3.dylib
          file "$out"
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'

          strings "$out" > /tmp/zonoe_v058_v3_strings.txt
          ! grep -q 'ZonoPatch-v0.5.6.2.log' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'Assembly-CSharp-first' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'v3-candidate-list' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'v3-qualified-candidates' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'v3-reverse-rva' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'v3CandidateList' /tmp/zonoe_v058_v3_strings.txt
          grep -q 'payload-v2+static-rva-protection-v1' /tmp/zonoe_v058_v3_strings.txt

          python3 <<'PY'
          import struct
          p='iosruntimepatchmenu/dist-v058-method-finder-v3/ZonoPatch_v0.5.8_MethodFinderV3.dylib'
          data=open(p,'rb').read()
          if struct.unpack_from('<I',data,0)[0] != 0xfeedfacf:
              raise SystemExit('not thin arm64 Mach-O')
          ncmds=struct.unpack_from('<I',data,16)[0]
          off=32
          init_size=None
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',data,off)
              if cmd==0x19:
                  nsects=struct.unpack_from('<I',data,off+64)[0]
                  so=off+72
                  for __ in range(nsects):
                      sectname=data[so:so+16].split(b'\0',1)[0]
                      if sectname==b'__init_offsets':
                          init_size=struct.unpack_from('<Q',data,so+40)[0]
                      so+=80
              off+=cmdsize
          print('init_offsets_size=',init_size)
          if init_size != 4:
              raise SystemExit(f'expected exactly one cold-launch constructor, got {init_size}')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-MethodFinder-V3-Test
          path: |
            iosruntimepatchmenu/dist-v058-method-finder-v3/ZonoPatch_v0.5.8_MethodFinderV3.dylib
            iosruntimepatchmenu/dist-v058-method-finder-v3/SHA256.txt
          if-no-files-found: error

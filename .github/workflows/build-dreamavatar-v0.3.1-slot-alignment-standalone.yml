name: DreamAvatar v0.3.1 Slot Alignment Standalone

run-name: 'DreamAvatar v0.3.1 · Fix weapon/glow slots · Remove AddOn dependency · #${{ github.run_number }}'

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dreamavatar-v0.3.1-slot-alignment-standalone
    paths:
      - '.github/workflows/build-dreamavatar-v0.3.1-slot-alignment-standalone.yml'
      - 'slim/dreamavatar-v0.3.1-slot-alignment-standalone/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build corrected Turtle WoW visible-item layout without MoonMarker AddOn dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out v0.3.1 branch
        uses: actions/checkout@v4

      - name: Restore exact successful v0.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8946763697/zip" \
            -o v03-artifact.zip
          unzip -q v03-artifact.zip -d v03-artifact
          echo '4f7594506f5518c3f12cbae629fae5a1d5c6647becad740c9748a499ac6d0c98  v03-artifact/DreamAvatar-v0.3-Three-Tabs-Guild-Auth-Source.tar.xz' | sha256sum -c -
          tar -xJf v03-artifact/DreamAvatar-v0.3-Three-Tabs-Guild-Auth-Source.tar.xz
          mv target-source target
          cp -a target v03-baseline
          grep -Fq '## Version: 0.3.0-three-tabs-guild-auth-experimental' target/DreamAvatar/DreamAvatar.toc
          grep -Fq '## RequiredDeps: MoonMarker' target/DreamAvatar/DreamAvatar.toc

      - name: Apply v0.3.1 slot-alignment standalone patch
        run: |
          set -euxo pipefail
          cp slim/dreamavatar-v0.3.1-slot-alignment-standalone/v031.patch v031.patch
          echo '7f40335b609f5f0e824e0eb12fa5eda0c04b99b344a5f9d2d04d6827a42ebee2  v031.patch' | sha256sum -c -
          git apply --check --directory=target v031.patch
          git apply --directory=target v031.patch

      - name: Audit root cause fix authorization and isolation
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          before = Path('v03-baseline')
          after = Path('target')
          allowed = {
              'DREAMAVATAR-V0.3.1-SLOT-ALIGNMENT-STANDALONE-NOTES.md',
              'DreamAvatar/DreamAvatar.lua',
              'DreamAvatar/DreamAvatar.toc',
              'native/MoonMarkerDreamAvatar.cpp',
          }
          paths = {str(p.relative_to(before)) for p in before.rglob('*') if p.is_file()}
          paths |= {str(p.relative_to(after)) for p in after.rglob('*') if p.is_file()}
          changed = set()
          for rel in paths:
              a, b = before / rel, after / rel
              if not a.exists() or not b.exists() or a.read_bytes() != b.read_bytes():
                  changed.add(rel)
          if changed != allowed:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')
          PY

          grep -Fq 'kPlayerVisibleItem1DataOffset = 0x03F8u' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'kVisibleItemStrideBytes = 0x0030u' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'kWeaponVisibleSlots = {{16, 17, 18}}' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'kGlowVisibleSlots = {{16, 17}}' target/native/MoonMarkerDreamAvatar.cpp
          ! grep -Fq 'kPlayerVisibleItem1DataOffset = 0x03C8u' target/native/MoonMarkerDreamAvatar.cpp

          grep -Fq '## Version: 0.3.1-slot-alignment-standalone-experimental' target/DreamAvatar/DreamAvatar.toc
          ! grep -Eq '^## (RequiredDeps|OptionalDeps):' target/DreamAvatar/DreamAvatar.toc

          grep -Fq 'visibleItemLayoutVersion ~= 2' target/DreamAvatar/DreamAvatar.lua
          grep -Fq '客户端武器显示 ID（ItemDisplayInfo）' target/DreamAvatar/DreamAvatar.lua

          grep -Fq 'local AUTH_COMMAND = "MMAuth"' target/DreamAvatar/DreamAvatar.lua
          grep -Fq 'if (!moonMarkerGuildAuth::isAuthorized(L))' target/native/dllmain.cpp
          grep -Fq 'return moonMarkerGuildAuth::denyAdvanced(L);' target/native/dllmain.cpp

          cmp v03-baseline/native/MoonMarkerGuildAuth.cpp target/native/MoonMarkerGuildAuth.cpp
          cmp v03-baseline/native/MoonMarkerGuildAuth.h target/native/MoonMarkerGuildAuth.h
          cmp v03-baseline/native/MoonMarkerRuntimeGuard.cpp target/native/MoonMarkerRuntimeGuard.cpp
          cmp v03-baseline/native/moonMarker.cpp target/native/moonMarker.cpp
          cmp v03-baseline/native/moonMarker.h target/native/moonMarker.h
          cmp v03-baseline/native/nativeM2Test.cpp target/native/nativeM2Test.cpp
          cmp v03-baseline/native/nativeM2Test.h target/native/nativeM2Test.h
          cmp v03-baseline/native/MoonMarkerMainModel.cpp target/native/MoonMarkerMainModel.cpp
          cmp v03-baseline/native/dllmain.cpp target/native/dllmain.cpp

          ! grep -RniE 'vanilla1121_unitDisable|vanilla1121_unitEnable|0x005FBB60|0x005FBD60|0x005FBE00' target/native/MoonMarkerDreamAvatar.cpp
          ! grep -RniE 'MH_CreateHook|MH_EnableHook|MH_DisableHook' target/native/MoonMarkerDreamAvatar.cpp

      - name: Validate Lua 5.1
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r file; do luac5.1 -p "$file"; done < <(find target/plugin target/DreamAvatar -type f -name '*.lua' | sort)
          ! grep -RInE '#[A-Za-z_(]' target/plugin target/DreamAvatar --include='*.lua'

      - name: Prepare clean source snapshot
        run: |
          set -euxo pipefail
          cp -a target target-source
          find target-source/native -maxdepth 1 -type f \( -name '*.obj' -o -name '*.dll' -o -name '*.lib' -o -name '*.exp' -o -name '*.pdb' \) -delete
          rm -rf target-source/native/xwinSDK target-source/native/d3d9x_headers
          tar --sort=name --mtime='UTC 2026-08-06' --owner=0 --group=0 --numeric-owner \
            -cJf DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Source.tar.xz target-source

      - name: Install Windows x86 build toolchain
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK

          curl -L --fail --retry 3 \
            'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile PE32 x86 DLL
        run: |
          set -euxo pipefail
          rm -rf target/native/xwinSDK target/native/d3d9x_headers
          ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" target/native/xwinSDK
          ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" target/native/d3d9x_headers
          sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' target/native/Makefile
          make -C target/native clean
          make -C target/native -j2
          file target/native/UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -q 'PE32 executable.*Intel 80386' DLL-FILE-TYPE.txt

      - name: Package build
        run: |
          set -euxo pipefail
          root='release/DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Experimental'
          mkdir -p "$root/Interface/AddOns/DreamAvatar" "$root/Audit"
          cp target/native/UnitXP_SP3.dll "$root/UnitXP_SP3.dll"
          cp target/DreamAvatar/DreamAvatar.lua "$root/Interface/AddOns/DreamAvatar/DreamAvatar.lua"
          cp target/DreamAvatar/DreamAvatar.toc "$root/Interface/AddOns/DreamAvatar/DreamAvatar.toc"
          cp target/DREAMAVATAR-V0.3.1-SLOT-ALIGNMENT-STANDALONE-NOTES.md "$root/README.md"
          cp v031.patch "$root/Audit/DreamAvatar-v0.3.1-slot-alignment-standalone.patch"
          cp DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Source.tar.xz "$root/Audit/"
          (cd "$root" && sha256sum UnitXP_SP3.dll Interface/AddOns/DreamAvatar/DreamAvatar.lua Interface/AddOns/DreamAvatar/DreamAvatar.toc > SHA256.txt)
          {
            echo 'DreamAvatar v0.3.1 Slot Alignment + Standalone AddOn'
            cat DLL-FILE-TYPE.txt
            stat -c 'DLL bytes: %s' target/native/UnitXP_SP3.dll
            sha256sum target/native/UnitXP_SP3.dll
            echo 'Visible item base: 0x03F8; logical slots: main 16, off 17, ranged 18.'
            echo 'DreamAvatar.toc has no MoonMarker RequiredDeps or OptionalDeps.'
            echo 'Guild authorization remains enforced by Lua MMAuth and native isAuthorized checks.'
            echo 'Build/static audit do not replace in-game testing.'
          } > "$root/BUILD-RESULT.txt"
          mkdir -p artifact
          (cd release && zip -9 -r ../artifact/DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Experimental-x86.zip DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Experimental)
          cp DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Source.tar.xz artifact/
          cp v031.patch artifact/
          sha256sum artifact/* > artifact/ARTIFACT-SHA256.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DreamAvatar-v0.3.1-Slot-Alignment-Standalone-Experimental-x86-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

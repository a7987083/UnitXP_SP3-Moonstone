name: Build Addon Task Manager Profiler B1R5R7 LoginSafe x86

on:
  push:
    branches:
      - agent/addontaskmanager-profiler-b1-20260811
    paths:
      - '.github/workflows/build-addon-profiler-b1r5r7-loginsafe.yml'
      - 'tools/apply_addon_profiler_b1r5r7_loginsafe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file python3 binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Fetch exact UnitXP_SP3 v89 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Apply exact R6.3 baseline feature chain
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            patches/true8x8.patch.gz.b64.part00 \
            patches/true8x8.patch.gz.b64.part01 \
            patches/true8x8.patch.gz.b64.part02.00 \
            patches/true8x8.patch.gz.b64.part02.01.00 \
            patches/true8x8.patch.gz.b64.part02.01.01 \
            patches/true8x8.patch.gz.b64.part02.01.02 \
            patches/true8x8.patch.gz.b64.part02.01.03 \
            patches/true8x8.patch.gz.b64.part02.02 \
            patches/true8x8.patch.gz.b64.part02.03 \
            patches/true8x8.patch.gz.b64.part03 \
            patches/true8x8.patch.gz.b64.part04 \
            patches/true8x8.patch.gz.b64.part05 \
            patches/true8x8.patch.gz.b64.part06 > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          gzip -dc true8x8.patch.gz > true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < patches/groundprobe-b1.patch
          python3 tools/apply_groundprobe_b2_fixed.py upstream
          python3 tools/apply_autorange_b3.py upstream
          python3 tools/apply_autorange_b31_fix.py upstream
          python3 tools/apply_autorange_b32_resolver.py upstream
          python3 tools/apply_speed_api.py upstream
          python3 tools/apply_autorange_b33_relation.py upstream
          python3 tools/apply_groundprobe_b34_totem.py upstream
          python3 tools/apply_autorange_b37_totemdbc.py upstream
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-vfinal.patch
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-sstream.patch
          python3 tools/apply_autorange_b38r2_visual_resync.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1_fix.py upstream
          python3 tools/apply_autorange_r63_spellchain_fields.py upstream
          python3 tools/apply_autorange_tremor40_m2scale.py upstream
          grep -Fq 'cmd == "speed"' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.PlayerPosition' upstream/dllmain.cpp
          grep -Fq 'descriptionZhCN' upstream/UnitXPDbc.cpp

      - name: Prepare B1R2 deep template
        shell: bash
        run: |
          set -euxo pipefail
          cp -a upstream cleanbase
          cp -a upstream deepbase
          python3 tools/apply_addon_profiler_b1.py deepbase
          python3 tools/apply_addon_profiler_b1r2_fix.py deepbase
          grep -Fq 'lua_sethook' deepbase/addonProfiler.cpp

      - name: Apply stable B1R4 light profiler
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r3_lite.py upstream
          python3 tools/apply_addon_profiler_b1r4_calibrated.py upstream
          grep -Fq 'AddonProfiler B1R4 Calibrated' upstream/addonProfilerLite.cpp
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          if grep -Fq 'lua_sethook' upstream/addonProfilerLite.cpp; then exit 1; fi

      - name: Apply proven B1R5R4 Targeted Deep
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r5_deep_merge.py upstream cleanbase deepbase
          curl -fsSL https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/681f4167996c7b2442cafd93662cbe934e35dc86/tools/apply_addon_profiler_b1r5r4_targeted.py -o targeted-r5r4.py
          python3 - <<'PY'
          import zlib,base64,re
          s=open('targeted-r5r4.py','r',encoding='utf-8').read()
          m=re.search(r"b64decode\('([^']+)'\)",s)
          assert m and len(zlib.decompress(base64.b64decode(m.group(1)))) > 10000
          print('known-good B1R5R4 targeted script verified')
          PY
          python3 targeted-r5r4.py upstream
          grep -Fq 'TARGETED_ENTRY_SAMPLING' upstream/addonProfilerDeep.cpp
          grep -Fq 'beginTargetScope' upstream/addonProfilerLite.cpp

      - name: Apply B1R5R5 Deep-Light isolation
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r5r5_isolation_ci.py upstream
          grep -Fq 'deepIsolationActive' upstream/addonProfilerLite.cpp
          grep -Fq 'discardActiveWindowKeepLast' upstream/addonProfilerLite.cpp
          if grep -Fq 'lua_sethook' upstream/addonProfilerLite.cpp; then exit 1; fi

      - name: Apply B1R5R6 long-frame contribution model
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r5r6_longframe_contribution.py upstream
          grep -Fq 'totalLongFrameContributionHits' upstream/addonProfilerLite.cpp
          grep -Fq 'associatedAddonPct' upstream/addonProfilerLite.cpp
          grep -Fq 'contributionLabel' upstream/addonProfilerLite.cpp

      - name: Apply B1R5R7 LoginSafe lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r5r7_loginsafe.py upstream
          grep -Fq 'void hardReset(void* L)' upstream/addonProfilerDeep.cpp
          grep -Fq 'void hardReset()' upstream/addonProfilerLite.cpp
          grep -Fq 'gSessionGeneration' upstream/addonProfilerLite.cpp
          grep -Fq 'destroySessionResources' upstream/addonProfilerDeep.cpp
          grep -Fq 'sub == "hardreset"' upstream/addonProfilerDeep.cpp
          grep -Fq 'sub=="hardreset"' upstream/addonProfilerLite.cpp
          grep -Fq 'addonProfilerDeep::hardReset(L)' upstream/dllmain.cpp
          grep -Fq 'addonProfilerLite::hardReset()' upstream/dllmain.cpp
          python3 - <<'PY'
          from pathlib import Path
          d=Path('upstream/addonProfilerDeep.cpp').read_text(encoding='utf-8')
          l=Path('upstream/addonProfilerLite.cpp').read_text(encoding='utf-8')
          start=d[d.index('static bool startProfiler'):d.index('static void destroySessionResources')]
          assert 'gLuaState = L;' not in start, 'Deep must not pin lua_State for whole session'
          scope=d[d.index('bool beginTargetScope'):d.index('void endTargetScope')]
          assert 'gLuaState = L;' in scope, 'lua_State should exist only in active sampled scope'
          assert 'generation == gSessionGeneration' in l
          assert 'std::vector<HandlerRecord>().swap(gHandlers)' in l
          print('B1R5R7 lifecycle source assertions OK')
          PY
          if grep -Fq 'lua_sethook' upstream/addonProfilerLite.cpp; then exit 1; fi

      - name: Install Windows SDK and D3DX9 headers
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/

      - name: Build B1R5R7
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt
          stat -c '%s' UnitXP_SP3.dll | tee DLL-SIZE.txt
          sha256sum UnitXP_SP3.dll | tee DLL-SHA256.txt
          strings -a UnitXP_SP3.dll | grep -F 'AddonProfiler B1R4 Calibrated'
          strings -a UnitXP_SP3.dll | grep -F 'AddonProfiler Deep B1R5R4 Targeted'
          strings -a UnitXP_SP3.dll | grep -F 'TARGETED_ENTRY_SAMPLING'
          strings -a UnitXP_SP3.dll | grep -F 'LIGHT_ENTRY_WRAPPER_B1R5R6_LONGFRAME_CONTRIBUTION'
          strings -a UnitXP_SP3.dll | grep -F 'totalLongFrameContributionHits'
          strings -a UnitXP_SP3.dll | grep -F 'sessionGeneration'
          strings -a UnitXP_SP3.dll | grep -x 'hardreset'
          strings -a UnitXP_SP3.dll | grep -x 'profiler'
          strings -a UnitXP_SP3.dll | grep -x 'profilerdeep'

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/source
          cp upstream/UnitXP_SP3.dll release/UnitXP_SP3.dll
          cp upstream/DLL-FILE-TYPE.txt release/
          cp upstream/DLL-SIZE.txt release/
          cp upstream/DLL-SHA256.txt release/SHA256.txt
          cp upstream/addonProfilerLite.cpp upstream/addonProfilerLite.h release/source/
          cp upstream/addonProfilerDeep.cpp upstream/addonProfilerDeep.h release/source/
          cp upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/Makefile release/source/
          cp targeted-r5r4.py release/source/apply_addon_profiler_b1r5r4_targeted.py
          cp tools/apply_addon_profiler_b1r5r5_isolation.py tools/apply_addon_profiler_b1r5r5_isolation_ci.py release/source/
          cp tools/apply_addon_profiler_b1r5r6_longframe_contribution.py release/source/
          cp tools/apply_addon_profiler_b1r5r7_loginsafe.py release/source/
          cat > release/README-B1R5R7.txt <<'TXT'
          Addon Task Manager / UnitXP_SP3 Profiler B1R5R7 LoginSafe

          Keeps B1R5R6 long-frame contribution, B1R5R5 Deep/light isolation,
          and B1R5R4 Targeted Deep sampling.

          Lifecycle safety:
          - Deep no longer stores lua_State* for the full analysis session.
            It is retained only while a sampled target entry is actively hooked,
            and is cleared immediately when that entry returns.
          - profilerdeep stop destroys native Deep maps, call stack, long-frame
            buffers, target name, sampling counters, and lua_State pointer.
          - PLAYER_LEAVING_WORLD and PLAYER_ENTERING_WORLD both perform an
            idempotent Profiler Hard Reset.
          - Light Hard Reset stops monitoring and releases handler/addon/file
            vectors, lookup maps, long-frame buffers, frame/window state, and
            targeted-addon state.
          - Wrapped handlers use a session generation guard, so a Hard Reset
            occurring inside a Lua handler cannot access freed handler records
            after the original Lua function returns.
          - Monitoring never auto-resumes after a world/character transition.

          New APIs:
            UnitXP("profiler", "hardreset")
            UnitXP("profilerdeep", "hardreset")
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: AddonTaskManager-Profiler-B1R5R7-LoginSafe-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

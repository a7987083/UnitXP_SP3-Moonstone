name: Migrate Menu To UIViewController

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-menu-viewcontroller.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/runtime-patch-menu-v0.5.8-m3.1-menu-as-viewcontroller
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote menu controller superclass and root view
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm')
          s = p.read_text()
          old1 = '@interface ZNRuntimeMenuControllerV024 : NSObject'
          new1 = '@interface ZNRuntimeMenuControllerV024 : UIViewController'
          old2 = 'self.panel=[UIView new]; self.panel.layer.masksToBounds=NO;'
          new2 = 'self.panel=[UIView new]; self.view=self.panel; self.panel.layer.masksToBounds=NO;'
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          grep -q '@interface ZNRuntimeMenuControllerV024 : UIViewController' iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm
          grep -q 'self.panel=\[UIView new\]; self.view=self.panel;' iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm

      - name: Commit migration
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm
          git commit -m 'fix(ui): promote runtime menu to UIViewController'
          git push origin HEAD:hotfix/runtime-patch-menu-v0.5.8-m3.1-menu-as-viewcontroller

name: Build JSONCapture v0.4.2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.4.2
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-json-capture-v0.4.2.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify TAB Sweep source contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq '#define JC42_BATCH_SIZE 10' jsoncapture/src/LuaSweep.m
          grep -Fq '#define JC42_INTERVAL_SECONDS 5.0' jsoncapture/src/LuaSweep.m
          grep -Fq 'FindObjectsOfTypeAll' jsoncapture/src/LuaSweep.m
          grep -Fq 'GetAllAssetNames' jsoncapture/src/LuaSweep.m
          grep -Fq 'LoadAsset' jsoncapture/src/LuaSweep.m
          grep -Fq 'luaL_loadbufferx' jsoncapture/src/LuaSweep.m
          grep -Fq 'lua_gettop' jsoncapture/src/LuaSweep.m
          grep -Fq 'lua_settop' jsoncapture/src/LuaSweep.m
          grep -Fq 'dispatch_get_main_queue' jsoncapture/src/LuaSweep.m
          if grep -Eq 'lua_pcall|lua_call' jsoncapture/src/LuaSweep.m; then
            echo 'TAB Sweep must never execute loaded chunks' >&2
            exit 1
          fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify JSONCapture v0.4.2
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/JSONCapture_v0.4.2_HFAMap187.dylib"
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out"
          otool -L "$out"
          strings "$out" > dist/strings.txt
          grep -Fq "JSONCapture IL2CPP v0.4" dist/strings.txt
          grep -Fq "JSONCapture LuaLoader v0.4.1" dist/strings.txt
          grep -Fq "Lua53Analyzer v0.4" dist/strings.txt
          grep -Fq "JSONCapture TAB Sweep v0.4.2" dist/strings.txt
          grep -Fq "TAB-COMPILE-OK" dist/strings.txt
          grep -Fq "TAB-RAW-ONLY" dist/strings.txt
          grep -Fq "TAB_Sweep_v0.4.2.status.json" dist/strings.txt
          grep -Fq "FindObjectsOfTypeAll" dist/strings.txt
          grep -Fq "GetAllAssetNames" dist/strings.txt
          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Package release
        run: |
          set -euxo pipefail
          cd jsoncapture/dist
          cp ../README.md README_v0.4.2.txt
          zip -9 JSONCapture_v0.4.2_HFAMap187.zip JSONCapture_v0.4.2_HFAMap187.dylib SHA256.txt README_v0.4.2.txt
          shasum -a 256 JSONCapture_v0.4.2_HFAMap187.zip | tee ZIP_SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: JSONCapture-v0.4.2-HFAMap187
          path: |
            jsoncapture/dist/JSONCapture_v0.4.2_HFAMap187.dylib
            jsoncapture/dist/SHA256.txt
            jsoncapture/dist/JSONCapture_v0.4.2_HFAMap187.zip
            jsoncapture/dist/ZIP_SHA256.txt
          if-no-files-found: error

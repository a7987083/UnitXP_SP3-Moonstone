name: Build JSONCapture v0.5 Manual Task Engine

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.5-manual-task-engine
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-json-capture-v0.5-manual.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify v0.5.2 manual architecture, UI and runtime cache
        shell: bash
        run: |
          set -euxo pipefail
          src=jsoncapture/src/ManualTaskEngineV05.m
          scroll=jsoncapture/src/JCG5ScrollFix.m
          cache=jsoncapture/scripts/apply_v052_runtime_cache.py
          grep -Fq 'JSONCapture_FILES = src/ManualTaskEngineV05.m src/JCG5ScrollFix.m src/OnDeviceLuaRecovery.m' jsoncapture/Makefile
          grep -Fq 'before-all::' jsoncapture/Makefile
          grep -Fq 'apply_v052_runtime_cache.py' jsoncapture/Makefile
          grep -Fq 'Documents/Bundle' "$src"
          grep -Fq '开始本地扫描' "$src"
          grep -Fq '重试扫描失败' "$src"
          grep -Fq '开始解密' "$src"
          grep -Fq '重试解密失败' "$src"
          grep -Fq '开始JSON恢复' "$src"
          grep -Fq '重试恢复失败' "$src"
          grep -Fq '停止当前任务' "$src"
          grep -Fq '检测到运行时抓取：当前手动任务已停止' "$src"
          grep -Fq 'no bundle watcher, no disk watcher, no auto decrypt, no auto recovery' "$src"
          grep -Fq 'LocalScan.failures.json' "$src"
          grep -Fq 'Decrypt.failures.json' "$src"
          grep -Fq 'Recovery.failures.json' "$src"
          grep -Fq 'UIScrollView' "$scroll"
          grep -Fq 'alwaysBounceVertical = YES' "$scroll"
          grep -Fq 'JCG5_SCROLL_TAG' "$scroll"
          grep -Fq 'method_setImplementation' "$scroll"
          grep -Fq 'JCG5_RUNTIME_CACHE_V052' "$cache"
          grep -Fq 'RuntimeCapture.cache.jsonl' "$cache"
          grep -Fq 'JCG5MD5' "$cache"
          grep -Fq 'migrated-duplicate' "$cache"
          grep -Fq '已抓过，已跳过' "$cache"
          grep -Fq 'Only a genuinely new runtime Lua capture may preempt manual work' "$cache"
          ! grep -Fq 'GenericPersistentSweep.m' jsoncapture/Makefile
          ! grep -Fq 'MobileRecoveryInputBridge.m' jsoncapture/Makefile
          ! grep -Fq 'GenericG4ChineseUIR2.m' jsoncapture/Makefile
          ! grep -Fq '打开JSON目录' "$src"
          ! grep -Fq '导出恢复报告' "$src"
          ! grep -Fq '打开状态' "$src"
          ! grep -Fq '清空持久索引' "$src"
          ! grep -Fq '强制全扫' "$src"
          ! grep -Fq '仅恢复新增' "$src"
          if grep -Eq '0x186A4B8|0x186FA64|AesHelper.CustomDecrypt|RVA_CUSTOM_DECRYPT' "$src" jsoncapture/Makefile; then
            echo 'old game-specific RVA leaked into v0.5' >&2
            exit 1
          fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          grep -Fq 'JCG5_RUNTIME_CACHE_V052' src/ManualTaskEngineV05.m
          grep -Fq 'RuntimeCapture.cache.jsonl' src/ManualTaskEngineV05.m
          grep -Fq '缓存MD5' src/ManualTaskEngineV05.m
          grep -Fq '已抓过' src/ManualTaskEngineV05.m
          mkdir -p dist-v05
          out="dist-v05/JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.dylib"
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out"
          otool -L "$out"
          strings "$out" > dist-v05/strings.txt
          grep -Fq 'JSONCapture v0.5 Manual Task Engine' dist-v05/strings.txt
          grep -Fq 'com.openai.jsoncapture.v05.capture' dist-v05/strings.txt
          grep -Fq 'com.openai.jsoncapture.v05.manualtask' dist-v05/strings.txt
          grep -Fq 'LocalScan.failures.json' dist-v05/strings.txt
          grep -Fq 'Decrypt.failures.json' dist-v05/strings.txt
          grep -Fq 'Recovery.failures.json' dist-v05/strings.txt
          grep -Fq 'RuntimeCapture.cache.jsonl' dist-v05/strings.txt
          grep -Fq 'RUNTIME-CACHE ready' dist-v05/strings.txt
          grep -Fq '已抓过' dist-v05/strings.txt
          grep -Fq '缓存MD5' dist-v05/strings.txt
          grep -Fq 'ManualV05' dist-v05/strings.txt
          if grep -Fq 'com.openai.jsoncapture.fullsweep.disk' dist-v05/strings.txt; then
            echo 'old automatic full-sweep disk watcher present' >&2
            exit 1
          fi
          shasum -a 256 "$out" | tee dist-v05/SHA256.txt

      - name: Package release
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture/dist-v05
          cat > README.txt <<'TXT'
          JSONCapture v0.5.2 Manual Task Engine + Scroll/Drag + Persistent Runtime Cache
          Target: Unity 2019.4.33f1 / IL2CPP / ToLua / Lua 5.3.5

          v0.5.2 runtime capture changes:
          - Runtime Lua capture cache persists across game restarts.
          - MD5 is the primary cross-launch duplicate key; SHA256 is retained for compatibility and migration.
          - Existing v0.5/v0.5.1 loader_manifest SHA256 entries are imported automatically.
          - Already captured Lua is NOT written again and does NOT preempt local scan/decrypt/recovery.
          - UI shows new captures, skipped duplicates, MD5 cache count and latest Lua status such as "xxx.lua | 已抓过".
          - New runtime Lua still has absolute priority and safely stops the active manual task.

          v0.5.1 UI changes retained:
          - Vertical scrolling inside the compact menu.
          - Menu panel is draggable and remembers its position.
          - Game touch passes through outside the overlay.

          Manual task design:
          - Local scan is manual only and scans Documents/Bundle only.
          - Decrypt and JSON recovery are manual only.
          - All manual tasks are mutually exclusive and stop when complete.
          - Explicit retry-failed buttons are retained.
          - No automatic bundle watcher, disk watcher, persistent log poll, auto decrypt or auto recovery.

          Working root: Documents/JSONCapture/ManualV05
          Runtime cache: Documents/JSONCapture/ManualV05/state/RuntimeCapture.cache.jsonl
          TXT
          zip -9 JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.zip JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.dylib SHA256.txt README.txt
          shasum -a 256 JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.zip | tee ZIP_SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: JSONCapture-v0.5.2-ManualTaskEngine-RuntimeCache-ToLua535
          path: |
            jsoncapture/dist-v05/JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.dylib
            jsoncapture/dist-v05/SHA256.txt
            jsoncapture/dist-v05/JSONCapture_v0.5.2_ManualTaskEngine_RuntimeCache_ToLua535.zip
            jsoncapture/dist-v05/ZIP_SHA256.txt
          if-no-files-found: error

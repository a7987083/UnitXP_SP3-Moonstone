name: Dispatch corrected B3.8 build fixed

on:
  push:
    branches:
      - agent/autorange-b38-cleancore-20260810
    paths:
      - '.github/workflows/dispatch-b38-v2-fixed.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch B3.8 v2 workflow at latest branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-autorange-b38-cleancore-v2.yml -R a7987083/UnitXP_SP3-Moonstone --ref agent/autorange-b38-cleancore-20260810

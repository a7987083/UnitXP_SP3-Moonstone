name: Build HFAPatchIPA v1.0.0

on:
  push:
    branches:
      - work/hfapatchipa-v1.0
    paths:
      - "HFAPatchIPA/**"
      - ".github/workflows/hfapatchipa-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Prepare embedded menu
        run: |
          test -f HFAPatchMenu/dist/HFAPatchMenu_v0.1.0.dylib
          cp HFAPatchMenu/dist/HFAPatchMenu_v0.1.0.dylib HFAPatchIPA/Resources/HFAPatchMenu_v0.1.0.dylib
          file HFAPatchIPA/Resources/HFAPatchMenu_v0.1.0.dylib

      - name: Generate project
        run: |
          cd HFAPatchIPA
          xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HFAPatchIPA/HFAPatchIPA.xcodeproj \
            -scheme HFAPatchIPA

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project HFAPatchIPA/HFAPatchIPA.xcodeproj \
            -scheme HFAPatchIPA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath HFAPatchIPA/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Fake sign and package IPA
        run: |
          app="HFAPatchIPA/build/Build/Products/Release-iphoneos/HFAPatchIPA.app"
          test -d "$app"
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then
              ldid -S "$file"
            fi
          done < <(find "$app/Frameworks" -type f 2>/dev/null || true)
          ldid -S "$app/HFAPatchIPA"
          mkdir -p HFAPatchIPA/dist/stage/Payload
          cp -R "$app" HFAPatchIPA/dist/stage/Payload/
          cd HFAPatchIPA/dist/stage
          ditto -c -k --sequesterRsrc --keepParent Payload ../HFAPatchIPA_v1.0.0_TrollStore.ipa
          cd ..
          file stage/Payload/HFAPatchIPA.app/HFAPatchIPA
          shasum -a 256 HFAPatchIPA_v1.0.0_TrollStore.ipa > SHA256SUMS.txt

      - name: Publish IPA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HFAPatchIPA/dist/HFAPatchIPA_v1.0.0_TrollStore.ipa
          git add -f HFAPatchIPA/dist/SHA256SUMS.txt
          git commit -m "Publish HFAPatchIPA v1.0.0 IPA [skip ci]"
          git push origin HEAD:work/hfapatchipa-v1.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAPatchIPA-v1.0.0
          path: |
            HFAPatchIPA/dist/HFAPatchIPA_v1.0.0_TrollStore.ipa
            HFAPatchIPA/dist/SHA256SUMS.txt
          if-no-files-found: error

name: Build HFAPatchIPA v2.1.0

on:
  push:
    branches:
      - work/hfapatchipa-v1.0
    paths:
      - "HFAPatchIPA/**"
      - ".github/workflows/hfapatchipa-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Prepare fixed Zsign package
        run: |
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git HFAPatchIPA/Vendor/Zsign
          cd HFAPatchIPA/Vendor/Zsign
          cp swift/zsign.mm src/zsign_wrapper.mm
          cp swift/zsign.hpp src/zsign.hpp
          cp swift/utils.mm src/utils_wrapper.mm
          cp swift/utils.hpp src/utils.hpp
          perl -0pi -e 's#\.\./swift/utils\.mm#utils_wrapper.mm#g; s#\.\./swift/zsign\.mm#zsign_wrapper.mm#g' Package.swift
          perl -0pi -e 's/void\(\^completionHandler\)\(BOOL success, NSError \*error\)/void(^completionHandler)(BOOL success)/g; s/vector<string> arrDylibFiles;/vector<string> arrDylibFiles;\n\tvector<string> arrRemoveDylibNames;/g; s/arrDylibFiles, bForce/arrDylibFiles, arrRemoveDylibNames, bForce/g; s/completionHandler\(bRet\);/if (completionHandler) completionHandler(bRet);/g' src/zsign_wrapper.mm
          grep -n 'wrapper.mm' Package.swift

      - name: Generate project
        run: |
          cd HFAPatchIPA
          xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HFAPatchIPA/HFAPatchIPA.xcodeproj \
            -scheme HFAPatchIPA

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project HFAPatchIPA/HFAPatchIPA.xcodeproj \
            -scheme HFAPatchIPA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath HFAPatchIPA/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Fake sign and package IPA
        run: |
          app="HFAPatchIPA/build/Build/Products/Release-iphoneos/HFAPatchIPA.app"
          test -d "$app"
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then
              ldid -S "$file"
            fi
          done < <(find "$app/Frameworks" -type f 2>/dev/null || true)
          ldid -S "$app/HFAPatchIPA"
          mkdir -p HFAPatchIPA/dist/stage/Payload
          cp -R "$app" HFAPatchIPA/dist/stage/Payload/
          cd HFAPatchIPA/dist/stage
          ditto -c -k --sequesterRsrc --keepParent Payload ../HFAPatchIPA_v2.1.0_TrollStore.ipa
          cd ..
          file stage/Payload/HFAPatchIPA.app/HFAPatchIPA
          shasum -a 256 HFAPatchIPA_v2.1.0_TrollStore.ipa > SHA256SUMS.txt

      - name: Publish IPA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HFAPatchIPA/dist/HFAPatchIPA_v2.1.0_TrollStore.ipa
          git add -f HFAPatchIPA/dist/SHA256SUMS.txt
          git commit -m "Publish HFAPatchIPA v2.1.0 IPA [skip ci]"
          git push origin HEAD:work/hfapatchipa-v1.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFAPatchIPA-v2.1.0
          path: |
            HFAPatchIPA/dist/HFAPatchIPA_v2.1.0_TrollStore.ipa
            HFAPatchIPA/dist/SHA256SUMS.txt
          if-no-files-found: error

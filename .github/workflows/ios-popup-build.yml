name: iOS Popup Build

on:
  push:
    branches:
      - feature/ios-popup-rebuild
  workflow_dispatch:

jobs:
  build-ios-popup:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Prepare source artifact
        run: |
          mkdir -p build/ios-popup
          cp -R ios-popup/* build/ios-popup/

      - name: Upload iOS popup sources
        uses: actions/upload-artifact@v4
        with:
          name: ios-popup-source
          path: build/ios-popup

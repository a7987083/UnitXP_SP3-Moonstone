name: Build LoginIPTracer v3 Timeline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/login-ip-tracer-dylib-v3-timeline
    paths:
      - 'loginiptracer/**'
      - '.github/workflows/build-login-ip-tracer-v3.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify LoginIPTracer v3
        run: |
          set -euxo pipefail
          cd loginiptracer
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/LoginIPTracer_v3_Timeline_HFAMap187.dylib"
          cp .theos/obj/LoginIPTracer.dylib "$out"
          file "$out"
          otool -L "$out"
          strings "$out" | grep -q "LoginIPTracer v3 Timeline HFAMap187"
          strings "$out" | grep -q "\[CAPTURE-START\]"
          strings "$out" | grep -q "\[NEW\]"
          strings "$out" | grep -q "\[GONE\]"
          strings "$out" | grep -q "\[MARK\]"
          strings "$out" | grep -q "ACTIVE-AT-STOP"
          strings "$out" | grep -q "SERVER_LIST"
          strings "$out" | grep -q "ENTER_GAME"
          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: LoginIPTracer-v3-Timeline-HFAMap187
          path: |
            loginiptracer/dist/LoginIPTracer_v3_Timeline_HFAMap187.dylib
            loginiptracer/dist/SHA256.txt
          if-no-files-found: error

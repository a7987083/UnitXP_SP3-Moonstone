name: Export Runtime Menu Sources

on:
  push:
    branches:
      - feature/runtime-patch-menu-consolidation

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack current runtime menu sources
        run: |
          set -euxo pipefail
          mkdir -p export
          cp iosruntimepatchmenu/Makefile export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV024.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV040.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV0401.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV0402.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV042.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV044.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV045.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV048.mm export/
          cp iosruntimepatchmenu/src/ZonoeRuntimeMenuV049.mm export/
          cp iosruntimepatchmenu/src/ZNDeveloperGate.h export/
          cp iosruntimepatchmenu/src/ZNDeveloperGate.mm export/
          cp iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.h export/
          cp iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm export/
          cp iosruntimepatchmenu/src/ZNPatchJSONImporter.h export/
          cp iosruntimepatchmenu/src/ZNPatchJSONImporter.mm export/
          cp iosruntimepatchmenu/src/ZNStaticDispatchRuntime.h export/
          cp iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm export/
          cp iosruntimepatchmenu/src/ZNPatchRuntimeValidator.h export/
          cp iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm export/
          cp iosruntimepatchmenu/src/ZNSharedSiteProbe.h export/
          cp iosruntimepatchmenu/src/ZNSharedSiteProbe.mm export/
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-menu-source-export
          path: export
          if-no-files-found: error

name: Build Login10195Diag v0.4

on:
  push:
    branches:
      - feature/login10195diag-v0.1
    paths:
      - 'login10195diag_v0.4/**'
      - '.github/workflows/build-login10195diag-v0.4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix source typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('login10195diag_v0.4/src/Login10195DiagV04.cpp')
          s = p.read_text()
          old = 'return orig_Write?orig_Write(fd,buf,len):::write(fd,buf,len);'
          new = 'return orig_Write ? orig_Write(fd,buf,len) : ::write(fd,buf,len);'
          if old not in s:
              raise SystemExit('expected raw_write typo not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git login10195diag_v0.4/third_party/Dobby

      - name: Configure iOS arm64
        run: |
          cmake -S login10195diag_v0.4 -B build-login10195diag-v04 \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-login10195diag-v04 --config Release --target Login10195DiagV04 --parallel 4

      - name: Locate and verify dylib
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="$(find build-login10195diag-v04 -type f -name 'Login10195Diag_v0.4.dylib' | head -1)"
          test -n "$DYLIB"
          echo "DYLIB=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"
          file "$DYLIB" | grep -q 'arm64'
          otool -hv "$DYLIB"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/Login10195Diag-v0.4
          cp "$DYLIB" dist/Login10195Diag-v0.4/
          cp login10195diag_v0.4/README.md dist/Login10195Diag-v0.4/
          cp login10195diag_v0.4/src/Login10195DiagV04.cpp dist/Login10195Diag-v0.4/
          cp login10195diag_v0.4/CMakeLists.txt dist/Login10195Diag-v0.4/
          shasum -a 256 "$DYLIB" > dist/Login10195Diag-v0.4/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Login10195Diag-v0.4 dist/Login10195Diag-v0.4-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Login10195Diag-v0.4-arm64
          path: |
            dist/Login10195Diag-v0.4-arm64.zip
            dist/Login10195Diag-v0.4/Login10195Diag_v0.4.dylib
            dist/Login10195Diag-v0.4/SHA256.txt
          if-no-files-found: error

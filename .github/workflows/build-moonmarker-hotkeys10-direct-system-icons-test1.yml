name: Build MoonMarker Hotkeys10 Direct System Icons Test1

on:
  push:
    branches:
      - agent/moonmarker-hotkeys10-direct-system-icons-test1-20260806
    paths:
      - '.github/workflows/build-moonmarker-hotkeys10-direct-system-icons-test1.yml'
      - 'fixes/hotkeys10-direct-system-icons-test1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Hotkeys10 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8886817364/zip" \
            -o exact-source.zip
          unzip -q exact-source.zip -d exact-source
          echo '89488a13ca54c6ab6e709a2dba7492bdbbdb422913cd5eb871d878dc6fba3f7e  exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz' | sha256sum -c -
          tar -xJf exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz
          rm -rf source-export/native/.git source-export/plugin/.git
          cp -a source-export target
          cat slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part00 \
              slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part01 \
              slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part02 \
              slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part03 \
              slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part04 \
            > hook-safety-stable.patch.gz.b64
          echo '632f019def405e2115bfae757e906ceef0a33a1d3156435e69d2529ccf397774  hook-safety-stable.patch.gz.b64' | sha256sum -c -
          base64 -d hook-safety-stable.patch.gz.b64 > hook-safety-stable.patch.gz
          gzip -dc hook-safety-stable.patch.gz > hook-safety-stable.patch
          git apply --directory=target hook-safety-stable.patch
          git apply --directory=target slim/universal-hotkeys10/universal-hotkeys10.patch
          grep -Fq '## Version: 0.9.2-universal-layout-hotkeys10' target/plugin/MoonMarker.toc

      - name: Apply locally finalized direct texture patch
        run: |
          set -euxo pipefail
          cat fixes/hotkeys10-direct-system-icons-test1/patch.part00 \
              fixes/hotkeys10-direct-system-icons-test1/patch.part01 \
              fixes/hotkeys10-direct-system-icons-test1/patch.part02 \
              fixes/hotkeys10-direct-system-icons-test1/patch.part03 \
            > direct-system-icons-test1.patch
          echo 'c5b5ecb65f407e218ef54364671eb48999483bdc7e97795920a53cf6ee78e925  direct-system-icons-test1.patch' | sha256sum -c -
          git apply --directory=target direct-system-icons-test1.patch

      - name: Verify protected Hotkeys10 behavior
        run: |
          set -euxo pipefail
          grep -Fq '## Version: 0.9.5-hotkeys10-direct-system-texture-test1' target/plugin/MoonMarker.toc
          grep -Fq 'constexpr float kIconWorldHeight = 8.5f;' target/native/nativeM2Test.cpp
          grep -Fq 'Spells\\MoonBeam_Impact_Base.mdx' target/native/nativeM2Test.cpp
          grep -Fq 'Interface\\TargetingFrame\\UI-RaidTargetingIcons.blp' target/native/nativeM2Test.cpp
          grep -Fq 'world.z += kIconWorldHeight;' target/native/nativeM2Test.cpp
          grep -Fq 'if (renderSystemRaidIcons(device)) return;' target/native/nativeM2Test.cpp
          grep -Fq 'projectSlot(i);' target/native/nativeM2Test.cpp
          ! test -e target/plugin/SystemRaidIcons.lua
          test "$(grep -c 'MOONMARKER_QUICK_PRESET_' target/plugin/Bindings.xml)" = '10'
          grep -Fq 'std::uint32_t nonce' target/native/MoonMarkerMainModel.cpp
          grep -Fq 'rememberPacket' target/native/MoonMarkerMainModel.cpp
          grep -Fq 'originalIsPartyLeader' target/native/MoonMarkerGuildAuth.cpp

      - name: Validate Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r file; do luac5.1 -p "$file"; done < <(find target/plugin -type f -name '*.lua' | sort)

      - name: Install Windows x86 toolchain
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK
          curl -L --fail --retry 3 'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile Windows x86 DLL
        run: |
          set -euxo pipefail
          ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" target/native/xwinSDK
          ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" target/native/d3d9x_headers
          sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' target/native/Makefile
          make -C target/native clean
          make -C target/native -j2
          file target/native/UnitXP_SP3.dll | tee target/native/DLL-FILE-TYPE.txt
          grep -q 'PE32 executable.*Intel 80386' target/native/DLL-FILE-TYPE.txt

      - name: Package test build
        run: |
          set -euxo pipefail
          mkdir -p release/Interface/AddOns/MoonMarker release/Project-Source/native release/Project-Source/plugin release/Audit
          cp target/native/UnitXP_SP3.dll release/
          cp -a target/plugin/. release/Interface/AddOns/MoonMarker/
          cp -a target/native/. release/Project-Source/native/
          cp -a target/plugin/. release/Project-Source/plugin/
          rm -rf release/Project-Source/native/xwinSDK release/Project-Source/native/d3d9x_headers
          cp direct-system-icons-test1.patch release/Audit/
          sha256sum release/UnitXP_SP3.dll > release/DLL-SHA256.txt
          file release/UnitXP_SP3.dll > release/DLL-FILE-TYPE.txt
          cat > release/README-TEST1.txt <<'EOF'
          MoonMarker Hotkeys10 Direct System Icons Test1

          Baseline: MoonMarker-Universal-Hotkeys10
          Top icon anchor: original beam x/y plus original 8.5 world-height offset
          Projection: original Hotkeys10 safeWorldToScreen/projectSlot
          Texture: Interface\TargetingFrame\UI-RaidTargetingIcons.blp read from game MPQ
          Rendering: native Direct3D textured quads centered on original screen.x/screen.y
          Extra MoonMarker slots: none
          Lua coordinate conversion: none
          Fallback: original vector icons if the system BLP cannot be loaded

          Compiled/static validation only. In-game testing is required.
          EOF
          (cd release && zip -9 -r ../MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86.zip .)
          sha256sum MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86.zip > MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86
          path: |
            release
            MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86.zip
            MoonMarker-Universal-Hotkeys10-Direct-System-Icons-Test1-x86.zip.sha256
          if-no-files-found: error

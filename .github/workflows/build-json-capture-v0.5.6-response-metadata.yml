name: Build JSONCapture v0.5.6 Response Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.5.6-response-metadata
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-json-capture-v0.5.6-response-metadata.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify v0.5.2-derived contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'JSONCapture_FILES = src/ManualTaskEngineV05.m src/JCG5ScrollFix.m src/OnDeviceLuaRecovery.m' jsoncapture/Makefile
          grep -Fq 'apply_v052_runtime_cache.py' jsoncapture/Makefile
          grep -Fq 'apply_v054_response_observer.py' jsoncapture/Makefile
          grep -Fq 'apply_v055_response_capture.py' jsoncapture/Makefile
          grep -Fq 'apply_v056_response_metadata.py' jsoncapture/Makefile
          test ! -e jsoncapture/src/JCG53RuntimeCapture2.m
          test ! -e jsoncapture/src/JCG53RuntimeCapture2UI.m

      - name: Apply patches and verify metadata architecture
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          python3 scripts/apply_v052_runtime_cache.py
          python3 scripts/apply_v054_response_observer.py
          python3 scripts/apply_v055_response_capture.py
          python3 scripts/apply_v056_response_metadata.py
          src=src/ManualTaskEngineV05.m

          grep -Fq 'JCG5_RESPONSE_METADATA_V056' "$src"
          grep -Fq 'JCG56_SEND_WEB_REQUEST_RVA 0x0ECFD938ULL' "$src"
          grep -Fq 'JCG56_GET_METHOD_RVA 0x0ECFDD54ULL' "$src"
          grep -Fq 'JCG56_GET_URL_RVA 0x0ECFE328ULL' "$src"
          grep -Fq 'JCG56_GET_RESPONSE_CODE_RVA 0x0ECFE0C4ULL' "$src"
          grep -Fq 'JCG54_DOWNLOAD_HANDLER_BUFFER_GETDATA_RVA 0x0ECFC0C0ULL' "$src"
          grep -Fq 'CEF4252D-DCA1-3442-AED5-E5751D7BF5CD' "$src"

          grep -Fq 'JCG56HookSendWebRequest' "$src"
          grep -Fq 'JCG56InstallRequestMetadata' "$src"
          grep -Fq 'BOOL d=anchor?JCG56InstallRequestMetadata(anchor):NO;' "$src"
          grep -Fq 'Keep all MSHookFunction installs serialized in this same call.' "$src"
          grep -Fq 'response_metadata=%d' "$src"

          grep -Fq 'runtime_response_requests.jsonl' "$src"
          grep -Fq '"schema": @2' "$src"
          grep -Fq '"url"' "$src"
          grep -Fq '"method"' "$src"
          grep -Fq '"http_status"' "$src"
          grep -Fq '"metadata_matched"' "$src"
          grep -Fq 'hot_update_config' "$src"
          grep -Fq 'hot_update_package_count' "$src"
          grep -Fq 'hot_update_version' "$src"
          grep -Fq 'packverurl' "$src"
          grep -Fq 'notice_config' "$src"
          grep -Fq 'RESPONSE-METADATA hit=' "$src"

          ! grep -Fq 'tolua_variable' "$src"
          ! grep -Fq 'lua_pushlstring-json' "$src"
          ! grep -Eq '__thread|thread_local|JCG53UIEntry' "$src"
          test "$(grep -c '__attribute__((constructor))' src/ManualTaskEngineV05.m | tr -d ' ')" = '1'
          compiled_ctor_count=$(grep -h '__attribute__((constructor))' \
            src/ManualTaskEngineV05.m src/JCG5ScrollFix.m src/OnDeviceLuaRecovery.m \
            | wc -l | tr -d ' ')
          echo "compiled constructor count=$compiled_ctor_count"
          test "$compiled_ctor_count" = '2'

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v056
          out='dist-v056/JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.dylib'
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out"
          otool -L "$out"
          shasum -a 256 "$out" | tee dist-v056/SHA256.txt

      - name: Enforce startup and target-safety invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          out='dist-v056/JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.dylib'
          otool -l "$out" > dist-v056/load_commands.txt
          otool -hv "$out" > dist-v056/header.txt
          strings "$out" > dist-v056/strings.txt

          modinit=$(awk '/sectname __mod_init_func/{seen=1;next} seen && $1=="size"{print $2; exit}' dist-v056/load_commands.txt)
          echo "__mod_init_func size=$modinit"
          test "$modinit" = '0x0000000000000010'
          ! grep -Eq 'sectname __thread_vars|sectname __thread_bss' dist-v056/load_commands.txt
          ! grep -Fq 'HAS_TLV_DESCRIPTORS' dist-v056/header.txt

          grep -Fq 'RESPONSE-OBSERVER ready' dist-v056/strings.txt
          grep -Fq 'RESPONSE-CAPTURE saved' dist-v056/strings.txt
          grep -Fq 'RESPONSE-METADATA ready' dist-v056/strings.txt
          grep -Fq 'RESPONSE-METADATA hit=' dist-v056/strings.txt
          grep -Fq 'runtime_response_requests.jsonl' dist-v056/strings.txt
          grep -Fq 'hot_update_config' dist-v056/strings.txt
          grep -Fq 'notice_config' dist-v056/strings.txt
          grep -Fq 'CEF4252D-DCA1-3442-AED5-E5751D7BF5CD' dist-v056/strings.txt
          ! grep -Fq 'RUNTIME2-HOOK registration ready' dist-v056/strings.txt
          ! grep -Fq 'xhr.responseText' dist-v056/strings.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture/dist-v056
          cat > README.txt <<'TXT'
          JSONCapture v0.5.6 Response Metadata — v0.5.5 proven body capture + request correlation

          Proven response path retained:
          - DownloadHandlerBuffer.GetData RVA 0x0ECFC0C0
          - UnityFramework UUID CEF4252D-DCA1-3442-AED5-E5751D7BF5CD
          - Full JSON validation + MD5/SHA256 persistent duplicate suppression.

          v0.5.6 additions:
          - Hooks UnityWebRequest.SendWebRequest at RVA 0x0ECFD938 in the SAME serialized install call.
          - Reads URL from get_url RVA 0x0ECFE328.
          - Reads HTTP method from get_method RVA 0x0ECFDD54.
          - Reads HTTP response code from get_responseCode RVA 0x0ECFE0C4 when GetData returns a JSON-looking body.
          - Correlates downloadHandler -> request before send, then enriches each validated JSON event.
          - runtime_response_manifest.jsonl schema upgraded to 2.
          - runtime_response_requests.jsonl records every validated JSON event, including duplicate-body events.
          - Automatic classification: hot_update_config / notice_config / json.
          - Hot-update metadata includes package count, packverurl, and version parsed from the first package URL when available.

          Output:
          - Documents/JSONCapture/ManualV05/runtime_response_json/<md5>.json
          - Documents/JSONCapture/ManualV05/runtime_response_manifest.jsonl
          - Documents/JSONCapture/ManualV05/runtime_response_requests.jsonl
          - Documents/JSONCapture/ManualV05/state/ResponseCapture.cache.jsonl
          - Documents/JSONCapture/ManualV05/ManualV05.log

          Stability constraints retained:
          - No extra constructor / +load.
          - No TLS/TLV.
          - No tolua_variable hook.
          - No second hook polling queue.
          - All MSHookFunction installs remain sequential inside JCG5InstallHooks().
          - Exact UnityFramework UUID gate before fixed-RVA hooks.
          TXT
          zip -9 JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.zip \
            JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.dylib SHA256.txt README.txt load_commands.txt header.txt
          shasum -a 256 JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.zip | tee ZIP_SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: JSONCapture-v0.5.6-ResponseMetadata-0.5.2Base
          path: |
            jsoncapture/dist-v056/JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.dylib
            jsoncapture/dist-v056/JSONCapture_v0.5.6_ResponseMetadata_0.5.2Base.zip
            jsoncapture/dist-v056/SHA256.txt
            jsoncapture/dist-v056/ZIP_SHA256.txt
            jsoncapture/dist-v056/load_commands.txt
            jsoncapture/dist-v056/header.txt
          if-no-files-found: error

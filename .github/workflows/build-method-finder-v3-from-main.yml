name: Build Method Finder V3 via Main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-method-finder-v3-from-main.yml
  workflow_dispatch:

jobs:
  build-v3:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout V3 source
        uses: actions/checkout@v4
        with:
          ref: acfce4935b47a9394372eeb656771a1b3e44cef1
          fetch-depth: 0

      - name: V3 M3.1 text interaction source assertions
        run: |
          set -euxo pipefail
          src=iosruntimepatchmenu/src
          makefile=iosruntimepatchmenu/Makefile
          grep -q 'src/ZNIL2CPPMethodFinderM2.mm' "$makefile"
          grep -q 'src/ZNIL2CPPMethodFinderM22StableCancelUX.mm' "$makefile"
          grep -q 'src/ZNFeatureBuilderControlsV2.mm' "$makefile"
          grep -q 'src/ZNFeatureRuntimeControlsV2.mm' "$makefile"
          grep -q 'src/ZNIL2CPPABIMetadata.mm' "$makefile"
          grep -q 'src/ZNIL2CPPABIDetailUI.mm' "$makefile"
          grep -q 'src/ZNMenuPresentationHostFix.mm' "$makefile"
          grep -q 'ZNIL2CPPABIValueKindFloat64' "$src/ZNIL2CPPABIMetadata.h"
          grep -q 'il2cpp_method_get_return_type' "$src/ZNIL2CPPABIMetadata.mm"
          grep -q 'ZNIL2CPPBuildReturnOverridePlan' "$src/ZNIL2CPPABIMetadata.mm"
          grep -q 'ZNInstallMenuPresentationHostFixDeferred' "$src/ZNIL2CPPMethodFinderMenuBinding.mm"
          grep -q 'ZN62ContainsFirstResponder' "$src/ZNMenuPresentationHostFix.mm"
          grep -q 'bringSubviewToFront:self.floatButton' "$src/ZNMenuPresentationHostFix.mm"
          ! grep -q '\[window bringSubviewToFront:self.panel\]' "$src/ZNMenuPresentationHostFix.mm"
          ! grep -q 'ZN62PresentationHostView' "$src/ZNMenuPresentationHostFix.mm"
          grep -q 'kZN61ShardClasses = 12000' "$src/ZNIL2CPPMethodFinderM2.mm"
          grep -q 'ZN61MatchContains' "$src/ZNIL2CPPMethodFinderM2.mm"

      - name: Named Offset parser tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/il2cpp_named_offset_parser_test.mm \
            iosruntimepatchmenu/src/ZNIL2CPPResolver.mm \
            -o /tmp/zn_il2cpp_named_offset_parser_test
          /tmp/zn_il2cpp_named_offset_parser_test

      - name: IL2CPP ABI classifier tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/il2cpp_abi_classifier_test.mm \
            iosruntimepatchmenu/src/ZNIL2CPPABIMetadata.mm \
            -o /tmp/zn_il2cpp_abi_classifier_test
          /tmp/zn_il2cpp_abi_classifier_test

      - name: Static protection tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/static_payload_protection_v2_test.mm \
            -o /tmp/zn_static_payload_protection_v2_test
          /tmp/zn_static_payload_protection_v2_test
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/static_rva_protection_test.mm \
            -o /tmp/zn_static_rva_protection_test
          /tmp/zn_static_rva_protection_test

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build M3.1 text interaction hotfix
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v058-m3-1-translate-hotfix
          cp .theos/obj/ZonoePatchV03.dylib dist-v058-m3-1-translate-hotfix/ZonoPatch_v0.5.8_M3_1_TextTranslateHotfix.dylib
          shasum -a 256 dist-v058-m3-1-translate-hotfix/ZonoPatch_v0.5.8_M3_1_TextTranslateHotfix.dylib | tee dist-v058-m3-1-translate-hotfix/SHA256.txt

      - name: Verify M3.1 text interaction hotfix binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-v058-m3-1-translate-hotfix/ZonoPatch_v0.5.8_M3_1_TextTranslateHotfix.dylib
          file "$out"
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'
          strings "$out" > /tmp/zonoe_m31_translate_strings.txt
          grep -q 'v3-candidate-list' /tmp/zonoe_m31_translate_strings.txt
          grep -q 'm2-wide-index' /tmp/zonoe_m31_translate_strings.txt
          grep -q 'pending-m3.2-hook-backend' /tmp/zonoe_m31_translate_strings.txt
          grep -q 'expected-by-generated-IL2CPP-code' /tmp/zonoe_m31_translate_strings.txt
          grep -q 'ZNRuntimeMenuControllerV040' /tmp/zonoe_m31_translate_strings.txt
          grep -q 'zn62_tick:' /tmp/zonoe_m31_translate_strings.txt
          python3 <<'PY'
          import struct
          p='iosruntimepatchmenu/dist-v058-m3-1-translate-hotfix/ZonoPatch_v0.5.8_M3_1_TextTranslateHotfix.dylib'
          data=open(p,'rb').read()
          if struct.unpack_from('<I',data,0)[0] != 0xfeedfacf:
              raise SystemExit('not thin arm64 Mach-O')
          ncmds=struct.unpack_from('<I',data,16)[0]
          off=32
          init_size=None
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',data,off)
              if cmd==0x19:
                  nsects=struct.unpack_from('<I',data,off+64)[0]
                  so=off+72
                  for __ in range(nsects):
                      sectname=data[so:so+16].split(b'\0',1)[0]
                      if sectname==b'__init_offsets':
                          init_size=struct.unpack_from('<Q',data,so+40)[0]
                      so+=80
              off+=cmdsize
          print('init_offsets_size=',init_size)
          if init_size != 4:
              raise SystemExit(f'expected exactly one cold-launch constructor, got {init_size}')
          PY

      - name: Upload M3.1 text interaction hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M3.1-TextTranslate-Hotfix
          path: |
            iosruntimepatchmenu/dist-v058-m3-1-translate-hotfix/ZonoPatch_v0.5.8_M3_1_TextTranslateHotfix.dylib
            iosruntimepatchmenu/dist-v058-m3-1-translate-hotfix/SHA256.txt
          if-no-files-found: error

name: Build Runtime Patch Menu v0.5.8 M5.4 Unified Method Finder

on:
  push:
    branches:
      - refactor/method-finder-ui-consolidation-m5.4
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f METHOD_FINDER_UI_AUDIT.md
          test -f iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'src/ZNMethodFinderUnifiedUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallMethodFinderUnifiedUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q '\[m5.4-unified-ui\]' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'IL2CPP 方法查找 · Unified' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q '搜索记录 · %lu/50' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'znm54_historyTapped' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'znm54_renderSearchAtWidth' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'znm54_renderResultsAtWidth' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'znm54_renderDetailAtWidth' iosruntimepatchmenu/src/ZNMethodFinderUnifiedUI.mm
          grep -q 'ZNInstallM462CandidateBindingUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM47ReceiverCaptureUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM52ChainExecuteButtonDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          ! grep -q 'ZNInstallM52MethodSearchHistoryDeferred();' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q '0.5.8 · M5.4' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.4
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.4
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.4/ZonoPatch_v0.5.8_M5.4_Unified_Method_Finder.dylib
          shasum -a 256 dist-m5.4/ZonoPatch_v0.5.8_M5.4_Unified_Method_Finder.dylib | tee dist-m5.4/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.4/ZonoPatch_v0.5.8_M5.4_Unified_Method_Finder.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m54_load_commands.txt
          strings -a "$out" > /tmp/zono_m54_strings.txt
          grep -q '\[m5.1-silent\]' /tmp/zono_m54_strings.txt
          grep -q '\[m5.2-chain\]' /tmp/zono_m54_strings.txt
          grep -q '\[m5.3-binding\]' /tmp/zono_m54_strings.txt
          grep -q '\[m5.4-unified-ui\]' /tmp/zono_m54_strings.txt
          grep -q 'zonoe.m52.method-search-history.v1' /tmp/zono_m54_strings.txt
          grep -q 'znm54_historyTapped:' /tmp/zono_m54_strings.txt
          grep -q 'znm54_renderSearchAtWidth:' /tmp/zono_m54_strings.txt
          grep -q 'znm54_renderResultsAtWidth:' /tmp/zono_m54_strings.txt
          grep -q 'znm54_renderDetailAtWidth:' /tmp/zono_m54_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m54_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M5.4-Unified-Method-Finder
          path: |
            iosruntimepatchmenu/dist-m5.4/ZonoPatch_v0.5.8_M5.4_Unified_Method_Finder.dylib
            iosruntimepatchmenu/dist-m5.4/SHA256.txt
          if-no-files-found: error

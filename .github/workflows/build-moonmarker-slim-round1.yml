name: Build MoonMarker Slim Round 1

on:
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - '.github/workflows/build-moonmarker-slim-round1.yml'
      - 'slim/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout verified build assets
        uses: actions/checkout@v4

      - name: Decode verified reconstruction inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir cleanroom_input advanced_v2_input
          cat cleanroom/bundle.part00 cleanroom/bundle.part01 cleanroom/bundle.part02 cleanroom/bundle.part03 \
            | base64 -d > cleanroom_bundle.zip
          echo '077166868465beba39f5d8a87448190cb5892f9335289b3860a2c2396f5fd31a  cleanroom_bundle.zip' | sha256sum -c -
          unzip -q cleanroom_bundle.zip -d cleanroom_input

          # All historical cleanroom assets are pinned to the previously verified one-pass commit.
          git fetch --depth 1 origin 100463402c468a97c0804bbdcf4b077d321ebd96
          git archive FETCH_HEAD cleanroom | tar -x
          cat cleanroom/advanced-v2.fixed.part00 cleanroom/advanced-v2.fixed.part01 \
              cleanroom/advanced-v2.fixed.part02 cleanroom/advanced-v2.fixed.part03 \
              cleanroom/advanced-v2.fixed.part04 cleanroom/advanced-v2.fixed.part05 \
              cleanroom/advanced-v2.fixed.part06 \
            | base64 -d > advanced-v2.tar.xz
          echo 'bb817eb41f64ccea39e5c35119f367146e2ba554597ace2bcb7fa07b6e857e1f  advanced-v2.tar.xz' | sha256sum -c -
          tar -xJf advanced-v2.tar.xz -C advanced_v2_input

      - name: Reconstruct exact pre-slim MoonMarker source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir reconstructed
          git -C reconstructed init
          git -C reconstructed remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C reconstructed fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C reconstructed checkout --detach FETCH_HEAD
          test "$(git -C reconstructed rev-parse HEAD)" = '3370011e396ccdbf4c9921f6cf2b005bed818b24'

          sed -i 's/\r$//' reconstructed/dllmain.cpp reconstructed/sceneBegin_sceneEnd.cpp reconstructed/sceneBegin_sceneEnd.h reconstructed/Makefile
          sed -i '1s/^\xEF\xBB\xBF//' reconstructed/dllmain.cpp reconstructed/sceneBegin_sceneEnd.cpp reconstructed/sceneBegin_sceneEnd.h reconstructed/Makefile

          patch --batch -p1 -d reconstructed < cleanroom_input/MoonMarker_Cleanroom.patch
          patch --batch -p1 -d reconstructed < cleanroom/fix-lua-string.patch
          patch --batch -p1 -d reconstructed < cleanroom/present-hook.patch
          patch --batch -p1 -d reconstructed < cleanroom/fix-placement-projection.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/addon-status.patch

          cp cleanroom/native-m2-v2/nativeM2Test.cpp reconstructed/
          cp cleanroom/native-m2-v2/nativeM2Test.h reconstructed/
          patch --batch -p1 -d reconstructed < cleanroom/native-m2-v2.patch
          patch --batch -p1 -d reconstructed < cleanroom/native-white-v1.patch
          patch --batch -p1 -d reconstructed < cleanroom/native-white-remote-v1.patch
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/native-white-remote-addon-v1.patch

          cp cleanroom/native-eight-v1/nativeM2Test.cpp reconstructed/nativeM2Test.cpp
          cp cleanroom/native-eight-v1/nativeM2Test.h reconstructed/nativeM2Test.h
          python3 cleanroom/apply_eight_markers.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon \
            --addon-source cleanroom/eight-markers/MoonMarker.lua
          python3 cleanroom/configure_eight_marker_addon.py \
            --addon cleanroom_input/addon \
            --source-dir cleanroom/eight-markers
          python3 cleanroom/apply_guild_auth.py \
            --upstream reconstructed \
            --source-dir cleanroom/guild-auth-v1
          python3 cleanroom/apply_advanced_editor_bundle.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon
          python3 cleanroom/apply_advanced_editor_v2.py \
            --upstream reconstructed \
            --addon cleanroom_input/addon \
            --source-dir advanced_v2_input/advanced-v2

          base64 -d cleanroom/main-model-v1/native-patches.tar.gz.b64 > native-patches.tar.gz
          echo 'dcee1a75e9b3fa55d472a80db0c0a2d1d17fe9ba444f923b4b423172d112147f  native-patches.tar.gz' | sha256sum -c -
          tar -xzf native-patches.tar.gz
          for patch_file in native/*.patch; do
            patch --batch -p0 -d reconstructed < "$patch_file"
          done

          grep -Fq 'createCustomAt' reconstructed/nativeM2Test.cpp
          grep -Fq 'MoonMarker.Main.Remote' reconstructed/MoonMarkerGuildAuth.cpp
          grep -Fq 'MoonMarkerMainModel.cpp' reconstructed/Makefile

      - name: Decode exact matching plugin
        shell: bash
        run: |
          set -euxo pipefail
          echo '1f4e402aa75694885a09839697efc7ac287b3f749ad871a222184050a4f54e2b  cleanroom/main-model-v1/addon.part00' | sha256sum -c -
          echo '2ec2a1284aacb77ea920dea10e15466c8aeba73f212ca1034665910b50261a4f  cleanroom/main-model-v1/addon.part01' | sha256sum -c -
          echo '07e05ab6e6ee6ea5078fc50f864410446d3da9839fc3cfb391e91a4990343d6a  cleanroom/main-model-v1/addon.part02' | sha256sum -c -
          echo 'b1de5af9d50fcf0927eed9aa2d81f1745dc9db04d3a314dde5cdc72d987f0273  cleanroom/main-model-v1/addon.part03' | sha256sum -c -
          echo 'cd4123b59352f2c43958d8efac00ab165aebc5be962a8364f20475f180324f02  cleanroom/main-model-v1/addon.part04' | sha256sum -c -
          echo 'b837f806d5f03d536d879cfcbb7bd2ba0944843c1aaeb3ffbd9986aa0b44033a  cleanroom/main-model-v1/addon.part05' | sha256sum -c -
          echo '43cf4a7d92aebb559706260e9d8919950df317fee7e62a95d8953d14f2354af2  cleanroom/main-model-v1/addon.part06' | sha256sum -c -
          echo '9b93e4d396b9f97fb61bc67ca594e3ed77dbafeaa808d86fcfc5e21167fe5bb1  cleanroom/main-model-v1/addon.part07' | sha256sum -c -
          echo '37ce6eea035ba0b10ce34288541f89e92367622cd7d4e9d7a9256e2382575ea7  cleanroom/main-model-v1/addon.part08' | sha256sum -c -
          cat cleanroom/main-model-v1/addon.part00 cleanroom/main-model-v1/addon.part01 \
              cleanroom/main-model-v1/addon.part02 cleanroom/main-model-v1/addon.part03 \
              cleanroom/main-model-v1/addon.part04 cleanroom/main-model-v1/addon.part05 \
              cleanroom/main-model-v1/addon.part06 cleanroom/main-model-v1/addon.part07 \
              cleanroom/main-model-v1/addon.part08 \
            | base64 -d > addon.tar.xz
          echo '266c465bda70eb7619d733501aab6c63bd149be7c6a63b9f800b1e147b0e99bc  addon.tar.xz' | sha256sum -c -
          mkdir addon_package
          tar -xJf addon.tar.xz -C addon_package
          test -f addon_package/MoonMarker/MainModels.lua

      - name: Apply round 1 deletions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p before/native before/plugin work
          cp -a reconstructed before/native
          cp -a addon_package/MoonMarker before/plugin/MoonMarker
          cp -a reconstructed work/native
          cp -a addon_package/MoonMarker work/plugin

          base64 -d slim/apply-round1-slim.py.gz.b64 > apply-round1-slim.py.gz
          echo '16bdb944b2d856a94b47578db06faa99963aca2ee7f69febff33b72735e54a33  apply-round1-slim.py.gz' | sha256sum -c -
          gzip -dc apply-round1-slim.py.gz > apply-round1-slim.py
          python3 -m py_compile apply-round1-slim.py
          python3 apply-round1-slim.py work

          test ! -e work/native/MoonMarkerM2Scanner.cpp
          test ! -e work/native/MoonMarkerM2Scanner.h
          test ! -e work/plugin/AdvancedCoreDiagnostics.lua
          test ! -e work/plugin/SettingsDiagnostics.lua
          ! grep -RFq 'MoonMarker.Advanced.ScanM2' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.Core.SelfTest' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.Core.Status' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.Core.Policy' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.Main.PlaceCursor' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.Main.RestoreDefault' work/native work/plugin
          ! grep -RFq 'MoonMarker.Advanced.PreviewM2' work/native work/plugin
          ! grep -RFq 'QueryMarks' work/native work/plugin
          grep -Fq '## Version: 0.5.1-slim-round1' work/plugin/MoonMarker.toc

          find before/native -type f \( -name '*.cpp' -o -name '*.h' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > before-native-source-bytes.txt
          find work/native -type f \( -name '*.cpp' -o -name '*.h' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > after-native-source-bytes.txt
          find before/plugin/MoonMarker -type f \( -name '*.lua' -o -name '*.toc' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > before-plugin-source-bytes.txt
          find work/plugin -type f \( -name '*.lua' -o -name '*.toc' \) -printf '%s\n' | awk '{s+=$1} END{print s}' > after-plugin-source-bytes.txt

      - name: Validate Lua 5.1 syntax
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find work/plugin -type f -name '*.lua' | sort)

      - name: Install Windows x86 build toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK

          curl -L --fail --retry 3 \
            'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile before and after with identical flags
        shell: bash
        run: |
          set -euxo pipefail
          for tree in before/native work/native; do
            ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" "$tree/xwinSDK"
            ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" "$tree/d3d9x_headers"
            sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' "$tree/Makefile"
            make -C "$tree" clean
            make -C "$tree" -j2
            file "$tree/UnitXP_SP3.dll"
            file "$tree/UnitXP_SP3.dll" | grep -q 'PE32 executable.*Intel 80386'
          done

          stat -c '%s' before/native/UnitXP_SP3.dll > before-dll-size.txt
          stat -c '%s' work/native/UnitXP_SP3.dll > after-dll-size.txt
          test "$(cat before-dll-size.txt)" = '636416'
          test "$(cat after-dll-size.txt)" -lt "$(cat before-dll-size.txt)"

      - name: Package round 1 test build
        shell: bash
        run: |
          set -euxo pipefail
          before_size=$(cat before-dll-size.txt)
          after_size=$(cat after-dll-size.txt)
          reduced=$((before_size-after_size))
          clean_v89=491008
          moonmarker_added=$((after_size-clean_v89))

          mkdir -p release/Interface/AddOns
          cp work/native/UnitXP_SP3.dll release/UnitXP_SP3.dll
          cp -a work/plugin release/Interface/AddOns/MoonMarker
          file release/UnitXP_SP3.dll > release/DLL-FILE-TYPE.txt
          sha256sum release/UnitXP_SP3.dll > release/DLL-SHA256.txt
          printf '%s\n' "$after_size" > release/DLL-SIZE-BYTES.txt

          cat > release/SLIM-ROUND1-RESULT.txt <<EOF
          MoonMarker slimming round 1
          Clean v89 baseline: ${clean_v89} bytes
          Before round 1: ${before_size} bytes
          After round 1: ${after_size} bytes
          Reduced this round: ${reduced} bytes
          Remaining MoonMarker increase over clean v89: ${moonmarker_added} bytes

          Removed:
          - Native M2 scanner and ScanM2 commands
          - Core Policy/Status/SelfTest diagnostics
          - Legacy M2Test/M2Clear/M2Status and query/status aliases
          - Old four-field white-marker synchronization fallback
          - Unused 16-slot team-state/rate-limit framework
          - Unused PreviewM2, Main.PlaceCursor and RestoreDefault DLL commands
          - Diagnostic Lua pages
          - Obsolete .orig and development documentation files

          Not changed in round 1:
          - Old PNG overlay renderer
          - Duplicate gMarks runtime state
          - Two preview-slot implementations
          - Main-model signed protocol
          - Marker auto-restoration remains disabled
          EOF

          printf '%s\n' \
            "Native source before: $(cat before-native-source-bytes.txt) bytes" \
            "Native source after: $(cat after-native-source-bytes.txt) bytes" \
            "Plugin source before: $(cat before-plugin-source-bytes.txt) bytes" \
            "Plugin source after: $(cat after-plugin-source-bytes.txt) bytes" \
            > release/SOURCE-SIZE-RESULT.txt

          cp slim/apply-round1-slim.py.gz.b64 release/
          cd release
          zip -q -r ../MoonMarker-Slim-Round1-x86.zip .

          {
            echo '## MoonMarker slimming round 1'
            echo
            echo "- Before: ${before_size} bytes"
            echo "- After: ${after_size} bytes"
            echo "- Reduced: ${reduced} bytes"
            echo "- Remaining increase over clean v89: ${moonmarker_added} bytes"
            echo '- Lua 5.1 syntax: passed'
            echo '- PE32 Intel 80386: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload round 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Slim-Round1-x86
          path: |
            release/
            MoonMarker-Slim-Round1-x86.zip
          if-no-files-found: error
          retention-days: 14

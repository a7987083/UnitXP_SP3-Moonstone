name: Build Runtime Menu v0.6.4.1 M6.4.1 Unified Backend Controls

on:
  push:
    branches:
      - feature/m6.4.1-unified-backend-controls
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate single renderer contract
        run: |
          set -euxo pipefail
          python3 iosruntimepatchmenu/tools/validate_single_ui_renderer.py

      - name: Source assertions
        run: |
          set -euxo pipefail
          grep -q '0.6.4.1 · M6.4.1' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'M6.4.1 canonical authoring renderer' iosruntimepatchmenu/src/ZNM641UnifiedAuthoringRenderer.mm
          grep -q 'Backend 与控件独立' iosruntimepatchmenu/src/ZNM641UnifiedAuthoringRenderer.mm
          grep -q 'Patch HEX' iosruntimepatchmenu/src/ZNM641UnifiedAuthoringRenderer.mm
          grep -q 'ZN_UI_CANONICAL_FEATURE_RENDERER' iosruntimepatchmenu/src/ZNM641UnifiedClientRenderer.mm
          grep -q 'one customer Feature renderer owns BOTH Static and Runtime records' iosruntimepatchmenu/src/ZNM641UnifiedClientRenderer.mm
          grep -q 'backend-only Number/Slider Value Cell semantics installed' iosruntimepatchmenu/src/ZNM641StaticControlBackend.mm
          ! grep -q 'ZNInstallFeatureGroupUIDeferred();' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          ! grep -q 'ZNInstallM630SingleUnifiedRendererDeferred();' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M6.4.1
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m6.4.1
          cp .theos/obj/ZonoePatchV03.dylib dist-m6.4.1/ZonoPatch_v0.6.4.1_M6.4.1_UnifiedBackendControls.dylib
          shasum -a 256 dist-m6.4.1/ZonoPatch_v0.6.4.1_M6.4.1_UnifiedBackendControls.dylib | tee dist-m6.4.1/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m6.4.1/ZonoPatch_v0.6.4.1_M6.4.1_UnifiedBackendControls.dylib
          file "$out" | grep -q 'arm64'
          strings -a "$out" > /tmp/zono_m641_strings.txt
          grep -q '\[m6.4.1-authoring\]' /tmp/zono_m641_strings.txt
          grep -q '\[m6.4.1-client\]' /tmp/zono_m641_strings.txt
          grep -q '\[m6.4.1-static\]' /tmp/zono_m641_strings.txt
          otool -L "$out" | tee /tmp/zono_m641_load_commands.txt
          ! grep -qi 'dobby' /tmp/zono_m641_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.6.4.1-M6.4.1-UnifiedBackendControls
          path: |
            iosruntimepatchmenu/dist-m6.4.1/ZonoPatch_v0.6.4.1_M6.4.1_UnifiedBackendControls.dylib
            iosruntimepatchmenu/dist-m6.4.1/SHA256.txt
          if-no-files-found: error

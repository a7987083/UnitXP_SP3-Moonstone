name: Build LoginHTTPObserver v6 Delegate Response

on:
  workflow_dispatch:
  push:
    branches:
      - feature/login-http-observer-v6-delegate-response
    paths:
      - 'loginhttpobserver/**'
      - '.github/workflows/build-login-http-observer-v6.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify LoginHTTPObserver v6
        run: |
          set -euxo pipefail
          cd loginhttpobserver
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/LoginHTTPObserver_v6_DelegateResponse_HFAMap187.dylib"
          cp .theos/obj/LoginHTTPObserver.dylib "$out"
          file "$out"
          otool -L "$out"
          strings "$out" | grep -q "LoginHTTPObserver v6 Delegate Response Capture"
          strings "$out" | grep -q "DELEGATE-HOOK"
          strings "$out" | grep -q "DELEGATE RESPONSE TARGET"
          strings "$out" | grep -q "DELEGATE COMPLETE TARGET"
          strings "$out" | grep -q "LoginHTTPTrace_v6.log"
          strings "$out" | grep -q "118.145.146.208"
          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: LoginHTTPObserver-v6-DelegateResponse-HFAMap187
          path: |
            loginhttpobserver/dist/LoginHTTPObserver_v6_DelegateResponse_HFAMap187.dylib
            loginhttpobserver/dist/SHA256.txt
          if-no-files-found: error

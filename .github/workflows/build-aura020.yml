name: Build TaiYangShenDian Aura Dual Mode

on:
  push:
    branches:
      - codex/aura-dual-v020-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM linker
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld unzip file binutils
          CLANG_CL="$(find /usr/bin -maxdepth 1 -type f -name 'clang-cl*' | sort -V | tail -n1)"
          LLD_LINK="$(find /usr/bin -maxdepth 1 -type f -name 'lld-link*' | sort -V | tail -n1)"
          test -x "$CLANG_CL"
          test -x "$LLD_LINK"
          sudo ln -sf "$CLANG_CL" /usr/local/bin/clang-cl
          sudo ln -sf "$LLD_LINK" /usr/local/bin/lld-link
          clang-cl --version
          lld-link --version

      - name: Extract source
        run: |
          set -euxo pipefail
          unzip -q TaiYangShenDian_Aura020_Source.zip -d source
          test -f source/TaiYangShenDian_V1.3.2_PLR2_SOURCE/build/build.sh

      - name: Build x86 DLL
        working-directory: source/TaiYangShenDian_V1.3.2_PLR2_SOURCE
        run: |
          set -euxo pipefail
          bash build/build.sh
          test -f taiyangshendian.dll
          file taiyangshendian.dll

      - name: Verify and package
        run: |
          set -euxo pipefail
          SRC=source/TaiYangShenDian_V1.3.2_PLR2_SOURCE
          mkdir -p release
          cp "$SRC/taiyangshendian.dll" release/
          sha256sum release/taiyangshendian.dll > release/SHA256SUMS.txt
          file release/taiyangshendian.dll > release/PE_VERIFY.txt
          objdump -p release/taiyangshendian.dll >> release/PE_VERIFY.txt
          strings -a release/taiyangshendian.dll | grep -E '1.4.0-AURA0.2.0|NAMPOWER_EVENTS|STANDALONE_NATIVE_HOOK|PASSIVE_UNIT_AURA' > release/MODE_VERIFY.txt
          cp "$SRC/AURA_ENGINE_V020.md" release/
          cp "$SRC/BUILD_STATUS_V020.md" release/

      - uses: actions/upload-artifact@v4
        with:
          name: TaiYangShenDian-Aura020-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

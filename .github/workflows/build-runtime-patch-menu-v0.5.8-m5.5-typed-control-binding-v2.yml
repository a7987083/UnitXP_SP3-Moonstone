name: Build Runtime Patch Menu v0.5.8 M5.6 RW Value Cell

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-m5.5-typed-control-binding-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNM551RuntimeSliderStability.mm
          test -f iosruntimepatchmenu/src/ZNStaticValueCellV1.h
          test -f iosruntimepatchmenu/src/ZNStaticValueCellV1.mm
          test -f iosruntimepatchmenu/src/ZNM56StaticValueCellBinding.mm
          grep -q 'ZN44_STATIC_HEADER_FLAG_VALUE_CELLS_V1' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'ZN44_STATIC_ENTRY_FLAG_VALUE_CELL_V1' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'ZNStaticValueCellAugmentAtPath' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'runtimeExecutableWrites' iosruntimepatchmenu/src/ZNGeneratedBinaryPostprocess.mm
          grep -q 'ZNInstallM551RuntimeSliderStabilityDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM56StaticValueCellBindingDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'src/ZNStaticValueCellV1.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM56StaticValueCellBinding.mm' iosruntimepatchmenu/Makefile
          grep -q '0.5.8 · M5.6' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a

      - name: Build M5.6
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.6
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.6/ZonoPatch_v0.5.8_M5.6_RW_Value_Cell.dylib
          shasum -a 256 dist-m5.6/ZonoPatch_v0.5.8_M5.6_RW_Value_Cell.dylib | tee dist-m5.6/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.6/ZonoPatch_v0.5.8_M5.6_RW_Value_Cell.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m56_load_commands.txt
          strings -a "$out" > /tmp/zono_m56_strings.txt
          grep -q '\[m5.5.1-slider\]' /tmp/zono_m56_strings.txt
          grep -q '\[m5.6-value-cell\]' /tmp/zono_m56_strings.txt
          grep -q 'RW __ZNDATA cells only' /tmp/zono_m56_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m56_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M5.6-RW-Value-Cell
          path: |
            iosruntimepatchmenu/dist-m5.6/ZonoPatch_v0.5.8_M5.6_RW_Value_Cell.dylib
            iosruntimepatchmenu/dist-m5.6/SHA256.txt
          if-no-files-found: error

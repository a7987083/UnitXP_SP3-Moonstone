name: Build iOS Runtime Patch Menu v0.4.7

on:
  push:
    branches:
      - feature/runtime-patch-v0.4-foundation-test
      - feature/runtime-patch-v0.4-foundation
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Source assertions
        run: |
          set -euxo pipefail
          grep -q '0.4.0-runtime-foundation' iosruntimepatchmenu/src/ZonoeRuntimeMenuV040.mm
          grep -q 'v0.4.3 developer runtime-validation layer' iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm
          grep -q 'v0.4.4 developer binary-builder layer' iosruntimepatchmenu/src/ZonoeRuntimeMenuV044.mm
          grep -q 'v0.4.7 manual JSON import layer' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm
          grep -q 'UIDocumentPickerViewController' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm
          grep -q 'UIDocumentPickerModeImport' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm
          grep -q 'didPickDocumentsAtURLs' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm
          grep -q 'zn44_importJSON:' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm
          grep -q 'arrayWithObject:@"功能"' iosruntimepatchmenu/src/ZonoeRuntimeMenuV045.mm
          grep -q 'patchdata' iosruntimepatchmenu/src/ZNPatchJSONImporter.mm
          grep -q 'JSON original is ignored' iosruntimepatchmenu/src/ZNStaticBinaryBuilder.mm
          grep -q 'selectedTarget' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'app-owned images only' iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm
          grep -q 'JSON original' iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm
          grep -q 'Temporary runtime apply' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.h
          grep -q 'Runtime Patch PASS' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'otherAuthorized' iosruntimepatchmenu/src/ZNDeveloperGate.h
          grep -q 'developer category gate installed' iosruntimepatchmenu/src/ZNDeveloperGate.mm
          grep -q 'ZonoeRuntimeMenuV047.mm' iosruntimepatchmenu/Makefile
          ! grep -REn 'MAP_JIT|pthread_jit_write_protect_np|task_for_pid' \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV044.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV045.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm \
            iosruntimepatchmenu/src/ZNStaticBinaryBuilder.mm \
            iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm \
            iosruntimepatchmenu/src/ZNBinaryPatchWorkspace.mm \
            iosruntimepatchmenu/src/ZNPatchJSONImporter.mm
          ! grep -q 'zonoe://device-auth' iosruntimepatchmenu/src/ZonoeRuntimeMenuV047.mm

      - name: Build v0.4.7 Manual JSON Picker
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v047
          cp .theos/obj/ZonoePatchV03.dylib dist-v047/ZonoePatch_v0.4.7_ManualJSONPicker.dylib
          shasum -a 256 dist-v047/ZonoePatch_v0.4.7_ManualJSONPicker.dylib | tee dist-v047/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-v047/ZonoePatch_v0.4.7_ManualJSONPicker.dylib
          file "$out"
          otool -L "$out"
          otool -l "$out" | grep -A4 '__znprobe'
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchDeveloperAuthorized'
          nm -gU "$out" | grep '_ZonoePatchOtherAuthorized'
          nm -gU "$out" | grep 'ZNBinaryPatchWorkspace'
          nm -gU "$out" | grep 'ZNStaticBinaryBuilder'
          nm -gU "$out" | grep 'ZNStaticDispatchRuntime'
          nm -gU "$out" | grep 'ZNPatchRuntimeValidator'
          nm -u "$out" | grep '_mprotect'
          strings "$out" > /tmp/zonoe_v047_strings.txt
          grep -q 'v0.4.7 manual UIDocumentPicker JSON import installed' /tmp/zonoe_v047_strings.txt
          grep -q 'Manual JSON Import + Binary Builder' /tmp/zonoe_v047_strings.txt
          grep -q 'com.zonoe.static-dispatch/v1' /tmp/zonoe_v047_strings.txt
          grep -q 'runtime validation installed' /tmp/zonoe_v047_strings.txt
          ! grep -q 'LocalTicketV2 transport installed' /tmp/zonoe_v047_strings.txt
          ! grep -q 'zonoe://device-auth' /tmp/zonoe_v047_strings.txt
          ! grep -q 'ZonoeHostGetUDID' /tmp/zonoe_v047_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoePatch-v0.4.7-ManualJSONPicker
          path: |
            iosruntimepatchmenu/dist-v047/ZonoePatch_v0.4.7_ManualJSONPicker.dylib
            iosruntimepatchmenu/dist-v047/SHA256.txt
          if-no-files-found: error

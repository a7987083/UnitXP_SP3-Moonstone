name: Build iOS Runtime Patch Menu v0.4.3

on:
  push:
    branches:
      - feature/runtime-patch-v0.4-foundation-test
      - feature/runtime-patch-v0.4-foundation
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Source assertions
        run: |
          set -euxo pipefail
          grep -q '0.4.0-runtime-foundation' iosruntimepatchmenu/src/ZonoeRuntimeMenuV040.mm
          grep -q 'v0.4.0b touch-policy scope fix' iosruntimepatchmenu/src/ZonoeRuntimeMenuV0402.mm
          grep -q 'v0.4.2 UI/diagnostics layer' iosruntimepatchmenu/src/ZonoeRuntimeMenuV042.mm
          grep -q 'v0.4.3 developer runtime-validation layer' iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm
          grep -q 'Live Original' iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm
          grep -q 'Temporary runtime apply' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.h
          grep -q 'JSON "original" is intentionally ignored' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'Executable Page Probe 未通过' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q '原字节已回滚' iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm
          grep -q 'numberOfLines = 0' iosruntimepatchmenu/src/ZonoeRuntimeMenuV042.mm
          grep -q 'Executable Page Probe 0.4.2' iosruntimepatchmenu/src/ZNExecutablePageProbe.mm
          grep -q '__TEXT,__znprobe' iosruntimepatchmenu/src/ZNExecutablePageProbe.mm
          grep -q 'RX→RW→写入→恢复→RX→执行' iosruntimepatchmenu/src/ZNExecutablePageProbe.mm
          grep -q 'dyldDebounce=400ms' iosruntimepatchmenu/src/ZNRuntimeDiagnosticsV042.mm
          grep -q 'main-thread delay=' iosruntimepatchmenu/src/ZNRuntimeDiagnosticsV042.mm
          grep -q 'Runtime Patch Executor 0.4.1' iosruntimepatchmenu/src/ZNRuntimePatchExecutor.mm
          grep -q 'ZNPatchActionTypeIL2CPPMethod' iosruntimepatchmenu/src/ZNPatchCore.h
          grep -q 'il2cpp_class_from_name' iosruntimepatchmenu/src/ZNIL2CPPResolver.mm
          grep -q 'line 2 is optional' iosruntimepatchmenu/src/ZNDeveloperGate.mm
          ! grep -REn 'MAP_JIT|pthread_jit_write_protect_np|task_for_pid' \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV040.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV0401.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV0402.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV042.mm \
            iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm \
            iosruntimepatchmenu/src/ZNPatchCore.mm \
            iosruntimepatchmenu/src/ZNPatchCoreV041.mm \
            iosruntimepatchmenu/src/ZNRuntimePatchExecutor.mm \
            iosruntimepatchmenu/src/ZNExecutablePageProbe.mm \
            iosruntimepatchmenu/src/ZNRuntimeDiagnosticsV042.mm \
            iosruntimepatchmenu/src/ZNPatchRuntimeValidator.mm \
            iosruntimepatchmenu/src/ZNIL2CPPResolver.mm
          ! grep -q 'zonoe://device-auth' iosruntimepatchmenu/src/ZonoeRuntimeMenuV043.mm

      - name: Build v0.4.3 Runtime Validation
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1 \
            ZonoePatchV03_FILES="src/ZonoeRuntimeMenuV043.mm src/ZNTheme.mm src/ZNPatchCore.mm src/ZNPatchCoreV041.mm src/ZNRuntimePatchExecutor.mm src/ZNExecutablePageProbe.mm src/ZNRuntimeDiagnosticsV042.mm src/ZNPatchRuntimeValidator.mm src/ZNDeveloperGate.mm src/ZNIL2CPPResolver.mm"
          mkdir -p dist-v043
          cp .theos/obj/ZonoePatchV03.dylib dist-v043/ZonoePatch_v0.4.3_RuntimeValidation.dylib
          shasum -a 256 dist-v043/ZonoePatch_v0.4.3_RuntimeValidation.dylib | tee dist-v043/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-v043/ZonoePatch_v0.4.3_RuntimeValidation.dylib
          file "$out"
          otool -L "$out"
          otool -l "$out" | grep -A4 '__znprobe'
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'
          nm -gU "$out" | grep '_ZonoePatchStart'
          nm -gU "$out" | grep '_ZonoePatchShow'
          nm -gU "$out" | grep '_ZonoePatchHide'
          nm -gU "$out" | grep '_ZonoePatchIsVisible'
          nm -gU "$out" | grep '_ZonoePatchDeveloperAuthorized'
          nm -gU "$out" | grep 'ZNRuntimePatchExecutor'
          nm -gU "$out" | grep 'ZNExecutablePageProbe'
          nm -gU "$out" | grep 'ZNPatchRuntimeValidator'
          nm -u "$out" | grep '_mprotect'
          strings "$out" > /tmp/zonoe_v043_strings.txt
          grep -q '0.4.0-runtime-foundation' /tmp/zonoe_v043_strings.txt
          grep -q 'runtime validation installed' /tmp/zonoe_v043_strings.txt
          grep -q 'Live Original' /tmp/zonoe_v043_strings.txt
          grep -q 'Runtime Patch PASS' /tmp/zonoe_v043_strings.txt
          grep -q 'No JIT' /tmp/zonoe_v043_strings.txt
          grep -q 'il2cpp_domain_get' /tmp/zonoe_v043_strings.txt
          ! grep -q 'LocalTicketV2 transport installed' /tmp/zonoe_v043_strings.txt
          ! grep -q 'zonoe://device-auth' /tmp/zonoe_v043_strings.txt
          ! grep -q 'ZonoeHostGetUDID' /tmp/zonoe_v043_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoePatch-v0.4.3-RuntimeValidation
          path: |
            iosruntimepatchmenu/dist-v043/ZonoePatch_v0.4.3_RuntimeValidation.dylib
            iosruntimepatchmenu/dist-v043/SHA256.txt
          if-no-files-found: error

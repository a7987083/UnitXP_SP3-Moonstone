name: Build JSONCapture v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.1
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-json-capture-v0.1.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify JSONCapture v0.1
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/JSONCapture_v0.1_HFAMap187.dylib"
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          otool -L "$out"
          strings "$out" | grep -q "JSONCapture v0.1"
          test -s "$out"
          shasum -a 256 "$out" | tee dist/SHA256.txt
          ls -lh "$out" dist/SHA256.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: JSONCapture-v0.1-HFAMap187
          path: |
            jsoncapture/dist/JSONCapture_v0.1_HFAMap187.dylib
            jsoncapture/dist/SHA256.txt
          if-no-files-found: error

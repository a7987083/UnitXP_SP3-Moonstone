name: HFAMapUniversal v1.9.8 StaticNativeHookRecovery

on:
  push:
    branches:
      - feature/login-ip-tracer-dylib-v2-hfamap187-v198
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v189_patch.py'
      - '.github/scripts/hfamap_v192_patch.py'
      - '.github/scripts/hfamap_v193_patch.py'
      - '.github/scripts/hfamap_v194_patch.py'
      - '.github/scripts/hfamap_v195_patch.py'
      - '.github/scripts/hfamap_v196_patch.py'
      - '.github/scripts/hfamap_v197_patch.py'
      - '.github/scripts/hfamap_v198_patch.py'
      - '.github/workflows/theos-hfamap-v198.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Apply v1.9.8 StaticNativeHookRecovery
        run: |
          python3 .github/scripts/hfamap_v189_patch.py
          python3 .github/scripts/hfamap_v192_patch.py
          python3 .github/scripts/hfamap_v193_patch.py
          python3 .github/scripts/hfamap_v194_patch.py
          python3 .github/scripts/hfamap_v195_patch.py
          python3 .github/scripts/hfamap_v196_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapPatchExecutionTrace.m')
          s=p.read_text()
          old='''        snprintf(definition->type, sizeof(definition->type), "%s", type);\n        HFAResolveDynamicRegistrationCandidates(identifier, type);\n        return;\n'''
          new='''        snprintf(definition->type, sizeof(definition->type), "%s", type);\n        return;\n'''
          if s.count(old)!=1: raise SystemExit(f'normalize feature type expected 1, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 .github/scripts/hfamap_v197_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapPatchExecutionTrace.m')
          s=p.read_text()
          old='''        snprintf(definition->type, sizeof(definition->type), "%s", type);\n        if (strcmp(type, "customSwitch") == 0)\n            HFAAssociateNativeHookWithCustomSwitch(identifier);\n        return;\n'''
          new='''        snprintf(definition->type, sizeof(definition->type), "%s", type);\n        HFAResolveDynamicRegistrationCandidates(identifier, type);\n        if (strcmp(type, "customSwitch") == 0)\n            HFAAssociateNativeHookWithCustomSwitch(identifier);\n        return;\n'''
          if s.count(old)!=1: raise SystemExit(f'restore feature type expected 1, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapPatchExecutionTrace.m')
          s=p.read_text()
          old='''__attribute__((constructor)) static void HFAInit(void) {\n    HFALog("[HFALearn v1.9.6 CustomSwitchBuiltinDispatchProbe] loaded\\n");\n    HFAInstallDynamicRegistrationHooks();\n}\n'''
          new='''__attribute__((constructor)) static void HFAInit(void) {\n    HFALog("[HFALearn v1.9.6 CustomSwitchBuiltinDispatchProbe] loaded\\n");\n}\n'''
          if s.count(old)!=1: raise SystemExit(f'normalize constructor expected 1, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 .github/scripts/hfamap_v197_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hfamap/src/HFAMapPatchExecutionTrace.m')
          s=p.read_text()
          old='''__attribute__((constructor)) static void HFAInit(void) {\n    HFALog("[HFALearn v1.9.7 CustomSwitchNativeHookProbe] loaded\\n");\n    _dyld_register_func_for_add_image(HFANativeImageAdded);\n}\n'''
          new='''__attribute__((constructor)) static void HFAInit(void) {\n    HFALog("[HFALearn v1.9.7 CustomSwitchNativeHookProbe] loaded\\n");\n    _dyld_register_func_for_add_image(HFANativeImageAdded);\n    HFAInstallDynamicRegistrationHooks();\n}\n'''
          if s.count(old)!=1: raise SystemExit(f'restore constructor expected 1, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 .github/scripts/hfamap_v198_patch.py
          git diff --check -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m
          git diff -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m

      - name: Build and verify HFAMapUniversal v1.9.8
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.9.8_StaticNativeHookRecovery.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.9.8.txt
          strings "$out" | grep -q "HFALearn v1.9.8 StaticNativeHookRecovery"
          strings "$out" | grep -q "HFALearn UI v1.9.8 StaticNativeHookRecovery"
          strings "$out" | grep -q "\[CUSTOM-STATIC-NATIVE-WRAPPER\]"
          strings "$out" | grep -q "\[CUSTOM-STATIC-NATIVE-HOOK\]"
          strings "$out" | grep -q "\[CUSTOM-STATIC-NATIVE-SCAN\]"
          strings "$out" | grep -q "\[CUSTOM-NATIVE-HOOK-ASSOC\]"
          strings "$out" | grep -q "\[CUSTOM-NATIVE-HOOK-MAPPING\]"
          strings "$out" | grep -q "\[CUSTOM-BUILTIN-DISPATCH\]"
          strings "$out" | grep -q "\[CUSTOM-ACTION-RUNTIME\]"
          strings "$out" | grep -q "\[FULL-MAPPING\]"
          strings "$out" | grep -q "\[PACKAGE-EXPORT\]"
          ls -lh "$out"

      - name: Publish raw dylib
        run: |
          git checkout -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hfamap/dist/HFAMapUniversal_v1.9.8_StaticNativeHookRecovery.dylib hfamap/dist/SHA256_v1.9.8.txt
          git commit -m "Publish HFAMapUniversal v1.9.8 dylib [skip ci]" || exit 0
          git push origin HEAD:feature/login-ip-tracer-dylib-v2-hfamap187-v198

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.9.8-StaticNativeHookRecovery
          path: |
            hfamap/dist/HFAMapUniversal_v1.9.8_StaticNativeHookRecovery.dylib
            hfamap/dist/SHA256_v1.9.8.txt
          if-no-files-found: error

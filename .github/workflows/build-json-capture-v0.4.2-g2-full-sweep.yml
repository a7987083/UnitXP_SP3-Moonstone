name: Build JSONCapture v0.4.2 g2 Full Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - feature/json-capture-v0.4.2-g2-full-sweep
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-json-capture-v0.4.2-g2-full-sweep.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify full-sweep source contract
        shell: bash
        run: |
          set -euxo pipefail
          src=jsoncapture/src/GenericFullSweep.m
          grep -Fq 'JSONCapture_FILES = src/GenericFullSweep.m src/Lua53Analyzer.m' jsoncapture/Makefile
          grep -Fq 'JSONCapture Generic Full Sweep v0.4.2-g2' "$src"
          grep -Fq 'artificial_batch_limits' "$src"
          grep -Fq 'LoadFromFile' "$src"
          grep -Fq 'UnityFS' "$src"
          grep -Fq 'runtime-loaded' "$src"
          grep -Fq 'disk:' "$src"
          grep -Fq 'tolua_loadbuffer' "$src"
          grep -Fq 'luaL_loadbufferx' "$src"
          grep -Fq 'FindObjectsOfTypeAll' "$src"
          grep -Fq 'GetAllAssetNames' "$src"
          grep -Fq 'decoded_lua' "$src"
          grep -Fq 'FullSweep.status.json' "$src"
          if grep -Eq 'JCG2_BATCH_TEXTASSETS|JCG2_MAX_NAMES_PER_TICK|JCG2_INTERVAL_SECONDS|lua_pcall|lua_call' "$src"; then
            echo 'forbidden batch/execute limiter leaked into g2' >&2
            exit 1
          fi
          if grep -Eq '0x186A4B8|0x186FA64|RVA_CUSTOM_DECRYPT|AesHelper.CustomDecrypt' "$src" jsoncapture/Makefile; then
            echo 'old game-specific fixed RVA leaked into g2' >&2
            exit 1
          fi

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify g2 dylib
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-g2
          out="dist-g2/JSONCapture_v0.4.2-g2_FullSweep_ToLua535.dylib"
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out"
          otool -L "$out"
          strings "$out" > dist-g2/strings.txt
          grep -Fq 'JSONCapture Generic Full Sweep v0.4.2-g2' dist-g2/strings.txt
          grep -Fq 'full-disk+runtime' dist-g2/strings.txt
          grep -Fq 'UnityFS' dist-g2/strings.txt
          grep -Fq 'LoadFromFile' dist-g2/strings.txt
          grep -Fq 'FullSweep.status.json' dist-g2/strings.txt
          grep -Fq 'manifest.jsonl' dist-g2/strings.txt
          if grep -Eq 'AesHelper.CustomDecrypt|0x186A4B8|0x186FA64' dist-g2/strings.txt; then
            echo 'game-specific decrypt code present in g2 binary' >&2
            exit 1
          fi
          shasum -a 256 "$out" | tee dist-g2/SHA256.txt

      - name: Package mobile release
        run: |
          set -euxo pipefail
          cd jsoncapture/dist-g2
          cat > README.txt <<'EOF'
          JSONCapture v0.4.2-g2 Full Sweep
          Target: Unity 2019.4 / IL2CPP / ToLua / Lua 5.3.5
          - No 5-second / 100-name / 10-TextAsset processing limits.
          - Full sweep of every newly discovered loaded AssetBundle.
          - Recursively discovers UnityFS/UnityRaw/UnityWeb files under app/Documents/Library.
          - Newly downloaded or modified Bundle files are automatically queued and processed.
          - Saves raw TextAssets, decoded Lua, JSON, loader captures and Lua53 analysis.
          - Lua chunks are load/compile-only; no lua_pcall/lua_call execution.
          - Output: Documents/JSONCapture/FullSweep/
          EOF
          zip -9 JSONCapture_v0.4.2-g2_FullSweep_ToLua535.zip JSONCapture_v0.4.2-g2_FullSweep_ToLua535.dylib SHA256.txt README.txt
          shasum -a 256 JSONCapture_v0.4.2-g2_FullSweep_ToLua535.zip | tee ZIP_SHA256.txt

      - name: Upload mobile build output
        uses: actions/upload-artifact@v7
        with:
          name: JSONCapture-v0.4.2-g2-FullSweep-ToLua535
          path: |
            jsoncapture/dist-g2/JSONCapture_v0.4.2-g2_FullSweep_ToLua535.dylib
            jsoncapture/dist-g2/SHA256.txt
            jsoncapture/dist-g2/JSONCapture_v0.4.2-g2_FullSweep_ToLua535.zip
            jsoncapture/dist-g2/ZIP_SHA256.txt
          if-no-files-found: error

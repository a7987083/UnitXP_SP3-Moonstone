name: Verify M6.13.3 ZNUnifiedUI topology baseline

on:
  push:
    branches:
      - refactor/m6.13.3-znunifiedui-audit-v1
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen UI/swizzle topology
        run: |
          set -euo pipefail
          mkdir -p /tmp/znui-audit
          python3 iosruntimepatchmenu/tests/znunifiedui_topology_audit.py \
            --report /tmp/znui-audit/ZNUnifiedUI_topology_report.json
      - name: Verify extracted modules are byte-identical to baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          baseline = subprocess.check_output([
              "git","show",
              "ceabd64e74898a50d329c3dec168f07c87d6c96e:iosruntimepatchmenu/src/ZNUnifiedUI.mm"
          ]).decode("utf-8")
          modules = [
              "ZNRangeControl.mm",
              "ZNM55StaticTypedBinding.mm",
              "ZNM56StaticValueCellBinding.mm",
          ]
          expected_unified = baseline
          for name in modules:
              begin = f"#pragma mark - BEGIN {name}"
              end = f"#pragma mark - END {name}"
              a = expected_unified.index(begin)
              b0 = expected_unified.index(end, a)
              b = expected_unified.find("\n", b0)
              b = len(expected_unified) if b < 0 else b + 1
              expected_module = expected_unified[a:b]
              current_module = pathlib.Path("iosruntimepatchmenu/src", name).read_text()
              assert current_module == expected_module, f"{name} extraction changed bytes"
              expected_unified = expected_unified[:a] + expected_unified[b:]
          current_unified = pathlib.Path("iosruntimepatchmenu/src/ZNUnifiedUI.mm").read_text()
          assert current_unified == expected_unified, "ZNUnifiedUI contains changes beyond exact whitelisted extractions"
          print("PASS: exact source extraction equivalence for", ", ".join(modules))
          PY
      - name: Verify stable Runtime/Native engines are untouched
        run: |
          set -euo pipefail
          git diff --exit-code ceabd64e74898a50d329c3dec168f07c87d6c96e -- \
            iosruntimepatchmenu/src/ZNNativeHookRuntime.mm \
            iosruntimepatchmenu/src/ZNNativeHookScheduler.mm \
            iosruntimepatchmenu/src/ZNIL2CPPInvokeEngine.mm \
            iosruntimepatchmenu/src/ZNM47MultiArgInvoke.mm
      - name: Upload topology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6.13.3-znunifiedui-topology-baseline
          path: /tmp/znui-audit/ZNUnifiedUI_topology_report.json
          if-no-files-found: warn

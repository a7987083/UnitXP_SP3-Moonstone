name: Build MoonMarker Safety Creature

on:
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - '.github/workflows/build-moonmarker-safety-creature.yml'
      - 'slim/safety-creature/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact tested baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8885426844/zip" \
            -o exact-source.zip
          unzip -q exact-source.zip -d exact-source
          echo 'cbb7faf8d18006f68ef8bc1538daaaf2d627b365fc85bb58481c488c2f9aace9  exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz' | sha256sum -c -
          tar -xJf exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz
          rm -rf source-export/native/.git
          grep -Fq '## Version: 0.8.1-compat-cleanup' source-export/plugin/MoonMarker.toc
          cp -a source-export baseline
          cp -a source-export target

      - name: Apply audited patch
        run: |
          set -euxo pipefail
          cat slim/safety-creature/safety-creature.patch.gz.b64.part00 \
              slim/safety-creature/safety-creature.patch.gz.b64.part01 \
              slim/safety-creature/safety-creature.patch.gz.b64.part02 \
              slim/safety-creature/safety-creature.patch.gz.b64.part03 \
              slim/safety-creature/safety-creature.patch.gz.b64.part04 \
            | base64 -d > safety-creature.patch.gz
          echo 'c32402d08e6471fd8a9405d8427dd1d08f480afb97920323caeb71ba38f900e3  safety-creature.patch.gz' | sha256sum -c -
          gzip -dc safety-creature.patch.gz > safety-creature.patch
          echo 'da4a565b61fb0a293399f75e11409be9c9b2004d75487bbcc84789b62cccace9  safety-creature.patch' | sha256sum -c -
          patch --batch -p1 -d target < safety-creature.patch

          cat > expected.txt <<'EOF'
          native/Makefile
          native/MoonMarkerCreatureCatalog.cpp
          native/MoonMarkerCreatureCatalog.h
          native/MoonMarkerGuildAuth.cpp
          native/MoonMarkerM2Scanner.cpp
          native/MoonMarkerM2Scanner.h
          native/MoonMarkerRuntimeGuard.cpp
          native/MoonMarkerRuntimeGuard.h
          native/dllmain.cpp
          native/moonMarker.cpp
          native/nativeM2Test.cpp
          plugin/AdvancedEditorFramework.lua
          plugin/CurrentMarkers.lua
          plugin/FuBar.lua
          plugin/GuildAdvanced.lua
          plugin/MainModels.lua
          plugin/ModelLibrary.lua
          plugin/MoonMarker.lua
          plugin/MoonMarker.toc
          plugin/Presets.lua
          plugin/QuickPresets.lua
          EOF
          sed -i 's/^          //' expected.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def inv(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file(): out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=inv('baseline'),inv('target')
          changed=sorted(x for x in set(a)|set(b) if a.get(x)!=b.get(x))
          Path('actual.txt').write_text('\n'.join(changed)+'\n')
          PY
          sort -o expected.txt expected.txt
          diff -u expected.txt actual.txt

      - name: Protect current behavior and verify features
        run: |
          set -euxo pipefail
          cmp baseline/native/MoonMarkerMainModel.cpp target/native/MoonMarkerMainModel.cpp
          cmp baseline/native/MoonMarkerMainModel.h target/native/MoonMarkerMainModel.h
          cmp baseline/native/moonMarker.h target/native/moonMarker.h
          cmp baseline/native/nativeM2Test.h target/native/nativeM2Test.h

          diff -u baseline/native/Makefile target/native/Makefile > makefile.diff || true
          grep -Fq '+            MoonMarkerRuntimeGuard.cpp \' makefile.diff
          grep -Fq '+            MoonMarkerCreatureCatalog.cpp \' makefile.diff
          ! grep -Eq '^-[^-]' makefile.diff

          grep -Fq 'edit_CWorld_Intersect_init()' target/native/dllmain.cpp
          grep -Fq 'MH_CreateHook(p_UnitXP' target/native/dllmain.cpp
          grep -Fq 'MH_EnableHook(MH_ALL_HOOKS)' target/native/dllmain.cpp
          grep -Fq 'moonMarkerRuntimeGuard::initialize()' target/native/dllmain.cpp
          grep -Fq 'MoonMarker.Runtime.Status' target/native/dllmain.cpp
          grep -Fq 'std::uint32_t nonce' target/native/MoonMarkerMainModel.cpp
          grep -Fq 'rememberPacket' target/native/MoonMarkerMainModel.cpp
          grep -Fq 'MoonMarker.Advanced.Main.Validate' target/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'originalIsPartyLeader' target/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'kExpectedImageBase = 0x00400000u' target/native/MoonMarkerRuntimeGuard.cpp
          grep -Fq 'kExpectedTimeDateStamp = 0x4510B6DBu' target/native/MoonMarkerRuntimeGuard.cpp
          grep -Fq 'FORCED_UNSUPPORTED_TEST_MODE' target/native/MoonMarkerRuntimeGuard.cpp
          grep -Fq 'moonMarkerRuntimeGuard::enabled()' target/native/moonMarker.cpp
          grep -Fq 'moonMarkerRuntimeGuard::enabled()' target/native/nativeM2Test.cpp
          grep -Fq 'UNSUPPORTED_CLIENT' target/native/MoonMarkerM2Scanner.cpp

          test "$(grep -Rho 'DEFAULT_CHAT_FRAME:AddMessage' target/plugin | wc -l)" = '1'
          grep -Fq '当前 WoW 客户端版本不受支持，MoonMarker Hook 未安装。' target/plugin/MoonMarker.lua
          grep -Fq '当前 WoW 客户端版本不受支持 · MoonMarker 已安全停用' target/plugin/MoonMarker.lua

          grep -Fq 'DBFilesClient\\CreatureModelData.dbc' target/native/MoonMarkerCreatureCatalog.cpp
          grep -Fq 'DBFilesClient\\CreatureDisplayInfo.dbc' target/native/MoonMarkerCreatureCatalog.cpp
          grep -Fq 'MoonMarker.Advanced.Creature.Load' target/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'MoonMarker.Advanced.Creature.Count' target/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'MoonMarker.Advanced.Creature.Get' target/native/MoonMarkerGuildAuth.cpp
          grep -Fq 'PlayerModel' target/plugin/ModelLibrary.lua
          grep -Fq 'SetDisplayInfo' target/plugin/ModelLibrary.lua
          grep -Fq 'Creature Display ID 与皮肤' target/plugin/ModelLibrary.lua
          grep -Fq '## Version: 0.9.0-safety-creature' target/plugin/MoonMarker.toc

      - name: Validate Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          for tree in baseline/plugin target/plugin; do
            while IFS= read -r f; do luac5.1 -p "$f"; done < <(find "$tree" -type f -name '*.lua' | sort)
          done

      - name: Install x86 toolchain
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK
          curl -L --fail --retry 3 'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile baseline, normal and forced fallback
        run: |
          set -euxo pipefail
          cp -a target forced
          sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DMOONMARKER_FORCE_UNSUPPORTED|' forced/native/Makefile
          for tree in baseline/native target/native forced/native; do
            ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" "$tree/xwinSDK"
            ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" "$tree/d3d9x_headers"
            sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' "$tree/Makefile"
            make -C "$tree" clean
            make -C "$tree" -j2
            file "$tree/UnitXP_SP3.dll" | tee "$tree/DLL-FILE-TYPE.txt"
            grep -q 'PE32 executable.*Intel 80386' "$tree/DLL-FILE-TYPE.txt"
          done
          stat -c '%s' baseline/native/UnitXP_SP3.dll > baseline-size.txt
          stat -c '%s' target/native/UnitXP_SP3.dll > target-size.txt
          stat -c '%s' forced/native/UnitXP_SP3.dll > forced-size.txt
          test "$(cat baseline-size.txt)" = '606208'

      - name: Package test build
        run: |
          set -euxo pipefail
          b=$(cat baseline-size.txt); n=$(cat target-size.txt); f=$(cat forced-size.txt)
          mkdir -p release/Interface/AddOns/MoonMarker release/Audit
          cp target/native/UnitXP_SP3.dll release/
          cp forced/native/UnitXP_SP3.dll release/UnitXP_SP3-ForcedUnsupported-Test.dll
          cp -a target/plugin/. release/Interface/AddOns/MoonMarker/
          cp slim/safety-creature/MANIFEST.txt release/
          cp safety-creature.patch expected.txt actual.txt release/Audit/
          sha256sum release/UnitXP_SP3.dll release/UnitXP_SP3-ForcedUnsupported-Test.dll > release/DLL-SHA256.txt
          file release/UnitXP_SP3.dll release/UnitXP_SP3-ForcedUnsupported-Test.dll > release/DLL-FILE-TYPE.txt
          cat > release/SAFETY-CREATURE-RESULT.txt <<EOF
          Compatibility-cleanup baseline DLL: ${b} bytes
          Safety + Creature normal DLL: ${n} bytes
          Forced-unsupported test DLL: ${f} bytes
          Change versus baseline: $((n-b)) bytes
          Original full MoonMarker A/B baseline: 636928 bytes
          Change versus original full: $((n-636928)) bytes
          Clean v89 baseline: 491008 bytes
          Increase over clean v89: $((n-491008)) bytes
          Hook/client ABI guard: added
          Unsupported client skips MoonMarker hook/native ABI: yes
          Original UnitXP hooks retained: yes
          Ordinary beam-test chat output: disabled
          Unsupported-client warning: retained once per login
          Creature DisplayID/skin DBC catalog: added
          Creature PlayerModel skin viewer: added
          Native world replaceable-texture binding: not implemented
          Lua 5.1 validation: passed
          Normal PE32 x86 compilation: passed
          Forced-unsupported PE32 x86 compilation: passed
          In-game runtime test: not performed
          EOF
          (cd release && zip -9 -r ../MoonMarker-Safety-Creature-x86.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Safety-Creature-x86
          path: |
            release
            MoonMarker-Safety-Creature-x86.zip
          if-no-files-found: error

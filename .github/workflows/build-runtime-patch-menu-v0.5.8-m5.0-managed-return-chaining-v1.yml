name: Build Runtime Patch Menu v0.5.8 M5.0 Managed Return Chaining V1

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-m5.0-managed-return-chaining-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNM48ReturnCapture.mm
          test -f iosruntimepatchmenu/src/ZNM49GenericInvokeEditableArgs.mm
          test -f iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q 'ZNInstallM50ManagedReturnChainingDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'src/ZNM50ManagedReturnChaining.mm' iosruntimepatchmenu/Makefile
          grep -q 'managed reference' iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q 'il2cpp_gchandle_new' iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q 'znm44_validateInstanceAddress' iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q 'previousKeepAlive' iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q 'managedReturnChained' iosruntimepatchmenu/src/ZNM50ManagedReturnChaining.mm
          grep -q '0.5.8 · M5.0' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'Managed-reference Return Chaining + Generic Invoke' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZN_RUNTIME_ACTION_MAX_ARGUMENTS 8u' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
          file build/iphoneos/arm64/libdobby.a

      - name: Build M5.0
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m5.0
          cp .theos/obj/ZonoePatchV03.dylib dist-m5.0/ZonoPatch_v0.5.8_M5.0_Managed_Return_Chaining_V1.dylib
          shasum -a 256 dist-m5.0/ZonoPatch_v0.5.8_M5.0_Managed_Return_Chaining_V1.dylib | tee dist-m5.0/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m5.0/ZonoPatch_v0.5.8_M5.0_Managed_Return_Chaining_V1.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m50_load_commands.txt
          strings -a "$out" > /tmp/zono_m50_strings.txt
          grep -q '\[m4.8-return\]' /tmp/zono_m50_strings.txt
          grep -q '\[m4.9-generic\]' /tmp/zono_m50_strings.txt
          grep -q '\[m5.0-chain\]' /tmp/zono_m50_strings.txt
          grep -q 'Managed-reference Return Chaining + Generic Invoke' /tmp/zono_m50_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m50_load_commands.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M5.0-Managed-Return-Chaining-V1
          path: |
            iosruntimepatchmenu/dist-m5.0/ZonoPatch_v0.5.8_M5.0_Managed_Return_Chaining_V1.dylib
            iosruntimepatchmenu/dist-m5.0/SHA256.txt
          if-no-files-found: error

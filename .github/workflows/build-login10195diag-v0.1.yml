name: Build Login10195Diag v0.1

on:
  push:
    branches:
      - feature/login10195diag-v0.1
    paths:
      - 'login10195diag_v0.1/**'
      - '.github/workflows/build-login10195diag-v0.1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git login10195diag_v0.1/third_party/Dobby

      - name: Configure iOS arm64
        run: |
          cmake -S login10195diag_v0.1 -B build-login10195diag \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-login10195diag --config Release --target Login10195Diag --parallel 4

      - name: Locate and verify dylib
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="$(find build-login10195diag -type f -name 'Login10195Diag_v0.1.dylib' | head -1)"
          test -n "$DYLIB"
          echo "DYLIB=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"
          file "$DYLIB" | grep -q 'arm64'
          otool -hv "$DYLIB"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/Login10195Diag-v0.1
          cp "$DYLIB" dist/Login10195Diag-v0.1/
          cp login10195diag_v0.1/README.md dist/Login10195Diag-v0.1/
          cp login10195diag_v0.1/src/Login10195Diag.cpp dist/Login10195Diag-v0.1/
          cp login10195diag_v0.1/CMakeLists.txt dist/Login10195Diag-v0.1/
          shasum -a 256 "$DYLIB" > dist/Login10195Diag-v0.1/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent dist/Login10195Diag-v0.1 dist/Login10195Diag-v0.1-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Login10195Diag-v0.1-arm64
          path: |
            dist/Login10195Diag-v0.1-arm64.zip
            dist/Login10195Diag-v0.1/Login10195Diag_v0.1.dylib
            dist/Login10195Diag-v0.1/SHA256.txt
          if-no-files-found: error

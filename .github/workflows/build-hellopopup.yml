name: Build HelloPopup dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'HelloDylib/**'
      - '.github/workflows/build-hellopopup.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        working-directory: HelloDylib
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HelloPopup-build
          path: |
            HelloDylib/packages/*

name: M5.10.7 Legacy Mock Slider Cleanup

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy Foundation/mock sliders
        run: python3 iosruntimepatchmenu/tools/m5107_remove_legacy_mock_sliders.py
      - name: Commit deterministic cleanup
        run: |
          set -euxo pipefail
          if git diff --quiet --exit-code; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm iosruntimepatchmenu/src/ZNPatchCore.mm
          git commit -m "cleanup(offset): remove legacy Foundation mock sliders"
          git push origin HEAD:feature/m5.10-offset-core-rebuild-v1

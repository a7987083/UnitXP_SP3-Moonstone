name: HFAMapUniversal v1.4.6.4 UniversalMapping

on:
  push:
    branches:
      - build/hfamap-v1.4.5-20260901
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify HFAMapUniversal v1.4.6.4
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.4.6.4_UniversalMapping.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out"
          strings "$out" | grep -q "HFALearn v1.4.6.4 UniversalMapping"
          strings "$out" | grep -q "\[MAPPING\]"
          strings "$out" | grep -q "\[MAP-DECRYPT\]"
          strings "$out" | grep -q "\[MAP-DECRYPT-SKIP\]"
          ls -lh "$out"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.4.6.4-UniversalMapping
          path: hfamap/dist/HFAMapUniversal_v1.4.6.4_UniversalMapping.dylib
          if-no-files-found: error

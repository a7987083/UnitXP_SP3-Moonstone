name: HFAMapUniversal v1.7.0 Key2Bootstrap

on:
  push:
    branches:
      - build/hfamap-v1.4.5-20260901
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify HFAMapUniversal v1.7.0
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.7.0_Key2Bootstrap.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out"
          strings "$out" | grep -q "HFALearn v1.7.0 Key2Bootstrap"
          strings "$out" | grep -q "\[KEY2-BOOTSTRAP\]"
          strings "$out" | grep -q "\[KEY2-RETRY\]"
          strings "$out" | grep -q "\[AUTO-TARGET-BEGIN\]"
          strings "$out" | grep -q "\[AUTO-TARGET-END\]"
          strings "$out" | grep -q "\[AUTO-TRAVERSAL-END\]"
          strings "$out" | grep -q "\[FULL-SCAN-BEGIN\]"
          strings "$out" | grep -q "\[FULL-MAPPING\]"
          strings "$out" | grep -q "\[FULL-SCAN-END\]"
          strings "$out" | grep -q "\[AUTO-SCAN\]"
          strings "$out" | grep -q "\[AUTO-TARGET\]"
          strings "$out" | grep -q "\[GROUP-MAPPING\]"
          strings "$out" | grep -q "\[CUSTOM-BLOCK\]"
          strings "$out" | grep -q "\[CUSTOM-INVOKE\]"
          strings "$out" | grep -q "\[SECRET02\]"
          strings "$out" | grep -q "\[ACTION-IMP\]"
          strings "$out" | grep -q "\[CUSTOM-QUERY-INSTALL\]"
          strings "$out" | grep -q "\[CUSTOM-STATE\]"
          strings "$out" | grep -q "\[CUSTOM-HOOK-TARGET\]"
          strings "$out" | grep -q "\[CUSTOM-TRAMPOLINE\]"
          strings "$out" | grep -q "\[MAPPING\]"
          strings "$out" | grep -q "\[MAP-DECRYPT\]"
          strings "$out" | grep -q "\[MAP-DECRYPT-SKIP\]"
          strings "$out" | grep -q "HFAMap_Mapping.log"
          ls -lh "$out"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.7.0-Key2Bootstrap
          path: hfamap/dist/HFAMapUniversal_v1.7.0_Key2Bootstrap.dylib
          if-no-files-found: error

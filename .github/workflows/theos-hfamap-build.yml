name: HFAMapUniversal v1.8.8 GenericCustomSwitchProbe

on:
  push:
    branches:
      - feature/login-ip-tracer-dylib-v2-hfamap187
    paths:
      - 'hfamap/**'
      - '.github/workflows/theos-hfamap-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Apply v1.8.8 GenericCustomSwitchProbe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hfamap/src/HFAMapPatchExecutionTrace.m')
          s = p.read_text()
          replacements = [
              (
                  '    char identifier[16];\n',
                  '    char identifier[96];\n',
              ),
              (
                  '''static HFAFeatureDefinition *HFAFeatureDefinitionForKey(const char *key) {
    if (!key || !*key) return NULL;
    for (unsigned i = 0; i < gFeatureDefinitionCount; i++)
        if (strcmp(gFeatureDefinitions[i].key, key) == 0)
            return &gFeatureDefinitions[i];
    return NULL;
}
''',
                  '''static HFAFeatureDefinition *HFAFeatureDefinitionForKey(const char *key) {
    if (!key || !*key) return NULL;
    for (unsigned i = 0; i < gFeatureDefinitionCount; i++)
        if (strcmp(gFeatureDefinitions[i].key, key) == 0)
            return &gFeatureDefinitions[i];
    return NULL;
}

static int HFAKnownFeatureIdentifier(const char *identifier) {
    if (!identifier || !*identifier) return 0;
    for (unsigned i = 0; i < gFeatureDefinitionCount; i++) {
        if (strcmp(gFeatureDefinitions[i].identifier, identifier) == 0)
            return 1;
    }
    return 0;
}
''',
              ),
              (
                  '''void HFARegisterCustomBlock(id value, const char *identifier) {
    if (!value || !identifier ||
        (strcmp(identifier, "Fuel") != 0 && strcmp(identifier, "Boost") != 0))
        return;
''',
                  '''void HFARegisterCustomBlock(id value, const char *identifier) {
    if (!value || !identifier || !HFAKnownFeatureIdentifier(identifier))
        return;
''',
              ),
              (
                  '''    char identifier[16] = {0};
    if (argument && [argument isKindOfClass:[NSString class]]) {
        const char *s = [(NSString *)argument UTF8String];
        if (s && (strcmp(s, "Fuel") == 0 || strcmp(s, "Boost") == 0))
            snprintf(identifier, sizeof(identifier), "%s", s);
    }
''',
                  '''    char identifier[96] = {0};
    if (argument && [argument isKindOfClass:[NSString class]]) {
        const char *s = [(NSString *)argument UTF8String];
        if (s && HFAKnownFeatureIdentifier(s))
            snprintf(identifier, sizeof(identifier), "%s", s);
    }
''',
              ),
              (
                  '''    if (!identifier[0]) return result;

    HFAStateSite *site = HFAStateSiteFor(caller, _cmd, identifier);
''',
                  '''    if (!identifier[0]) return result;

    HFALog("[CUSTOM-IDENTIFIER] identifier=%s source=state-query\\n", identifier);
    HFAStateSite *site = HFAStateSiteFor(caller, _cmd, identifier);
''',
              ),
              (
                  '[HFALearn v1.8.7 KeyRegisterProbe] loaded',
                  '[HFALearn v1.8.8 GenericCustomSwitchProbe] loaded',
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected source fragment not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check -- hfamap/src/HFAMapPatchExecutionTrace.m
          git diff -- hfamap/src/HFAMapPatchExecutionTrace.m

      - name: Build and verify HFAMapUniversal v1.8.8
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.8.8_GenericCustomSwitchProbe.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.8.8.txt
          strings "$out" | grep -q "HFALearn v1.8.8 GenericCustomSwitchProbe"
          strings "$out" | grep -q "\[CUSTOM-IDENTIFIER\]"
          strings "$out" | grep -q "\[KEY-REGISTER-HOOK\]"
          strings "$out" | grep -q "\[KEY-REGISTER-BEGIN\]"
          strings "$out" | grep -q "\[KEY-REGISTER-END\]"
          strings "$out" | grep -q "\[MODULE-NORMALIZE\]"
          strings "$out" | grep -q "\[PACKAGE-EXPORT\]"
          strings "$out" | grep -q "\[AUTO-CONTROL-TARGET\]"
          strings "$out" | grep -q "\[AUTO-STAGE\]"
          strings "$out" | grep -q "\[KEY2-PATH-BEGIN\]"
          strings "$out" | grep -q "\[KEY2-XREF\]"
          strings "$out" | grep -q "\[KEY2-PATH-END\]"
          strings "$out" | grep -q "\[AUTO-TARGET-BEGIN\]"
          strings "$out" | grep -q "\[AUTO-TARGET-END\]"
          strings "$out" | grep -q "\[AUTO-TRAVERSAL-END\]"
          strings "$out" | grep -q "\[FULL-SCAN-BEGIN\]"
          strings "$out" | grep -q "\[FULL-MAPPING\]"
          strings "$out" | grep -q "\[FULL-SCAN-END\]"
          strings "$out" | grep -q "\[AUTO-SCAN\]"
          strings "$out" | grep -q "\[AUTO-TARGET\]"
          strings "$out" | grep -q "\[GROUP-MAPPING\]"
          strings "$out" | grep -q "\[CUSTOM-BLOCK\]"
          strings "$out" | grep -q "\[CUSTOM-INVOKE\]"
          strings "$out" | grep -q "\[SECRET02\]"
          strings "$out" | grep -q "\[ACTION-IMP\]"
          strings "$out" | grep -q "\[CUSTOM-QUERY-INSTALL\]"
          strings "$out" | grep -q "\[CUSTOM-STATE\]"
          strings "$out" | grep -q "\[CUSTOM-HOOK-TARGET\]"
          strings "$out" | grep -q "\[CUSTOM-TRAMPOLINE\]"
          strings "$out" | grep -q "\[MAPPING\]"
          strings "$out" | grep -q "\[MAP-DECRYPT\]"
          strings "$out" | grep -q "\[MAP-DECRYPT-SKIP\]"
          strings "$out" | grep -q "HFAMap_Mapping.log"
          ls -lh "$out"

      - name: Publish raw dylib
        run: |
          git checkout -- hfamap/src/HFAMapPatchExecutionTrace.m
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hfamap/dist/HFAMapUniversal_v1.8.8_GenericCustomSwitchProbe.dylib hfamap/dist/SHA256_v1.8.8.txt
          git commit -m "Publish HFAMapUniversal v1.8.8 dylib [skip ci]" || exit 0
          git push origin HEAD:feature/login-ip-tracer-dylib-v2-hfamap187

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.8.8-GenericCustomSwitchProbe
          path: |
            hfamap/dist/HFAMapUniversal_v1.8.8_GenericCustomSwitchProbe.dylib
            hfamap/dist/SHA256_v1.8.8.txt
          if-no-files-found: error

name: HFAMapUniversal v1.4.5.3 SecretIMPCallGraph

on:
  push:
    branches:
      - build/hfamap-v1.4.5-20260901
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build and verify HFAMapUniversal v1.4.5.3
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.4.5.3_SecretIMPCallGraph.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out"
          strings "$out" | grep -q "HFALearn v1.4.5.3 SecretIMPCallGraph"
          strings "$out" | grep -q "source=_methodDescription"
          if strings "$out" | grep -q "CG-CANDIDATE"; then exit 1; fi
          ls -lh "$out"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.4.5.3-SecretIMPCallGraph
          path: hfamap/dist/HFAMapUniversal_v1.4.5.3_SecretIMPCallGraph.dylib
          if-no-files-found: error

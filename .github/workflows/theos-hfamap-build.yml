name: HFAMapUniversal Theos Build

on:
  push:
    branches:
      - feature/ios-popup-rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git clang make perl

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal
        run: |
          cd hfamap
          make package FINALPACKAGE=1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-build
          path: |
            hfamap/packages/*.deb
            hfamap/**/*.dylib
          if-no-files-found: error

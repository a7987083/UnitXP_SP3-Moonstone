name: HFAMapUniversal v1.8.9 MenuFrameworkAnchorProbe

on:
  push:
    branches:
      - feature/login-ip-tracer-dylib-v2-hfamap187
    paths:
      - 'hfamap/**'
      - '.github/scripts/hfamap_v189_patch.py'
      - '.github/workflows/theos-hfamap-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Apply v1.8.9 MenuFrameworkAnchorProbe
        run: |
          python3 .github/scripts/hfamap_v189_patch.py
          git diff --check -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m
          git diff -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m

      - name: Build and verify HFAMapUniversal v1.8.9
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_v1.8.9_MenuFrameworkAnchorProbe.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_v1.8.9.txt
          strings "$out" | grep -q "HFALearn v1.8.9 MenuFrameworkAnchorProbe"
          strings "$out" | grep -q "HFALearn UI v1.8.9 MenuFrameworkAnchorProbe"
          strings "$out" | grep -q "Made by Laxus for iOSGods.com!"
          strings "$out" | grep -q "Made for iOSGods.com"
          strings "$out" | grep -q "\[FEATURE-SCHEMA\]"
          strings "$out" | grep -q "\[MENU-ANCHOR\]"
          strings "$out" | grep -q "\[MENU-ANCHOR-BLOCK\]"
          strings "$out" | grep -q "\[CUSTOM-IDENTIFIER\]"
          strings "$out" | grep -q "armed-customSwitch"
          strings "$out" | grep -q "\[KEY-REGISTER-HOOK\]"
          strings "$out" | grep -q "\[KEY-REGISTER-BEGIN\]"
          strings "$out" | grep -q "\[KEY-REGISTER-END\]"
          strings "$out" | grep -q "\[MODULE-NORMALIZE\]"
          strings "$out" | grep -q "\[PACKAGE-EXPORT\]"
          strings "$out" | grep -q "\[AUTO-CONTROL-TARGET\]"
          strings "$out" | grep -q "\[AUTO-STAGE\]"
          strings "$out" | grep -q "\[KEY2-PATH-BEGIN\]"
          strings "$out" | grep -q "\[KEY2-XREF\]"
          strings "$out" | grep -q "\[KEY2-PATH-END\]"
          strings "$out" | grep -q "\[AUTO-TARGET-BEGIN\]"
          strings "$out" | grep -q "\[AUTO-TARGET-END\]"
          strings "$out" | grep -q "\[AUTO-TRAVERSAL-END\]"
          strings "$out" | grep -q "\[FULL-SCAN-BEGIN\]"
          strings "$out" | grep -q "\[FULL-MAPPING\]"
          strings "$out" | grep -q "\[FULL-SCAN-END\]"
          strings "$out" | grep -q "\[AUTO-SCAN\]"
          strings "$out" | grep -q "\[AUTO-TARGET\]"
          strings "$out" | grep -q "\[GROUP-MAPPING\]"
          strings "$out" | grep -q "\[CUSTOM-BLOCK\]"
          strings "$out" | grep -q "\[CUSTOM-INVOKE\]"
          strings "$out" | grep -q "\[SECRET02\]"
          strings "$out" | grep -q "\[ACTION-IMP\]"
          strings "$out" | grep -q "\[CUSTOM-QUERY-INSTALL\]"
          strings "$out" | grep -q "\[CUSTOM-STATE\]"
          strings "$out" | grep -q "\[CUSTOM-HOOK-TARGET\]"
          strings "$out" | grep -q "\[CUSTOM-TRAMPOLINE\]"
          strings "$out" | grep -q "\[MAPPING\]"
          strings "$out" | grep -q "\[MAP-DECRYPT\]"
          strings "$out" | grep -q "\[MAP-DECRYPT-SKIP\]"
          strings "$out" | grep -q "HFAMap_Mapping.log"
          ls -lh "$out"

      - name: Publish raw dylib
        run: |
          git checkout -- hfamap/src/HFAMapPatchExecutionTrace.m hfamap/src/HFAMapLegacy.m
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hfamap/dist/HFAMapUniversal_v1.8.9_MenuFrameworkAnchorProbe.dylib hfamap/dist/SHA256_v1.8.9.txt
          git commit -m "Publish HFAMapUniversal v1.8.9 dylib [skip ci]" || exit 0
          git push origin HEAD:feature/login-ip-tracer-dylib-v2-hfamap187

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.8.9-MenuFrameworkAnchorProbe
          path: |
            hfamap/dist/HFAMapUniversal_v1.8.9_MenuFrameworkAnchorProbe.dylib
            hfamap/dist/SHA256_v1.8.9.txt
          if-no-files-found: error

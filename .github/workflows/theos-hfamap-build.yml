name: HFAMapUniversal Theos Build

on:
  push:
    branches:
      - main
      - v1.4.6-patch-object
      - v1.4.5-SecretFunctionTrace
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/HFAMapUniversal.dylib dist/HFAMapUniversal.dylib
          ls -lh dist/HFAMapUniversal.dylib

      - name: Package release
        run: |
          mkdir -p release
          cp hfamap/dist/HFAMapUniversal.dylib release/
          cd release
          zip -r HFAMapUniversal-build.zip HFAMapUniversal.dylib

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.4.6-build
          path: release/
          if-no-files-found: error

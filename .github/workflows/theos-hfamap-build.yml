name: HFAMapUniversal v1.4.4 Theos Build

on:
  push:
    branches:
      - build/hfamap-v1.4.4-20260901
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal v1.4.4
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/HFAMapUniversal.dylib dist/HFAMapUniversal.dylib
          file dist/HFAMapUniversal.dylib
          shasum -a 256 dist/HFAMapUniversal.dylib
          ls -lh dist/HFAMapUniversal.dylib

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-v1.4.4
          path: hfamap/dist/HFAMapUniversal.dylib
          if-no-files-found: error

name: HFAMapUniversal Theos Build

on:
  push:
    branches:
      - feature/ios-popup-rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build HFAMapUniversal
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/HFAMapUniversal.dylib dist/HFAMapUniversal.dylib
          ls -lh dist/HFAMapUniversal.dylib

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-build
          path: hfamap/dist/HFAMapUniversal.dylib
          if-no-files-found: error

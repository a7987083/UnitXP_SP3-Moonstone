name: Verify M6.13.1 Single Result Card + Direct/Hook

on:
  push:
    branches:
      - feature/m6.8.4-build-manifest-v1
      - feature/m6.8.6-permanent-hook-lifecycle-v1
      - feature/m6.9-prepared-native-hook-descriptor-v1
      - feature/m6.10-static-prepared-native-hook-v1
      - feature/m6.11-instant-menu-lazy-init-v1
      - feature/m6.12-capability-prewarm-activation-v1
      - feature/m6.13-direct-call-struct-codec-v1
      - feature/m6.13.1-single-result-card-v1
      - refactor/m6.13.3-znunifiedui-audit-v1
      - refactor/m6.13.8-owner-swizzle-topology-v1
      - fix/m6.13.4-arm64-relocation-widening-v1
      - fix/m6.13.5-direct-call-rva-identity-v1
      - fix/m6.13.6-full-json-export-import-v1
      - fix/m6.13.7-offset-hook-decoded-rva-v1
      - fix/m6.13.8-static-prepared-value-hook-v1
      - feature/m6.13.3-runtime-argument-marshalling-v1
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Single UI owner source contract
        run: |
          set -euxo pipefail
          sh iosruntimepatchmenu/tests/single_ui_owner_contract.sh

      - name: Verify M6.8.4 architecture contract
        run: |
          set -euxo pipefail
          grep -q '#define ZN_PRODUCT_VERSION @"0.6.8.4"' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q '#define ZN_MILESTONE_VERSION @"M6.8.4"' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'BuildManifest V1' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNBuildExecutorBuildWorkspace' iosruntimepatchmenu/src/ZNUnifiedUI.mm
          ! grep -q '\[ZNStaticBinaryBuilder buildWorkspace:ws' iosruntimepatchmenu/src/ZNUnifiedUI.mm
          test -f iosruntimepatchmenu/src/legacy/ZNLegacyStaticBinaryPipeline.mm
          test ! -e iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm

      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew update
          brew unlink openssl@1.1 || true
          if [ -L /opt/homebrew/bin/openssl ]; then rm -f /opt/homebrew/bin/openssl; fi
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
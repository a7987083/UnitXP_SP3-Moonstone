name: Build MoonMarker Guild Auth Phase 1

on:
  workflow_dispatch:
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - 'cleanroom/**'
      - '.github/workflows/build-eight-markers.yml'
  push:
    branches: ['agent/eight-colors-eight-icons']
    paths:
      - 'cleanroom/**'
      - '.github/workflows/build-eight-markers.yml'

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Decode clean-room bundle
        run: |
          set -euxo pipefail
          mkdir cleanroom_input
          cat cleanroom/bundle.part00 cleanroom/bundle.part01 cleanroom/bundle.part02 cleanroom/bundle.part03 | base64 -d > cleanroom_bundle.zip
          echo '077166868465beba39f5d8a87448190cb5892f9335289b3860a2c2396f5fd31a  cleanroom_bundle.zip' | sha256sum -c -
          unzip -q cleanroom_bundle.zip -d cleanroom_input
          test -f cleanroom_input/MoonMarker_Cleanroom.patch
          test -f cleanroom_input/addon/MoonMarker/MoonMarker.lua

      - name: Install Clang 19 and build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link
          clang-cl --version
          lld-link --version

      - name: Fetch exact UnitXP_SP3 v89 source
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = '3370011e396ccdbf4c9921f6cf2b005bed818b24'

      - name: Apply confirmed native white baseline
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/sceneBegin_sceneEnd.h upstream/Makefile
          sed -i '1s/^\xEF\xBB\xBF//' upstream/dllmain.cpp upstream/sceneBegin_sceneEnd.cpp upstream/sceneBegin_sceneEnd.h upstream/Makefile

          echo 'c51d0d4c70d010263618d5dcdd48bb11f80ad04ef02feb483bfc3c085ffcd02b  cleanroom_input/MoonMarker_Cleanroom.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom_input/MoonMarker_Cleanroom.patch
          echo 'f994d67b58824fc002a1735243f91226944fc60d3b8e500a1999e66dd33fd7a5  cleanroom/fix-lua-string.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom/fix-lua-string.patch
          echo '96f3f255313d80c70cd73b2a8317aba35516e3b46a064185af3352274f926ec8  cleanroom/present-hook.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom/present-hook.patch
          echo '05f54024fcc705954492c225734e8237b8c689637e6daded5a3ab99ab6b29fe5  cleanroom/fix-placement-projection.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom/fix-placement-projection.patch
          echo 'bbe682f9476a4c1b73eded98c1e904632714531b715508d4fe4d00c3fcfff91b  cleanroom/addon-status.patch' | sha256sum -c -
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/addon-status.patch

          echo 'e6011923b25aaaf0cd959c620c4d67c3bce087c45dde13bc3c77cf5754d8c046  cleanroom/native-m2-v2.patch' | sha256sum -c -
          echo '9961b924030e235bab91b49b53ccb266c16500e1f5c1329c477f9fa034e696f3  cleanroom/native-m2-v2/nativeM2Test.cpp' | sha256sum -c -
          echo 'a56840d2bbed52579b6d360d57a21d5050e3bb44a9f6488ac0c438ae6ccf708b  cleanroom/native-m2-v2/nativeM2Test.h' | sha256sum -c -
          cp cleanroom/native-m2-v2/nativeM2Test.cpp upstream/
          cp cleanroom/native-m2-v2/nativeM2Test.h upstream/
          patch --batch -p1 -d upstream < cleanroom/native-m2-v2.patch

          echo '9e49dd350183cf07f45727f0812f136efbc7806647b0a6f5cc9827f7ae60ebf6  cleanroom/native-white-v1.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom/native-white-v1.patch
          echo '503907ba0f4cc14c0bed10f645d951ba554072669bce160fe86ff390b4a5fde9  cleanroom/native-white-remote-v1.patch' | sha256sum -c -
          patch --batch -p1 -d upstream < cleanroom/native-white-remote-v1.patch
          echo 'a8cd0ebffd874edad6e6b5f0fdd39e30ab75882927e6c7ecd572edbf2f161d50  cleanroom/native-white-remote-addon-v1.patch' | sha256sum -c -
          patch --batch -p1 -d cleanroom_input/addon < cleanroom/native-white-remote-addon-v1.patch

      - name: Apply MoonMarker implementation and guild auth
        run: |
          set -euxo pipefail
          test -s cleanroom/native-eight-v1/nativeM2Test.cpp
          test -s cleanroom/native-eight-v1/nativeM2Test.h
          test -s cleanroom/eight-markers/MoonMarker.lua
          test -s cleanroom/eight-markers/Bindings.xml
          test -s cleanroom/eight-markers/GuildAdvanced.lua
          test -s cleanroom/guild-auth-v1/MoonMarkerGuildAuth.cpp
          test -s cleanroom/guild-auth-v1/MoonMarkerGuildAuth.h
          python3 -m py_compile \
            cleanroom/apply_eight_markers.py \
            cleanroom/configure_eight_marker_addon.py \
            cleanroom/apply_guild_auth.py

          cp cleanroom/native-eight-v1/nativeM2Test.cpp upstream/nativeM2Test.cpp
          cp cleanroom/native-eight-v1/nativeM2Test.h upstream/nativeM2Test.h
          python3 cleanroom/apply_eight_markers.py \
            --upstream upstream \
            --addon cleanroom_input/addon \
            --addon-source cleanroom/eight-markers/MoonMarker.lua
          python3 cleanroom/configure_eight_marker_addon.py \
            --addon cleanroom_input/addon \
            --source-dir cleanroom/eight-markers
          python3 cleanroom/apply_guild_auth.py \
            --upstream upstream \
            --source-dir cleanroom/guild-auth-v1

          grep -Fq 'constexpr std::size_t kSlotCount = 8' upstream/nativeM2Test.cpp
          grep -Fq 'bool createAt(const std::string& colorName, const std::string& iconName' upstream/nativeM2Test.cpp
          grep -Fq 'void renderIcons(IDirect3DDevice9* device)' upstream/nativeM2Test.cpp
          grep -Fq 'nativeM2Test::renderIcons(device);' upstream/moonMarker.cpp
          grep -Fq 'constexpr std::size_t kColorCount = 8' upstream/moonMarker.cpp
          grep -Fq '{"cyan",    40, 230, 230}' upstream/moonMarker.cpp
          grep -Fq 'return 5;' upstream/dllmain.cpp
          grep -Fq 'activeCount' upstream/dllmain.cpp

          grep -Fq '#include "MoonMarkerGuildAuth.h"' upstream/dllmain.cpp
          grep -Fq 'moonMarkerGuildAuth::isAuthQuery' upstream/dllmain.cpp
          grep -Fq 'moonMarkerGuildAuth::isAdvancedCommand' upstream/dllmain.cpp
          grep -Fq 'MoonMarkerGuildAuth.cpp' upstream/Makefile
          grep -Fq 'kLuaIsCFunctionAddress = 0x006F34A0' upstream/MoonMarkerGuildAuth.cpp
          grep -Fq 'kLuaToCFunctionAddress = 0x006F3720' upstream/MoonMarkerGuildAuth.cpp
          grep -Fq 'FUNCTION_TAMPERED' upstream/MoonMarkerGuildAuth.cpp
          grep -Fq 'ACCESS_DENIED' upstream/MoonMarkerGuildAuth.cpp
          grep -Fq 'originalGetGuildInfo' upstream/MoonMarkerGuildAuth.cpp
          ! grep -Fq '太阳神殿' upstream/MoonMarkerGuildAuth.cpp

          grep -Fq 'SenderCanControl' cleanroom_input/addon/MoonMarker/MoonMarker.lua
          grep -Fq 'MoonMarker_BindingPlace' cleanroom_input/addon/MoonMarker/MoonMarker.lua
          grep -Fq 'MoonMarker.Remote", color, tonumber(x), tonumber(y), tonumber(z), marker' cleanroom_input/addon/MoonMarker/MoonMarker.lua
          grep -Fq 'pcall(UnitXP, "MMAuth")' cleanroom_input/addon/MoonMarker/GuildAdvanced.lua
          grep -Fq '成员身份由 UnitXP_SP3.dll 验证。' cleanroom_input/addon/MoonMarker/GuildAdvanced.lua
          ! grep -Fq 'GetGuildInfo(' cleanroom_input/addon/MoonMarker/GuildAdvanced.lua
          grep -Fq '## SavedVariables: MoonMarkerDB' cleanroom_input/addon/MoonMarker/*.toc
          grep -Fq '## Title: 光柱测试板-由太阳神殿-yanz' cleanroom_input/addon/MoonMarker/*.toc
          grep -Fq 'GuildAdvanced.lua' cleanroom_input/addon/MoonMarker/*.toc
          test "$(grep -c '<Binding ' cleanroom_input/addon/MoonMarker/Bindings.xml)" -eq 7
          ! grep -Fq 'CreateFrame("PlayerModel"' cleanroom_input/addon/MoonMarker/MoonMarker.lua

      - name: Configure Windows compatibility
        run: sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' upstream/Makefile

      - name: Install xwin and Windows SDK
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK

      - name: Download D3DX headers
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/

      - name: Build PE32 DLL
        working-directory: upstream
        run: |
          set -euxo pipefail
          make clean
          make -j2
          file UnitXP_SP3.dll
          file UnitXP_SP3.dll | grep -q 'PE32 executable.*Intel 80386'
          ! strings UnitXP_SP3.dll | grep -Fq '太阳神殿'

      - name: Package runtime test
        run: |
          set -euxo pipefail
          mkdir -p release
          cp upstream/UnitXP_SP3.dll release/
          cp upstream/UnitXP_SP3.pdb release/ 2>/dev/null || true
          cp -a cleanroom_input/addon/MoonMarker release/
          cp cleanroom/EIGHT_COLORS_EIGHT_MARKERS_V1.md release/
          (cd release && sha256sum UnitXP_SP3.dll > SHA256.txt && sha256sum -c SHA256.txt)
          printf '%s\n' \
            '光柱测试板-由太阳神殿-yanz：DLL 工会授权第一阶段' \
            '普通版的八色光柱、八种标记、按键、保存和团队同步保持不变。' \
            '高级按钮只根据 UnitXP("MMAuth") 的 DLL 返回值显示。' \
            '测试授权：/run local a,g,r=UnitXP("MMAuth");print(a,g,r)' \
            '测试高级入口：/run local a,r=UnitXP("MoonMarker.Advanced.Ping");print(a,r)' \
            '非太阳神殿角色必须得到 false / ACCESS_DENIED，且看不到高级按钮。' \
            '把 GetGuildInfo 替换为 Lua 函数后，MMAuth 必须返回 FUNCTION_TAMPERED。' \
            '目标工会名在 DLL 中使用 XOR 字节编码，不保存为明文 UTF-8 字符串。' \
            '光柱仍使用原生 Spells\\MoonBeam_Impact_Base.mdx。' \
            > release/TESTING.txt

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: MoonMarker-Guild-Auth-Phase1-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

name: Build AutoRange B3.8 CleanCore x86

on:
  workflow_dispatch:
  push:
    branches:
      - agent/autorange-b38-cleancore-20260810
    paths:
      - 'patches/b38-cleancore.part00'
      - 'patches/b38-cleancore.part01'
      - 'patches/b38-cleancore.part02'
      - 'patches/b38-cleancore.part03'
      - '.github/workflows/build-autorange-b38-cleancore.yml'

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout B3.8 branch
        uses: actions/checkout@v4

      - name: Install Clang and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file python3
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Fetch exact UnitXP_SP3 v89 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"

      - name: Rebuild exact TRUE 8x8 source
        shell: bash
        run: |
          set -euxo pipefail
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'
          cat \
            patches/true8x8.patch.gz.b64.part00 \
            patches/true8x8.patch.gz.b64.part01 \
            patches/true8x8.patch.gz.b64.part02.00 \
            patches/true8x8.patch.gz.b64.part02.01.00 \
            patches/true8x8.patch.gz.b64.part02.01.01 \
            patches/true8x8.patch.gz.b64.part02.01.02 \
            patches/true8x8.patch.gz.b64.part02.02 \
            patches/true8x8.patch.gz.b64.part02.03 \
            patches/true8x8.patch.gz.b64.part03 \
            patches/true8x8.patch.gz.b64.part04 \
            patches/true8x8.patch.gz.b64.part05 \
            patches/true8x8.patch.gz.b64.part06 \
            > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          echo '19ca05bd7d6943c60b9d4372723c01e77a3ba551afcf300172f914e0c23b844b  true8x8.patch.gz' | sha256sum -c -
          gzip -dc true8x8.patch.gz > true8x8.patch
          echo 'f5d7506b85955661d322b00b6b2aa3bbfae8601cd7c05e672a8338a8ddc875e4  true8x8.patch' | sha256sum -c -
          patch --dry-run -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch

      - name: Apply stable GroundProbe and AutoRange chain
        shell: bash
        run: |
          set -euxo pipefail
          echo '27f87c231bf5c174201c7e26ddc298e827435363e8d5135dece510f40795be7c  patches/groundprobe-b1.patch' | sha256sum -c -
          patch --dry-run -p1 -d upstream < patches/groundprobe-b1.patch
          patch --batch --forward -p1 -d upstream < patches/groundprobe-b1.patch
          python3 -m py_compile tools/apply_groundprobe_b2_fixed.py
          python3 tools/apply_groundprobe_b2_fixed.py upstream
          python3 -m py_compile tools/apply_autorange_b3.py
          python3 tools/apply_autorange_b3.py upstream
          python3 -m py_compile tools/apply_autorange_b31_fix.py
          python3 tools/apply_autorange_b31_fix.py upstream
          python3 -m py_compile tools/apply_autorange_b32_resolver.py
          python3 tools/apply_autorange_b32_resolver.py upstream
          python3 -m py_compile tools/apply_speed_api.py
          python3 tools/apply_speed_api.py upstream
          python3 -m py_compile tools/apply_autorange_b33_relation.py
          python3 tools/apply_autorange_b33_relation.py upstream
          python3 -m py_compile tools/apply_groundprobe_b34_totem.py
          python3 tools/apply_groundprobe_b34_totem.py upstream
          python3 -m py_compile tools/apply_autorange_b37_totemdbc.py
          python3 tools/apply_autorange_b37_totemdbc.py upstream

      - name: Apply B3.8 CleanCore audit fix
        shell: bash
        run: |
          set -euxo pipefail
          cat patches/b38-cleancore.part00 \
              patches/b38-cleancore.part01 \
              patches/b38-cleancore.part02 \
              patches/b38-cleancore.part03 > b38-cleancore.patch
          patch --dry-run -p1 -d upstream < b38-cleancore.patch
          patch --batch --forward -p1 -d upstream < b38-cleancore.patch
          grep -Fq 'GroundProbe.DynamicByGuid' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualHide' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualShow' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualRestart' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualStats' upstream/dllmain.cpp
          grep -Fq 'std::string autoRangeVisualStats' upstream/nativeM2Test.cpp
          grep -Fq 'autoRangeSlot.hidden' upstream/nativeM2Test.cpp
          grep -Fq 'cmd == "speed"' upstream/dllmain.cpp

      - name: Install xwin
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin

      - name: Download Microsoft CRT and Windows SDK x86
        shell: bash
        run: |
          set -euxo pipefail
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK

      - name: Download Microsoft D3DX headers
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/
          test -f upstream/d3d9x_headers/d3dx9.h

      - name: Build PE32 x86 DLL
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          test -f UnitXP_SP3.dll
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt
          python3 - <<'PY'
          from pathlib import Path
          data = Path('UnitXP_SP3.dll').read_bytes()
          for marker in [
              b'speed\x00',
              b'GroundProbe.DynamicByGuid\x00',
              b'AutoRange.VisualHide\x00',
              b'AutoRange.VisualShow\x00',
              b'AutoRange.VisualRestart\x00',
              b'AutoRange.VisualStats\x00',
          ]:
              assert marker in data, marker
          print('B3.8 CleanCore markers present')
          PY

      - name: Package B3.8 artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp upstream/UnitXP_SP3.dll release/UnitXP_SP3_B38_CleanCore_Test.dll
          cp upstream/UnitXP_SP3.pdb release/ 2>/dev/null || true
          cp upstream/DLL-FILE-TYPE.txt release/
          sha256sum release/UnitXP_SP3_B38_CleanCore_Test.dll > release/SHA256.txt
          cat > release/README-B38-CleanCore.txt <<'TXT'
          UnitXP_SP3 AutoRange B3.8 CleanCore audit DLL

          Preserved:
          - TRUE 8x8 chain
          - GroundProbe B1/B2/B3.4
          - AutoRange B3/B3.1/B3.2/B3.3/B3.7 Totem DBC
          - UnitXP("speed", "player") legacy CAT compatibility

          New B3.8 APIs:
          UnitXP("GroundProbe.DynamicByGuid", guid)
          UnitXP("AutoRange.VisualHide", key)
          UnitXP("AutoRange.VisualShow", key)
          UnitXP("AutoRange.VisualRestart", key)
          UnitXP("AutoRange.VisualStats")

          Source/master toggle visibility changes are non-destructive: Hide/Show reuse the same native M2.
          Known DynamicObjects are tracked by exact GUID instead of persistent full-world Snapshot scans.
          Hidden AutoRange previews do zero per-frame native model work after the one-time detach.
          TXT

      - name: Upload B3.8 DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnitXP-SP3-B38-CleanCore-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

name: Check Main Model Addon Parts

on:
  push:
    branches: ['agent/main-model-replacement-v1']
    paths:
      - 'cleanroom/main-model-v1/addon.part*'
      - '.github/workflows/check-main-model-addon-parts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify every encoded part
        run: |
          set -euxo pipefail
          echo '1f4e402aa75694885a09839697efc7ac287b3f749ad871a222184050a4f54e2b  cleanroom/main-model-v1/addon.part00' | sha256sum -c -

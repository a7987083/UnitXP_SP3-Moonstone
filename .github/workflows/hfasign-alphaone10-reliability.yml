name: Build zonoe alphaone10 UDID reliability

on:
  push:
    branches: [work/hfapatchipa-ksign-v3]
    paths: [".github/workflows/hfasign-alphaone10-reliability.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned Ksign source
        run: |
          set -euxo pipefail
          git clone https://github.com/Nyasami/Ksign.git HFASignBuild
          git -C HFASignBuild checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          for patch in \
            0001-Rebrand-Ksign-baseline-as-HFASign-alpha1.patch \
            0003-HFASign-alpha3-detailed-signing-and-import-fixes.patch \
            0004-zonoe-alpha4-incremental.patch \
            0005-zonoe-alpha5-import-resources-signing-ui.patch \
            0006-zonoe-alpha6-resource-actions-signing-fix.patch \
            0007-zonoe-alpha7-import-zip-library.patch \
            0008-zonoe-alpha8-udid-schemes-encrypted-sources.patch \
            0009-zonoe-alpha9-udid-zip-sources.patch \
            0010-zonoe-alpha9-compile-pending-validation.patch \
            0011-zonoe-alpha10-source-zip-udid-fixes.patch \
            0012-zonoe-alpha11-source-identity-advanced-signing.patch \
            0013-zonoe-alpha12-signing-paging-unlock.patch \
            0014-Fix-source-unlock-URL-identity-collisions.patch \
            0015-Fix-alpha12-signing-and-import-regressions.patch \
            0016-zonoe-alpha15-signing-navigation-unlock.patch \
            0019-Import-ZsignSwift-for-signature-validation.patch \
            0026-zonoe-alpha16-consolidated-fixes.patch \
            0027-zonoe-alpha17-fix-signing-layered-interactive-back.patch \
            0028-zonoe-alpha17-fix-udid-profile-service-completion.patch \
            0029-zonoe-alpha17-fix-legacy-source-unlock-post.patch \
            0030-zonoe-alpha18-native-signing-navigation.patch \
            0031-zonoe-alpha18-udid-localserver-301-return.patch \
            0032-zonoe-alpha18-source-unlock-real-protocol.patch \
            0033-zonoe-alpha18-compile-restore-commoncrypto.patch \
            0034-zonoe-alpha19-source-payload-metadata.patch \
            0035-zonoe-alpha19-source-app-ui-filters-fields.patch \
            0036-zonoe-alpha19-apple-app-store-search.patch \
            0037-zonoe-alpha19-tabs-and-files-settings.patch \
            0038-zonoe-alpha19-compile-source-ui.patch \
            0039-zonoe-alpha19-compile-category-filter.patch \
            0040-zonoe-alpha20-qnq-source-payload-decoders.patch \
            0041-zonoe-alpha20-localized-appstore-regions.patch \
            0045-zonoe-alphaone1-import-QNQ-v0.7.2-source-pipeline.patch \
            0046-zonoe-alphaone1-fix-source-and-settings-UI.patch \
            0047-zonoe-alphaone1-keyboard-and-build-identity.patch \
            0048-zonoe-alphaone2-source-certificate-feedback.patch \
            0049-zonoe-alphaone3-fix-navigation-and-clipboard-completion.patch \
            0050-zonoe-alphaone4-fix-signing-navigation-and-keyboard-dismissal.patch \
            0051-zonoe-alphaone4-build-identity.patch \
            0052-zonoe-alphaone5-restore-modal-signing-navigation.patch \
            0053-zonoe-alphaone5-build-identity.patch \
            0054-zonoe-alphaone6-signing-udid-callback-scheme.patch \
            0055-zonoe-alphaone6-build-identity.patch \
            0056-zonoe-alphaone7-show-udid-callback-on-signing-main.patch \
            0057-zonoe-alphaone7-build-identity.patch \
            0058-zonoe-alphaone8-clean-signing-udid-architecture.patch \
            0059-zonoe-alphaone8-build-identity.patch \
            0061-zonoe-alphaone8-udid-nonce-localhost-bridge.patch \
            0062-zonoe-alphaone9-udid-result-store-wake-only-callback.patch \
            0063-zonoe-alphaone9-build-identity.patch; do
              git -C HFASignBuild apply "../HFASign/patches/$patch"
          done
          python3 HFASign/scripts/apply_alphaone10_udid_reliability.py
          git -C HFASignBuild apply ../HFASign/patches/0065-zonoe-alphaone10-build-identity.patch
          git -C HFASignBuild diff --check
          git -C HFASignBuild submodule update --init --recursive
          git -C HFASignBuild/Zsign apply ../../HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch

      - name: Existing source regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Backend/Sources/QNQSourcePayloadDecoder.swift \
            HFASign/scripts/SourceDecoderRegressionMain.swift \
            -framework Security \
            -o /tmp/zonoe-source-regression
          /tmp/zonoe-source-regression

      - name: Existing signing architecture regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Features/Signing/Domain/ZonoeUDIDCallback.swift \
            HFASignBuild/Ksign/Features/Signing/Application/ConfigureZonoeUDIDCallbackUseCase.swift \
            HFASignBuild/Ksign/Features/Signing/Infrastructure/ZonoeUDIDCallbackInfrastructure.swift \
            HFASign/scripts/SigningArchitectureRegressionMain.swift \
            -o /tmp/zonoe-signing-architecture-regression
          /tmp/zonoe-signing-architecture-regression

      - name: Verify narrow UDID changes
        run: |
          set -euxo pipefail
          f=HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -Fq 'static let bridgePorts = [14302, 49173, 50321, 51739, 53261, 54883]' "$f"
          grep -Fq 'let selectedPort = firstAvailableBridgePort() ?? Self.port' "$f"
          grep -Fq 'app.post("bridge", "ack", ":nonce")' "$f"
          grep -Fq 'let result = bridgeResults[nonce]' "$f"
          ! grep -Fq 'consumeBridgeResult(for: nonce)' "$f"
          grep -Fq 'with: "http://127.0.0.1:\(activePort)/udid"' "$f"
          git -C HFASignBuild diff --name-only | grep -Eq '^Ksign/Backend/Server/UDIDService.swift$|^Ksign.xcodeproj/project.pbxproj$|^Ksign/Resources/Info.plist$'

      - name: Apply zonoe icon
        run: |
          curl -L --fail --retry 3 -o /tmp/zonoe-icon.png 'https://app.zonoeios.xyz/uploads/20220704/d042be36ab9f4c73f0c721bccc6ba6c9.png'
          sips -c 901 901 /tmp/zonoe-icon.png --out /tmp/zonoe-square.png
          sips -z 1024 1024 /tmp/zonoe-square.png --out /tmp/zonoe-1024.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-default.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans.png
          cp /tmp/zonoe-1024.png 'HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans 1.png'

      - name: Install packaging tools
        run: brew install ldid

      - name: Prepare installer assets
        working-directory: HFASignBuild
        run: make deps

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages
          git -C HFASignBuild/SourcePackages/checkouts/ZIPFoundation apply \
            ../../../../HFASign/patches/0018-Fix-ZIPFoundation-filename-encoding.patch

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath HFASignBuild/build -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages \
            SWIFT_VERSION=5 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee HFASign/alphaone10-build.log

      - name: Package TrollStore IPA
        run: |
          set -euxo pipefail
          app="HFASignBuild/build/Build/Products/Release-iphoneos/Ksign.app"
          test -d "$app"
          cp HFASignBuild/deps/* "$app/" || true
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then ldid -S "$file"; fi
          done < <(find "$app/Frameworks" -type f 2>/dev/null || true)
          ldid -S "$app/Ksign"
          rm -rf HFASign/dist/alphaone10-stage
          mkdir -p HFASign/dist/alphaone10-stage/Payload
          cp -R "$app" HFASign/dist/alphaone10-stage/Payload/HFASign.app
          cd HFASign/dist/alphaone10-stage
          ditto -c -k --sequesterRsrc --keepParent Payload ../zonoe_v3.0.0-alphaone10_TrollStore.ipa
          cd ..
          shasum -a 256 zonoe_v3.0.0-alphaone10_TrollStore.ipa > SHA256SUMS-alphaone10.txt

      - name: Verify packaged identity
        run: |
          set -euxo pipefail
          plist="HFASign/dist/alphaone10-stage/Payload/HFASign.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" | grep -qx zonoe
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" | grep -qx com.hfa.sign
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -qx 110
          /usr/libexec/PlistBuddy -c 'Print :ZonoeReleaseVersion' "$plist" | grep -qx v3.0.0-alphaone10

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="v3.0.0-alphaone10"
          ipa="HFASign/dist/zonoe_v3.0.0-alphaone10_TrollStore.ipa"
          sums="HFASign/dist/SHA256SUMS-alphaone10.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" "$sums" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$ipa" "$sums" --repo "$GITHUB_REPOSITORY" \
              --target work/hfapatchipa-ksign-v3 \
              --title "zonoe v3.0.0-alphaone10" --prerelease \
              --notes "Narrow UDID bridge reliability release: 14302 remains preferred with deterministic fallback ports when occupied; nonce results are retry-safe and are deleted only after explicit ACK. Existing signing, sources, certificates, navigation, callback scheme generation, and legacy no-nonce callback behavior are unchanged."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zonoe-v3.0.0-alphaone10
          path: |
            HFASign/dist/zonoe_v3.0.0-alphaone10_TrollStore.ipa
            HFASign/dist/SHA256SUMS-alphaone10.txt
          if-no-files-found: error

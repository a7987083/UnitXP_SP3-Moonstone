name: Build zonoe alphaone10 UDID reliability

on:
  push:
    branches: [work/hfapatchipa-ksign-v3]
    paths:
      - 'HFASign/patch-series-alphaone10.txt'
      - 'HFASign/scripts/reconstruct_alphaone10.sh'
      - 'HFASign/scripts/apply_alphaone10_udid_reliability.py'
      - '.github/workflows/hfasign-alphaone10-reliability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical alphaone10 source
        run: |
          set -euxo pipefail
          bash HFASign/scripts/reconstruct_alphaone10.sh

      - name: Existing source regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Backend/Sources/QNQSourcePayloadDecoder.swift \
            HFASign/scripts/SourceDecoderRegressionMain.swift \
            -framework Security \
            -o /tmp/zonoe-source-regression
          /tmp/zonoe-source-regression

      - name: Existing signing architecture regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Features/Signing/Domain/ZonoeUDIDCallback.swift \
            HFASignBuild/Ksign/Features/Signing/Application/ConfigureZonoeUDIDCallbackUseCase.swift \
            HFASignBuild/Ksign/Features/Signing/Infrastructure/ZonoeUDIDCallbackInfrastructure.swift \
            HFASign/scripts/SigningArchitectureRegressionMain.swift \
            -o /tmp/zonoe-signing-architecture-regression
          /tmp/zonoe-signing-architecture-regression

      - name: Verify alphaone10 UDID contract
        run: |
          set -euxo pipefail
          f=HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -Fq 'static let bridgePorts = [14302, 49173, 50321, 51739, 53261, 54883]' "$f"
          grep -Fq 'let selectedPort = firstAvailableBridgePort() ?? Self.port' "$f"
          grep -Fq 'app.post("bridge", "ack", ":nonce")' "$f"
          grep -Fq 'let result = bridgeResults[nonce]' "$f"
          ! grep -Fq 'consumeBridgeResult(for: nonce)' "$f"
          grep -Fq 'with: "http://127.0.0.1:\(activePort)/udid"' "$f"
          grep -Fq 'CURRENT_PROJECT_VERSION = 110;' HFASignBuild/Ksign.xcodeproj/project.pbxproj
          grep -Fq '<string>v3.0.0-alphaone10</string>' HFASignBuild/Ksign/Resources/Info.plist

      - name: Apply zonoe icon
        run: |
          curl -L --fail --retry 3 -o /tmp/zonoe-icon.png 'https://app.zonoeios.xyz/uploads/20220704/d042be36ab9f4c73f0c721bccc6ba6c9.png'
          sips -c 901 901 /tmp/zonoe-icon.png --out /tmp/zonoe-square.png
          sips -z 1024 1024 /tmp/zonoe-square.png --out /tmp/zonoe-1024.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-default.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans.png
          cp /tmp/zonoe-1024.png 'HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans 1.png'

      - name: Install packaging tools
        run: brew install ldid

      - name: Prepare installer assets
        working-directory: HFASignBuild
        run: make deps

      - name: Resolve packages
        run: |
          set -euxo pipefail
          xcodebuild -resolvePackageDependencies -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages
          git -C HFASignBuild/SourcePackages/checkouts/ZIPFoundation apply \
            ../../../../HFASign/patches/0018-Fix-ZIPFoundation-filename-encoding.patch

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath HFASignBuild/build -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages \
            SWIFT_VERSION=5 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify packaged identity inputs
        run: |
          set -euxo pipefail
          grep -Fq 'CURRENT_PROJECT_VERSION = 110;' HFASignBuild/Ksign.xcodeproj/project.pbxproj
          grep -Fq '<string>v3.0.0-alphaone10</string>' HFASignBuild/Ksign/Resources/Info.plist

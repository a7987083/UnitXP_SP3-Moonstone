name: Build Runtime Patch Menu v0.6.2.1 M6.2.1 Flat Offset Authoring

on:
  push:
    branches:
      - feature/m6.2-ted-offset-rewrite
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source contract assertions
        run: |
          set -euxo pipefail
          grep -q '0.6.2.1 · M6.2.1' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNM620TEDOffsetRewrite.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNM621FlatOffsetAuthoring.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM621FlatOffsetAuthoringDeferred' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          ! grep -q 'ZNInstallFeatureBuilderUIDeferred();' iosruntimepatchmenu/src/ZNDeferredBootstrap.mm
          grep -q 'One canonical authoring renderer only' iosruntimepatchmenu/src/ZNM621FlatOffsetAuthoring.mm
          grep -q '@"说明"' iosruntimepatchmenu/src/ZNM621FlatOffsetAuthoring.mm
          grep -q '@"名称"' iosruntimepatchmenu/src/ZNM621FlatOffsetAuthoring.mm
          grep -q '@"Offset"' iosruntimepatchmenu/src/ZNM621FlatOffsetAuthoring.mm
          ! grep -q 'ZNM591OffsetHookControls.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM592OffsetAuthoringPersistence.mm' iosruntimepatchmenu/Makefile
          ! grep -q 'ZNM610UnifiedFeatureModel.mm' iosruntimepatchmenu/Makefile
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
      - name: Build M6.2.1
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m6.2.1
          cp .theos/obj/ZonoePatchV03.dylib dist-m6.2.1/ZonoPatch_v0.6.2.1_M6.2.1_FlatOffsetAuthoring.dylib
          shasum -a 256 dist-m6.2.1/ZonoPatch_v0.6.2.1_M6.2.1_FlatOffsetAuthoring.dylib | tee dist-m6.2.1/SHA256.txt
      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m6.2.1/ZonoPatch_v0.6.2.1_M6.2.1_FlatOffsetAuthoring.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m621_load_commands.txt
          strings -a "$out" > /tmp/zono_m621_strings.txt
          grep -q '\[m6.2.1-ui\]' /tmp/zono_m621_strings.txt
          grep -q 'canonical flat Offset authoring installed' /tmp/zono_m621_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m621_load_commands.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.6.2.1-M6.2.1-FlatOffsetAuthoring
          path: |
            iosruntimepatchmenu/dist-m6.2.1/ZonoPatch_v0.6.2.1_M6.2.1_FlatOffsetAuthoring.dylib
            iosruntimepatchmenu/dist-m6.2.1/SHA256.txt
          if-no-files-found: error
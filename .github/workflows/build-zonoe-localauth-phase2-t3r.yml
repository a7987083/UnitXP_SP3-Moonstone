name: Build Zonoe LocalAuth Phase2 T3R
on:
  push:
    branches: [feature/login10195diag-v0.1]
    paths:
      - 'zonoe_localauth_phase2_t3r/**'
      - '.github/workflows/build-zonoe-localauth-phase2-t3r.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Configure iOS arm64
        run: |
          cmake -S zonoe_localauth_phase2_t3r -B build-zonoe-localauth-p2-t3r -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-zonoe-localauth-p2-t3r --config Release --target ZonoeLocalAuthPhase2T3R --parallel 4
      - name: Locate and verify dylib
        run: |
          set -euo pipefail
          DYLIB="$(find build-zonoe-localauth-p2-t3r -type f -name 'ZonoeLocalAuth_Phase2_T3R.dylib' | head -1)"
          test -n "$DYLIB"
          echo "DYLIB=$DYLIB" >> "$GITHUB_ENV"
          file "$DYLIB"
          file "$DYLIB" | grep -q 'arm64'
          otool -hv "$DYLIB"
      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist-p2-t3r
          mkdir -p dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R
          cp "$DYLIB" dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/
          cp zonoe_localauth_phase2_t3r/README.md dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/
          cp zonoe_localauth_phase2_t3r/server/register.php dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/
          shasum -a 256 "$DYLIB" > dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ZonoeLocalAuth-Phase2-T3R-arm64
          path: |
            dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R-arm64.zip
            dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/ZonoeLocalAuth_Phase2_T3R.dylib
            dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/register.php
            dist-p2-t3r/ZonoeLocalAuth-Phase2-T3R/SHA256.txt

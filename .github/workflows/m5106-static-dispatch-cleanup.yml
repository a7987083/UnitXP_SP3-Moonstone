name: M5.10.6 Static Dispatch Source Cleanup

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collapse Builder V3 to one-site two-state model
        run: python3 iosruntimepatchmenu/tools/m5106_static_dispatch_cleanup.py
      - name: Commit deterministic cleanup
        run: |
          set -euxo pipefail
          if git diff --quiet --exit-code; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iosruntimepatchmenu/src/ZNStaticBinaryBuilderV3.mm
          git commit -m "refactor(offset): collapse Builder V3 shared-site model"
          git push origin HEAD:feature/m5.10-offset-core-rebuild-v1

name: Build NetworkCapture v0.8.0 Clean Alpha7 SkillDriven

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/network-capture-v0.8.0-clean
    paths:
      - 'jsoncapture/**'
      - '.github/workflows/build-network-capture-v0.8.0-clean.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify clean patch chain
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'apply_v070_page_snapshot.py' jsoncapture/Makefile
          grep -Fq 'apply_v071_snapshot_completeness.py' jsoncapture/Makefile
          grep -Fq 'apply_v080_alpha6_nonblocking_runtime.py' jsoncapture/Makefile
          grep -Fq 'apply_v080_alpha6_recovered_json_hashcheck.py' jsoncapture/Makefile
          grep -Fq 'apply_v080_alpha6_compile_fix.py' jsoncapture/Makefile
          grep -Fq 'apply_v080_alpha7_skill_router_recovery.py' jsoncapture/Makefile
          ! grep -Fq 'apply_v080_page_dependency.py' jsoncapture/Makefile
          ! grep -Fq 'apply_v081_runtime_latest_sync.py' jsoncapture/Makefile
          ! grep -Fq 'apply_v083_' jsoncapture/Makefile

      - name: Apply patches and validate alpha7 invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          python3 scripts/apply_v052_runtime_cache.py
          python3 scripts/apply_v054_response_observer.py
          python3 scripts/apply_v055_response_capture.py
          python3 scripts/apply_v056_response_metadata.py
          python3 scripts/apply_v056_response_metadata_hardening.py
          python3 scripts/apply_v057_unity_all_json.py
          python3 scripts/apply_v057_compile_compat.py
          python3 scripts/apply_v058_socket_http_json.py
          python3 scripts/apply_v059_network_coverage.py
          python3 scripts/apply_v059_compile_fix.py
          python3 scripts/apply_v060_page_protobuf.py
          python3 scripts/apply_v060_hardening.py
          python3 scripts/apply_v070_page_snapshot.py
          python3 scripts/apply_v071_snapshot_completeness.py
          python3 scripts/apply_v080_mode1_exact_mirror.py
          python3 scripts/apply_v080_mode2_auto.py
          python3 scripts/apply_v080_alpha3_runtime_sync.py
          python3 scripts/apply_v080_alpha3_compile_fix.py
          python3 scripts/apply_v080_alpha4_preflight.py
          python3 scripts/apply_v080_alpha4_mode1_mode2_fix.py
          python3 scripts/apply_v080_recovery_memsafe.py
          python3 scripts/apply_v080_alpha4_stability.py
          python3 scripts/apply_v080_alpha4_compile_fix.py
          python3 scripts/apply_v080_alpha5_router_discovery.py
          python3 scripts/apply_v080_alpha5_recovery_sha256_resume.py
          python3 scripts/apply_v080_alpha5_identity.py
          python3 scripts/apply_v080_alpha5_compile_fix.py
          python3 scripts/apply_v080_alpha6_nonblocking_runtime.py
          python3 scripts/apply_v080_alpha6_recovered_json_hashcheck.py
          python3 scripts/apply_v080_alpha6_compile_fix.py
          python3 scripts/apply_v080_alpha7_skill_router_recovery.py

          src=src/ManualTaskEngineV05.m
          rec=src/OnDeviceLuaRecovery.m

          # Stable authority remains v0.7.1 runtime_page_snapshot.
          grep -Fq 'JCG5_PAGE_SNAPSHOT_V070' "$src"
          grep -Fq 'JCG5_SNAPSHOT_COMPLETENESS_V071' "$src"

          # rev-lua/lang-lua: no Mode2 work before sendMsg; post-parse + reentry guard preserved.
          grep -Fq 'JCG80Mode2Pump(L); // alpha6: post-parse only; never blocks user sendMsg input' "$src"
          ! grep -A3 -F 'static int JCG60SendMsgWrapper(void *L)' "$src" | grep -Fq 'JCG80Mode2Pump(L);'
          grep -Fq 'gJCG86Mode2PumpBusy' "$src"

          # rev-router: semantic method rank must dominate module name; specialized guide router rejected.
          grep -Fq 'JCG5_V080_ALPHA7_SKILL_ROUTER_RECOVERY' "$src"
          grep -Fq 'JCG87SpecializedOpenName' "$src"
          grep -Fq 'gJCG87RejectedOpenNames' "$src"
          grep -Fq 'ro * 1000000 + rc * 1000 + nameRank' "$src"
          grep -Fq 'MODE2 router candidate source=' "$src"
          grep -Fq 'MODE2 router reject fn=' "$src"
          grep -Fq 'action=rediscover-same-ui' "$src"
          grep -Fq 'openGuideDlg' "$src" || true

          # rev-struct/static recovery: runtime capture must not cancel JCG5TaskRecover.
          grep -Fq 'gJCG5Task!=JCG5TaskIdle && gJCG5Task!=JCG5TaskRecover' "$src"
          grep -Fq 'dispatch_queue_attr_make_with_qos_class(DISPATCH_QUEUE_SERIAL,QOS_CLASS_UTILITY,0)' "$src"

          # Actual recovered_json bytes remain SHA256 authority; verification only yields cooperatively.
          grep -Fq 'ODLR_V080_ALPHA7_COOPERATIVE_VERIFY' "$rec"
          grep -Fq 'NSString *actual=ODLRFileSHA256(path);' "$rec"
          grep -Fq '![actual isEqualToString:expectedSHA]' "$rec"
          grep -Fq 'sAlpha7VerifiedFiles' "$rec"
          grep -Fq 'usleep(750)' "$rec"
          grep -Fq 'Recovery.SHA256.txt' "$rec"
          grep -Fq 'ODLRRecoverDecodedDirectory(input,gJCG5Root,retryOnly?YES:NO' "$src"
          ! grep -Fq 'JCG5ResetDirectory(gJCG5RecoveredDir)' "$src"
          ! grep -Fq 'ODLRResetRecoveryIndex(gJCG5Root)' "$src"

          grep -Fq 'JSONCapture v0.8.0-alpha7 RouterSemantic+RecoveryContinuous' "$src"
          grep -Fq 'MODE2ROUTER=alpha7-semantic-adaptive' "$src"
          grep -Fq 'RECOVERYSHA=journal-v1-continuous' "$src"

          # No abandoned reducer/new hook surface.
          ! grep -Fq 'JCG80CaptureJSONData' "$src"
          ! grep -Fq 'JCG80CaptureProtobufData' "$src"
          test "$(grep -c 'JCG5Hook(' "$src" | tr -d ' ')" = '7'
          test "$(grep -o 'dispatch_queue_create' "$src" | wc -l | tr -d ' ')" = '2'
          ! grep -Eq '__thread|thread_local|JCG53UIEntry' "$src"
          test "$(grep -c '__attribute__((constructor))' src/ManualTaskEngineV05.m | tr -d ' ')" = '1'
          compiled_ctor_count=$(grep -h '__attribute__((constructor))' src/ManualTaskEngineV05.m src/JCG5ScrollFix.m src/OnDeviceLuaRecovery.m | wc -l | tr -d ' ')
          test "$compiled_ctor_count" = '2'

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-v080-clean
          out='dist-v080-clean/JSONCapture_v0.8.0_clean_alpha7_SkillDriven.dylib'
          cp .theos/obj/JSONCapture.dylib "$out"
          file "$out"
          otool -L "$out"
          shasum -a 256 "$out" | tee dist-v080-clean/SHA256.txt
          strings "$out" > dist-v080-clean/strings.txt

          grep -Fq 'PAGE-SNAPSHOT v0.7.1 ready' dist-v080-clean/strings.txt
          grep -Fq 'JSONCapture v0.8.0-alpha7 RouterSemantic+RecoveryContinuous' dist-v080-clean/strings.txt
          grep -Fq 'MODE2ROUTER=alpha7-semantic-adaptive' dist-v080-clean/strings.txt
          grep -Fq 'RECOVERYSHA=journal-v1-continuous' dist-v080-clean/strings.txt
          grep -Fq 'MODE2 router reject fn=' dist-v080-clean/strings.txt
          grep -Fq 'Recovery.SHA256.txt' dist-v080-clean/strings.txt

      - name: Verify Mach-O startup invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd jsoncapture
          out='dist-v080-clean/JSONCapture_v0.8.0_clean_alpha7_SkillDriven.dylib'
          otool -l "$out" > dist-v080-clean/load_commands.txt
          otool -hv "$out" > dist-v080-clean/header.txt
          modinit=$(awk '/sectname __mod_init_func/{seen=1;next} seen && $1=="size"{print $2; exit}' dist-v080-clean/load_commands.txt)
          echo "__mod_init_func size=$modinit"
          test "$modinit" = '0x0000000000000010'
          ! grep -Eq 'sectname __thread_vars|sectname __thread_bss' dist-v080-clean/load_commands.txt
          ! grep -Fq 'HAS_TLV_DESCRIPTORS' dist-v080-clean/header.txt

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v7
        with:
          name: JSONCapture-v0.8.0-clean-alpha7-SkillDriven
          path: |
            jsoncapture/dist-v080-clean/JSONCapture_v0.8.0_clean_alpha7_SkillDriven.dylib
            jsoncapture/dist-v080-clean/SHA256.txt
            jsoncapture/dist-v080-clean/load_commands.txt
            jsoncapture/dist-v080-clean/header.txt
          if-no-files-found: error
          retention-days: 30

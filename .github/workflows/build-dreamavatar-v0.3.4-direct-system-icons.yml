name: DreamAvatar v0.3.4 Direct System Icons

run-name: 'DreamAvatar v0.3.4 Â· Direct system raid icons Â· Saved history Â· #${{ github.run_number }}'

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dreamavatar-v0.3.4-direct-system-icons-saved-history
    paths:
      - '.github/workflows/build-dreamavatar-v0.3.4-direct-system-icons.yml'
      - 'slim/dreamavatar-v0.3.4-direct-system-icons/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build DreamAvatar and Hotkeys10 direct system icons in one x86 DLL
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4

      - name: Restore verified DreamAvatar v0.3.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8951907165/zip" \
            -o v033-artifact.zip
          unzip -q v033-artifact.zip -d v033-artifact
          echo 'c8b5c0c1b3db1a0293ff5ca4208686b352094275d233cd099ef36561984d4d67  v033-artifact/DreamAvatar-v0.3.3-Sync-Compact-Source.tar.xz' | sha256sum -c -
          tar -xJf v033-artifact/DreamAvatar-v0.3.3-Sync-Compact-Source.tar.xz
          mv target-source target
          cp -a target baseline
          grep -Fq '## Version: 0.3.3-sync-compact-experimental' target/DreamAvatar/DreamAvatar.toc

      - name: Verify and apply v0.3.4 direct icon patch
        run: |
          set -euxo pipefail
          cp slim/dreamavatar-v0.3.4-direct-system-icons/v034.patch.gz.b64 .
          echo 'bebb48b485b58e4cf0e6a6bff5c3c6635e2c27c4b3db5c087ef4bd01a00a1ee2  v034.patch.gz.b64' | sha256sum -c -
          base64 -d v034.patch.gz.b64 > v034.patch.gz
          echo '95907600a3bec3bb86dbb313db316f7c4ee460b5d55ca8b8331b136e44be3ce4  v034.patch.gz' | sha256sum -c -
          gzip -dc v034.patch.gz > v034.patch
          echo '1282617819ceb327d5e2abf74bed9578f2d2bbded57745e26ee3b31fd7df0913  v034.patch' | sha256sum -c -
          git apply --check --directory=target v034.patch
          git apply --directory=target v034.patch

      - name: Audit merge scope and requested behavior
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          before, after = Path('baseline'), Path('target')
          allowed = {
              'DREAMAVATAR-V0.3.4-DIRECT-SYSTEM-ICONS-NOTES.md',
              'DreamAvatar/DreamAvatar.toc',
              'native/nativeM2Test.cpp',
          }
          paths = {str(p.relative_to(before)) for p in before.rglob('*') if p.is_file()}
          paths |= {str(p.relative_to(after)) for p in after.rglob('*') if p.is_file()}
          changed = {r for r in paths if not (before/r).exists() or not (after/r).exists() or (before/r).read_bytes() != (after/r).read_bytes()}
          if changed != allowed:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')
          PY

          # DreamAvatar and synchronization implementation must stay byte-identical.
          cmp baseline/DreamAvatar/DreamAvatar.lua target/DreamAvatar/DreamAvatar.lua
          cmp baseline/native/MoonMarkerDreamAvatar.cpp target/native/MoonMarkerDreamAvatar.cpp
          cmp baseline/native/MoonMarkerDreamAvatar.h target/native/MoonMarkerDreamAvatar.h
          cmp baseline/native/MoonMarkerMainModel.cpp target/native/MoonMarkerMainModel.cpp
          cmp baseline/native/MoonMarkerMainModel.h target/native/MoonMarkerMainModel.h
          cmp baseline/native/dllmain.cpp target/native/dllmain.cpp
          cmp baseline/native/MoonMarkerGuildAuth.cpp target/native/MoonMarkerGuildAuth.cpp
          cmp baseline/native/MoonMarkerRuntimeGuard.cpp target/native/MoonMarkerRuntimeGuard.cpp

          # SavedVariables history is explicitly retained.
          grep -Fq '## SavedVariables: DreamAvatarDB' target/DreamAvatar/DreamAvatar.toc
          grep -Fq 'db.history.character' target/DreamAvatar/DreamAvatar.lua
          grep -Fq 'db.history.weapon' target/DreamAvatar/DreamAvatar.lua
          grep -Fq 'db.history.glow' target/DreamAvatar/DreamAvatar.lua
          grep -Fq 'db.history.mount' target/DreamAvatar/DreamAvatar.lua
          grep -Fq '## Version: 0.3.4-direct-system-icons-saved-history-experimental' target/DreamAvatar/DreamAvatar.toc

          # Hotkeys10 projection and world anchor stay unchanged; only final icon drawing changes.
          grep -Fq 'constexpr float kIconWorldHeight = 8.5f;' target/native/nativeM2Test.cpp
          grep -Fq 'projected.x = screen.x;' target/native/nativeM2Test.cpp
          grep -Fq 'projected.y = screen.y;' target/native/nativeM2Test.cpp
          grep -Fq 'Interface\\TargetingFrame\\UI-RaidTargetingIcons.blp' target/native/nativeM2Test.cpp
          grep -Fq 'bool renderSystemRaidIcons(IDirect3DDevice9* device)' target/native/nativeM2Test.cpp
          grep -Fq 'if (renderSystemRaidIcons(device)) return;' target/native/nativeM2Test.cpp
          grep -Fq 'DrawPrimitiveUP(D3DPT_TRIANGLELIST' target/native/nativeM2Test.cpp
          grep -Fq 'std::vector<IconVertex> vertices;' target/native/nativeM2Test.cpp

          # No Lua overlay, UIParent conversion, extra marker slots, or game raid marker mutation.
          test ! -e target/plugin/SystemRaidIcons.lua
          ! grep -RniF 'SystemRaidIcons.lua' target/plugin target/DreamAvatar
          ! grep -RniE 'UIParent.*GetScale|WorldToUI|SetRaidTarget|RAID_TARGET_UPDATE' target/native/nativeM2Test.cpp target/DreamAvatar
          grep -Fq 'constexpr std::size_t kSlotCount = 8;' target/native/nativeM2Test.cpp

      - name: Validate Lua 5.1
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r file; do luac5.1 -p "$file"; done \
            < <(find target/plugin target/DreamAvatar -type f -name '*.lua' | sort)

      - name: Prepare clean source snapshot
        run: |
          set -euxo pipefail
          cp -a target target-source
          find target-source/native -maxdepth 1 -type f \
            \( -name '*.obj' -o -name '*.dll' -o -name '*.lib' -o -name '*.exp' -o -name '*.pdb' \) -delete
          rm -rf target-source/native/xwinSDK target-source/native/d3d9x_headers target-source/native/.git target-source/plugin/.git
          tar --sort=name --mtime='UTC 2026-08-06' --owner=0 --group=0 --numeric-owner \
            -cJf DreamAvatar-v0.3.4-Direct-System-Icons-Saved-History-Source.tar.xz target-source

      - name: Install Windows x86 build toolchain
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK
          curl -L --fail --retry 3 \
            'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile PE32 x86 DLL
        run: |
          set -euxo pipefail
          rm -rf target/native/xwinSDK target/native/d3d9x_headers
          ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" target/native/xwinSDK
          ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" target/native/d3d9x_headers
          sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' target/native/Makefile
          make -C target/native clean
          make -C target/native -j2
          file target/native/UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -q 'PE32 executable.*Intel 80386' DLL-FILE-TYPE.txt

      - name: Package artifacts
        run: |
          set -euxo pipefail
          root='release/DreamAvatar-v0.3.4-Direct-System-Icons-Saved-History-Experimental'
          mkdir -p "$root/Interface/AddOns/DreamAvatar" "$root/Audit"
          cp target/native/UnitXP_SP3.dll "$root/UnitXP_SP3.dll"
          cp target/DreamAvatar/DreamAvatar.lua "$root/Interface/AddOns/DreamAvatar/DreamAvatar.lua"

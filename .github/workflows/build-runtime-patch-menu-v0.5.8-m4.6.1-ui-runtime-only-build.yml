name: Build Runtime Patch Menu v0.5.8 M4.6.1 UI Runtime-only Build

on:
  push:
    branches:
      - fix/runtime-patch-menu-v0.5.8-m4.6.1-ui-runtime-only-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNRuntimeOnlyBinaryBuilder.h
          test -f iosruntimepatchmenu/src/ZNRuntimeOnlyBinaryBuilder.mm
          test -f iosruntimepatchmenu/src/ZNM461Polish.mm
          grep -q 'src/ZNRuntimeOnlyBinaryBuilder.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM461Polish.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM461PolishDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'runtimeOnly = actions.count > 0 && workspace.filledCount == 0' iosruntimepatchmenu/src/ZNStaticBinaryPipeline.mm
          grep -q 'Runtime-only Builder' iosruntimepatchmenu/src/ZNRuntimeOnlyBinaryBuilder.mm
          grep -q '__ZNDATA' iosruntimepatchmenu/src/ZNRuntimeOnlyBinaryBuilder.mm
          grep -q 'header->count = 0' iosruntimepatchmenu/src/ZNRuntimeOnlyBinaryBuilder.mm
          grep -q 'signature helper row + runtime-only build gate override installed' iosruntimepatchmenu/src/ZNM461Polish.mm
          grep -q 'ZNIL2CPPShortSignature' iosruntimepatchmenu/src/ZNM461Polish.mm
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          git diff --exit-code a3b8db8651eaea23ec0ae7e5fca497e8f67bcf6c -- \
            iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build M4.6.1
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m4.6.1
          cp .theos/obj/ZonoePatchV03.dylib dist-m4.6.1/ZonoPatch_v0.5.8_M4.6.1_UI_RuntimeOnlyBuild.dylib
          shasum -a 256 dist-m4.6.1/ZonoPatch_v0.5.8_M4.6.1_UI_RuntimeOnlyBuild.dylib | tee dist-m4.6.1/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m4.6.1/ZonoPatch_v0.5.8_M4.6.1_UI_RuntimeOnlyBuild.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out"
          strings -a "$out" > /tmp/zono_m461_strings.txt
          grep -q '\[m4.6-signature\]' /tmp/zono_m461_strings.txt
          grep -q '\[m4.6.1-polish\]' /tmp/zono_m461_strings.txt
          grep -q '\[m4.6.1-runtime-only-build\]' /tmp/zono_m461_strings.txt
          grep -q 'runtime-only-m4.6.1' /tmp/zono_m461_strings.txt
          grep -q 'il2cpp_method_get_param' /tmp/zono_m461_strings.txt
          init_size=$(otool -l "$out" | awk '$1=="sectname" && $2=="__init_offsets" {found=1; next} found && $1=="size" {print $2; exit}')
          echo "__init_offsets size=$init_size"
          test "$init_size" = '0x0000000000000004' -o "$init_size" = '0x4'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M4.6.1-UI-RuntimeOnlyBuild
          path: |
            iosruntimepatchmenu/dist-m4.6.1/ZonoPatch_v0.5.8_M4.6.1_UI_RuntimeOnlyBuild.dylib
            iosruntimepatchmenu/dist-m4.6.1/SHA256.txt
          if-no-files-found: error

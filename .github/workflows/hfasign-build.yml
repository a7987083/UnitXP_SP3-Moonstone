name: Build HFASign v3 alpha
# alphaone10 hardens the no-hook UDID bridge with port fallback and retry-safe result delivery

on:
  push:
    branches: [work/hfapatchipa-ksign-v3]
    paths: ["HFASign/**", ".github/workflows/hfasign-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Ksign source
        run: |
          set -euxo pipefail
          exec > >(tee HFASign/prepare.log) 2>&1
          git clone https://github.com/Nyasami/Ksign.git HFASignBuild
          git -C HFASignBuild checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          git -C HFASignBuild apply ../HFASign/patches/0001-Rebrand-Ksign-baseline-as-HFASign-alpha1.patch
          git -C HFASignBuild apply ../HFASign/patches/0003-HFASign-alpha3-detailed-signing-and-import-fixes.patch
          git -C HFASignBuild apply ../HFASign/patches/0004-zonoe-alpha4-incremental.patch
          git -C HFASignBuild apply ../HFASign/patches/0005-zonoe-alpha5-import-resources-signing-ui.patch
          git -C HFASignBuild apply ../HFASign/patches/0006-zonoe-alpha6-resource-actions-signing-fix.patch
          git -C HFASignBuild apply ../HFASign/patches/0007-zonoe-alpha7-import-zip-library.patch
          git -C HFASignBuild apply ../HFASign/patches/0008-zonoe-alpha8-udid-schemes-encrypted-sources.patch
          git -C HFASignBuild apply ../HFASign/patches/0009-zonoe-alpha9-udid-zip-sources.patch
          git -C HFASignBuild apply ../HFASign/patches/0010-zonoe-alpha9-compile-pending-validation.patch
          git -C HFASignBuild apply ../HFASign/patches/0011-zonoe-alpha10-source-zip-udid-fixes.patch
          git -C HFASignBuild apply ../HFASign/patches/0012-zonoe-alpha11-source-identity-advanced-signing.patch
          git -C HFASignBuild apply ../HFASign/patches/0013-zonoe-alpha12-signing-paging-unlock.patch
          git -C HFASignBuild apply ../HFASign/patches/0014-Fix-source-unlock-URL-identity-collisions.patch
          git -C HFASignBuild apply ../HFASign/patches/0015-Fix-alpha12-signing-and-import-regressions.patch
          git -C HFASignBuild apply ../HFASign/patches/0016-zonoe-alpha15-signing-navigation-unlock.patch
          git -C HFASignBuild apply ../HFASign/patches/0019-Import-ZsignSwift-for-signature-validation.patch
          git -C HFASignBuild apply ../HFASign/patches/0026-zonoe-alpha16-consolidated-fixes.patch
          git -C HFASignBuild apply ../HFASign/patches/0027-zonoe-alpha17-fix-signing-layered-interactive-back.patch
          git -C HFASignBuild apply ../HFASign/patches/0028-zonoe-alpha17-fix-udid-profile-service-completion.patch
          git -C HFASignBuild apply ../HFASign/patches/0029-zonoe-alpha17-fix-legacy-source-unlock-post.patch
          git -C HFASignBuild apply ../HFASign/patches/0030-zonoe-alpha18-native-signing-navigation.patch
          git -C HFASignBuild apply ../HFASign/patches/0031-zonoe-alpha18-udid-localserver-301-return.patch
          git -C HFASignBuild apply ../HFASign/patches/0032-zonoe-alpha18-source-unlock-real-protocol.patch
          git -C HFASignBuild apply ../HFASign/patches/0033-zonoe-alpha18-compile-restore-commoncrypto.patch
          git -C HFASignBuild apply ../HFASign/patches/0034-zonoe-alpha19-source-payload-metadata.patch
          git -C HFASignBuild apply ../HFASign/patches/0035-zonoe-alpha19-source-app-ui-filters-fields.patch
          git -C HFASignBuild apply ../HFASign/patches/0036-zonoe-alpha19-apple-app-store-search.patch
          git -C HFASignBuild apply ../HFASign/patches/0037-zonoe-alpha19-tabs-and-files-settings.patch
          git -C HFASignBuild apply ../HFASign/patches/0038-zonoe-alpha19-compile-source-ui.patch
          git -C HFASignBuild apply ../HFASign/patches/0039-zonoe-alpha19-compile-category-filter.patch
          git -C HFASignBuild apply ../HFASign/patches/0040-zonoe-alpha20-qnq-source-payload-decoders.patch
          git -C HFASignBuild apply ../HFASign/patches/0041-zonoe-alpha20-localized-appstore-regions.patch
          # 0042-0044 are preserved alpha21 history and intentionally not applied.
          git -C HFASignBuild apply ../HFASign/patches/0045-zonoe-alphaone1-import-QNQ-v0.7.2-source-pipeline.patch
          git -C HFASignBuild apply ../HFASign/patches/0046-zonoe-alphaone1-fix-source-and-settings-UI.patch
          git -C HFASignBuild apply ../HFASign/patches/0047-zonoe-alphaone1-keyboard-and-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0048-zonoe-alphaone2-source-certificate-feedback.patch
          git -C HFASignBuild apply ../HFASign/patches/0049-zonoe-alphaone3-fix-navigation-and-clipboard-completion.patch
          git -C HFASignBuild apply ../HFASign/patches/0050-zonoe-alphaone4-fix-signing-navigation-and-keyboard-dismissal.patch
          git -C HFASignBuild apply ../HFASign/patches/0051-zonoe-alphaone4-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0052-zonoe-alphaone5-restore-modal-signing-navigation.patch
          git -C HFASignBuild apply ../HFASign/patches/0053-zonoe-alphaone5-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0054-zonoe-alphaone6-signing-udid-callback-scheme.patch
          git -C HFASignBuild apply ../HFASign/patches/0055-zonoe-alphaone6-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0056-zonoe-alphaone7-show-udid-callback-on-signing-main.patch
          git -C HFASignBuild apply ../HFASign/patches/0057-zonoe-alphaone7-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0058-zonoe-alphaone8-clean-signing-udid-architecture.patch
          git -C HFASignBuild apply ../HFASign/patches/0059-zonoe-alphaone8-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0061-zonoe-alphaone8-udid-nonce-localhost-bridge.patch
          git -C HFASignBuild apply ../HFASign/patches/0062-zonoe-alphaone9-udid-result-store-wake-only-callback.patch
          git -C HFASignBuild apply ../HFASign/patches/0063-zonoe-alphaone9-build-identity.patch
          git -C HFASignBuild apply ../HFASign/patches/0064-zonoe-alphaone10-udid-bridge-reliability.patch
          git -C HFASignBuild apply ../HFASign/patches/0065-zonoe-alphaone10-build-identity.patch
          git -C HFASignBuild diff --check
          git -C HFASignBuild submodule update --init --recursive
          git -C HFASignBuild/Zsign apply ../../HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch
      - name: Live source decoder regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Backend/Sources/QNQSourcePayloadDecoder.swift \
            HFASign/scripts/SourceDecoderRegressionMain.swift \
            -framework Security \
            -o /tmp/zonoe-source-regression
          for attempt in 1 2 3; do
            if /tmp/zonoe-source-regression; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - name: Signing clean architecture regression
        run: |
          set -euxo pipefail
          xcrun swiftc \
            HFASignBuild/Ksign/Features/Signing/Domain/ZonoeUDIDCallback.swift \
            HFASignBuild/Ksign/Features/Signing/Application/ConfigureZonoeUDIDCallbackUseCase.swift \
            HFASignBuild/Ksign/Features/Signing/Infrastructure/ZonoeUDIDCallbackInfrastructure.swift \
            HFASign/scripts/SigningArchitectureRegressionMain.swift \
            -o /tmp/zonoe-signing-architecture-regression
          /tmp/zonoe-signing-architecture-regression
      - name: Apply zonoe icon
        run: |
          curl -L --fail --retry 3 -o /tmp/zonoe-icon.png 'https://app.zonoeios.xyz/uploads/20220704/d042be36ab9f4c73f0c721bccc6ba6c9.png'
          sips -c 901 901 /tmp/zonoe-icon.png --out /tmp/zonoe-square.png
          sips -z 1024 1024 /tmp/zonoe-square.png --out /tmp/zonoe-1024.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-default.png
          cp /tmp/zonoe-1024.png HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans.png
          cp /tmp/zonoe-1024.png 'HFASignBuild/Ksign/Resources/Assets.xcassets/AppIcon.appiconset/Ksign-trans 1.png'
      - name: Install packaging tools
        run: brew install ldid
      - name: Prepare installer assets
        working-directory: HFASignBuild
        run: make deps
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages
          git -C HFASignBuild/SourcePackages/checkouts/ZIPFoundation apply \
            ../../../../HFASign/patches/0018-Fix-ZIPFoundation-filename-encoding.patch
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project HFASignBuild/Ksign.xcodeproj -scheme Ksign \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath HFASignBuild/build -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath HFASignBuild/SourcePackages \
            SWIFT_VERSION=5 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee HFASign/build.log
      - name: Publish build diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "=== workflow diagnostics ==="
            pwd
            ls -la HFASign || true
            echo "=== prepare.log ==="
            tail -n 900 HFASign/prepare.log 2>&1 || true
            echo "=== build.log ==="
            tail -n 1200 HFASign/build.log 2>&1 || true
          } > HFASign/BUILD_ERROR.txt 2>&1
          git add -f HFASign/BUILD_ERROR.txt
          git commit -m "Publish zonoe alphaone10 build diagnostics [skip ci]" || true
          git push origin HEAD:work/hfapatchipa-ksign-v3 || true
      - name: Package TrollStore IPA
        run: |
          app="HFASignBuild/build/Build/Products/Release-iphoneos/Ksign.app"
          test -d "$app"
          cp HFASignBuild/deps/* "$app/" || true
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then ldid -S "$file"; fi
          done < <(find "$app/Frameworks" -type f 2>/dev/null || true)
          ldid -S "$app/Ksign"
          mkdir -p HFASign/dist/stage/Payload
          cp -R "$app" HFASign/dist/stage/Payload/HFASign.app
          cd HFASign/dist/stage
          ditto -c -k --sequesterRsrc --keepParent Payload ../zonoe_v3.0.0-alphaone10_TrollStore.ipa
          cd ..
          shasum -a 256 zonoe_v3.0.0-alphaone10_TrollStore.ipa > SHA256SUMS.txt
      - name: Verify product metadata and file import
        run: |
          plist="HFASign/dist/stage/Payload/HFASign.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" | grep -qx zonoe
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" | grep -qx com.hfa.sign
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" | grep -qx 3.0.0
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -qx 110
          /usr/libexec/PlistBuddy -c 'Print :ZonoeReleaseVersion' "$plist" | grep -qx v3.0.0-alphaone10
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$plist" | grep -qx public.data
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSItemContentTypes:0' "$plist" | grep -qx com.apple.framework
          strings "$plist" | grep -q alphaone10
          grep -q 'Button("筛选")' HFASignBuild/Ksign/Views/Sources/Apps/SourceAppsView.swift
          ! grep -q 'Button("字段")' HFASignBuild/Ksign/Views/Sources/Apps/SourceAppsView.swift
          ! grep -q 'contextMenuConfigurationForRowAt' HFASignBuild/Ksign/Views/Sources/Apps/UIKit/SourceAppsTableRepresentableView.swift
          grep -q 'Button("复制 UDID")' HFASignBuild/Ksign/Views/Settings/SettingsView.swift
          grep -q '"重新获取"' HFASignBuild/Ksign/Views/Settings/SettingsView.swift
          grep -q 'localized("添加")' HFASignBuild/Ksign/Views/Sources/SourcesAddView.swift
          ! grep -q 'localized("分享")' HFASignBuild/Ksign/Views/Sources/SourcesAddView.swift
          ! grep -q 'Button(.localized("导入"), systemImage: "square.and.arrow.down")' HFASignBuild/Ksign/Views/Sources/SourcesAddView.swift
          grep -q '正在添加软件源' HFASignBuild/Ksign/Views/Sources/SourcesAddView.swift
          grep -q 'Text(isAdded ? "已添加"' HFASignBuild/Ksign/Backend/Sources/SourceRepositoryLoader.swift
          grep -q 'UDID 复制成功' HFASignBuild/Ksign/Views/Settings/SettingsView.swift
          grep -q '已导入：' HFASignBuild/Ksign/Views/Settings/Certificates/CertificatesAddView.swift
          grep -q '证书状态' HFASignBuild/Ksign/Views/Settings/Certificates/Info/CertificatesInfoView.swift
          grep -q 'func finishClipboardImport()' HFASignBuild/Ksign/Backend/Sources/SourceRepositoryLoader.swift
          grep -q 'coordinator.finishClipboardImport()' HFASignBuild/Ksign/Backend/Sources/SourceRepositoryLoader.swift
          grep -q 'ZonoeKeyboardDismissBridge' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'recognizer.isEnabled = false' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'NBNavigationView("")' HFASignBuild/Ksign/Views/Library/LibraryView.swift
          grep -q 'fullScreenCover(item: \$_selectedSigningAppPresenting)' HFASignBuild/Ksign/Views/Library/LibraryView.swift
          grep -q 'NBNavigationView(app.name ?? .localized("未知"), displayMode: .inline)' HFASignBuild/Ksign/Views/Signing/SigningView.swift
          grep -q 'NBToolbarButton(role: .dismiss)' HFASignBuild/Ksign/Views/Signing/SigningView.swift
          ! grep -q 'NavigationStack(path: \$_navigationPath)' HFASignBuild/Ksign/Views/Library/LibraryView.swift
          ! grep -q 'navigationDestination(for: LibrarySigningRoute.self)' HFASignBuild/Ksign/Views/Library/LibraryView.swift
          ! grep -q '_interactiveBackGesture' HFASignBuild/Ksign/Views/Signing/SigningView.swift
          grep -q 'AppleStoreProductDetail(product: product)' HFASignBuild/Ksign/Views/Appstore/AppstoreView.swift
          grep -q 'zonoeUDIDCallbackEnabled' HFASignBuild/Ksign/Backend/Observable/OptionsManager.swift
          grep -q 'ZonoeUDIDCallbackSection(isEnabled:' HFASignBuild/Ksign/Views/Signing/SigningView.swift
          grep -q '注册 zonoe UDID 回调' HFASignBuild/Ksign/Features/Signing/Presentation/ZonoeUDIDCallbackSection.swift
          ! grep -q '注册 zonoe UDID 回调' HFASignBuild/Ksign/Views/Signing/Shared/SigningOptionsView.swift
          grep -q 'NavigationLink("高级签名选项")' HFASignBuild/Ksign/Views/Signing/SigningView.swift
          grep -q 'ConfigureZonoeUDIDCallbackUseCase' HFASignBuild/Ksign/Utilities/Handlers/SigningHandler.swift
          grep -q 'ZonoeUDIDCallbackPlistAdapter' HFASignBuild/Ksign/Utilities/Handlers/SigningHandler.swift
          ! grep -q 'yyyyMMddHHmm' HFASignBuild/Ksign/Utilities/Handlers/SigningHandler.swift
          ! grep -q 'UUID().uuidString' HFASignBuild/Ksign/Utilities/Handlers/SigningHandler.swift
          grep -q 'yyyyMMddHHmm' HFASignBuild/Ksign/Features/Signing/Infrastructure/ZonoeUDIDCallbackInfrastructure.swift
          grep -q 'UUID().uuidString' HFASignBuild/Ksign/Features/Signing/Application/ConfigureZonoeUDIDCallbackUseCase.swift
          grep -q 'app.get("bridge", "result", ":nonce")' HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -q 'app.post("bridge", "ack", ":nonce")' HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -q 'static let bridgePorts = \[14302, 49173, 50321, 51739, 53261, 54883\]' HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -q 'let result = bridgeResults\[nonce\]' HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          ! grep -q 'consumeBridgeResult(for: nonce)' HFASignBuild/Ksign/Backend/Server/UDIDService.swift
          grep -q 'prepareBridgeResult(udid: udid, nonce: requestNonce)' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'let openBridgeCallback: () -> Void' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'targetComponents.queryItems = items.isEmpty ? nil : items' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'let openLegacyCallback: () -> Void' HFASignBuild/Ksign/FeatherApp.swift
          grep -q 'openBridgeCallback()' HFASignBuild/Ksign/FeatherApp.swift
      - name: Publish SHA256 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HFASign/dist/SHA256SUMS.txt
          git commit -m "Publish zonoe v3.0.0-alphaone10 SHA256 [skip ci]" || true
          git push origin HEAD:work/hfapatchipa-ksign-v3
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="v3.0.0-alphaone10"
          ipa="HFASign/dist/zonoe_v3.0.0-alphaone10_TrollStore.ipa"
          sums="HFASign/dist/SHA256SUMS.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" "$sums" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$ipa" "$sums" --repo "$GITHUB_REPOSITORY" --target work/hfapatchipa-ksign-v3 --title "zonoe v3.0.0-alphaone10" --prerelease --notes "Harden the no-hook UDID bridge only: prefer port 14302 with deterministic fallback ports when occupied, and make Result Store reads retry-safe by requiring explicit ACK before deletion. Existing callback behavior and unrelated signing/source/navigation code remain unchanged."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zonoe-v3.0.0-alphaone10
          path: |
            HFASign/dist/zonoe_v3.0.0-alphaone10_TrollStore.ipa
            HFASign/dist/SHA256SUMS.txt
          if-no-files-found: error

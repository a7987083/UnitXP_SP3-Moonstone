name: M5.10.5 Final Offset Source Cleanup

on:
  push:
    branches:
      - feature/m5.10-offset-core-rebuild-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy Shared-Site Offset probe chain
        run: python3 iosruntimepatchmenu/tools/m5105_final_offset_cleanup.py
      - name: Commit deterministic cleanup
        run: |
          set -euxo pipefail
          if git diff --quiet --exit-code && git diff --cached --quiet --exit-code; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A iosruntimepatchmenu/src
          git commit -m "cleanup(offset): remove legacy shared-site probe chain"
          git push origin HEAD:feature/m5.10-offset-core-rebuild-v1

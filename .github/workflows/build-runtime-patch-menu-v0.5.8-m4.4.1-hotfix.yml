name: Build Runtime Patch Menu v0.5.8 M4.4.1 Hotfix

on:
  push:
    branches:
      - fix/runtime-patch-menu-v0.5.8-m4.4.1-keyboard-search-route
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'src/ZNM441Hotfix.mm' iosruntimepatchmenu/Makefile
          grep -q 'ZNInstallM441HotfixDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'm4.4.1-search' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'rva:0x%llX' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'Vector3' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'Quaternion' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'Color' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q '441000' iosruntimepatchmenu/src/ZNM441Hotfix.mm
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          git diff --exit-code a3b8db8651eaea23ec0ae7e5fca497e8f67bcf6c -- \
            iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm \
            iosruntimepatchmenu/src/ZNOffsetResolverV2.mm \
            iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build M4.4.1 Hotfix
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m4.4.1-hotfix
          cp .theos/obj/ZonoePatchV03.dylib dist-m4.4.1-hotfix/ZonoPatch_v0.5.8_M4.4.1_Hotfix.dylib
          shasum -a 256 dist-m4.4.1-hotfix/ZonoPatch_v0.5.8_M4.4.1_Hotfix.dylib | tee dist-m4.4.1-hotfix/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m4.4.1-hotfix/ZonoPatch_v0.5.8_M4.4.1_Hotfix.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out"
          strings -a "$out" > /tmp/zono_m441_strings.txt
          grep -q '\[offset-v2\]' /tmp/zono_m441_strings.txt
          grep -q '\[runtime-method-call\]' /tmp/zono_m441_strings.txt
          grep -q '\[instance-selection-v2\]' /tmp/zono_m441_strings.txt
          grep -q '\[m4.4.1-hotfix\]' /tmp/zono_m441_strings.txt
          grep -q '\[m4.4.1-search\]' /tmp/zono_m441_strings.txt
          grep -q '\[m4.4.1-struct\]' /tmp/zono_m441_strings.txt
          grep -q 'znm441_submitSearch:' /tmp/zono_m441_strings.txt
          grep -q 'znm441_executeAssembly:namespace:className:method:argumentCount:argumentValues:error:' /tmp/zono_m441_strings.txt
          grep -q 'il2cpp_runtime_invoke' /tmp/zono_m441_strings.txt
          init_size=$(otool -l "$out" | awk '$1=="sectname" && $2=="__init_offsets" {found=1; next} found && $1=="size" {print $2; exit}')
          echo "__init_offsets size=$init_size"
          test "$init_size" = '0x0000000000000004' -o "$init_size" = '0x4'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M4.4.1-Hotfix
          path: |
            iosruntimepatchmenu/dist-m4.4.1-hotfix/ZonoPatch_v0.5.8_M4.4.1_Hotfix.dylib
            iosruntimepatchmenu/dist-m4.4.1-hotfix/SHA256.txt
          if-no-files-found: error

name: Build Runtime Patch Menu v0.5.8 M4.7 Receiver + MultiArg V1

on:
  push:
    branches:
      - feature/runtime-patch-menu-v0.5.8-m4.7-receiver-capture-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source contract assertions
        run: |
          set -euxo pipefail
          test -f iosruntimepatchmenu/src/ZNM47ReceiverCapture.mm
          test -f iosruntimepatchmenu/src/ZNM47ReceiverCaptureUI.mm
          test -f iosruntimepatchmenu/src/ZNM47MultiArgInvoke.mm
          test -f iosruntimepatchmenu/src/ZNM47MultiArgUI.mm
          test -f iosruntimepatchmenu/src/ZNM47BuilderArgsUI.mm
          test -f iosruntimepatchmenu/src/ZNM47VersionUI.mm
          test -f iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'DobbyInstrument' iosruntimepatchmenu/src/ZNM47ReceiverCapture.mm
          grep -q 'ZN_RUNTIME_ACTION_MAX_ARGUMENTS 8u' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'ZNRuntimeActionFlagArgumentVectorText' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'reserved\[2\]' iosruntimepatchmenu/src/ZNRuntimeActionBuilder.mm
          grep -q 'm4.7-multiarg' iosruntimepatchmenu/src/ZNM47MultiArgInvoke.mm
          grep -q 'm4.7-multiarg-ui' iosruntimepatchmenu/src/ZNM47MultiArgUI.mm
          grep -q 'm4.7-builder-args' iosruntimepatchmenu/src/ZNM47BuilderArgsUI.mm
          grep -q '0.5.8 · M4.7' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNInstallM47ReceiverCaptureUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM47MultiArgInvokeDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM47MultiArgUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM47BuilderArgsUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'ZNInstallM47VersionUIDeferred' iosruntimepatchmenu/src/ZNIL2CPPMethodFinderMenuBinding.mm
          grep -q 'src/ZNM47MultiArgInvoke.mm' iosruntimepatchmenu/Makefile
          grep -q 'src/ZNM47MultiArgUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h

      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          # Python 3.13+ removed the legacy pipes module; this pinned Dobby
          # builder imports it but does not use it, so remove that dead import
          # rather than changing the pinned Dobby source revision.
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
          file build/iphoneos/arm64/libdobby.a

      - name: Build M4.7
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m4.7
          cp .theos/obj/ZonoePatchV03.dylib dist-m4.7/ZonoPatch_v0.5.8_M4.7_Receiver_MultiArg_V1.dylib
          shasum -a 256 dist-m4.7/ZonoPatch_v0.5.8_M4.7_Receiver_MultiArg_V1.dylib | tee dist-m4.7/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m4.7/ZonoPatch_v0.5.8_M4.7_Receiver_MultiArg_V1.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out"
          strings -a "$out" > /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-receiver-capture\]' /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-receiver-ui\]' /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-multiarg\]' /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-multiarg-ui\]' /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-builder-args\]' /tmp/zono_m47_strings.txt
          grep -q '\[m4.7-version\]' /tmp/zono_m47_strings.txt
          grep -q 'DobbyInstrument' /tmp/zono_m47_strings.txt
          grep -q 'Receiver Capture + Multi-Arg Invoke' /tmp/zono_m47_strings.txt
          init_size=$(otool -l "$out" | awk '$1=="sectname" && $2=="__init_offsets" {found=1; next} found && $1=="size" {print $2; exit}')
          echo "__init_offsets size=$init_size"
          test "$init_size" = '0x0000000000000004' -o "$init_size" = '0x4'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.8-M4.7-Receiver-MultiArg-V1
          path: |
            iosruntimepatchmenu/dist-m4.7/ZonoPatch_v0.5.8_M4.7_Receiver_MultiArg_V1.dylib
            iosruntimepatchmenu/dist-m4.7/SHA256.txt
          if-no-files-found: error

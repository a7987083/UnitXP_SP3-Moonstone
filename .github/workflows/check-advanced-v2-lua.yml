name: Check Advanced V2 Lua

on:
  workflow_dispatch:
  push:
    branches: ['agent/guild-auth-gate']
    paths:
      - 'cleanroom/advanced-v2-lua/**'
      - 'cleanroom/apply_advanced_editor_v2.py'
      - 'cleanroom/apply_fubar_v1.py'
      - 'cleanroom/apply_team_state_sync_v1.py'
      - 'cleanroom/apply_team_state_logout_guard_v1.py'
      - 'cleanroom/apply_team_state_upvalue_fix_v1.py'
      - 'cleanroom/apply_team_state_deferred_scene_v1.py'
      - 'cleanroom/apply_team_state_local_scene_fix_v1.py'
      - '.github/workflows/check-advanced-v2-lua.yml'
  pull_request:
    branches: [cleanroom-v1]
    paths:
      - 'cleanroom/advanced-v2-lua/**'
      - 'cleanroom/apply_advanced_editor_v2.py'
      - 'cleanroom/apply_fubar_v1.py'
      - 'cleanroom/apply_team_state_sync_v1.py'
      - 'cleanroom/apply_team_state_logout_guard_v1.py'
      - 'cleanroom/apply_team_state_upvalue_fix_v1.py'
      - 'cleanroom/apply_team_state_deferred_scene_v1.py'
      - 'cleanroom/apply_team_state_local_scene_fix_v1.py'
      - '.github/workflows/check-advanced-v2-lua.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Decode, install sync guards, and validate Lua
        run: |
          set -euxo pipefail
          mkdir decoded
          python3 - <<'PY'
          import base64
          import hashlib
          import zlib
          from pathlib import Path

          expected = {
              'MoonMarker.lua': '198abe3af6215255c38fd0999780d46cfcba841f6c0f48211d364b75f7f010f1',
              'GuildAdvanced.lua': 'ff534ba57b7020d45fd437e5455db14acb7d1c01bfa0c7a13b397be0aea2b0f6',
          }
          root = Path('cleanroom/advanced-v2-lua')
          out = Path('decoded')
          for name, wanted in expected.items():
              encoded = ''.join((root / f'{name}.zlib.b64').read_text(encoding='ascii').split())
              raw = zlib.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'{name}: checksum mismatch {actual}')
              (out / name).write_bytes(raw)
          PY
          python3 cleanroom/apply_team_state_sync_v1.py --addon-root decoded
          mkdir -p staged/MoonMarker
          cp decoded/MoonMarker.lua staged/MoonMarker/MoonMarker.lua
          python3 cleanroom/apply_team_state_logout_guard_v1.py --addon staged
          python3 cleanroom/apply_team_state_upvalue_fix_v1.py --addon staged
          python3 cleanroom/apply_team_state_deferred_scene_v1.py --addon staged
          python3 cleanroom/apply_team_state_local_scene_fix_v1.py --addon staged
          cp staged/MoonMarker/MoonMarker.lua decoded/MoonMarker.lua
          luac5.1 -p decoded/MoonMarker.lua
          luac5.1 -p decoded/GuildAdvanced.lua
          grep -Fq 'MoonMarker.Targeting.Begin' decoded/MoonMarker.lua
          grep -Fq 'TEAM_SYNC_INTERVAL = 5.0' decoded/MoonMarker.lua
          grep -Fq 'message == "SYNCREQ"' decoded/MoonMarker.lua
          grep -Fq 'SLASH_MOONMARKERSYNC1 = "/mmsync"' decoded/MoonMarker.lua
          grep -Fq 'PLAYER_LEAVING_WORLD' decoded/MoonMarker.lua
          grep -Fq 'not worldReadyForMarkers then return end' decoded/MoonMarker.lua
          grep -Fq 'local function MoonMarkerHandleVariablesLoaded()' decoded/MoonMarker.lua
          grep -Fq 'local function MoonMarkerHandleWorldEvent(currentEvent)' decoded/MoonMarker.lua
          grep -Fq 'local function MoonMarkerHandleAddonMessage(prefix, message, channel, sender)' decoded/MoonMarker.lua
          grep -Fq 'MoonMarkerHandleAddonMessage(arg1, arg2, arg3, arg4)' decoded/MoonMarker.lua
          grep -Fq 'local function ApplyPendingSceneChanges()' decoded/MoonMarker.lua
          grep -Fq 'SetTeamMark(color, marker, x, y, z, true)' decoded/MoonMarker.lua
          grep -Fq 'ClearTeamState(true)' decoded/MoonMarker.lua
          grep -Fq 'local pendingSceneColors = {}' decoded/MoonMarker.lua
          ! grep -Fq 'pcall(UnitXP, "MoonMarker.Remote", color, nx, ny, nz, marker)' decoded/MoonMarker.lua
          grep -Fq 'local function EnsureStorage' decoded/GuildAdvanced.lua
          grep -Fq 'MoonMarker.Advanced.ScanM2.Start' decoded/GuildAdvanced.lua

name: HFAMapUniversal fenpingvip v7

on:
  push:
    branches:
      - fenpingvip
    paths:
      - 'hfamap/**'
      - '.github/workflows/theos-hfamap-fenpingvip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build fenpingvip v7
        run: |
          cd hfamap
          make clean
          make FINALPACKAGE=1
          mkdir -p dist
          out="dist/HFAMapUniversal_fenpingvip_v7.dylib"
          cp .theos/obj/HFAMapUniversal.dylib "$out"
          file "$out"
          shasum -a 256 "$out" | tee dist/SHA256_fenpingvip_v7.txt
          strings "$out" > dist/fenpingvip_v7.strings
          grep -Fq "HFAMapUniversal fenpingvip v7 offset-patch controller" dist/fenpingvip_v7.strings
          grep -Fq "NVideo VIP Authorization State Test · RVA Anchored" dist/fenpingvip_v7.strings
          grep -Fq "[OFFSET_READY]" dist/fenpingvip_v7.strings
          grep -Fq "[PATCH_WRITE]" dist/fenpingvip_v7.strings
          grep -Fq "[STATE_OFFSET_PATCH]" dist/fenpingvip_v7.strings
          grep -Fq "0x4AB18" dist/fenpingvip_v7.strings
          grep -Fq "02 0C 00 F9" dist/fenpingvip_v7.strings
          grep -Fq "恢复原始指令" dist/fenpingvip_v7.strings
          ! grep -Fq "Auto Detect / Full Scan" dist/fenpingvip_v7.strings

      - name: Publish raw dylib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hfamap/dist/HFAMapUniversal_fenpingvip_v7.dylib hfamap/dist/SHA256_fenpingvip_v7.txt
          git commit -m "Publish fenpingvip v7 dylib [skip ci]" || exit 0
          git push origin HEAD:fenpingvip

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HFAMapUniversal-fenpingvip-v7
          path: |
            hfamap/dist/HFAMapUniversal_fenpingvip_v7.dylib
            hfamap/dist/SHA256_fenpingvip_v7.txt
          if-no-files-found: error

name: Inspect DreamWeapon Native Client Calls

on:
  push:
    branches:
      - tmp-build-farsight6196-area4501
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode DreamWeapon v0.3.4 patch and inspect native calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib
          src=pathlib.Path('slim/dreamweapon-v0.3.4-public-full-receiver/dw-v034.patch.gz.b64').read_text().strip()
          raw=gzip.decompress(base64.b64decode(src))
          pathlib.Path('/tmp/dreamweapon.patch').write_bytes(raw)
          print('decoded bytes', len(raw))
          PY
          echo '=== Files touched ==='
          grep '^diff --git ' /tmp/dreamweapon.patch || true
          echo
          echo '=== VanillaHelpers references ==='
          grep -niE 'VanillaHelpers|VanillaHelper' /tmp/dreamweapon.patch || true
          echo
          echo '=== WoW addresses / native function typedefs ==='
          grep -niE '0x[0-9A-Fa-f]{5,8}|reinterpret_cast|__thiscall|__cdecl|__stdcall|typedef.*\(.*\*' /tmp/dreamweapon.patch | head -n 300 || true
          echo
          echo '=== Model / display / attachment / weapon / mount / enchant symbols ==='
          grep -niE 'Display|Model|Attachment|Weapon|Mount|Enchant|Native|Refresh|Disable|Enable|ItemVisual|Visual|CM2|M2|Scene' /tmp/dreamweapon.patch | head -n 500 || true
          echo
          echo '=== Added C/C++ function declarations and definitions ==='
          grep -nE '^\+.*(bool|void|int|uint32_t|uintptr_t|DWORD|float|double|static|auto)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(' /tmp/dreamweapon.patch | head -n 400 || true
          echo
          echo '=== Context around client-address lines ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/dreamweapon.patch').read_text(errors='replace').splitlines()
          hits=[]
          for i,l in enumerate(lines):
              if re.search(r'0x[0-9A-Fa-f]{5,8}|DisplayID|DisplayId|Attachment|Enchant|Mount|Weapon|Disable|Enable|nativeM2|CM2', l, re.I):
                  hits.append(i)
          shown=set()
          for i in hits:
              a=max(0,i-4); b=min(len(lines),i+5)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print(f'--- lines {a+1}-{b} ---')
              for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY

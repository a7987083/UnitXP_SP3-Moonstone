name: Build Slice 6774 MPQ Test

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build host repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Build patcher
        working-directory: raid-visuals
        run: cargo build --release

      - name: Rebuild untouched 1.4.18 base
        working-directory: raid-visuals
        run: ./target/release/wow_dbc_patcher build --mpq patch-O-base.mpq

      - name: Verify base matches user's current patch-O.mpq
        working-directory: raid-visuals
        shell: bash
        run: |
          echo "aa99e91794b52ef4dba076b154c9bf5abd1b9417aa4e66925a454e4506bf898f  patch-O-base.mpq" | sha256sum -c -

      - name: Add Slice 6774 visual test patch
        shell: bash
        run: |
          cat > raid-visuals/patches/z-test-slice-6774.yaml <<'YAML'
          # Slice and Dice (6774) visual test
          # Preserve original SpellVisual 254 and add a 10y flame ring as StateKit.
          SpellVisualKit.dbc:
            - type: insert
              key: 9390
              values:
                ID: 9390
                KitType: 2
                BaseEffect: 4903

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9390
                StateKit: 9390

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9390
          YAML

      - name: Build Slice 6774 test MPQ
        working-directory: raid-visuals
        run: ./target/release/wow_dbc_patcher build --mpq patch-O-6774-test.mpq

      - name: Show test output
        working-directory: raid-visuals
        run: ls -lh patch-O-6774-test.mpq && sha256sum patch-O-6774-test.mpq

      - name: Upload MPQ artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-O-6774-test-v2
          path: raid-visuals/patch-O-6774-test.mpq
          if-no-files-found: error
          retention-days: 3

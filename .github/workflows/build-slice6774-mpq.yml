name: Inspect Perotharn AreaKits

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals
      - name: Dump AreaKit 7027 and 7028
        working-directory: raid-visuals
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          def fields(path):
              out=[]; started=False
              for raw in Path(path).read_text(encoding='utf-8').splitlines():
                  if raw.strip()=='fields:': started=True; continue
                  if started and raw.startswith('  - '):
                      out.append(raw.split('- ',1)[1].split('#',1)[0].strip())
                  elif started and raw.strip() and not raw.strip().startswith('#') and not raw.startswith('  '):
                      break
              return out

          def load(path,schema):
              fs=fields(schema); d=Path(path).read_bytes()
              magic,n,fc,rs,ss=struct.unpack_from('<4s4I',d,0); assert magic==b'WDBC'
              rows=[]
              for i in range(n): rows.append(list(struct.unpack('<%dI'%(rs//4),d[20+i*rs:20+(i+1)*rs])))
              return fs,{r[0]:r for r in rows}

          kf,krows=load('dbc/SpellVisualKit.dbc','schema/SpellVisualKit.dbc.yaml')
          sf,srows=load('dbc/SpellVisual.dbc','schema/SpellVisual.dbc.yaml')
          for kid in (7027,7028,7030,7031):
              r=krows[kid]
              print(f'=== SpellVisualKit {kid} ===')
              for i,name in enumerate(kf):
                  v=r[i]
                  if v != 0:
                      f=struct.unpack('<f',struct.pack('<I',v))[0]
                      print(f'{i:02d} {name} = {v} (0x{v:08X}) float={f!r}')
          for vid in (8018,8019,8020):
              r=srows[vid]
              print(f'=== SpellVisual {vid} ===')
              for i,name in enumerate(sf):
                  v=r[i]
                  if v != 0: print(f'{i:02d} {name} = {v}')
          PY

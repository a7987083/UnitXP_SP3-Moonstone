name: Inspect Dirk 36834-36837

on:
  push:
    branches:
      - tmp-inspect-dirk-36834-36837
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals
      - name: Dump four Dirk spells and visuals
        working-directory: raid-visuals
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          def fields(path):
              out=[]; started=False
              for raw in Path(path).read_text(encoding='utf-8').splitlines():
                  if raw.strip()=='fields:': started=True; continue
                  if started and raw.startswith('  - '): out.append(raw.split('- ',1)[1].split('#',1)[0].strip())
                  elif started and raw.strip() and not raw.strip().startswith('#') and not raw.startswith('  '): break
              return out

          class DBC:
              def __init__(self,p,s):
                  self.fields=fields(s); self.idx={n:i for i,n in enumerate(self.fields)}
                  d=Path(p).read_bytes(); magic,n,fc,rs,ss=struct.unpack_from('<4s4I',d,0); assert magic==b'WDBC'
                  self.str=d[20+n*rs:20+n*rs+ss]
                  self.rows=[list(struct.unpack('<%dI'%(rs//4),d[20+i*rs:20+(i+1)*rs])) for i in range(n)]
                  self.byid={r[0]:r for r in self.rows}
              def get(self,i): return self.byid.get(i)
              def val(self,r,n):
                  j=self.idx.get(n); return r[j] if j is not None and j<len(r) else None
              def text(self,o):
                  if not o:return ''
                  e=self.str.find(b'\0',o); e=len(self.str) if e<0 else e
                  return self.str[o:e].decode('utf-8','replace')

          sp=DBC('dbc/Spell.dbc','schema/Spell.dbc.yaml')
          sv=DBC('dbc/SpellVisual.dbc','schema/SpellVisual.dbc.yaml')
          kit=DBC('dbc/SpellVisualKit.dbc','schema/SpellVisualKit.dbc.yaml')
          eff=DBC('dbc/SpellVisualEffectName.dbc','schema/SpellVisualEffectName.dbc.yaml')

          ids=[36834,36835,36836,36837]
          visuals=set(); kits=set(); effects=set()
          wanted=('SpellVisualID_','DurationIndex','CastingTimeIndex','RangeIndex','Speed','Effect_','EffectAura_','EffectImplicitTargetA_','EffectImplicitTargetB_','EffectRadiusIndex_','EffectTriggerSpell_','EffectBasePoints_','EffectMiscValue_','EffectMiscValueB_')

          print('=== SPELLS 36834-36837 ===')
          for sid in ids:
              r=sp.get(sid); print('\nSPELL',sid)
              if not r: print('MISSING'); continue
              for f in sp.fields:
                  if f in ('Name','Description'):
                      print(f,'=',sp.text(sp.val(r,f)))
                  elif f=='ID' or f.startswith(wanted) or f.startswith('Attributes'):
                      v=sp.val(r,f)
                      if v is not None and (v!=0 or f in ('SpellVisualID_1','SpellVisualID_2','DurationIndex','RangeIndex','Speed')): print(f,'=',v)
              for f in ('SpellVisualID_1','SpellVisualID_2'):
                  v=sp.val(r,f)
                  if v: visuals.add(v)

          print('\n=== REFERENCED SPELLVISUALS ===')
          for vid in sorted(visuals):
              r=sv.get(vid); print('\nVISUAL',vid)
              if not r: print('MISSING'); continue
              for f in sv.fields:
                  v=sv.val(r,f)
                  if v is not None: print(f,'=',v)
              for f in ('PrecastKit','CastKit','ImpactKit','StateKit','ChannelKit','AreaKit'):
                  v=sv.val(r,f)
                  if v: kits.add(v)
              for f in ('MissileModel','AreaModel'):
                  v=sv.val(r,f)
                  if v: effects.add(v)

          print('\n=== REFERENCED KITS ===')
          for kid in sorted(kits):
              r=kit.get(kid); print('\nKIT',kid)
              if not r: print('MISSING'); continue
              for f in kit.fields:
                  v=kit.val(r,f)
                  if v:
                      print(f,'=',v)
                      if 'Effect' in f: effects.add(v)

          print('\n=== REFERENCED EFFECT MODELS ===')
          for eid in sorted(effects):
              r=eff.get(eid)
              if not r: continue
              print('EFFECT',eid,'|',eff.text(eff.val(r,'Name')),'|',eff.text(eff.val(r,'FileName')),'| ScaleRaw',eff.val(r,'Scale'))
          PY

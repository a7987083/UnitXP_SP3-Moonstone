name: Build Dual Skill Perotharn Visual Test

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Add dual skill boss-model test patch
        shell: bash
        run: |
          cat > raid-visuals/patches/z-test-perotharn-dual-skill.yaml <<'YAML'
          # Peroth'arn Savage Blade local visual test
          # 6774 Slice and Dice keeps original visual and additionally plays:
          #   Effect 4501 = DirkOfTheBeast_Area_PreCast.mdx
          # 52531 Envenom keeps original visual and additionally plays:
          #   Effect 4502 = DirkOfTheBeast_Area_Cast.mdx

          SpellVisualKit.dbc:
            - type: copy
              key: 416
              values:
                ID: 9401
                BaseEffect: 4501

            - type: copy
              key: 37
              values:
                ID: 9402
                BaseEffect: 4502

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9411
                CastKit: 9401

            - type: copy
              key: 19
              values:
                ID: 9412
                CastKit: 9402

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9411

            - type: update
              key: 52531
              values:
                SpellVisualID_1: 9412
          YAML

      - name: Build DBC patcher
        working-directory: raid-visuals
        run: cargo build --release

      - name: Build standalone patch-P overlay
        working-directory: raid-visuals
        shell: bash
        run: |
          mkdir -p empty-includes
          ./target/release/wow_dbc_patcher build \
            -d dbc/Spell.dbc \
            -d dbc/SpellVisual.dbc \
            -d dbc/SpellVisualKit.dbc \
            --includes-dir empty-includes \
            --mpq patch-P.mpq
          ls -lh patch-P.mpq
          sha256sum patch-P.mpq

      - name: Upload patch-P.mpq
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-perotharn-dual-skill-test
          path: raid-visuals/patch-P.mpq
          if-no-files-found: error
          retention-days: 3

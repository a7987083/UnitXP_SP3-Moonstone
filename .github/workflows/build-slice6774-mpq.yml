name: Build Shaman Earthquake Exact 8018 Test

on:
  push:
    branches:
      - tmp-build-farsight6196-area4501
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals
      - name: Create Earthquake test patch
        working-directory: raid-visuals
        shell: bash
        run: |
          cat > earthquake-8018.yaml <<'EOF'
          Spell.dbc:
            - type: update
              key: 48306
              values:
                SpellVisualID_1: 8018
            - type: update
              key: 48307
              values:
                SpellVisualID_1: 8018
            - type: update
              key: 48308
              values:
                SpellVisualID_1: 8018
          EOF
          cat > BUILD-INFO.txt <<'EOF'
          Shaman Earthquake visual test
          Patched spell IDs: 48306, 48307, 48308
          Original visual: 7976
          Test visual: 8018
          8018: HasArea=1 AreaModel=4501 AreaKit=7027
          4501: Spells\DirkOfTheBeast_Area_PreCast.mdx
          These Earthquake ranks use Effect_2=27 (SPELL_EFFECT_PERSISTENT_AREA_AURA).
          EOF
      - name: Build MPQ
        working-directory: raid-visuals
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p empty-includes
          cargo build --release
          ./target/release/wow_dbc_patcher build \
            --patches earthquake-8018.yaml \
            --includes-dir empty-includes \
            --out-dir build-earthquake \
            --mpq patch-P-Shaman-Earthquake-Exact8018.mpq
          test -s patch-P-Shaman-Earthquake-Exact8018.mpq
          file patch-P-Shaman-Earthquake-Exact8018.mpq
          stat -c 'MPQ bytes: %s' patch-P-Shaman-Earthquake-Exact8018.mpq | tee -a BUILD-INFO.txt
          sha256sum patch-P-Shaman-Earthquake-Exact8018.mpq | tee SHA256.txt
      - name: Package artifact
        working-directory: raid-visuals
        shell: bash
        run: |
          mkdir -p artifact
          cp patch-P-Shaman-Earthquake-Exact8018.mpq artifact/
          cp earthquake-8018.yaml artifact/
          cp BUILD-INFO.txt artifact/
          cp SHA256.txt artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Shaman-Earthquake-Exact8018-${{ github.run_number }}
          path: raid-visuals/artifact/*
          if-no-files-found: error
          retention-days: 14

name: Inspect DreamAvatar Native Model Layers

on:
  push:
    branches:
      - tmp-build-farsight6196-area4501
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode native model patches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/dreamweapon-v0.3.4-public-full-receiver
          git show FETCH_HEAD:slim/dreamavatar-v0.2-native-model-rebuild/native-model-rebuild.patch.gz.b64 > /tmp/v02.b64
          git show FETCH_HEAD:slim/dreamavatar-v0.3.2-npc-weapons-mount-history/v032.patch.gz.b64 > /tmp/v032.b64
          python3 - <<'PY'
          import base64,gzip,pathlib
          for src,dst in [('/tmp/v02.b64','/tmp/v02.patch'),('/tmp/v032.b64','/tmp/v032.patch')]:
              raw=gzip.decompress(base64.b64decode(pathlib.Path(src).read_text().strip()))
              pathlib.Path(dst).write_bytes(raw)
              print(dst, len(raw), 'bytes')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in ['/tmp/v02.patch','/tmp/v032.patch']:
              lines=Path(path).read_text(errors='replace').splitlines()
              print('\n================',path,'================')
              for l in lines:
                  if l.startswith('diff --git '): print(l)
              print('\n=== Native/C++ added code matching model internals ===')
              pat=re.compile(r'0x[0-9A-Fa-f]{5,8}|Display|Model|Weapon|Mount|Enchant|Glow|Attachment|Disable|Enable|Rebuild|Refresh|Item|Object|Guid|Native|CM2|M2|Scene|Update|Set',re.I)
              # Print merged context windows only for added/native lines.
              hits=[]
              in_native=False
              for i,l in enumerate(lines):
                  if l.startswith('diff --git '): in_native=('native/' in l or 'dllmain.cpp' in l or '.h ' in l)
                  if in_native and l.startswith('+') and not l.startswith('+++') and pat.search(l): hits.append(i)
              merged=[]
              for i in hits:
                  a=max(0,i-8); b=min(len(lines),i+12)
                  if merged and a <= merged[-1][1]+3: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                  else: merged.append((a,b))
              for a,b in merged:
                  print(f'--- {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
              print('\n=== All added native function signatures ===')
              in_native=False
              for i,l in enumerate(lines):
                  if l.startswith('diff --git '): in_native=('native/' in l or 'dllmain.cpp' in l or '.h ' in l)
                  if in_native and l.startswith('+') and re.search(r'\b(bool|void|int|uint32_t|uintptr_t|DWORD|float|double|std::|static|inline|auto)\b.*\(',l):
                      print(f'{i+1}: {l}')
          PY

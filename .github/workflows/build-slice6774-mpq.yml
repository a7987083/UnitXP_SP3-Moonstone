name: Build Slice 6774 WorldEffect 4501 Test

on:
  push:
    branches:
      - tmp-build-farsight6196-area4501
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Create Slice WorldEffect test patch
        working-directory: raid-visuals
        shell: bash
        run: |
          set -euxo pipefail
          cat > slice-6774-worldeffect-4501.yaml <<'EOF'
          SpellVisualKit.dbc:
            - type: copy
              key: 416
              values:
                ID: 9395
                WorldEffect: 4501

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9395
                CastKit: 9395

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9395
          EOF

          cat > BUILD-INFO.txt <<'EOF'
          Slice and Dice 6774 WorldEffect test
          Original visual: 254
          Original CastKit: 416
          New visual: 9395 (copy of 254)
          New CastKit: 9395 (copy of 416)
          Only added field: SpellVisualKit.WorldEffect = 4501
          Effect 4501: Spells\DirkOfTheBeast_Area_PreCast.mdx
          Goal: test the native CEffect world-plant slot instead of BaseEffect/AreaModel.
          Expected placement if this path matches client reverse engineering: caster world position + caster facing.
          EOF

      - name: Build MPQ
        working-directory: raid-visuals
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p empty-includes
          cargo build --release
          ./target/release/wow_dbc_patcher build \
            --patches slice-6774-worldeffect-4501.yaml \
            --includes-dir empty-includes \
            --out-dir build-slice-worldeffect \
            --mpq patch-P-Slice6774-WorldEffect4501.mpq
          test -s patch-P-Slice6774-WorldEffect4501.mpq
          file patch-P-Slice6774-WorldEffect4501.mpq
          stat -c 'MPQ bytes: %s' patch-P-Slice6774-WorldEffect4501.mpq | tee -a BUILD-INFO.txt
          sha256sum patch-P-Slice6774-WorldEffect4501.mpq | tee SHA256.txt

      - name: Package artifact
        working-directory: raid-visuals
        shell: bash
        run: |
          mkdir -p artifact
          cp patch-P-Slice6774-WorldEffect4501.mpq artifact/
          cp slice-6774-worldeffect-4501.yaml artifact/
          cp BUILD-INFO.txt artifact/
          cp SHA256.txt artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: Slice6774-WorldEffect4501-${{ github.run_number }}
          path: raid-visuals/artifact/*
          if-no-files-found: error
          retention-days: 14

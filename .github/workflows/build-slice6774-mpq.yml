name: Inspect Envenom 52531 Visual

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals
      - name: Inspect 52531 and models 4501/4502
        working-directory: raid-visuals
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          def fields(path):
              out=[]; started=False
              for raw in Path(path).read_text(encoding='utf-8').splitlines():
                  if raw.strip()=='fields:': started=True; continue
                  if started and raw.startswith('  - '): out.append(raw.split('- ',1)[1].split('#',1)[0].strip())
                  elif started and raw.strip() and not raw.strip().startswith('#') and not raw.startswith('  '): break
              return out

          class DBC:
              def __init__(self,p,s):
                  self.fields=fields(s); self.idx={n:i for i,n in enumerate(self.fields)}
                  d=Path(p).read_bytes(); magic,n,fc,rs,ss=struct.unpack_from('<4s4I',d,0); assert magic==b'WDBC'
                  self.str=d[20+n*rs:20+n*rs+ss]
                  self.rows={}
                  for i in range(n):
                      r=list(struct.unpack('<%dI'%(rs//4),d[20+i*rs:20+(i+1)*rs])); self.rows[r[0]]=r
              def get(self,i): return self.rows.get(i)
              def val(self,r,n):
                  j=self.idx.get(n); return r[j] if j is not None and j<len(r) else None
              def text(self,o):
                  if not o:return ''
                  e=self.str.find(b'\0',o); e=len(self.str) if e<0 else e
                  return self.str[o:e].decode('utf-8','replace')

          sp=DBC('dbc/Spell.dbc','schema/Spell.dbc.yaml')
          sv=DBC('dbc/SpellVisual.dbc','schema/SpellVisual.dbc.yaml')
          kit=DBC('dbc/SpellVisualKit.dbc','schema/SpellVisualKit.dbc.yaml')
          eff=DBC('dbc/SpellVisualEffectName.dbc','schema/SpellVisualEffectName.dbc.yaml')

          for sid in (6774,52531):
              r=sp.get(sid); print(f'=== SPELL {sid} ===')
              for f in ('SpellVisualID_1','SpellVisualID_2','DurationIndex','Effect_1','Effect_2','Effect_3','EffectAura_1','EffectAura_2','EffectAura_3'):
                  print(f,sp.val(r,f) if r else None)
              if r:
                  for vf in ('SpellVisualID_1','SpellVisualID_2'):
                      vid=sp.val(r,vf)
                      if vid:
                          vr=sv.get(vid); print(f'--- VISUAL {vid} ---')
                          for f in sv.fields: print(f,sv.val(vr,f))
                          for kf in ('PrecastKit','CastKit','ImpactKit','StateKit','ChannelKit','AreaKit'):
                              kid=sv.val(vr,kf)
                              if kid:
                                  kr=kit.get(kid); print(f'--- KIT {kid} ({kf}) ---')
                                  for f in kit.fields:
                                      v=kit.val(kr,f)
                                      if v not in (0,4294967295,None): print(f,v)

          for eid in (4501,4502):
              r=eff.get(eid); print(f'=== EFFECT {eid} ===')
              if r:
                  print('Name',eff.text(eff.val(r,'Name')))
                  print('FileName',eff.text(eff.val(r,'FileName')))
                  print('ScaleRaw',eff.val(r,'Scale'))
              else: print('NOT FOUND')
          PY

name: Build Slice 6774 MPQ Test

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build host repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Add Slice 6774 visual test patch
        shell: bash
        run: |
          cat > raid-visuals/patches/z-test-slice-6774.yaml <<'YAML'
          SpellVisualKit.dbc:
            - type: insert
              key: 9390
              values:
                ID: 9390
                KitType: 2
                BaseEffect: 4903

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9390
                StateKit: 9390

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9390
          YAML

      - name: Build DBC patcher
        working-directory: raid-visuals
        run: cargo build --release

      - name: Build standalone patch-P overlay
        working-directory: raid-visuals
        shell: bash
        run: |
          mkdir -p empty-includes
          ./target/release/wow_dbc_patcher build \
            -d dbc/Spell.dbc \
            -d dbc/SpellVisual.dbc \
            -d dbc/SpellVisualKit.dbc \
            --includes-dir empty-includes \
            --mpq patch-P.mpq
          ls -lh patch-P.mpq
          sha256sum patch-P.mpq

      - name: Upload patch-P.mpq
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-slice6774-overlay
          path: raid-visuals/patch-P.mpq
          if-no-files-found: error
          retention-days: 3

name: Build Slice 6774 MPQ Test

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build host repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Build DBC patcher
        working-directory: raid-visuals
        run: cargo build --release

      - name: Download exact official 1.4.18 MPQ
        shell: bash
        run: |
          curl -L --fail -o patch-O-6774-test.mpq https://github.com/MarcelineVQ/twow-raid-visuals/releases/download/1.4.18/patch-O.mpq
          echo "aa99e91794b52ef4dba076b154c9bf5abd1b9417aa4e66925a454e4506bf898f  patch-O-6774-test.mpq" | sha256sum -c -

      - name: Add Slice 6774 visual test patch
        shell: bash
        run: |
          cat > raid-visuals/patches/z-test-slice-6774.yaml <<'YAML'
          # Slice and Dice (6774) visual test
          # Preserve original SpellVisual 254 and add a 10y flame ring as StateKit.
          SpellVisualKit.dbc:
            - type: insert
              key: 9390
              values:
                ID: 9390
                KitType: 2
                BaseEffect: 4903

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9390
                StateKit: 9390

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9390
          YAML

      - name: Generate patched DBCs
        working-directory: raid-visuals
        run: ./target/release/wow_dbc_patcher apply

      - name: Download mpqcli
        shell: bash
        run: |
          curl -L --fail -o mpqcli https://github.com/thegraydot/mpqcli/releases/download/v0.10.2/mpqcli-linux-amd64-glibc
          chmod +x mpqcli
          ./mpqcli version

      - name: Confirm target DBC paths exist in current MPQ
        shell: bash
        run: |
          ./mpqcli list patch-O-6774-test.mpq | grep -i 'DBFilesClient.*Spell.dbc'
          ./mpqcli list patch-O-6774-test.mpq | grep -i 'DBFilesClient.*SpellVisual.dbc'
          ./mpqcli list patch-O-6774-test.mpq | grep -i 'DBFilesClient.*SpellVisualKit.dbc'

      - name: Replace only Slice-related DBC tables
        shell: bash
        run: |
          ./mpqcli add patch-O-6774-test.mpq raid-visuals/build/Spell.dbc --path 'DBFilesClient\Spell.dbc' --overwrite
          ./mpqcli add patch-O-6774-test.mpq raid-visuals/build/SpellVisual.dbc --path 'DBFilesClient\SpellVisual.dbc' --overwrite
          ./mpqcli add patch-O-6774-test.mpq raid-visuals/build/SpellVisualKit.dbc --path 'DBFilesClient\SpellVisualKit.dbc' --overwrite

      - name: Compact updated MPQ
        shell: bash
        run: ./mpqcli compact patch-O-6774-test.mpq

      - name: Verify final MPQ
        shell: bash
        run: |
          ./mpqcli verify patch-O-6774-test.mpq || true
          ls -lh patch-O-6774-test.mpq
          sha256sum patch-O-6774-test.mpq

      - name: Upload MPQ artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-O-6774-test-final
          path: patch-O-6774-test.mpq
          if-no-files-found: error
          retention-days: 3

name: Build Slice 6774 Four Stage Test

on:
  push:
    branches:
      - tmp-build-slice6774-mpq
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build host repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone twow-raid-visuals 1.4.18
        run: git clone --depth 1 --branch 1.4.18 https://github.com/MarcelineVQ/twow-raid-visuals.git raid-visuals

      - name: Add Slice 6774 four-stage visual test patch
        shell: bash
        run: |
          cat > raid-visuals/patches/z-test-slice-6774.yaml <<'YAML'
          # Slice and Dice 6774 - four visual phase test
          # Precast: orange fast ring (existing effect 4981)
          # Cast: 5y X quickfade (existing effect 4800)
          # Impact: 10y arrow (existing effect 4810)
          # State: 10y flame ring (existing effect 4903)

          SpellVisualKit.dbc:
            # Preserve original kit 416 and add a quick orange ground marker.
            - type: copy
              key: 416
              values:
                ID: 9391
                BaseEffect: 4981

            # Preserve original kit 416 and add a quick X marker.
            - type: copy
              key: 416
              values:
                ID: 9392
                BaseEffect: 4800

            # Preserve original impact kit 401 and add an arrow marker.
            - type: copy
              key: 401
              values:
                ID: 9393
                BaseEffect: 4810

            # Persistent State marker.
            - type: insert
              key: 9394
              values:
                ID: 9394
                KitType: 2
                BaseEffect: 4903

          SpellVisual.dbc:
            - type: copy
              key: 254
              values:
                ID: 9395
                PrecastKit: 9391
                CastKit: 9392
                ImpactKit: 9393
                StateKit: 9394

          Spell.dbc:
            - type: update
              key: 6774
              values:
                SpellVisualID_1: 9395
          YAML

      - name: Build DBC patcher
        working-directory: raid-visuals
        run: cargo build --release

      - name: Build standalone patch-P overlay
        working-directory: raid-visuals
        shell: bash
        run: |
          mkdir -p empty-includes
          ./target/release/wow_dbc_patcher build \
            -d dbc/Spell.dbc \
            -d dbc/SpellVisual.dbc \
            -d dbc/SpellVisualKit.dbc \
            --includes-dir empty-includes \
            --mpq patch-P.mpq
          ls -lh patch-P.mpq
          sha256sum patch-P.mpq

      - name: Upload patch-P.mpq
        uses: actions/upload-artifact@v4
        with:
          name: patch-P-slice6774-four-stage
          path: raid-visuals/patch-P.mpq
          if-no-files-found: error
          retention-days: 3

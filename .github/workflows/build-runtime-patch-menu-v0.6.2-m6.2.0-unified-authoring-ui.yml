name: Build Runtime Patch Menu v0.6.2 M6.2.0 Unified Authoring UI

on:
  push:
    branches:
      - feature/m6.2-unified-authoring-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source contract assertions
        run: |
          set -euxo pipefail
          grep -q '0.6.2 · M6.2.0' iosruntimepatchmenu/src/ZNBuildVersion.h
          grep -q 'ZNM620UnifiedAuthoringUI.mm' iosruntimepatchmenu/Makefile
          grep -q 'Feature descriptions' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q '说明（显示给用户）' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q 'duplicate parameter labels hidden' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q 'no second UI hierarchy' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q 'm6.2.runtime-descriptions.v1' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q 'm6.2.static-descriptions.v1' iosruntimepatchmenu/src/ZNM620UnifiedAuthoringUI.mm
          grep -q 'sizeof(ZNRuntimeMethodCallEntry) == 64' iosruntimepatchmenu/src/ZNRuntimeActionFormat.h
          grep -q 'sizeof(ZN44StaticEntry) == 128' iosruntimepatchmenu/src/ZNStaticPatchFormat.h
      - name: Install dependencies
        run: |
          brew update
          brew install ldid cmake
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build pinned Dobby for iPhone arm64
        run: |
          set -euxo pipefail
          mkdir -p vendor
          git clone https://github.com/jmpews/Dobby.git vendor/Dobby
          cd vendor/Dobby
          git checkout 5dfc8546954ce3b3198132ab13fddb89ee92cdd7
          sed -i '' '/^import pipes$/d' scripts/platform_builder.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/dobby.h')
          s = p.read_text()
          old = '''#ifdef __cplusplus
          extern "C" {
          #endif

          #include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>
          '''
          new = '''#include <stdbool.h>
          #include <stdint.h>
          #include <sys/types.h>

          #ifdef __cplusplus
          extern "C" {
          #endif
          '''
          if old not in s:
              raise SystemExit('unexpected Dobby header layout')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/platform_builder.py --platform iphoneos --arch arm64 --library_build_type static
          test -f build/iphoneos/arm64/libdobby.a
      - name: Build M6.2.0
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-m6.2.0
          cp .theos/obj/ZonoePatchV03.dylib dist-m6.2.0/ZonoPatch_v0.6.2_M6.2.0_UnifiedAuthoringUI.dylib
          shasum -a 256 dist-m6.2.0/ZonoPatch_v0.6.2_M6.2.0_UnifiedAuthoringUI.dylib | tee dist-m6.2.0/SHA256.txt
      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-m6.2.0/ZonoPatch_v0.6.2_M6.2.0_UnifiedAuthoringUI.dylib
          file "$out" | grep -q 'arm64'
          otool -L "$out" | tee /tmp/zono_m620_load_commands.txt
          strings -a "$out" > /tmp/zono_m620_strings.txt
          grep -q '\[m6.2\]' /tmp/zono_m620_strings.txt
          grep -q '说明（显示给用户）' /tmp/zono_m620_strings.txt
          grep -q 'duplicate parameter labels hidden' /tmp/zono_m620_strings.txt
          ! grep -qi 'dobby' /tmp/zono_m620_load_commands.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.6.2-M6.2.0-UnifiedAuthoringUI
          path: |
            iosruntimepatchmenu/dist-m6.2.0/ZonoPatch_v0.6.2_M6.2.0_UnifiedAuthoringUI.dylib
            iosruntimepatchmenu/dist-m6.2.0/SHA256.txt
          if-no-files-found: error
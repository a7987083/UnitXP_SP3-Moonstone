name: Build TaiYangShenDian Aura 031 FPS Hotfix

on:
  push:
    branches:
      - codex/aura-fps-v031-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM linker
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld unzip file binutils
          CLANG_CL="$(command -v clang-cl-18 || command -v clang-cl)"
          LLD_LINK="$(command -v lld-link-18 || command -v lld-link)"
          sudo ln -sf "$CLANG_CL" /usr/local/bin/clang-cl
          sudo ln -sf "$LLD_LINK" /usr/local/bin/lld-link
      - name: Extract and build x86 DLL
        run: |
          set -euxo pipefail
          unzip -q TaiYangShenDian_Aura031_Source.zip -d source
          cd source/TaiYangShenDian_V1.3.2_PLR2_SOURCE
          bash build/build.sh
          test -f taiyangshendian.dll
      - name: Verify and package
        run: |
          set -euxo pipefail
          SRC=source/TaiYangShenDian_V1.3.2_PLR2_SOURCE
          mkdir -p release
          cp "$SRC/taiyangshendian.dll" release/
          sha256sum release/taiyangshendian.dll > release/SHA256SUMS.txt
          file release/taiyangshendian.dll > release/PE_VERIFY.txt
          objdump -p release/taiyangshendian.dll >> release/PE_VERIFY.txt
          strings -a release/taiyangshendian.dll | grep -E '1.4.3-AURA0.3.1|20260825-v143-aura031-single-channel-fps|NAMPOWER_EVENTS|STANDALONE_NATIVE_HOOK' > release/MODE_VERIFY.txt
          cp "$SRC/AURA_ENGINE_V031.md" release/
          cp "$SRC/BUILD_STATUS_V031.md" release/
      - uses: actions/upload-artifact@v4
        with:
          name: TaiYangShenDian-Aura031-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

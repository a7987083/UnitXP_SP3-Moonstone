name: Build Unified UnitXP DreamWeapon Public Weapons + Facing x86

on:
  push:
    branches:
      - agent/unified-facing-api-20260815
    paths:
      - '.github/workflows/build-unified-dreamweapon-public-weapons.yml'
      - 'tools/apply_dreamweapon_public_weapon_api.py'
      - 'tools/apply_facing_api.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file python3 binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

      - name: Fetch exact UnitXP_SP3 v89 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir upstream
          git -C upstream init
          git -C upstream remote add origin https://github.com/brues-code/UnitXP_SP3.git
          git -C upstream fetch --depth 1 origin 3370011e396ccdbf4c9921f6cf2b005bed818b24
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "3370011e396ccdbf4c9921f6cf2b005bed818b24"
          find upstream -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.h' -o -name 'Makefile' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Apply exact R6.3 baseline feature chain
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            patches/true8x8.patch.gz.b64.part00 \
            patches/true8x8.patch.gz.b64.part01 \
            patches/true8x8.patch.gz.b64.part02.00 \
            patches/true8x8.patch.gz.b64.part02.01.00 \
            patches/true8x8.patch.gz.b64.part02.01.01 \
            patches/true8x8.patch.gz.b64.part02.01.02 \
            patches/true8x8.patch.gz.b64.part02.01.03 \
            patches/true8x8.patch.gz.b64.part02.02 \
            patches/true8x8.patch.gz.b64.part02.03 \
            patches/true8x8.patch.gz.b64.part03 \
            patches/true8x8.patch.gz.b64.part04 \
            patches/true8x8.patch.gz.b64.part05 \
            patches/true8x8.patch.gz.b64.part06 > true8x8.patch.gz.b64
          echo 'a932b4a1b9786c10e23755ee344fb285fd2ceca25333825c6e99cbc105d8c320  true8x8.patch.gz.b64' | sha256sum -c -
          base64 -d true8x8.patch.gz.b64 > true8x8.patch.gz
          gzip -dc true8x8.patch.gz > true8x8.patch
          patch --batch --forward -p1 -d upstream < true8x8.patch
          patch --batch --forward -p1 -d upstream < patches/groundprobe-b1.patch
          python3 tools/apply_groundprobe_b2_fixed.py upstream
          python3 tools/apply_autorange_b3.py upstream
          python3 tools/apply_autorange_b31_fix.py upstream
          python3 tools/apply_autorange_b32_resolver.py upstream
          python3 tools/apply_speed_api.py upstream
          python3 tools/apply_autorange_b33_relation.py upstream
          python3 tools/apply_groundprobe_b34_totem.py upstream
          python3 tools/apply_autorange_b37_totemdbc.py upstream
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-vfinal.patch
          patch --batch --forward -p1 -d upstream < patches/b38-cleancore-sstream.patch
          python3 tools/apply_autorange_b38r2_visual_resync.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1.py upstream
          python3 tools/apply_unitxp_dbc_fusion_b1_fix.py upstream
          python3 tools/apply_autorange_r63_spellchain_fields.py upstream
          python3 tools/apply_autorange_tremor40_m2scale.py upstream

      - name: Prepare B1R2 deep template
        shell: bash
        run: |
          set -euxo pipefail
          cp -a upstream cleanbase
          cp -a upstream deepbase
          python3 tools/apply_addon_profiler_b1.py deepbase
          python3 tools/apply_addon_profiler_b1r2_fix.py deepbase
          grep -Fq 'lua_sethook' deepbase/addonProfiler.cpp

      - name: Apply B1R4 through B1R5R8 profiler chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_addon_profiler_b1r3_lite.py upstream
          python3 tools/apply_addon_profiler_b1r4_calibrated.py upstream
          python3 tools/apply_addon_profiler_b1r5_deep_merge.py upstream cleanbase deepbase
          curl -fsSL https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/681f4167996c7b2442cafd93662cbe934e35dc86/tools/apply_addon_profiler_b1r5r4_targeted.py -o targeted-r5r4.py
          python3 targeted-r5r4.py upstream
          python3 tools/apply_addon_profiler_b1r5r5_isolation_ci.py upstream
          python3 tools/apply_addon_profiler_b1r5r6_longframe_contribution.py upstream
          python3 tools/apply_addon_profiler_b1r5r7_loginsafe.py upstream
          python3 tools/apply_addon_profiler_b1r5r8_longframe_details.py upstream
          grep -Fq 'B1R5R8_LONGFRAME_TOP5_DETAILS' upstream/addonProfilerLite.cpp
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          grep -Fq 'cmd == "profilerdeep"' upstream/dllmain.cpp

      - name: Apply AutoRange R7.5.1b M2 archive chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_autorange_r75_m2archive.py upstream
          python3 tools/apply_autorange_r751_m2archive_fix.py upstream
          python3 tools/apply_autorange_r752_raw_listfile_fallback.py upstream
          grep -Fq 'AutoRange.M2Scan.ArchiveGet' upstream/dllmain.cpp
          grep -Fq 'readRawClassicMpqListfile' upstream/MoonMarkerM2Scanner.cpp

      - name: Add Spell effect values and FullTooltip SpellSearch
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_unitxp_spell_effect_values.py upstream
          python3 tools/apply_unitxp_spellsearch.py upstream
          grep -Fq 'pushSpellSearch' upstream/UnitXPDbc.cpp
          grep -Fq 'effectDamageMultiplier' upstream/UnitXPDbc.cpp
          grep -Fq 'cmd == "creaturebyspell"' upstream/UnitXPDbc.cpp

      - name: Add AutoRange Media directory enumeration
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_autorange_media_scan.py upstream
          grep -Fq 'AutoRange.Media.Scan' upstream/dllmain.cpp
          grep -Fq 'AutoRange.Media.Get' upstream/dllmain.cpp
          grep -Fq 'autoRangeMediaDirectory' upstream/dllmain.cpp
          grep -Fq 'FindFirstFileA' upstream/dllmain.cpp

      - name: Apply DreamWeapon public weapon-only authorization policy
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_dreamweapon_public_weapon_api.py upstream
          grep -Fq 'dreamWeaponPublicWeaponCommand' upstream/dllmain.cpp
          grep -Fq 'dreamWeaponReceiveOnlySyncCommand' upstream/dllmain.cpp
          grep -Fq 'suffix == "ApplyWeapon"' upstream/dllmain.cpp
          grep -Fq 'suffix == "SetAutoMaintainWeapons"' upstream/dllmain.cpp
          grep -Fq '!moonMarkerGuildAuth::isAuthorized(L)' upstream/dllmain.cpp
          grep -Fq 'moonMarkerGuildAuth::denyAdvanced(L)' upstream/dllmain.cpp
          python3 - <<'PY'
          from pathlib import Path
          s=Path('upstream/dllmain.cpp').read_text(encoding='utf-8')
          a=s.index('static bool dreamWeaponPublicWeaponCommand')
          b=s.index('int __fastcall detoured_UnitXP',a)
          h=s[a:b]
          assert 'suffix == "Sync.Build"' not in h
          assert 'suffix == "Sync.BuildClear"' not in h
          for x in ['WeaponStatus','GetTargetWeapons','GetTargetNpcWeapons','ApplyWeapon','RestoreWeapons','MaintainWeapons','SetAutoMaintainWeapons']:
              assert f'suffix == "{x}"' in h
          for x in ['Sync.Receive','Sync.Reapply','Sync.RestoreSender','Sync.RestoreAll']:
              assert f'suffix == "{x}"' in h
          print('DreamWeapon whitelist/static protection checks: OK')
          PY

      - name: Add native facing API
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_facing_api.py upstream
          grep -Fq 'cmd == "facing"' upstream/dllmain.cpp
          grep -Fq 'vanilla1121_unitFacing(unit)' upstream/dllmain.cpp

      - name: Static compatibility gates
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'AutoRange.Resolve' upstream/dllmain.cpp
          grep -Fq 'AutoRange.TotemInfo' upstream/dllmain.cpp
          grep -Fq 'AutoRange.VisualSet' upstream/dllmain.cpp
          grep -Fq 'AutoRange.Media.Scan' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.PlayerPosition' upstream/dllmain.cpp
          grep -Fq 'GroundProbe.TotemSnapshot' upstream/dllmain.cpp
          grep -Fq 'cmd == "profiler"' upstream/dllmain.cpp
          grep -Fq 'cmd == "profilerdeep"' upstream/dllmain.cpp
          grep -Fq 'cmd == "spellsearch"' upstream/UnitXPDbc.cpp
          grep -Fq 'cmd == "speed"' upstream/dllmain.cpp
          grep -Fq 'cmd == "facing"' upstream/dllmain.cpp
          grep -Fq 'cmd == "inSight"' upstream/dllmain.cpp
          grep -Fq 'cmd == "distanceBetween"' upstream/dllmain.cpp
          grep -Fq 'cmd == "behind"' upstream/dllmain.cpp
          grep -Fq 'return p_original_UnitXP(L);' upstream/dllmain.cpp
          grep -Fq 'MoonMarker.Advanced' upstream/dllmain.cpp
          grep -Fq 'moonMarkerGuildAuth::isAuthorized' upstream/dllmain.cpp

      - name: Install Windows SDK and D3DX9 headers
        shell: bash
        run: |
          set -euxo pipefail
          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output upstream/xwinSDK
          curl -L --fail --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8" -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p upstream/d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. upstream/d3d9x_headers/

      - name: Build unified x86 DLL
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make -j2
          file UnitXP_SP3.dll | tee DLL-FILE-TYPE.txt
          grep -Eq 'PE32 executable.*Intel 80386|PE32 executable.*80386' DLL-FILE-TYPE.txt

      - name: Preserve established PE timestamp
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('upstream/UnitXP_SP3.dll')
          b=bytearray(p.read_bytes())
          pe=struct.unpack_from('<I',b,0x3c)[0]
          assert b[pe:pe+4] == b'PE\0\0'
          before=struct.unpack_from('<I',b,pe+8)[0]
          struct.pack_into('<I',b,pe+8,0x6A7D63AF)
          p.write_bytes(b)
          after=struct.unpack_from('<I',p.read_bytes(),pe+8)[0]
          assert after == 0x6A7D63AF
          print(f'PE TimeDateStamp: 0x{before:08X} -> 0x{after:08X}')
          PY
          stat -c '%s' upstream/UnitXP_SP3.dll | tee upstream/DLL-SIZE.txt
          sha256sum upstream/UnitXP_SP3.dll | tee upstream/DLL-SHA256.txt

      - name: Binary smoke gates
        shell: bash
        run: |
          set -euxo pipefail
          strings -a upstream/UnitXP_SP3.dll | grep -F 'B1R5R8_LONGFRAME_TOP5_DETAILS'
          strings -a upstream/UnitXP_SP3.dll | grep -x 'spellsearch'
          strings -a upstream/UnitXP_SP3.dll | grep -x 'facing'

      - name: Package unified build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release/source
          cp upstream/UnitXP_SP3.dll release/UnitXP_SP3.dll
          cp upstream/DLL-FILE-TYPE.txt upstream/DLL-SIZE.txt release/
          cp upstream/DLL-SHA256.txt release/SHA256.txt
          cp upstream/dllmain.cpp release/source/dllmain.cpp
          cp tools/apply_dreamweapon_public_weapon_api.py release/source/
          cp tools/apply_facing_api.py release/source/
          cat > release/README.txt <<'TXT'
          Unified UnitXP_SP3 build based on R7.5.1b + AutoRange Media scan.

          Compatibility target:
          - AutoRange / GroundProbe
          - Addon Profiler / ProfilerDeep
          - SpellSearch / FullTooltip / DBC Fusion
          - AutoRange Media TGA enumeration
          - DebuffFilter existing UnitXP compatibility surface
          - DreamWeapon public weapon APIs

          Added low-overhead explicit API:
          - UnitXP("facing", "player") -> facing radians or nil
          - Also accepts another visible unit token / 0x GUID.
          - No timer, thread, background scan, or polling is created by this API.

          DreamWeapon public local weapon APIs and receive-side Sync behavior are unchanged.
          Character model, glow, mount, Sync.Build/BuildClear, MoonMarker Advanced and other protected commands remain protected.

          PE TimeDateStamp is normalized to 0x6A7D63AF after build.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: UnitXP-R751b-Unified-DreamWeapon-PublicWeapons-Facing-x86
          path: release/
          if-no-files-found: error
          retention-days: 14

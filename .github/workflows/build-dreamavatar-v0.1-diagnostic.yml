name: DreamAvatar · Build Hotkeys10 x86 DLL + AddOn Test Package

run-name: 'DreamAvatar v0.1 Diagnostic · Hotkeys10 x86 DLL + AddOn · #${{ github.run_number }}'

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dreamavatar-v0.1-diagnostic
    paths:
      - '.github/workflows/build-dreamavatar-v0.1-diagnostic.yml'
      - 'slim/dreamavatar-v0.1/**'
      - 'DREAMAVATAR.md'

permissions:
  contents: read
  actions: read

jobs:
  build-dreamavatar-hotkeys10-x86-dll-and-addon:
    name: Build DreamAvatar Hotkeys10 x86 DLL and matching AddOn package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out DreamAvatar diagnostic branch
        uses: actions/checkout@v4

      - name: Restore exact source and Hook Safety Stable baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8886817364/zip" \
            -o exact-source.zip
          unzip -q exact-source.zip -d exact-source
          echo '89488a13ca54c6ab6e709a2dba7492bdbbdb422913cd5eb871d878dc6fba3f7e  exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz' | sha256sum -c -
          tar -xJf exact-source/MoonMarker-Compat-Cleanup-Exact-Source.tar.xz
          rm -rf source-export/native/.git source-export/plugin/.git
          grep -Fq '## Version: 0.8.1-compat-cleanup' source-export/plugin/MoonMarker.toc

          mkdir -p stable-patch-parts
          for part in 00 01 02 03 04; do
            curl -L --fail --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/slim/hook-safety-stable/hook-safety-stable.patch.gz.b64.part${part}?ref=78aba13fb005a52b82b437f8153bde6f9c1f213a" \
              -o "stable-patch-parts/part${part}"
          done
          cat stable-patch-parts/part* > hook-safety-stable.patch.gz.b64
          echo '632f019def405e2115bfae757e906ceef0a33a1d3156435e69d2529ccf397774  hook-safety-stable.patch.gz.b64' | sha256sum -c -
          base64 -d hook-safety-stable.patch.gz.b64 > hook-safety-stable.patch.gz
          echo '72ca2a83a4bf32804337f318388febc3b6b49bdafc9c0a958c32ddfa4806c60f  hook-safety-stable.patch.gz' | sha256sum -c -
          gzip -dc hook-safety-stable.patch.gz > hook-safety-stable.patch
          echo 'cd9b8b5249302a8b298033c24306366e548370ad73361b3e08a21cd017cd67df  hook-safety-stable.patch' | sha256sum -c -

          cp -a source-export stable
          git apply --directory=stable hook-safety-stable.patch
          grep -Fq '## Version: 0.9.0-hook-safety-stable' stable/plugin/MoonMarker.toc

      - name: Rebuild the Hook Safety Stable Hotkeys10 baseline
        run: |
          set -euxo pipefail
          cat slim/dreamavatar-v0.1/hotkeys10.patch.gz.b64.part* \
            > hotkeys10.patch.gz.b64
          echo 'd691ce6b5c7d3a0f2d4f0859548b25118028da150249eb93d70903bd5382c581  hotkeys10.patch.gz.b64' | sha256sum -c -
          base64 -d hotkeys10.patch.gz.b64 > hotkeys10.patch.gz
          echo '15d53e04dfc3a41fdec0f2b17ed8930d4e7d9409ee9f7827aa102b0237d7b0e9  hotkeys10.patch.gz' | sha256sum -c -
          gzip -dc hotkeys10.patch.gz > hotkeys10.patch
          echo '24a862d9634a1c8612ae944f540ff05b11dd58c6a714039a783b4548b5206a59  hotkeys10.patch' | sha256sum -c -

          cp -a stable hotkeys10
          git apply --check --directory=hotkeys10 hotkeys10.patch
          git apply --directory=hotkeys10 hotkeys10.patch
          grep -Fq '## Version: 0.9.1-hook-safety-hotkeys10' hotkeys10/plugin/MoonMarker.toc
          test "$(grep -c 'MOONMARKER_QUICK_PRESET_' hotkeys10/plugin/Bindings.xml)" = '10'
          grep -Fq 'MoonMarker_BindingApplyQuickPreset(10)' hotkeys10/plugin/Bindings.xml
          grep -Fq 'function MoonMarker_BindingApplyQuickPreset(slot)' hotkeys10/plugin/QuickPresets.lua
          cp -a hotkeys10 target

      - name: Reassemble, verify and apply DreamAvatar patch
        run: |
          set -euxo pipefail
          cat slim/dreamavatar-v0.1/dreamavatar-v0.1-diagnostic.patch.gz.b64.part* \
            > dreamavatar-v0.1-diagnostic.patch.gz.b64
          echo '14c8486e075435ce34193ea6e6eebe160dd83201c290f5c4d9fa42e4ab2578d6  dreamavatar-v0.1-diagnostic.patch.gz.b64' | sha256sum -c -
          base64 -d dreamavatar-v0.1-diagnostic.patch.gz.b64 \
            > dreamavatar-v0.1-diagnostic.patch.gz
          echo '3c6c10d45a5b0018cd727d8452b743dd91a19829990eb50810e2d398b8ba921a  dreamavatar-v0.1-diagnostic.patch.gz' | sha256sum -c -
          gzip -dc dreamavatar-v0.1-diagnostic.patch.gz \
            > dreamavatar-v0.1-diagnostic.patch
          echo 'e5255d82e9830cc94b7fa743387a9f1e483c9777aa2389e1d1c91f6755938c04  dreamavatar-v0.1-diagnostic.patch' | sha256sum -c -
          git apply --check --directory=target dreamavatar-v0.1-diagnostic.patch
          git apply --directory=target dreamavatar-v0.1-diagnostic.patch

      - name: Verify DreamAvatar scope and protected MoonMarker behavior
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'DREAMAVATAR-V0.1-TEST-NOTES.md',
              'native/Makefile',
              'native/MoonMarkerDreamAvatar.cpp',
              'native/MoonMarkerDreamAvatar.h',
              'native/MoonMarkerRuntimeGuard.cpp',
              'native/dllmain.cpp',
              'plugin/DreamAvatar.lua',
              'plugin/MoonMarker.toc',
          }

          def snapshot(root):
              result = {}
              for path in sorted(Path(root).rglob('*')):
                  if path.is_file():
                      rel = path.relative_to(root).as_posix()
                      result[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
              return result

          before = snapshot('hotkeys10')
          after = snapshot('target')
          changed = {p for p in before.keys() | after.keys() if before.get(p) != after.get(p)}
          print('DreamAvatar changed files:')
          print('\n'.join(sorted(changed)))
          if changed != expected:
              raise SystemExit(f'Unexpected DreamAvatar patch scope: {sorted(changed ^ expected)}')
          PY

          test -f target/native/MoonMarkerDreamAvatar.cpp
          test -f target/native/MoonMarkerDreamAvatar.h
          test -f target/plugin/DreamAvatar.lua
          grep -Fq 'MoonMarkerDreamAvatar.cpp' target/native/Makefile
          grep -Fq 'std::string("MoonMarker.DreamAvatar.") + suffix' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'commandEquals(command, "Apply")' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'commandEquals(command, "Restore")' target/native/MoonMarkerDreamAvatar.cpp
          grep -Eq 'kDisplayIdOffset = 0x0?1F4u;' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'vanilla1121_unitGUID("player")' target/native/MoonMarkerDreamAvatar.cpp
          grep -Fq 'DreamAvatar.lua' target/plugin/MoonMarker.toc
          grep -Fq '## Version: 0.10.0-dreamavatar-diagnostic' target/plugin/MoonMarker.toc
          grep -Fq 'if idEdit.SetNumeric then idEdit:SetNumeric(true) end' target/plugin/DreamAvatar.lua
          test "$(grep -c 'MOONMARKER_QUICK_PRESET_' target/plugin/Bindings.xml)" = '10'
          grep -Fq 'MoonMarker_BindingApplyQuickPreset(10)' target/plugin/Bindings.xml

          cmp hotkeys10/native/MoonMarkerMainModel.cpp target/native/MoonMarkerMainModel.cpp
          cmp hotkeys10/native/MoonMarkerMainModel.h target/native/MoonMarkerMainModel.h
          cmp hotkeys10/native/MoonMarkerGuildAuth.cpp target/native/MoonMarkerGuildAuth.cpp
          cmp hotkeys10/native/MoonMarkerGuildAuth.h target/native/MoonMarkerGuildAuth.h
          cmp hotkeys10/plugin/ModelLibrary.lua target/plugin/ModelLibrary.lua
          cmp hotkeys10/plugin/Shared.lua target/plugin/Shared.lua
          cmp hotkeys10/plugin/Bindings.xml target/plugin/Bindings.xml
          cmp hotkeys10/plugin/QuickPresets.lua target/plugin/QuickPresets.lua
          ! grep -RniE 'CreatureCatalog|Advanced\.Creature|CreatureDisplayInfo|CreatureModelData|SetDisplayInfo|Generated\\Creature|creatureDisplayByPath' target/native target/plugin

      - name: Validate DreamAvatar Lua 5.1
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find target/plugin -type f -name '*.lua' | sort)
          ! grep -RInE '#[A-Za-z_(]' target/plugin --include='*.lua'

      - name: Install Windows x86 build toolchain
        run: |
          set -euxo pipefail
          sudo apt-get install -y curl ca-certificates gnupg make unzip git patch file zip binutils
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y lld-19
          sudo ln -sf /usr/bin/clang-cl-19 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-19 /usr/local/bin/lld-link

          XWIN_VERSION=0.9.0
          curl -L --fail --retry 3 \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o xwin.tar.gz
          tar -xzf xwin.tar.gz
          sudo install -m 0755 \
            "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin" \
            /usr/local/bin/xwin
          xwin --accept-license --arch x86 splat --output shared-xwinSDK

          curl -L --fail --retry 3 \
            'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8' \
            -o d3dx.nupkg
          unzip -q d3dx.nupkg -d d3dx_pkg
          mkdir -p shared-d3d9x_headers
          cp -a d3dx_pkg/build/native/include/. shared-d3d9x_headers/

      - name: Compile Hotkeys10 baseline and DreamAvatar PE32 x86 DLLs
        run: |
          set -euxo pipefail
          for tree in hotkeys10/native target/native; do
            ln -s "$GITHUB_WORKSPACE/shared-xwinSDK" "$tree/xwinSDK"
            ln -s "$GITHUB_WORKSPACE/shared-d3d9x_headers" "$tree/d3d9x_headers"
            sed -i 's|/DWIN32_LEAN_AND_MEAN|/DWIN32_LEAN_AND_MEAN /DNOMINMAX|' "$tree/Makefile"
            make -C "$tree" clean
            make -C "$tree" -j2
            file "$tree/UnitXP_SP3.dll" | tee "$tree/DLL-FILE-TYPE.txt"
            grep -q 'PE32 executable.*Intel 80386' "$tree/DLL-FILE-TYPE.txt"
          done
          stat -c '%s' hotkeys10/native/UnitXP_SP3.dll > hotkeys10-size.txt
          stat -c '%s' target/native/UnitXP_SP3.dll > dreamavatar-size.txt

      - name: Package DreamAvatar Hotkeys10 x86 DLL and matching AddOn
        run: |
          set -euxo pipefail
          hotkeys10_size=$(cat hotkeys10-size.txt)
          dreamavatar_size=$(cat dreamavatar-size.txt)
          package='release/DreamAvatar-v0.1-Diagnostic-Hotkeys10-Test'
          addon="$package/Interface/AddOns/MoonMarker"
          mkdir -p "$addon" "$package/Audit"
          cp target/native/UnitXP_SP3.dll "$package/UnitXP_SP3.dll"
          cp -a target/plugin/. "$addon/"
          cp target/DREAMAVATAR-V0.1-TEST-NOTES.md "$package/README-TEST.md"
          cp DREAMAVATAR.md "$package/"
          cp slim/dreamavatar-v0.1/MANIFEST.txt "$package/Audit/"
          cp hotkeys10.patch "$package/Audit/"
          cp dreamavatar-v0.1-diagnostic.patch "$package/Audit/"
          cat > "$package/BUILD-RESULT.txt" <<RESULT
          DreamAvatar version: v0.1 Diagnostic
          Base: MoonMarker Hook Safety Stable Hotkeys10
          Hotkeys10 baseline DLL: ${hotkeys10_size} bytes
          DreamAvatar DLL: ${dreamavatar_size} bytes
          Change versus Hotkeys10 baseline: $((dreamavatar_size-hotkeys10_size)) bytes
          Ten quick-preset hotkeys retained: yes
          Lua 5.1 validation: passed
          Patch scope validation: passed
          Creature experiment rollback protection: passed
          PE32 Intel 80386 compilation: passed
          Local player only design check: passed
          In-game runtime test: not performed
          RESULT
          (
            cd "$package"
            sha256sum UnitXP_SP3.dll > SHA256.txt
            find Interface/AddOns/MoonMarker -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum >> SHA256.txt
          )
          (
            cd release
            zip -9 -r DreamAvatar-v0.1-Diagnostic-Hotkeys10-x86-DLL-and-Addon.zip \
              DreamAvatar-v0.1-Diagnostic-Hotkeys10-Test
          )

      - name: Upload DreamAvatar Hotkeys10 x86 DLL and AddOn test package
        uses: actions/upload-artifact@v4
        with:
          name: DreamAvatar-v0.1-Diagnostic-Hotkeys10-x86-DLL-and-Addon-${{ github.run_number }}
          path: |
            release/DreamAvatar-v0.1-Diagnostic-Hotkeys10-x86-DLL-and-Addon.zip
            release/DreamAvatar-v0.1-Diagnostic-Hotkeys10-Test/BUILD-RESULT.txt
            release/DreamAvatar-v0.1-Diagnostic-Hotkeys10-Test/SHA256.txt
          if-no-files-found: error
          retention-days: 30

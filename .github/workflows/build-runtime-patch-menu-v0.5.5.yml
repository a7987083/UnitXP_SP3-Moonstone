          p.write_text(s)
          PY

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Source assertions
        run: |
          set -euxo pipefail
          src=iosruntimepatchmenu/src
          makefile=iosruntimepatchmenu/Makefile

          grep -q 'src/ZNDeferredBootstrap.mm' "$makefile"
          grep -q -- '-fvisibility=hidden' "$makefile"

          grep -q 'ZNDeferredStateCold' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZNDeferredStateLoading' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZNDeferredStateReady' "$src/ZNDeferredBootstrap.mm"
          grep -q '0.45 \* NSEC_PER_SEC' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZNInstallRuntimeExecutorV041Deferred' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZNPrepareStaticDispatchRuntimeDeferred' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZNInstallRuntimeMenuV055Deferred' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZonoePatchStart' "$src/ZNDeferredBootstrap.mm"
          grep -q 'ZonoePatchShow' "$src/ZNDeferredBootstrap.mm"

          # No feature/runtime module may auto-run before the launcher tap.
          load_hits="$(grep -R -nE '^[[:space:]]*\+[[:space:]]*\(void\)load[[:space:]]*\{' "$src" --include='*.mm' || true)"
          if [ -n "$load_hits" ]; then echo "$load_hits"; exit 1; fi
          ctor_hits="$(grep -R -n '__attribute__((constructor' "$src" --include='*.mm' || true)"
          echo "$ctor_hits"
          test "$(printf '%s\n' "$ctor_hits" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          echo "$ctor_hits" | grep 'ZNDeferredBootstrap.mm'
          echo "$ctor_hits" | grep 'ZNDeferredColdLauncherBootstrap'

          grep -q 'extern "C" void ZNInstallRuntimeExecutorV041Deferred' "$src/ZNPatchCoreV041.mm"
          grep -q 'extern "C" void ZNInstallRuntimeDiagnosticsV042Deferred' "$src/ZNRuntimeDiagnosticsV042.mm"
          grep -q 'extern "C" void ZNPrepareStaticDispatchRuntimeDeferred' "$src/ZNStaticDispatchRuntime.mm"
          grep -q 'extern "C" void ZNInstallFeatureGroupUIDeferred' "$src/ZNFeatureGroupUI.mm"
          grep -q 'extern "C" void ZNInstallFeatureBuilderUIDeferred' "$src/ZNFeatureBuilderUI.mm"
          grep -q 'extern "C" void ZNInstallPublicCompactLayoutDeferred' "$src/ZNPublicCompactUI.mm"
          grep -q 'extern "C" void ZNInstallPublicCompactDefaultsDeferred' "$src/ZNPublicCompactUI.mm"
          grep -q 'extern "C" void ZNInstallSharedSiteExecutionProbeV3Deferred' "$src/ZNSharedSiteExecutionProbeV3Bootstrap.mm"

          grep -q 'first-menu-activation snapshot' "$src/ZNDeveloperGate.mm"
          grep -q '首次点击检查: 已缓存' "$src/ZNDeveloperGate.mm"
          grep -q 'ZNDeferredBootstrapIsActivated' "$src/ZNDeveloperGate.mm"

          grep -q 'return "0.5.5-ui-consolidated"' "$src/ZonoeRuntimeMenu.mm"
          grep -q 'ZNInstallRuntimeMenuV055Deferred' "$src/ZonoeRuntimeMenu.mm"
          grep -q 'v0.5.5 current UI installed after first launcher tap' "$src/ZonoeRuntimeMenu.mm"
          grep -q 'self.subtitleLabel.text = @"0.5.5"' "$src/ZNPublicCompactUI.mm"
          grep -q 'v0.5.5 feature UI installed after first activation' "$src/ZNFeatureGroupUI.mm"

          # Builder/metadata/protection remain the v0.5.4 device-validated path.
          grep -q 'src/ZNStaticBinaryPipeline.mm' "$makefile"
          grep -q 'src/ZNStaticBinaryBuilderV3.mm' "$makefile"
          if grep -q 'src/ZNStaticBinaryBuilder.mm' "$makefile"; then exit 1; fi
          if grep -q 'src/ZNStaticBinarySigningBridge.mm' "$makefile"; then exit 1; fi
          grep -q 'explicit-v0.5.4' "$src/ZNGeneratedBinaryPostprocess.mm"
          grep -q 'ZNFeatureMetadataEncodeEntry' "$src/ZNStaticMetadataPrivacy.mm"
          grep -q 'ZN44_STATIC_HEADER_FLAG_RVA_PROTECTION_V1' "$src/ZNStaticPatchFormat.h"
          grep -q 'ZN55DecodeEntryRVAs' "$src/ZNStaticDispatchRuntime.mm"
          grep -q 'return @"开"' "$src/ZNFeatureGroupUI.mm"
          grep -q 'return @"关"' "$src/ZNFeatureGroupUI.mm"
          grep -q 'zn.f.%016llx.enabled' "$src/ZNFeatureGroupUI.mm"

      - name: Feature metadata codec tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation \
            -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/feature_metadata_codec_test.mm \
            iosruntimepatchmenu/src/ZNFeatureMetadataCodec.mm \
            -o /tmp/zn_feature_metadata_codec_test
          /tmp/zn_feature_metadata_codec_test

      - name: Static RVA protection tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -fobjc-arc -framework Foundation \
            -Iiosruntimepatchmenu/src \
            iosruntimepatchmenu/tests/static_rva_protection_test.mm \
            -o /tmp/zn_static_rva_protection_test
          /tmp/zn_static_rva_protection_test

      - name: Build
        run: |
          set -euxo pipefail
          cd iosruntimepatchmenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist-deferred-bootstrap
          cp .theos/obj/ZonoePatchV03.dylib dist-deferred-bootstrap/ZonoPatch_v0.5.5_FullDeferredBootstrap_Test.dylib
          shasum -a 256 dist-deferred-bootstrap/ZonoPatch_v0.5.5_FullDeferredBootstrap_Test.dylib | tee dist-deferred-bootstrap/SHA256.txt

      - name: Verify binary
        run: |
          set -euxo pipefail
          out=iosruntimepatchmenu/dist-deferred-bootstrap/ZonoPatch_v0.5.5_FullDeferredBootstrap_Test.dylib
          file "$out"
          nm -gU "$out" | grep '_ZonoePatchGetAPIVersion'
          nm -gU "$out" | grep '_ZonoePatchGetVersion'
          nm -gU "$out" | grep '_ZonoePatchDeveloperAuthorized'
          nm -gU "$out" | grep '_ZonoePatchOtherAuthorized'

          # Deferred implementation helpers stay internal.
          if nm -gU "$out" | grep -q 'ZNDeferredBootstrap'; then exit 1; fi
          if nm -gU "$out" | grep -q 'ZNInstallRuntimeMenuV055Deferred'; then exit 1; fi
          if nm -gU "$out" | grep -q 'ZNPrepareStaticDispatchRuntimeDeferred'; then exit 1; fi

          strings "$out" > /tmp/zonoe_v055_strings.txt
          grep -q '0.5.5-ui-consolidated' /tmp/zonoe_v055_strings.txt
          grep -q 'explicit-v0.5.4' /tmp/zonoe_v055_strings.txt
          grep -q 'static-rva-protection-v1' /tmp/zonoe_v055_strings.txt
          grep -q 'v0.5.5 deferred activation failed' /tmp/zonoe_v055_strings.txt

          # There must be exactly one Mach-O constructor: the cold launcher.
          python3 <<'PY'
          import struct
          p='iosruntimepatchmenu/dist-deferred-bootstrap/ZonoPatch_v0.5.5_FullDeferredBootstrap_Test.dylib'
          data=open(p,'rb').read()
          if struct.unpack_from('<I',data,0)[0] != 0xfeedfacf:
              raise SystemExit('not thin arm64 Mach-O')
          ncmds=struct.unpack_from('<I',data,16)[0]
          off=32
          init_size=None
          for _ in range(ncmds):
              cmd,cmdsize=struct.unpack_from('<II',data,off)
              if cmd==0x19:
                  nsects=struct.unpack_from('<I',data,off+64)[0]
                  so=off+72
                  for __ in range(nsects):
                      sectname=data[so:so+16].split(b'\0',1)[0]
                      if sectname==b'__init_offsets':
                          init_size=struct.unpack_from('<Q',data,so+40)[0]
                      so+=80
              off+=cmdsize
          print('init_offsets_size=',init_size)
          if init_size != 4:
              raise SystemExit(f'expected exactly one constructor (4 bytes), got {init_size}')
          PY

      - name: Commit deferred bootstrap source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iosruntimepatchmenu/Makefile \
                  iosruntimepatchmenu/src/ZNDeferredBootstrap.h \
                  iosruntimepatchmenu/src/ZNDeferredBootstrap.mm \
                  iosruntimepatchmenu/src/ZNPatchCoreV041.mm \
                  iosruntimepatchmenu/src/ZNRuntimeDiagnosticsV042.mm \
                  iosruntimepatchmenu/src/ZNStaticDispatchRuntime.mm \
                  iosruntimepatchmenu/src/ZNSharedSiteExecutionProbeV3Bootstrap.mm \
                  iosruntimepatchmenu/src/ZNPublicCompactUI.mm \
                  iosruntimepatchmenu/src/ZNFeatureGroupUI.mm \
                  iosruntimepatchmenu/src/ZNFeatureBuilderUI.mm \
                  iosruntimepatchmenu/src/ZNDeveloperGate.mm \
                  iosruntimepatchmenu/src/ZonoeRuntimeMenu.mm
          if ! git diff --cached --quiet; then
            git commit -m 'feat(runtime): defer all patch and menu logic until launcher tap'
            git push origin HEAD:feature/runtime-patch-menu-full-deferred-bootstrap
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZonoPatch-v0.5.5-FullDeferredBootstrap-Test
          path: |
            iosruntimepatchmenu/dist-deferred-bootstrap/ZonoPatch_v0.5.5_FullDeferredBootstrap_Test.dylib
            iosruntimepatchmenu/dist-deferred-bootstrap/SHA256.txt
          if-no-files-found: error

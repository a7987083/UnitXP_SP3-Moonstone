name: Build HFAPatchMenu v0.1.0

on:
  push:
    branches:
      - work/hfapatchmenu-v0.1
    paths:
      - "HFAPatchMenu/**"
      - ".github/workflows/hfapatchmenu-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate example configuration
        run: python3 HFAPatchMenu/tools/validate_hfapatch.py HFAPatchMenu/examples/example.hfapatch.json

      - name: Install build dependencies
        run: brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build dylib
        run: |
          cd HFAPatchMenu
          make clean
          make FINALPACKAGE=1
          mkdir -p dist/package
          cp .theos/obj/HFAPatchMenu.dylib dist/HFAPatchMenu_v0.1.0.dylib
          cp README_CN.md dist/package/
          cp schema/hfapatch-v1.schema.json dist/package/
          cp examples/example.hfapatch.json dist/package/
          cp dist/HFAPatchMenu_v0.1.0.dylib dist/package/
          ditto -c -k --sequesterRsrc --keepParent dist/package dist/HFAPatchMenu_v0.1.0_Package.zip
          file dist/HFAPatchMenu_v0.1.0.dylib
          lipo -info dist/HFAPatchMenu_v0.1.0.dylib
          strings dist/HFAPatchMenu_v0.1.0.dylib | grep -q "HFAPatchMenu v0.1"
          strings dist/HFAPatchMenu_v0.1.0.dylib | grep -q "com.hfa.patch/v1"
          shasum -a 256 dist/HFAPatchMenu_v0.1.0.dylib > dist/SHA256SUMS.txt
          shasum -a 256 dist/HFAPatchMenu_v0.1.0_Package.zip >> dist/SHA256SUMS.txt

      - name: Publish versioned files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HFAPatchMenu/dist/HFAPatchMenu_v0.1.0.dylib
          git add -f HFAPatchMenu/dist/HFAPatchMenu_v0.1.0_Package.zip
          git add -f HFAPatchMenu/dist/SHA256SUMS.txt
          git commit -m "Publish HFAPatchMenu v0.1.0 binaries [skip ci]"
          git push origin HEAD:work/hfapatchmenu-v0.1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HFAPatchMenu-v0.1.0
          path: |
            HFAPatchMenu/dist/HFAPatchMenu_v0.1.0.dylib
            HFAPatchMenu/dist/HFAPatchMenu_v0.1.0_Package.zip
            HFAPatchMenu/dist/SHA256SUMS.txt
          if-no-files-found: error
